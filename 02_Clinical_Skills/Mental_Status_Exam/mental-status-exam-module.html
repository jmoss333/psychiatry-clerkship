<!DOCTYPE html>
<html lang="en">
<head>
<!-- [CLERKSHIP-META v1] tool="Mental Status Exam — Teaching Module" version="1.1" built="2026-09-04" category="clinical-skills" audience="trainee,ms3" settings="inpatient" time="30min" summary="Interactive MSE teaching module: domain-by-domain descriptors, a builder that drafts a written MSE, and an annotated exemplar. Fictional composites only; no PHI." -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Status Exam — Teaching Module</title>
<meta name="description" content="A teaching module for the mental status exam: what to observe in each domain, a descriptor bank, an interactive MSE builder that drafts a written exam, and an annotated exemplar.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#bc573a; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
    --text:#3b332c; --text-mid:#64574b; --text-light:#87786a;
    --success:#357160; --success-light:#e7f1ed;
    --warning:#7a6234; --warning-light:#f5efe2;
    --danger:#a34132; --danger-light:#fbece9;
    --info:#41618a; --info-light:#eaf0f6;
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
    --shadow-sm:0 1px 3px rgba(59,51,44,.06); --shadow-md:0 2px 10px rgba(59,51,44,.08);
    --shadow-lg:0 8px 28px rgba(59,51,44,.10);
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
    --sp1:6px; --sp2:10px; --sp3:16px; --sp4:24px; --sp5:36px;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .shell{width:min(900px,100%);margin:0 auto;padding:var(--sp4) var(--sp3) var(--sp5)}
  h1,h2,h3{font-family:var(--font-head);line-height:1.25;margin:0 0 var(--sp3)}
  h1{font-size:2.2rem;color:var(--primary)} h2{font-size:1.45rem;color:var(--text);margin-top:var(--sp5)}
  h3{font-size:1.1rem;color:var(--text)}
  .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--accent-dark);margin-bottom:var(--sp2)}
  .sub{color:var(--text-mid);max-width:64ch;margin:0 0 var(--sp3)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp4);box-shadow:var(--shadow-sm);margin-bottom:var(--sp3)}
  .mse-guide{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:var(--sp3);align-items:start}
  .mse-guide-intro{grid-column:1/-1;max-width:68ch}
  .mse-guide-intro h2{margin:0 0 var(--sp1)}
  .mse-guide-intro p{margin:0;color:var(--text-mid)}
  .mse-guide-map{display:grid;gap:5px}
  .mse-guide-step{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;text-align:left;font:inherit;font-size:.9rem;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer}
  .mse-guide-step:hover{border-color:var(--accent-dark);background:var(--accent-light)}
  .mse-guide-step[aria-pressed="true"]{border-color:var(--accent-dark);background:var(--accent-dark);color:var(--on-brand,#fff)}
  .mse-guide-index{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border:1px solid currentColor;border-radius:50%;font-size:.75rem;line-height:1}
  .mse-guide-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp4);box-shadow:var(--shadow-sm)}
  .mse-guide-progress{font-size:.8rem;color:var(--accent-dark);font-weight:700;margin:0 0 var(--sp1)}
  .mse-visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .mse-guide-detail h3{font-size:1.8rem;margin:0 0 var(--sp3)}
  .mse-guide-detail p{margin:0}
  .mse-guide-observe{border-left:3px solid var(--accent);padding:0 0 0 var(--sp3);margin:0 0 var(--sp4)}
  .mse-guide-descriptors{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-top:var(--sp1)}

  .mse-guide-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2);margin-top:var(--sp4)}
  .mse-guide-actions .btn{min-height:44px}
  .mse-guide-actions .btn:disabled{opacity:.5;cursor:default}
  .mse-guide-actions .btn-primary{margin-left:auto}
  .mse-guide button:focus-visible,.mse-coverage button:focus-visible,.mse-build-domain:focus-visible,.mse-guide-detail h3:focus-visible{outline:3px solid var(--focus,#2f6fd0);outline-offset:3px}
  .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);font-weight:700;margin:var(--sp3) 0 var(--sp1)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp1)}

  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pearl{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:var(--radius-sm);padding:var(--sp2) var(--sp3);font-size:.9rem;color:var(--text);margin-top:var(--sp3)}
  .pearl b{color:var(--warning)}
  .danger{background:var(--danger-light);border-left:3px solid var(--danger)}
  .danger b{color:var(--danger)}
  .output{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-md);padding:var(--sp3);font-size:.97rem;line-height:1.7;white-space:pre-wrap}
  .btn{border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--primary-dark);color:#fff} .btn-primary:hover{background:var(--primary)}
  .btn-ghost{background:transparent;color:var(--accent-dark);border:1px solid var(--border)} .btn-ghost:hover{border-color:var(--accent)}
  .row{display:flex;gap:var(--sp2);flex-wrap:wrap;align-items:center;margin-top:var(--sp3)}
  .tabs{display:flex;gap:var(--sp1);border-bottom:2px solid var(--border);margin-bottom:var(--sp4);flex-wrap:wrap}

  .anno{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp2)}

  .anno-item .why{font-size:.88rem;color:var(--text-mid)}
  .disclaimer{background:var(--bg-alt);border:1px dashed var(--border);border-radius:var(--radius-md);padding:var(--sp3);font-size:.82rem;color:var(--text-mid);margin-top:var(--sp4)}
  .mse-coverage{margin:var(--sp3) 0 var(--sp4)}
  .mse-coverage-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp2);flex-wrap:wrap;margin-bottom:var(--sp2)}
  .mse-coverage-head h3{margin:0}
  .mse-coverage-head p{margin:0;color:var(--text-mid);font-size:.82rem}
  .mse-coverage-track{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;margin-bottom:var(--sp2)}
  .mse-coverage-track span{height:7px;border-radius:var(--radius-pill);background:var(--border)}
  .mse-coverage-track span.on{background:var(--accent-dark)}
  .mse-coverage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .mse-coverage-step{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:52px;padding:8px 10px;text-align:left;font:inherit;font-size:.86rem;line-height:1.25;color:var(--text-mid);background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer}
  .mse-coverage-step:hover{border-color:var(--accent-dark)}
  .mse-coverage-step.on{color:var(--accent-dark);border-color:var(--accent-dark);background:var(--accent-light);font-weight:700}
  .mse-coverage-step strong{font-size:.8rem;font-variant-numeric:tabular-nums}
  .mse-build-domain{padding:var(--sp3) 0;border-top:1px solid var(--border);scroll-margin-top:var(--sp3)}
  .mse-build-domain:first-of-type{border-top:0}
  .mse-build-domain h3{font-family:var(--font-body);font-size:.9rem;margin:0 0 var(--sp1)}
  .mse-build-domain .count{font-weight:400}
  .note{background:var(--bg-alt);border:1px dashed var(--border);border-radius:var(--radius-md);padding:var(--sp3) var(--sp4);line-height:1.75}
  .noteline{margin:0 0 8px;font-size:.97rem;color:var(--text)}
  .noteline:last-child{margin-bottom:0}
  .notedom{color:var(--accent-dark);font-family:var(--font-head)}
  .noteph{color:var(--text-light);font-style:italic}
  @keyframes notein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .noteline{animation:notein .3s ease}
  @media(prefers-reduced-motion:reduce){.noteline{animation:none}}
  footer{margin-top:var(--sp4);padding-top:var(--sp3);border-top:1px solid var(--border);font-size:.85rem;color:var(--text-light);text-align:center}
  .count{font-size:.78rem;color:var(--text-light)}
  .selection-status{min-height:1.4em;margin:0 0 var(--sp2);font-size:.86rem;color:var(--accent-dark)}
  /* The comparison uses the same Clinical Warm palette as rounds practice. */
  .shell{width:min(1120px,100%)}
  .mse-header h1{font-size:1.55rem;margin-bottom:8px}
  .mse-header .sub{font-size:.9rem;max-width:80ch}
  .msec[hidden]{display:none}
  .msec{margin-top:24px}
  .msec-intro{max-width:70ch;margin-bottom:24px}
  .msec-intro h2{font-size:2rem;margin:14px 0 10px}
  .msec-intro p{color:var(--text-mid);margin:0}
  .msec-review{display:inline-block;color:var(--warning);background:var(--warning-light);padding:5px 10px;border-radius:6px;font-size:.8rem}
  .msec-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
  .msec-finding{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;margin-bottom:14px}
  .msec-finding.chosen{border-color:var(--accent-dark)}
  .msec-row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  .msec-row-head h3{font-size:1.25rem;margin:0}
  .msec-source{font-family:var(--font-body);font-size:.78rem;color:var(--accent-dark);font-weight:600}
  .msec-days{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .msec-days>div+div{border-left:1px solid var(--border);padding-left:20px}
  .msec-days h4{font-family:var(--font-body);font-size:.8rem;color:var(--text-mid);margin:0 0 7px}
  .msec-days p{font-size:.95rem;line-height:1.5;margin:0}
  .msec-select{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.82rem;margin-top:14px;cursor:pointer}
  .msec-select input{width:19px;height:19px;accent-color:var(--accent-dark)}
  .msec-selection{position:sticky;top:18px;background:var(--accent-light);border-radius:12px;padding:22px}
  .msec-selection h3{font-size:1.4rem;margin:0 0 8px}
  .msec-count,.msec-help{font-size:.8rem;color:var(--text-mid)}
  .msec-selection ul{list-style:none;padding:0;margin:16px 0}
  .msec-selection li{padding:12px 0;border-top:1px solid var(--border)}
  .msec-selection li p{font-size:.9rem;line-height:1.5;margin:5px 0 0}
  .msec-empty{font-size:.9rem;color:var(--text-mid);margin:18px 0}
  .msec-cta{display:block;text-align:center;width:100%;font:inherit;font-size:.9rem;font-weight:600;padding:12px 14px;min-height:44px;background:var(--accent-dark);color:var(--on-brand,#fff);border:0;border-radius:8px;text-decoration:none;cursor:pointer}
  .msec-cta:disabled{opacity:.5;cursor:default}
  .msec-clear{display:block;margin:8px auto 0;border:0;background:transparent;color:var(--accent-dark);font:inherit;font-size:.8rem;min-height:44px;text-decoration:underline;cursor:pointer}
  .msec-interpretation{border-top:1px solid var(--border);padding:16px 0;margin-top:12px}
  .msec-interpretation summary{min-height:44px;cursor:pointer;font-weight:600;color:var(--accent-dark)}
  .msec-interpretation p{max-width:75ch}
  .msec a:focus-visible,.msec button:focus-visible,.msec input:focus-visible,.msec summary:focus-visible{outline:3px solid var(--focus,#2f6fd0);outline-offset:3px}
  @media(max-width:700px){.mse-guide{grid-template-columns:1fr}.mse-guide-map{grid-template-columns:repeat(2,minmax(0,1fr))}.mse-coverage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:420px){.mse-guide-step{padding:8px;gap:7px;font-size:.82rem}.mse-guide-index{width:22px;height:22px}.mse-guide-detail{padding:var(--sp3)}.mse-guide-detail h3{font-size:1.55rem}.mse-guide-actions .btn-primary{margin-left:0}}
  @media(max-width:800px){.msec-layout{grid-template-columns:1fr}.msec-selection{position:static}.msec-empty{margin:10px 0}}
  @media(max-width:420px){.msec-finding{padding:16px}.msec-days{gap:12px}.msec-days>div+div{padding-left:12px}.msec-days p{font-size:.88rem}.msec-intro h2{font-size:1.75rem}}
</style>

<body>
<div id="root"></div>
<script>
var e = React.createElement;
var useState = React.useState;

var DOMAINS = [
  {key:'appearance', title:'Appearance', observe:'Apparent age, grooming, hygiene, dress, distinguishing features, nutritional status.',
   prose:'appears ', options:['stated age','older than stated age','well-groomed','disheveled','poor hygiene','appropriately dressed','malodorous','cachectic'],
   pearl:'Describe, do not interpret. "Wearing a heavy coat indoors in summer" beats "bizarrely dressed."'},
  {key:'behavior', title:'Behavior & psychomotor', observe:'Eye contact, cooperation, psychomotor activity, abnormal movements, attitude toward examiner.',
   prose:'with ', options:['good eye contact','poor eye contact','cooperative','guarded','psychomotor agitation','psychomotor retardation','no abnormal movements','tremor'],
   pearl:'Screen any mute or immobile patient for catatonia (Bush-Francis). Missing it can be fatal — antipsychotics can precipitate NMS.', danger:true},
  {key:'speech', title:'Speech', observe:'Rate, rhythm, volume, tone, latency, articulation, spontaneity.',
   prose:'Speech is ', options:['normal rate and rhythm','pressured','slowed','loud','soft','increased latency','monotone','spontaneous'],
   pearl:'Speech describes the form of output (mechanics); thought process describes how ideas connect. Keep them separate.'},
  {key:'mood', title:'Mood', observe:'The patient’s subjective emotional state — ideally in their own words, in quotation marks.',
   prose:'Mood is ', single:true, options:['"fine"','"depressed"','"anxious"','"angry"','"empty"','"good"','"irritable"'],
   pearl:'Mood is what the patient tells you; affect is what you observe. Quote the patient verbatim.'},
  {key:'affect', title:'Affect', observe:'Observed emotional expression: quality, range, congruence, stability, appropriateness.',
   prose:'affect is ', options:['euthymic','dysphoric','full range','constricted','flat','labile','congruent with mood','incongruent'],
   pearl:'Characterize affect on at least range and quality. "Constricted and dysphoric" says more than "depressed affect."'},
  {key:'thoughtProcess', title:'Thought process', observe:'How thoughts are organized and connected (the form, not the content).',
   prose:'Thought process is ', single:true, options:['linear and goal-directed','circumstantial','tangential','loose associations','flight of ideas','thought blocking','disorganized'],
   pearl:'Process = the connections between ideas. Reserve "disorganized" for genuinely incoherent output, not merely talkative.'},
  {key:'thoughtContent', title:'Thought content', observe:'What the patient is thinking: SI/HI, delusions, obsessions, preoccupations.',
   prose:'Thought content notable for ', options:['no SI/HI','passive SI','active SI','homicidal ideation','paranoid delusions','grandiose delusions','obsessions','no delusions'],
   pearl:'Always document suicidal and homicidal ideation explicitly — including their absence, with what you asked (e.g., "denies SI/HI when asked directly about thoughts, plan, and recent steps").', danger:true},
  {key:'perception', title:'Perception', observe:'Hallucinations (auditory, visual, other), illusions, dissociation, responding to internal stimuli.',
   prose:'with ', options:['no perceptual disturbances','auditory hallucinations','visual hallucinations','responding to internal stimuli','denies hallucinations'],
   pearl:'Note both what the patient reports and what you observe (e.g., appearing to respond to internal stimuli).'},
  {key:'cognition', title:'Cognition', observe:'Alertness, orientation, attention, memory, fund of knowledge. Use a tool (MoCA/MMSE) when indicated.',
   prose:'Cognitively, ', options:['alert','oriented x3','oriented x4','inattentive','grossly intact','impaired short-term memory'],
   pearl:'"Oriented x4" = person, place, time, situation. If delirium is possible, test attention and use a delirium screen (e.g., 4AT or CAM) now; reserve the MoCA for suspected dementia/MCI once delirium is excluded — a MoCA done during delirium is not interpretable.'},
  {key:'insight', title:'Insight', observe:'Awareness of illness and need for treatment.',
   prose:'Insight is ', single:true, options:['good','fair','limited','poor','absent'],
   pearl:'Insight predicts adherence. In psychosis, anosognosia (not denial) may be the barrier — see Amador’s LEAP.'},
  {key:'judgment', title:'Judgment', observe:'Capacity to make reasoned, safe decisions; recent real-world decisions are the best evidence.',
   prose:'judgment is ', single:true, options:['good','fair','limited','poor'],
   pearl:'Judge judgment on behavior, not hypotheticals. "Left AMA against advice with active SI" is the evidence.'}
];

var MSE_CONFLICTS = {
  thoughtContent: [
    ['no SI/HI','passive SI'],
    ['no SI/HI','active SI'],
    ['no SI/HI','homicidal ideation'],
    ['no delusions','paranoid delusions'],
    ['no delusions','grandiose delusions']
  ],
  perception: [
    ['no perceptual disturbances','auditory hallucinations'],
    ['no perceptual disturbances','visual hallucinations'],
    ['no perceptual disturbances','responding to internal stimuli']
  ],
  cognition: [['oriented x3','oriented x4']]
};

function mseDomainByKey(domainKey){
  for(var i=0;i<DOMAINS.length;i++){
    if(DOMAINS[i].key===domainKey) return DOMAINS[i];
  }
  return null;
}

function applyMseSelection(selection, domainKey, option, singleChoice){
  var source=(selection&&typeof selection==='object')?selection:{};
  var next={};
  var key;
  for(key in source){
    if(Object.prototype.hasOwnProperty.call(source,key)){
      next[key]=Array.isArray(source[key])?source[key].slice():[];
    }
  }
  var domain=mseDomainByKey(domainKey);
  if(!domain||domain.options.indexOf(option)<0) return {selection:next,removed:[]};

  var cur=(next[domainKey]||[]).slice();
  var selectedIndex=cur.indexOf(option);
  var removed=[];
  if(singleChoice){
    cur=(selectedIndex===0)?[]:[option];
  }else if(selectedIndex>=0){
    cur.splice(selectedIndex,1);
  }else{
    var pairs=Array.isArray(MSE_CONFLICTS[domainKey])?MSE_CONFLICTS[domainKey]:[];
    for(var p=0;p<pairs.length;p++){
      var pair=pairs[p];
      if(!Array.isArray(pair)||pair.length!==2||typeof pair[0]!=='string'||typeof pair[1]!=='string') continue;
      var other=null;
      if(pair[0]===option) other=pair[1];
      else if(pair[1]===option) other=pair[0];
      if(other===null) continue;
      var otherIndex=cur.indexOf(other);
      if(otherIndex>=0){ cur.splice(otherIndex,1); removed.push(other); }
    }
    cur.push(option);
  }
  next[domainKey]=cur;
  return {selection:next,removed:removed};
}

function mseJoinLabels(values){
  if(values.length>2) return values.slice(0,-1).join(', ')+', and '+values[values.length-1];
  return values.join(' and ');
}

function mseReplacementMessage(option, removed){
  if(!removed||!removed.length) return '';
  var subject=option.charAt(0).toUpperCase()+option.slice(1);
  return subject+' replaced '+mseJoinLabels(removed)+' because these findings conflict.';
}

function MseChange(props){
  var shared=window.MSERounds;
  var initial=shared?shared.read(location.search):{valid:false,present:false,ids:[]};
  var choice=useState(function(){return initial.valid?initial.ids:[];}), selected=choice[0], setSelected=choice[1];
  if(!shared)return e('section',{hidden:!props.active,className:'card'},e('h2',null,'Comparison unavailable'),e('p',null,'Reload to try loading the fictional case again. The other MSE resources remain available.'));
  var c=shared.caseData, rows=c.rows.filter(function(r){return selected.indexOf(r.id)>=0;});
  var href=shared.link('oral.html',selected,window.self!==window.top);
  function toggle(id){setSelected(function(previous){return previous.indexOf(id)<0?previous.concat([id]):previous.filter(function(x){return x!==id;});});}
  return e('section',{className:'msec',hidden:!props.active,'aria-label':'MSE comparison'},
    e('div',{className:'msec-intro'},e('span',{className:'msec-review'},'Fictional practice case'),
      e('h2',null,c.title),e('p',null,'Compare the interview excerpts. Choose what you would bring to rounds, including anything you still need to clarify.')),
    initial.present&&!initial.valid?e('p',{className:'pearl',role:'status'},'That saved selection is unavailable. Choose details from this case to begin again.'):null,
    e('div',{className:'msec-layout'},

function App(){

        e('div',{className:'mse-guide-descriptors'},focusedDomain.options.map(function(o){return e('span',{className:'mse-guide-descriptor',key:o},o);}))),
      e('div',{className:'pearl'+(focusedDomain.danger?' danger':'')},e('b',null,focusedDomain.danger?'Safety pearl: ':'Pearl: '),focusedDomain.pearl),

    e('footer',null,'Mental Status Exam — Teaching Module · Psychiatry Clerkship Library · Joshua Moss, MD | Psychiatrist')

}
