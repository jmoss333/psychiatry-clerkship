<!DOCTYPE html>
<html lang="en">
<head>
<!-- [CLERKSHIP-META v1] tool="Treatment Team Rounding Prep" version="2.2" built="2026-09-04" category="clinical-skills" audience="trainee,ms3,resident" settings="inpatient" time="5-15min" summary="Optional aid for treatment-team rounds: gather the right data, present crisply, and rehearse 30-second collateral and 60-second rounds updates. Fictional composites only; no PHI." -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Treatment Team Rounding Prep</title>
<meta name="description" content="An optional aid for inpatient treatment-team rounds: gather the right data before rounds, then present it in three minutes or rehearse focused 30-second collateral and 60-second rounds updates.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
    --success:#357160; --warning:#7a6234; --warning-light:#f5efe2; --danger:#a34132;
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
    --shadow-sm:0 1px 3px rgba(59,51,44,.06);
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
    --sp1:6px; --sp2:10px; --sp3:16px; --sp4:24px; --sp5:36px;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text,#3b332c);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .shell{width:min(900px,100%);margin:0 auto;padding:var(--sp4) var(--sp3) var(--sp5)}
  h1,h2,h3{font-family:var(--font-head);line-height:1.25;margin:0 0 var(--sp3)}
  h1{font-size:2.1rem;color:var(--primary)} h3{font-size:1.05rem}
  .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--accent-dark);margin-bottom:var(--sp2)}
  .sub{color:var(--text-mid,#64574b);max-width:64ch;margin:0 0 var(--sp3)}
  .opt{display:inline-block;font-size:.7rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid #cfe1db;border-radius:999px;padding:2px 9px;margin-bottom:var(--sp3)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp4);box-shadow:var(--shadow-sm);margin-bottom:var(--sp3)}
  .tabs{display:flex;gap:var(--sp1);border-bottom:2px solid var(--border);margin-bottom:var(--sp4);flex-wrap:wrap}
  .tab{border:none;background:transparent;padding:10px 14px;font-size:.95rem;font-weight:600;color:var(--text-mid,#64574b);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
  .tab.on{color:var(--primary-dark);border-bottom-color:var(--primary-dark)}
  .step{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp3);align-items:start;border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--sp3);margin-bottom:var(--sp2);background:var(--surface)}
  .step.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
  .step.done{opacity:.6}
  .step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;font-weight:700;font-size:.85rem}
  .step h3{margin:0 0 2px} .step .d{font-size:.9rem;color:var(--text-mid,#64574b)}
  .step .t{font-size:.8rem;color:var(--text-light,#87786a);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ex{font-style:italic;background:var(--primary-light);border-radius:var(--radius-sm);padding:6px 10px;font-size:.88rem;margin-top:6px;display:block}
  .timer{font-family:var(--font-head);font-size:3rem;font-variant-numeric:tabular-nums;text-align:center;color:var(--primary-dark);margin:var(--sp2) 0}
  .bar{height:10px;border-radius:var(--radius-pill);background:var(--border);overflow:hidden;margin-bottom:var(--sp3)}
  .bar > div{height:100%;background:var(--accent);transition:width .5s linear}
  .bar.over > div{background:var(--danger)}
  .cue{text-align:center;font-weight:700;color:var(--accent-dark);margin-bottom:var(--sp3);min-height:1.4em}
  .cue.over{color:var(--danger)}
  .btn{border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--primary-dark);color:#fff}
  .btn-ghost{background:transparent;color:var(--accent-dark);border:1px solid var(--border)}
  .row{display:flex;gap:var(--sp2);justify-content:center;flex-wrap:wrap}
  .check{display:flex;gap:var(--sp2);align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .check:last-child{border-bottom:none}
  .box{width:20px;height:20px;border:2px solid var(--accent);border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;margin-top:2px}
  .box.on{background:var(--accent)}
  .check .ct{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light,#87786a);font-weight:700}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3)}
  @media(max-width:640px){.twocol{grid-template-columns:1fr}}
  .do b{color:var(--success)} .dont b{color:var(--danger)}
  .pearl{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:var(--radius-sm);padding:var(--sp2) var(--sp3);font-size:.9rem;margin-top:var(--sp3)}
  .pearl b{color:var(--warning)}
  .modegrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2);margin-bottom:var(--sp3)}
  .modebtn{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:var(--sp3);font:inherit;cursor:pointer}
  .modebtn.on{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 2px rgba(42,107,94,.10)}
  .modebtn b{display:block;color:var(--accent-dark);font-family:var(--font-head);font-size:1.05rem;line-height:1.2;margin-bottom:2px}
  .modebtn span{display:block;color:var(--text-mid,#64574b);font-size:.86rem;line-height:1.35}
  .script{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--sp3);font-size:.94rem}
  .script b{color:var(--accent-dark)}
  .script code{white-space:normal;font-family:var(--font-body);font-weight:700;color:var(--primary-dark)}
  @media(max-width:640px){.modegrid{grid-template-columns:1fr}}
  .disclaimer{background:var(--bg-alt);border:1px dashed var(--border);border-radius:var(--radius-md);padding:var(--sp3);font-size:.82rem;color:var(--text-mid,#64574b);margin-top:var(--sp4)}
  .ringwrap{display:flex;justify-content:center;margin:var(--sp2) 0 var(--sp1)}
  .ring{width:150px;height:150px;border-radius:50%;position:relative;transition:background .5s linear}
  .ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
  .ringtime{font-family:var(--font-head);font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--accent-dark);line-height:1}
  .ring.over .ringtime{color:var(--danger)}
  .ringlbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-light,#87786a);font-weight:700;margin-top:5px}
  .ringtot{font-size:.78rem;color:var(--text-light,#87786a);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:var(--sp2)}
  .sdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--border);transition:background .2s,box-shadow .2s}
  .sdot.done{background:var(--accent)}
  .sdot.current{background:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  @media(prefers-reduced-motion:reduce){.ring,.sdot{transition:none}}
  footer{margin-top:var(--sp4);padding-top:var(--sp3);border-top:1px solid var(--border);font-size:.85rem;color:var(--text-light,#87786a);text-align:center}
  /* Short updates: the approved quick/guided layout, using the library's shared tokens. */
  .shell{width:min(1060px,100%)}
  .oral-header h1{font-size:1.45rem;color:var(--text,#3b332c);margin-bottom:5px}
  .oral-header .sub{font-size:.85rem}
  .oral-nav{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0}
  .oral-nav-button{font:inherit;font-size:.82rem;min-height:44px;padding:8px 13px;color:var(--text-mid,#64574b);background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer}
  .oral-nav-button[aria-pressed="true"]{color:var(--accent-dark);border-color:var(--border);background:var(--surface)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus,#2f6fd0);outline-offset:3px}
  .op-workspace{display:grid;grid-template-columns:210px minmax(0,1fr);background:var(--bg);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .op-workspace[hidden]{display:none}
  .op-workspace button{font-family:var(--font-body)}
  .op-sidebar{padding:26px 18px;border-right:1px solid var(--border)}
  .op-eyebrow{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mid,#64574b);margin:0 0 10px}
  .op-sidebar h2{font-size:1.45rem;font-weight:500;color:var(--text,#3b332c);margin:0 0 22px;line-height:1.25}
  .op-intent{display:block;width:100%;padding:15px 12px;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text,#3b332c);cursor:pointer;margin:0 0 10px;min-height:80px}
  .op-intent[aria-pressed="true"]{border-color:var(--accent-dark);background:var(--accent-light)}
  .op-intent span{display:block}
  .op-intent-title{font-size:.88rem;font-weight:600;line-height:1.4}
  .op-intent-meta{font-size:.74rem;color:var(--text-mid,#64574b);margin-top:6px}
  .op-side-note{font-size:.75rem;color:var(--text-mid,#64574b);margin-top:22px}
  .op-main{padding:26px;min-width:0}
  .op-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
  .op-title-row h2{font-size:2rem;font-weight:500;letter-spacing:-.025em;margin:0 0 9px;color:var(--text,#3b332c);line-height:1.15}
  .op-subtitle{color:var(--text-mid,#64574b);font-size:.83rem;margin:0}
  .op-clock{font-family:var(--font-head);font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent-dark);text-align:right}
  .op-time-label{display:block;font-family:var(--font-body);font-size:.7rem;margin-top:6px;color:var(--text-mid,#64574b)}
  .op-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}
  .op-modes{display:inline-flex;gap:3px;padding:4px;background:var(--accent-light);border-radius:9px}
  .op-mode{background:transparent;color:var(--text-mid,#64574b);border:0;border-radius:6px;padding:8px 13px;min-height:44px;font-size:.82rem;cursor:pointer}
  .op-mode[aria-pressed="true"]{background:var(--surface);color:var(--accent-dark);box-shadow:var(--shadow-sm)}
  .op-text{background:transparent;color:var(--accent-dark);border:0;padding:9px 2px;min-height:44px;font-size:.8rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .op-cues{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 16px}
  .op-cue{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
  .op-cue:last-child{border-bottom:0}
  .op-cue-number{border:0;border-radius:6px;min-height:44px;background:transparent;color:var(--accent-dark);font-size:1.15rem;cursor:pointer}
  .op-cue-number[aria-pressed="true"]{background:var(--accent-light)}
  .op-cue h3{font-family:var(--font-body);font-size:.9rem;font-weight:600;margin:0;color:var(--text,#3b332c)}
  .op-cue p{font-size:.77rem;margin:4px 0 0;color:var(--text-mid,#64574b);line-height:1.45}
  .op-seconds{font-size:.72rem;color:var(--text-mid,#64574b);white-space:nowrap;font-variant-numeric:tabular-nums}
  .op-guided{padding:22px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
  .op-steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .op-step{width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:50%;background:transparent;color:var(--text-mid,#64574b);font-size:.83rem;cursor:pointer}
  .op-step[aria-current="step"]{background:var(--accent-dark);color:var(--on-brand,#fff);border-color:var(--accent-dark)}
  .op-guided h3{font-size:1.7rem;font-weight:500;line-height:1.25;color:var(--text,#3b332c);margin:0 0 12px}
  .op-guide-copy{font-size:.95rem;margin:0 0 14px}
  .op-example{background:var(--warning-light);border-left:3px solid var(--warning);padding:15px;border-radius:0 8px 8px 0;margin:10px 0}
  .op-example span{font-size:.72rem;color:var(--warning)}
  .op-example p{font-family:var(--font-head);font-size:1.1rem;line-height:1.5;margin:7px 0 0}
  .op-practiced{display:flex;align-items:center;gap:10px;font-size:.8rem;min-height:44px;cursor:pointer;margin-top:10px}
  .op-practiced input{width:18px;height:18px;accent-color:var(--accent-dark)}
  .op-step-footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  .op-button{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text,#3b332c);min-height:44px;padding:10px 14px;font-size:.83rem;font-weight:600;cursor:pointer}
  .op-button:disabled{opacity:.45;cursor:default}
  .op-primary{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--on-brand,#fff)}
  .op-safety{padding:12px 14px;background:var(--accent-light);border-left:2px solid var(--accent-dark);font-size:.76rem;line-height:1.5;margin-top:16px}
  .op-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
  .op-actions>span{font-size:.75rem;color:var(--text-mid,#64574b)}
  .op-storage{font-size:.73rem;color:var(--text-mid,#64574b);margin:18px 0 0}
  .op-resume{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:28px;margin:20px 0}
  .op-resume h3{font-size:1.75rem;font-weight:500;margin-bottom:12px}
  .op-resume p:not(.op-eyebrow){font-size:.88rem;color:var(--text-mid,#64574b)}
  .op-resume-info{border-block:1px solid var(--border);padding:15px 0;margin:18px 0;font-size:.88rem}
  .op-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .oral-history{margin-top:18px}
  @media(max-width:740px){.op-workspace{grid-template-columns:1fr}.op-sidebar{padding:20px;border-right:0;border-bottom:1px solid var(--border)}.op-sidebar h2{margin-bottom:14px}.op-intents{display:grid;grid-template-columns:1fr 1fr;gap:9px}.op-intent{margin:0}.op-side-note{display:none}.op-main{padding:20px}}
  @media(max-width:420px){.shell{padding:16px 10px}.op-sidebar,.op-main{padding:16px}.op-title-row h2{font-size:1.7rem}.op-title-row{gap:10px}.op-clock{font-size:1.6rem}.op-guided{padding:16px}.op-cues{padding:0 12px}.op-cue{grid-template-columns:28px minmax(0,1fr) auto;gap:7px}.op-controls{gap:5px}.op-intent{padding:12px 10px}.oral-nav-button{padding:7px 9px}.op-button{padding:10px 12px}}
</style>

<body>
<div id="root"></div>
<script>
var e=React.createElement; var useState=React.useState; var useEffect=React.useEffect; var useRef=React.useRef;

var GATHER=[
  ['Overnight','Events, nursing notes, incidents, PRNs given'],
  ['Sleep','Hours slept; pattern vs. prior nights'],
  ['Behavior / milieu','Agitation, isolation, interactions, groups attended'],
  ['Intake','PO intake, appetite, hydration; refusals'],
  ['Meds','Current psychotropics, changes, missed/refused doses, levels'],
  ['Vitals / labs','Pertinent vitals, labs, drug levels, pending studies'],
  ['Safety','SI/HI status, observation level, restraint/seclusion use'],
  ['Disposition','Barriers to discharge, family/collateral, aftercare, legal status']
];
var STEPS=[
  {n:1,t:'One-liner',sec:20,d:'ID + chief concern + key context, in one sentence.',ex:'"Mr. A is a 34-year-old man with bipolar I, admitted on a hold for a manic episode after stopping lithium."'},
  {n:2,t:'Interval / overnight',sec:25,d:'What changed since the last presentation: events, behavior, sleep, intake, PRNs.',ex:'"Overnight he slept 3 hours, was redirectable, took one PRN olanzapine for agitation."'},
  {n:3,t:'Subjective + MSE highlights',sec:35,d:'Patient report plus the 2-3 MSE findings that matter today — not the whole exam.',ex:'"Reports he feels great; still pressured, expansive affect, grandiose themes, no SI/HI."'},
  {n:4,t:'Objective: meds, vitals, labs',sec:25,d:'Relevant data and changes only: current psychotropics + adjustments, pertinent vitals/labs/levels.',ex:'"Lithium restarted, level pending; valproate at goal; vitals stable."'},
  {n:5,t:'Safety / risk',sec:20,d:'Explicit SI/HI, agitation, elopement, and observation level — never skipped.',ex:'"No SI/HI; one agitation episode managed verbally; remains on Q15 checks."'},
  {n:6,t:'Assessment (formulation)',sec:25,d:'One to two lines: who, what, why now — biological + relational. Not a re-read of the HPI.',ex:'"Manic relapse precipitated by lithium discontinuation and sleep loss, with high family expressed emotion."'},
  {n:7,t:'Plan by problem',sec:30,d:'Problem-based, concrete next steps: meds, monitoring, milieu/family, disposition.',ex:'"1) Mania: resume lithium, recheck level. 2) Sleep: protect with scheduled meds. 3) Family meeting today. 4) Dispo: needs 1 more day of stability."'}
];
var TARGET=STEPS.reduce(function(a,s){return a+s.sec},0);
var MICRO=[
  {key:'collateral',title:'30-sec collateral update',target:30,sub:'Use after a collateral call, family call, outpatient-clinician call, or nursing update.',script:'Source -> baseline -> timeline -> risk/discharge -> plan change',steps:[
    {t:'Source + boundary',sec:5,d:'Who you spoke with and the consent/policy frame.',ex:'"I spoke with his sister with patient permission."'},
    {t:'Baseline',sec:6,d:'What the patient is like when well.',ex:'"Baseline is organized, employed, and usually sleeps 7 hours."'},
    {t:'Timeline',sec:6,d:'What changed and when.',ex:'"Sleep dropped 5 days ago, spending increased, then paranoia escalated."'},
    {t:'Risk / discharge',sec:8,d:'What changes safety or disposition.',ex:'"Family can secure meds, but cannot supervise overnight."'},
    {t:'Plan implication',sec:5,d:'One sentence on what this changes.',ex:'"This supports mania and makes discharge premature today."'}
  ]},
  {key:'rounds',title:'60-sec rounds update',target:60,sub:'Use for a daily patient update when the team already knows the admission story.',script:'Hospital day -> overnight -> one subjective/MSE change -> risk -> plan question',steps:[
    {t:'Hospital day + problem',sec:8,d:'Orient the team immediately.',ex:'"Hospital day 4 for mania with psychosis."'},
    {t:'Overnight data',sec:12,d:'Sleep, PRNs, safety events, vitals/labs only if relevant.',ex:'"Slept 5 hours, no IMs, accepted lithium and olanzapine."'},
    {t:'Patient + MSE delta',sec:15,d:'One patient report and one observed change.',ex:'"Feels slower; speech is less pressured but grandiosity persists."'},
    {t:'Risk update',sec:12,d:'What is safer, worse, or still unresolved.',ex:'"Violence risk is lower with sleep, but discharge risk remains high."'},
    {t:'Plan question',sec:13,d:'End with the decision you need from the team.',ex:'"My question is whether to request limited collateral today."'}
  ]}
];
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}

var ORALS_CAP=50;
var RUBRIC_ITEMS=[
  {k:'oneLiner',label:'Lead with the one-liner.'},
  {k:'siHi',label:'State SI/HI explicitly.'},
  {k:'synthesis',label:'Give a real assessment — who/what/why-now, not a recap.'},
  {k:'planByProblem',label:'Plan by problem with concrete next steps.'},
  // Adapted from the Don't card's "End without a plan or disposition thought." — NOT
  // byte-verbatim (the "without" was dropped to flip it into a positive self-check item; the
  // Do card's 5th line, "Know your numbers", doesn't cover this concept). If that Don't-card
  // line ever changes, re-check this label stays in sync.
  {k:'endedWithAsk',label:'End with a plan or disposition thought.'}
];
var FORMAT_LABEL={full:'Full presentation (7-step)',collateral:'30-sec collateral',rounds:'60-sec rounds'};
function loadOralReps(){
  try{
    var raw=localStorage.getItem('cw_orals_v1');
    if(!raw) return [];
    var parsed=JSON.parse(raw);
    if(!parsed||!Array.isArray(parsed.reps)) return [];
    return parsed.reps;
  }catch(err){ return []; }
}
function saveOralReps(list){
  try{ localStorage.setItem('cw_orals_v1', JSON.stringify({v:1,reps:list})); }catch(err){}
}
function targetForFormat(format){
  if(format==='full') return TARGET;
  var m=MICRO.filter(function(x){return x.key===format;})[0];
  return m?m.target:null;
}
function fmtRepDate(iso){
  var d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
}
function rubricScore(rubric){
  if(!rubric) return null;
  var keys=['oneLiner','siHi','synthesis','planByProblem','endedWithAsk'];
  var n=0;
  for(var i=0;i<keys.length;i++){ if(rubric[keys[i]]) n++; }
  return n;
}

/* Only bounded practice state is retained in this tab. Bump v when cue identities change. */
function oralSession(raw){
  var source=raw&&raw.v===1?raw:{};

  var result={v:1,format:source.format==='collateral'?'collateral':'rounds',paused:source.paused===true,entry:{
    format:['rounds','collateral'].indexOf(priorEntry.format)>=0?priorEntry.format:null,

    var item=source.items&&source.items[key]||{}, target=key==='rounds'?60:30;
    var seconds=typeof item.seconds==='number'&&isFinite(item.seconds)?Math.max(0,Math.min(target,Math.floor(item.seconds))):0;
    var step=typeof item.step==='number'&&isFinite(item.step)?Math.max(0,Math.min(4,Math.floor(item.step))):0;
    var done=[];
    if(Array.isArray(item.done)) item.done.forEach(function(n){if(typeof n==='number'&&n>=0&&n<5&&n%1===0&&done.indexOf(n)<0)done.push(n);});
    var repAt=typeof item.repAt==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(item.repAt)&&isFinite(Date.parse(item.repAt))?item.repAt:null;
    result.items[key]={seconds:seconds,step:step,view:item.view==='guided'?'guided':'quick',example:item.example===true,done:done,repAt:repAt};
  });

}
function oralEntry(search){
  var result={format:null,view:null};
  try{
    var sp=new URLSearchParams(search);
    ['format','view'].forEach(function(key){
      var allowed=key==='format'?['rounds','collateral']:['quick','guided'];
      if(sp.getAll(key).length===1&&allowed.indexOf(sp.get(key))>=0)result[key]=sp.get(key);
    });

}
function oralTransition(previous,action){
  var state=oralSession(previous), a=action||{}, item=state.items[state.format];
  if(a.type==='format'&&(a.value==='rounds'||a.value==='collateral')){state.format=a.value;state.paused=false;}
  else if(a.type==='view'&&(a.value==='quick'||a.value==='guided'))item.view=a.value;
  else if(a.type==='step'&&typeof a.value==='number'&&isFinite(a.value)){item.step=Math.max(0,Math.min(4,Math.floor(a.value)));item.example=false;}
  else if(a.type==='seconds'&&typeof a.value==='number'&&isFinite(a.value))item.seconds=Math.max(0,Math.min(state.format==='rounds'?60:30,Math.floor(a.value)));

  else if(a.type==='pause')state.paused=true;
  else if(a.type==='resume')state.paused=false;
  else if(a.type==='reset'){state.items[state.format]=oralSession(null).items[state.format];state.items[state.format].view=item.view;state.paused=false;}

    var ix=item.done.indexOf(a.value);if(ix<0)item.done.push(a.value);else item.done.splice(ix,1);

function oralRestore(raw,search){
  var value=oralSession(raw), entry=oralEntry(search);
  /* Apply a new entry link once; reloading the same link keeps the learner's place. */
  if(entry.format!==value.entry.format||entry.view!==value.entry.view){
    if(entry.format)value=oralTransition(value,{type:'format',value:entry.format});
    if(entry.view)value=oralTransition(value,{type:'view',value:entry.view});
    if(entry.format||entry.view)value.paused=false;
  }
  value.entry=entry;return value;
}

      e('div',{className:'ringwrap'},
        e('div',{className:'ring'+(over?' over':''),role:'img',
          'aria-label':'Practice timer: '+fmt(sec)+' elapsed of a '+fmt(TARGET)+' target'+(over?', over time':', '+fmt(remain)+' remaining'),
          style:{background:'conic-gradient('+(over?'var(--danger)':'var(--accent)')+' '+deg+'deg, var(--primary-light) 0deg)'}},
          e('div',{className:'ringtxt'},
            e('div',{className:'ringtime'}, over?('+'+fmt(sec-TARGET)):fmt(remain)),
            e('div',{className:'ringlbl'}, over?'over time':'left')))
      ),
      e('div',{className:'ringtot'}, fmt(sec)+' / '+fmt(TARGET)+' elapsed'),
      e('div',{className:'bar'+(over?' over':'')}, e('div',{style:{width:pct+'%'}})),
      e('div',{className:'cue'+(over?' over':'')}, cue),
      e('div',{className:'row'},
        e('button',{className:'btn btn-primary',onClick:function(){ if(run) stopFullRep(); setRun(!run); }}, run?'Pause':(sec?'Resume':'Start')),
        e('button',{className:'btn btn-ghost',onClick:function(){ if(run) stopFullRep(); setRun(false);setSec(0);setDone({});setStepMark({});setFullRepAt(null); }},'Reset'))
    ),
    e('div',{className:'card'},
      e('p',{className:'sub',style:{marginTop:0}},'Tick each section as you say it. The highlighted step is where a well-paced presentation should be right now.'),
      STEPS.map(function(s,i){
        var st=done[s.n]?'done':(run?(i<cur?'done':(i===cur?'current':'future')):'future');
        return e('div',{className:'step'+(i===cur&&run?' active':'')+(done[s.n]?' done':''),key:s.n,onClick:function(){toggleDone(s.n)},style:{cursor:'pointer'}},
          e('span',{style:{display:'flex',alignItems:'center',gap:'9px'}},
            e('span',{className:'sdot '+st,title:st==='current'?'on now':(st==='done'?'covered':'upcoming')}),
            e('span',{className:'box'+(done[s.n]?' on':'')}, done[s.n]?'✓':'')),
          e('div',null, e('h3',null,s.t), e('div',{className:'d'},s.d)),
          e('span',{className:'t'},'~'+s.sec+'s'));
      })
    ),
    rubricPanel(['full']),
    lastFivePanel()
  );

  return e('div',{className:'shell'},
    header, tabs,
    e(ShortUpdates,{key:'short-updates',active:tab==='micro',onRecord:recordShortRep}),
    tab==='gather'?gather:(tab==='present'?present:(tab==='practice'?practice:e('div',{className:'oral-history'},rubricPanel(['collateral','rounds']),lastFivePanel()))),
    e('div',{className:'disclaimer'},'Optional educational aid for clinical trainees. Examples are fictional composites — no protected health information. The format is a scaffold; follow your team and institution conventions.'),
    e('footer',null,'Treatment Team Rounding Prep · Psychiatry Clerkship Library · Joshua Moss, MD | Psychiatrist')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
