<!DOCTYPE html>
<html lang="en">
<head>
<!-- [CLERKSHIP-META v1] tool="Practice Questions — MS3 Question Bank" version="1.1" built="2026-07-07" category="practice" audience="trainee,ms3" settings="self-study" time="10min" summary="Browser-local practice question bank with confidence, trap feedback, and spaced-review hooks. Educational; fictional composites only; no PHI." -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Practice Questions — MS3 Question Bank</title>
<style>
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:root{
  --bg:#f6f3ee;--bg-alt:#faf6f0;--surface:#ffffff;--border:#ddd3c6;
  --primary:#c25a3c;--primary-dark:#a84830;--primary-light:#f3ebe5;
  --accent:#2a6b5e;--accent-dark:#1e5248;--accent-light:#edf4f2;
  --text:#2f2924;--text-mid:#51473d;--text-light:#665a4f;
  --success:#357160;--success-light:#e7f1ed;
  --danger:#a34132;--danger-light:#fbece9;
  --warning:#7a6234;--warning-light:#f5efe2;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --focus:#155eef;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.6}
.app{max-width:740px;margin:0 auto;padding:20px 16px 60px}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr h1{font-family:var(--font-head);color:var(--primary);font-size:1.35rem;margin:0;flex:1}
.prog-label{font-size:.82rem;color:var(--text-light)}
.qprog{height:4px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.qprog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
/* Buttons */
.btn{border:none;border-radius:8px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary-dark);color:#fff}.btn-primary:hover{background:var(--primary)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-dark)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-mid)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
/* Setup */
.setup{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.setup h2{font-family:var(--font-head);color:var(--text);font-size:1.25rem;margin:0 0 4px}
.setup .sub{color:var(--text-mid);font-size:.88rem;margin:0 0 18px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.field label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:4px}
.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--surface);color:var(--text);font-size:.88rem}
.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.setup-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.item-count{font-size:.82rem;color:var(--text-light)}
.focus-modes{border-top:1px solid var(--border);margin:4px 0 20px;padding-top:16px}
.focus-modes-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:4px}
.focus-modes-sub{color:var(--text-mid);font-size:.82rem;margin:0 0 10px}
.focus-btns{display:flex;gap:10px;flex-wrap:wrap}
/* Question card */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.qcard-meta{display:flex;align-items:center;gap:7px;padding:14px 18px 0;flex-wrap:wrap}
.chip{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:3px 9px;border:1px solid var(--border)}
.chip-cat{color:var(--accent-dark);background:var(--accent-light);border-color:var(--accent-light)}
.chip-draft{color:var(--warning);background:var(--warning-light);border-color:var(--warning)}
.chip-hy{color:var(--primary-dark);background:var(--primary-light);border-color:var(--primary-light)}
.chip-rel{color:var(--info,#41618a);background:var(--info-light,#eaf0f6);border-color:var(--info-light,#eaf0f6)}
.diff-dots{display:flex;gap:3px;align-items:center;margin-left:2px}
.diff-dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.diff-dot.on{background:var(--primary)}
.qcard-stem{padding:16px 18px 12px;font-family:var(--font-head);font-size:1.06rem;line-height:1.55;color:var(--text)}
.qcard-stem .subtype{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-dark);display:block;margin-bottom:6px;font-family:var(--font-body)}
/* Confidence */
.conf-section{padding:0 18px 12px}
.conf-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:8px}
.conf-btns{display:flex;gap:8px}
.conf-btn{flex:1;border:2px solid var(--border);background:var(--bg-alt);border-radius:10px;padding:8px 6px;cursor:pointer;font:inherit;font-size:.78rem;font-weight:700;color:var(--text-mid);text-align:center;line-height:1.3;transition:border-color .12s,background .12s,color .12s}
.conf-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.conf-btn.guess.on{border-color:var(--warning);background:var(--warning-light);color:var(--warning)}
.conf-btn.likely.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
.conf-btn.certain.on{border-color:var(--success);background:var(--success-light);color:var(--success)}
.conf-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.conf-hint{font-size:.74rem;color:var(--danger);margin-top:4px;display:none}
.conf-hint.show{display:block}
/* Options */
.opts{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--border);background:var(--bg-alt);border-radius:10px;padding:11px 14px;cursor:pointer;font:inherit;font-size:.92rem;color:var(--text);line-height:1.45;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled):not(.locked){border-color:var(--accent);background:var(--accent-light)}
.opt.locked{cursor:default}
.opt.selected-wrong{border-color:var(--danger) !important;background:var(--danger-light) !important}
.opt.correct-reveal{border-color:var(--success) !important;background:var(--success-light) !important}
.opt.selected-correct{border-color:var(--success) !important;background:var(--success-light) !important;font-weight:600}
.opt-key{font-weight:700;margin-right:8px;font-size:.8rem;color:var(--text-light)}
.opt.correct-reveal .opt-key,.opt.selected-correct .opt-key{color:var(--success)}
.opt.selected-wrong .opt-key{color:var(--danger)}
/* Tier2 */
.tier2-section{border-top:2px solid var(--border);padding:16px 18px 0;background:var(--bg-alt)}
.tier2-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-dark);margin-bottom:6px}
.tier2-q{font-weight:700;font-size:.95rem;margin:0 0 10px;color:var(--text)}
.tier2-note{font-size:.78rem;color:var(--text-light);font-style:italic;margin-bottom:10px}
/* Feedback */
.feedback{border-top:2px solid var(--border);padding:16px 18px;background:var(--surface)}
.verdict{font-size:1.05rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.verdict.correct{color:var(--success)}.verdict.wrong{color:var(--danger)}.verdict.shaky{color:var(--warning)}
.fb-trap{background:var(--danger-light);border-left:3px solid var(--danger);border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:12px;font-size:.88rem}
.fb-trap .tn{font-weight:700;color:var(--danger)}
.fb-trap .note{color:var(--text-mid);margin-top:3px}
.fb-shaky{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:12px;font-size:.88rem;color:var(--warning)}
.fb-block{margin-bottom:10px;font-size:.9rem;line-height:1.55}
.fb-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);display:block;margin-bottom:2px}
.fb-link{display:inline-block;margin-top:10px;color:var(--accent-dark);font-size:.86rem;font-weight:600;text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:6px 12px}
.fb-link:hover{background:var(--accent-light)}
.fb-link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.fb-actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Summary */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.summary h2{font-family:var(--font-head);color:var(--text);font-size:1.25rem;margin:0 0 4px}
.sum-score{font-family:var(--font-head);font-size:2.6rem;color:var(--accent-dark);line-height:1;margin-bottom:2px}
.sum-sub{color:var(--text-mid);font-size:.88rem;margin:0 0 18px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.sum-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--bg-alt)}
.sum-card .k{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-bottom:3px}
.sum-card .v{font-family:var(--font-head);font-size:1.4rem;color:var(--text)}
.sum-card .v small{font-size:.75rem;color:var(--text-light);font-family:var(--font-body)}
.cal-warn{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:0 8px 8px 0;padding:10px 13px;font-size:.86rem;color:var(--warning);margin-bottom:14px}
/* Un-attested items are served but always labelled (2026-07-15 decision log). Same
   warning tokens as .cal-warn/.chip-draft, which clear WCAG AA at normal size in both
   themes (--warning on --warning-light: 5.06:1 light, 4.74:1 dark). The wording states
   the status outright, so the meaning never rests on colour or on the icon. */
.draft-notice{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:0 8px 8px 0;padding:10px 13px;font-size:.86rem;color:var(--warning);margin:12px 18px 0}
.setup-draft-note{background:var(--warning-light);border-left:3px solid var(--warning);border-radius:0 8px 8px 0;padding:10px 13px;font-size:.86rem;color:var(--warning);margin:0 0 14px}
.setup-draft-note .chip-draft{margin-right:4px}
.setup-draft-toggle{display:block;margin-top:8px;font-weight:600;cursor:pointer}
.setup-draft-toggle input{margin-right:6px}
.sum-certlist{margin-bottom:16px}
.sum-certlist h3{font-family:var(--font-head);font-size:.95rem;color:var(--text);margin:0 0 8px}
.sum-certlist .row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.84rem}
.sum-certlist .lab{flex:0 0 38%;color:var(--text-mid);text-transform:capitalize}
.sum-certlist .track{flex:1;height:7px;background:var(--bg-alt);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.sum-certlist .fill{height:100%;background:var(--success);border-radius:999px}
.sum-certlist .fill.warn{background:var(--warning)}
.sum-certlist .pct{flex:0 0 36px;text-align:right;font-size:.76rem;color:var(--text-light)}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap}
/* Misc */
.loading{text-align:center;padding:40px;color:var(--text-light);font-size:.95rem}
.err-box{background:var(--danger-light);border:1px solid var(--danger);border-radius:12px;padding:16px;color:var(--danger);font-size:.9rem}
@media(prefers-reduced-motion:no-preference){
  .qcard{animation:qrise .22s ease both}
  @keyframes qrise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
@media(max-width:520px){
  .conf-btns{gap:5px}.conf-btn{font-size:.72rem;padding:7px 4px}
  .qcard-stem{font-size:1rem}
}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <h1>Practice Questions</h1>
    <span class="prog-label" id="progLabel"></span>
  </div>
  <div class="qprog" id="qprog" hidden><div class="qprog-fill" id="qprogFill" style="width:0%"></div></div>
  <main id="root"><div class="loading">Loading question bank&hellip;</div></main>
  <div id="qb-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</div>
<script>
(function(){
'use strict';
var BANK = null;
var SESSION = null;
var REVIEW_CONTEXT = readReviewContext();
/* ?resume=1 rides the shell's toolExtraFromParams passthrough (spa_index.html) — no
   shell change needed to reach this tool's iframe query string. */
var RESUME_REQUESTED = (function(){
  try{ return new URLSearchParams(location.search).get('resume')==='1'; }catch(_){ return false; }
})();
var CAT_LABELS = {
  mood:'Mood',psychosis:'Psychosis',anxiety:'Anxiety/Trauma',
  substance:'Substance Use',neurocog:'Neurocognitive',pharm:'Pharmacology',
  safety:'Safety',personality:'Personality',childdev:'Child/Dev',
  otherdx:'Other Dx',ethics:'Ethics/Law',relational:'Relational'
};
var SUBTYPE_LABELS = {
  'family-system':'Family system','what-would-you-say':'What would you say?',
  'transition-of-care':'Transition of care'
};

/* ---- utilities ---------------------------------------------------------------- */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){
  var a=arr.slice(),i=a.length,j,t;
  while(i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function readReviewContext(){
  var sp = new URLSearchParams(location.search);
  var reviewItem = sp.get('reviewItem') || '';
  var reviewKey = sp.get('reviewKey') || '';
  var reviewToken = sp.get('reviewToken') || '';
  if(sp.getAll('reviewItem').length !== 1 || sp.getAll('reviewKey').length !== 1
      || sp.getAll('reviewToken').length !== 1) return null;
  if(!/^qb_[a-z]+_[0-9]{3}$/.test(reviewItem)) return null;
  if(reviewKey !== 'question:' + reviewItem) return null;
  if(!/^[0-9a-f]{32}$/.test(reviewToken)) return null;
  return Object.freeze({reviewItem:reviewItem, reviewKey:reviewKey, reviewToken:reviewToken});
}

function postReviewItemStatus(status){
  if(!REVIEW_CONTEXT || ['ready','not_found','error'].indexOf(status) < 0) return;
  window.parent.postMessage({
    type:'faculty-preview-question-status',
    reviewKey:REVIEW_CONTEXT.reviewKey,
    reviewToken:REVIEW_CONTEXT.reviewToken,
    reviewItem:REVIEW_CONTEXT.reviewItem,
    status:status,
    surface:'question'
  }, location.origin);
}

/* ---- localStorage helpers ----------------------------------------------------- */
function lsGet(k){ try{return JSON.parse(localStorage.getItem(k)||'null');}catch(_){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(_){} }

/* ---- cw_qb_v1 response store -------------------------------------------------- */
function qbLoad(){ return lsGet('cw_qb_v1')||{}; }
function qbSave(data){ lsSet('cw_qb_v1',data); }
function qbRecord(item, key, tier2Key, confidence, correct, twoTierResult){
  var data = qbLoad();
  var prev = data[item.id];
  var re = (prev && prev.ts && (new Date(prev.ts)).toDateString() === (new Date()).toDateString()) ? 1 : 0;
  var rec = {
    id: item.id,
    key: key,
    tier2Key: tier2Key||null,
    confidence: confidence,
    correct: correct,
    pages: item.pages||[],
    ts: Date.now()
  };
  if(confidence==='certain' && !correct) rec.certWrong = true;
  data[item.id] = rec;
  qbSave(data);
  calibLog({s:'qb',id:item.id,pages:item.pages||[],p:confidence,a:correct?1:0,t2:twoTierResult||null,re:re,ts:Date.now()});
  return rec;
}

/* ---- cw_srs_v1 SRS seeding + grading ----------------------------------------- */
function srsLoad(){
  var s = lsGet('cw_srs_v1');
  if(!s||s.v!==1){
    s={v:1,cards:{},day:{lastDay:'',newToday:0},
      stats:{streak:0,lastStudy:'',totalReviews:0,correct:0,seen:0},
      settings:{newPerDay:12}};
  }
  return s;
}
function srsSave(s){ lsSet('cw_srs_v1',s); }

function srsGrade(item, confidence, correct, twoTierResult){
  /* Map confidence×correct to SM-2 grade, respecting two-tier shaky cap */
  if(!correct) return 'Again';
  if(twoTierResult==='shaky') return 'Hard';  /* cap: right answer, wrong reason */
  if(confidence==='certain') return 'Easy';
  if(confidence==='likely')  return 'Good';
  /* guess + correct = Hard (lucky guess ≠ mastery) */
  return 'Hard';
}

var DAY = 86400000;
/*__SM2_APPLY_GRADE__*/

/*__CALIB_LOG__*/

/*__SESS_CAPSULE__*/

function srsUpdate(item, confidence, correct, twoTierResult){
  var s = srsLoad();
  var cardId = 'QB#'+item.id;
  var card = s.cards[cardId]||{ease:2.5,ivl:0,reps:0,lapses:0,due:Date.now(),last:0};
  var grade = srsGrade(item, confidence, correct, twoTierResult);
  s.cards[cardId] = applyGrade(card, grade, {fuzzKey:cardId});
  /* update aggregate stats */
  s.stats.totalReviews = (s.stats.totalReviews||0)+1;
  if(correct) s.stats.correct=(s.stats.correct||0)+1;
  s.stats.seen=(s.stats.seen||0)+1;
  srsSave(s);
  return grade;
}

/* ---- queue building ----------------------------------------------------------- */
function buildQueue(items, catFilter, diffFilter, sizeLimit){
  var q = items.filter(function(it){
    if(catFilter!=='all' && it.category!==catFilter) return false;
    if(diffFilter!=='all' && String(it.difficulty)!==diffFilter) return false;
    return true;
  });
  q = shuffle(q);
  if(sizeLimit!=='all') q = q.slice(0, parseInt(sizeLimit,10)||20);
  return q;
}

/* Items eligible to serve to learners. Two gates:
   — Retired items (near-duplicate/redundant per question_bank.schema.json) are NEVER queued.
   — Un-attested items serve ONLY when the learner opts in via the setup-screen toggle
     (persisted as cw_qb_drafts_v1). The default pool is faculty-attested items only, and
     every surface that shows an included draft labels it — see renderMeta() and the
     .draft-notice callout in renderQuestion().

   Policy history, because this has flipped before: the 2026-07-15 decision log recorded
   "serve drafts, marked" after a04a848 gated to attested-only by ACCIDENT — the pool fell
   192->143 with no UI trace, and #284 restored serving. The 2026-08-20 Taplinger response
   plan (PLAN_Taplinger_Feedback_and_Therapy_Library_2026-08-20.md §A2 / WP-37, urgency per
   FEEDBACK_IMPACT_Taplinger_Verbatim_2026-08-20.md §3) reverses that decision deliberately
   now that an external course page links to the site: attested-only BY DEFAULT, drafts
   opt-in and labelled. Unlike a04a848, this flip is visible — the setup screen states the
   exclusion, shows the excluded count, and carries the toggle.

   Fail-safe direction: only an explicit status==='attested' reaches the default pool, so a
   new or misspelled status is withheld rather than served as reviewed (mirrors the label
   logic, which marks anything not attested). `status` is still the source of truth; nothing
   here mutates it, and attestation stays server-side. */
function includeDrafts(){ return lsGet('cw_qb_drafts_v1')===true; }
function setIncludeDrafts(on){ lsSet('cw_qb_drafts_v1', !!on); }
function activeItems(){
  var inc = includeDrafts();
  return (BANK && BANK.items ? BANK.items : []).filter(function(it){
    if(it.retired) return false;
    if(!inc && it.status!=='attested') return false;
    return true;
  });
}

/* Focus-mode presets, built from the learner's own cw_qb_v1 history. Both start from
   activeItems(), so a leftover record for a since-retired item (or one dropped from the
   bank entirely) can never surface here — the item has to still be servable today. That
   same routing applies the draft rule: a record for a draft item surfaces only while the
   learner's cw_qb_drafts_v1 opt-in is set (see the policy comment above). */
function missedItems(){
  var records = qbLoad();
  return activeItems().filter(function(it){
    var rec = records[it.id];
    return !!rec && rec.correct === false;
  });
}
function certWrongItems(){
  var records = qbLoad();
  return activeItems().filter(function(it){
    var rec = records[it.id];
    return !!rec && rec.certWrong === true;
  });
}

/* Due-first serving. This tool has WRITTEN QB# cards to cw_srs_v1 since SRS seeding
   landed, but nothing ever read the schedule — Daily Review serves TOPIC# cards only
   (the false "resurfaces in Daily Review" copy was corrected in #344). This makes the
   schedule real: cards that have come due return at the FRONT of the next practice
   session here, most-overdue first. Routed through activeItems(), so a since-retired
   item can never resurface no matter what its card says. */
function dueQbItems(){
  var s = srsLoad();
  if(!s || !s.cards) return [];
  var now = Date.now(), due = {};
  Object.keys(s.cards).forEach(function(id){
    if(id.indexOf('QB#') !== 0) return;
    var c = s.cards[id];
    if(c && typeof c.due === 'number' && c.due <= now) due[id.slice(3)] = c.due;
  });
  return activeItems()
    .filter(function(it){ return Object.prototype.hasOwnProperty.call(due, it.id); })
    .sort(function(a, b){ return due[a.id] - due[b.id]; });
}

/* ---- rendering helpers -------------------------------------------------------- */
function diffDots(n){
  var h='<div class="diff-dots" title="Difficulty '+n+'/3" aria-label="Difficulty '+n+' of 3">';
  for(var i=1;i<=3;i++) h+='<span class="diff-dot'+(i<=n?' on':'')+'"></span>';
  return h+'</div>';
}

function renderSetup(){
  var items = activeItems();
  var cats = {};
  items.forEach(function(it){ cats[it.category]=1; });
  var catOpts = '<option value="all">All categories</option>';
  Object.keys(CAT_LABELS).forEach(function(k){
    if(cats[k]) catOpts+='<option value="'+k+'">'+CAT_LABELS[k]+'</option>';
  });
  var total = items.length;
  /* bankDraftCount is toggle-independent (all non-retired, non-attested items in the
     bank); draftCount is how many of those are in the SERVED pool right now. The note
     renders whenever the bank has drafts, in whichever wording matches the toggle —
     excluded-by-default (off) or labelled-in-pool (on). */
  var draftsOn = includeDrafts();
  var bankDraftCount = (BANK && BANK.items ? BANK.items : []).filter(function(it){
    return !it.retired && it.status!=='attested';
  }).length;
  var draftCount = draftsOn ? bankDraftCount : 0;
  var missedCount = missedItems().length;
  var certWrongCount = certWrongItems().length;
  var dueCount = dueQbItems().length;
  return '<div class="setup">'
    +'<h2>Practice bank</h2>'
    +'<p class="sub">'+total+' items across 12 categories. Select filters, then start. '
      +'Retired near-duplicates are excluded.</p>'
    +(bankDraftCount
      ? '<p class="setup-draft-note" role="note">'
        +'<span class="chip chip-draft"><span aria-hidden="true">&#9888;</span> Draft — not yet faculty-reviewed</span> '
        +(draftsOn
          ? draftCount+' of these '+total+' questions carry this label. They have not yet been '
            +'reviewed by faculty, so treat their answers and explanations as unverified — check them '
            +'against a primary source before relying on them clinically. Every draft is labelled again '
            +'on the question itself. '
          : bankDraftCount+' draft question'+(bankDraftCount===1?' is':'s are')+' not served by default — '
            +'this bank serves only faculty-reviewed questions unless you include drafts. ')
        +'<label class="setup-draft-toggle"><input type="checkbox" id="draftToggle"'+(draftsOn?' checked':'')+'> '
        +'Include draft questions</label></p>'
      : '')
    +'<div class="focus-modes">'
    +'<div class="focus-modes-lbl">Focus modes</div>'
    +'<p class="focus-modes-sub">Jump straight into a targeted set, skipping the filters below.</p>'
    +'<div class="focus-btns">'
    +'<button class="btn btn-ghost" id="dueBtn"'+(dueCount?'':' disabled')+'>Due for review ('+dueCount+')</button>'
    +'<button class="btn btn-ghost" id="redoMissesBtn"'+(missedCount?'':' disabled')+'>Redo my misses ('+missedCount+')</button>'
    +'<button class="btn btn-ghost" id="certWrongBtn"'+(certWrongCount?'':' disabled')+'>Confidently wrong ('+certWrongCount+')</button>'
    +'</div>'
    +'</div>'
    +'<div class="filters">'
    +'<div class="field"><label for="f-cat">Category</label><select id="f-cat">'+catOpts+'</select></div>'
    +'<div class="field"><label for="f-diff">Difficulty</label><select id="f-diff"><option value="all">All levels</option><option value="1">1 — Recognition</option><option value="2">2 — Shelf-standard</option><option value="3">3 — Stretch</option></select></div>'
    +'<div class="field"><label for="f-size">Session size</label><select id="f-size"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="all">All matching</option></select></div>'
    +'</div>'
    +'<div class="setup-foot">'
    +'<button class="btn btn-primary" id="startBtn">Start practice</button>'
    +'<span class="item-count" id="itemCount">'+total+' questions match</span>'
    +'</div>'
    +'</div>';
}

function renderMeta(item){
  var h = '<div class="qcard-meta">';
  h += '<span class="chip chip-cat">'+esc(CAT_LABELS[item.category]||item.category)+'</span>';
  h += diffDots(item.difficulty);
  if(item.type==='two-tier') h+='<span class="chip">Two-tier</span>';
  if(item.type==='relational') h+='<span class="chip chip-rel">Relational</span>';
  if(item.hy) h+='<span class="chip chip-hy">&#9733; High-yield</span>';
  /* The glyph is decorative — the wording carries the meaning, so the label never depends
     on colour or on the icon being announced. */
  if(item.status!=='attested') h+='<span class="chip chip-draft"><span aria-hidden="true">&#9888;</span> Draft — not yet faculty-reviewed</span>';
  h += '</div>';
  return h;
}

function renderConfidence(disabled){
  var ds = disabled ? ' disabled' : '';
  return '<div class="conf-section">'
    +'<div class="conf-lbl">Your confidence — select before answering</div>'
    +'<div class="conf-btns">'
    +'<button class="conf-btn guess" data-conf="guess"'+ds+'>Guess<br><small style="font-weight:400;font-size:.7em;opacity:.8">uncertain</small></button>'
    +'<button class="conf-btn likely" data-conf="likely"'+ds+'>Likely<br><small style="font-weight:400;font-size:.7em;opacity:.8">confident</small></button>'
    +'<button class="conf-btn certain" data-conf="certain"'+ds+'>Certain<br><small style="font-weight:400;font-size:.7em;opacity:.8">no doubt</small></button>'
    +'</div>'
    +'<div class="conf-hint" id="confHint">Select your confidence level first.</div>'
    +'</div>';
}

function renderOptions(item, state){
  /* state: 'active'|'locked' — locked after answer.
     Letters come from DISPLAY position, not the authored key: 46 of 47 draft items are
     keyed A, so rendering opt.key after the shuffle both scrambled the letter sequence
     and let "A." follow the correct answer around the screen. data-key still carries the
     authored key for answer logic. A locked re-render reuses the session's stored order —
     reshuffling at lock would visibly jump the options mid-question. */
  var displayOrder = (state==='locked' && SESSION.displayOrder && SESSION.displayOrder.length)
    ? SESSION.displayOrder : shuffle(item.options.slice());
  SESSION.displayOrder = displayOrder;
  var h = '<div class="opts" id="optsList">';
  displayOrder.forEach(function(opt, i){
    var letter = String.fromCharCode(65+i);
    var cls = 'opt';
    if(state==='locked') cls += ' locked';
    h += '<button class="'+cls+'" data-key="'+esc(opt.key)+'" '
       + (state==='locked'?'disabled ':'')+' aria-label="Option '+letter+': '+esc(opt.t)+'">'
       + '<span class="opt-key">'+letter+'.</span>'+esc(opt.t)
       + '</button>';
  });
  h += '</div>';
  return h;
}

function renderTier2(item){
  var t2 = item.tier2;
  var displayOrder = shuffle(t2.options.slice());
  SESSION.tier2DisplayOrder = displayOrder;
  var h = '<div class="tier2-section" id="tier2Sect">'
    +'<div class="tier2-lbl">Now the reason</div>'
    +'<p class="tier2-q">'+esc(t2.q)+'</p>'
    +'<p class="tier2-note">Select the best rationale — then see your full feedback.</p>'
    +'<div class="opts" id="tier2Opts">';
  displayOrder.forEach(function(opt, i){
    var letter = String.fromCharCode(65+i);
    h += '<button class="opt" data-tier2key="'+esc(opt.key)+'" aria-label="Rationale '+letter+': '+esc(opt.t)+'">'
       + '<span class="opt-key">'+letter+'.</span>'+esc(opt.t)+'</button>';
  });
  h += '</div></div>';
  return h;
}

function getFeedbackHtml(item, selectedKey, tier2Key, confidence, correct, twoTierResult){
  var reviewOnly = SESSION && SESSION.reviewOnly;
  var h = '<div class="feedback" id="feedbackPanel">';
  /* verdict */
  var verdClass, verdText;
  if(twoTierResult==='shaky'){
    verdClass='shaky'; verdText='&#10003; Right answer — shaky reasoning';
  } else if(correct){
    verdClass='correct'; verdText='&#10003; Correct';
    if(confidence==='certain') verdText+=' &#183; Nailed it';
    else if(confidence==='guess') verdText+=' &#183; Lucky — review soon';
  } else {
    verdClass='wrong'; verdText='&#10007; Incorrect';
    if(confidence==='certain') verdText+=' &#183; Confidently wrong — flagged for review';
  }
  h += '<div class="verdict '+verdClass+'">'+verdText+'</div>';
  /* trap feedback for wrong answers */
  if(!correct){
    var wrongOpt = item.options.filter(function(o){return o.key===selectedKey;})[0];
    if(wrongOpt&&wrongOpt.trap){
      h += '<div class="fb-trap">'
         +'<div class="tn">You fell for: '+esc(wrongOpt.trap.name)+'</div>'
         +'<div class="note">'+esc(wrongOpt.trap.note)+'</div>'
         +'</div>';
    }
    /* reveal correct option — letter must match what the learner SAW (display position),
       not the authored key */
    var correctOpt = item.options.filter(function(o){return o.c;})[0];
    if(correctOpt){
      var cIdx = (SESSION.displayOrder||[]).indexOf(correctOpt);
      var cLetter = cIdx>=0 ? String.fromCharCode(65+cIdx) : correctOpt.key;
      h += '<div class="fb-block"><span class="fb-lbl">Correct answer</span>'
         + '<strong>'+esc(cLetter)+'. </strong>'+esc(correctOpt.t)+'</div>';
    }
  }
  /* shaky reason feedback */
  if(twoTierResult==='shaky'){
    var correctT2 = item.tier2.options.filter(function(o){return o.c;})[0];
    h += '<div class="fb-shaky">Right answer, wrong reason — your SRS interval is capped at <em>Hard</em>, so this item comes due again soon and will serve at the front of a future session here. The correct rationale: <strong>'+esc(correctT2?correctT2.t:'—')+'</strong></div>';
    h += '<div class="fb-block"><span class="fb-lbl">Why that rationale</span>'+esc(item.tier2.why)+'</div>';
  }
  /* standard why / pearl / evidence */
  h += '<div class="fb-block"><span class="fb-lbl">Why</span>'+esc(item.why)+'</div>';
  h += '<div class="fb-block"><span class="fb-lbl">Pearl</span><em>'+esc(item.pearl)+'</em></div>';
  h += '<div class="fb-block"><span class="fb-lbl">Source</span>'+esc(item.evidence)+'</div>';
  /* deep link */
  if(!reviewOnly && item.link&&item.link.href){
    var linkHref = item.link.href;
    /* route through SPA shell if running inside iframe */
    var isSPA = (window.self!==window.top);
    if(isSPA && linkHref.indexOf('?page=')===-1 && linkHref.indexOf('?tool=')===-1){
      linkHref = '?tool='+encodeURIComponent(linkHref);
    }
    h += '<a class="fb-link" href="'+esc(linkHref)+'" '+(isSPA?'data-spa-nav="1"':' target="_blank" rel="noopener"')+'>'
       + esc(item.link.label||'Continue reading')+(isSPA?'':' →')+'</a>';
  }
  if(!reviewOnly){
    h += '<div class="fb-actions">'
       + '<button class="btn btn-accent" id="nextBtn">Next question &rarr;</button>'
       + '</div>';
  }
  h += '</div>';
  return h;
}

/* Un-attested items are served (2026-07-15 decision) but never served silently: the meta
   chip above marks them at a glance, and this callout states plainly what "draft" means
   before the learner reads the stem. role="note" so it is reachable as its own region and
   is not mistaken for part of the question. */
function renderDraftNotice(item){
  if(item.status==='attested') return '';
  return '<div class="draft-notice" role="note">'
    +'<strong><span aria-hidden="true">&#9888;</span> Draft — not yet faculty-reviewed.</strong> '
    +'This question and its explanation have not been checked by faculty. Practise with it, '
    +'but verify anything you would act on against a primary source.'
    +'</div>';
}

function renderQuestion(item){
  var h = '<div class="qcard">';
  h += renderMeta(item);
  h += renderDraftNotice(item);
  h += '<div class="qcard-stem">';
  if(item.type==='relational'&&item.subtype){
    h += '<span class="subtype">'+esc(SUBTYPE_LABELS[item.subtype]||item.subtype)+'</span>';
  }
  h += esc(item.stem);
  h += '</div>';
  h += renderConfidence(false);
  h += renderOptions(item, 'active');
  h += '</div>';
  return h;
}

/* ---- render session summary -------------------------------------------------- */
function renderSummary(){
  var responses = SESSION.responses;
  var total = responses.length;
  var correct = responses.filter(function(r){return r.correct;}).length;
  var pct = total ? Math.round(correct/total*100) : 0;
  /* calibration: certain answers that were correct */
  var certTotal=0, certCorrect=0;
  responses.forEach(function(r){
    if(r.confidence==='certain'){ certTotal++; if(r.correct) certCorrect++; }
  });
  var certPct = certTotal ? Math.round(certCorrect/certTotal*100) : null;
  /* calibration by category */
  var byCat={};
  responses.forEach(function(r){
    var c=r.item.category;
    if(!byCat[c]) byCat[c]={cert:0,certC:0};
    if(r.confidence==='certain'){ byCat[c].cert++; if(r.correct)byCat[c].certC++; }
  });
  var h = '<div class="summary">';
  h += '<h2>Session complete</h2>';
  h += '<div class="sum-score">'+correct+'/'+total+'</div>';
  h += '<div class="sum-sub">'+pct+'% correct &nbsp;&#183;&nbsp; '+total+' question'+(total!==1?'s':'')+' answered</div>';
  h += '<div class="sum-grid">';
  h += '<div class="sum-card"><div class="k">Correct</div><div class="v">'+correct+'<small> / '+total+'</small></div></div>';
  if(certTotal>0){
    h += '<div class="sum-card"><div class="k">When certain</div><div class="v">'+certPct+'%<small> accurate</small></div></div>';
  }
  var certWrong = responses.filter(function(r){return r.confidence==='certain'&&!r.correct;}).length;
  if(certWrong>0){
    h += '<div class="sum-card"><div class="k">Confidently wrong</div><div class="v">'+certWrong+'<small> flagged</small></div></div>';
  }
  h += '</div>';
  /* calibration warning */
  if(certTotal>=3 && certPct!==null && certPct<80){
    h += '<div class="cal-warn">'
       + '<strong>Calibration gap:</strong> You were certain '+certTotal+' time'+(certTotal!==1?'s':'')
       + ' but only '+certPct+'% accurate when certain. '
       + 'Miscalibration on the wards is more dangerous than ignorance — '
       + 'replay your confidently-wrong items from this summary.</div>';
  }
  /* per-category calibration bars */
  var catKeys = Object.keys(byCat).filter(function(k){ return byCat[k].cert>=2; });
  if(catKeys.length){
    h += '<div class="sum-certlist"><h3>Calibration by category</h3>';
    catKeys.forEach(function(k){
      var d=byCat[k], p=Math.round(d.certC/d.cert*100);
      h += '<div class="row">'
         +'<span class="lab">'+esc(CAT_LABELS[k]||k)+'</span>'
         +'<span class="track"><span class="fill'+(p<80?' warn':'')+'" style="width:'+p+'%"></span></span>'
         +'<span class="pct">'+p+'%</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="sum-actions">'
     +'<button class="btn btn-primary" id="practiceMoreBtn">Practice more</button>'
     +'<button class="btn btn-ghost" id="goHomeBtn">Go to Home</button>'
     +'</div></div>';
  return h;
}

/* ---- DOM helpers -------------------------------------------------------------- */
var root = document.getElementById('root');
var progLabel = document.getElementById('progLabel');
var qprog = document.getElementById('qprog');
var qprogFill = document.getElementById('qprogFill');

function setRoot(html){ root.innerHTML=html; }
function updateProgress(){
  if(!SESSION) return;
  var idx=SESSION.idx, total=SESSION.queue.length;
  if(total===0) return;
  var pct=Math.round((idx/total)*100);
  progLabel.textContent = 'Question '+(idx+1)+' of '+total;
  qprog.hidden=false;
  qprogFill.style.width=pct+'%';
}

/* ---- app state transitions ---------------------------------------------------- */
function showSetup(){
  SESSION=null;
  progLabel.textContent='';
  qprog.hidden=true;
  setRoot(renderSetup());
  bindSetup();
}

function bindSetup(){
  var catSel=document.getElementById('f-cat');
  var diffSel=document.getElementById('f-diff');
  var sizeSel=document.getElementById('f-size');
  var countEl=document.getElementById('itemCount');
  var startBtn=document.getElementById('startBtn');
  var redoMissesBtn=document.getElementById('redoMissesBtn');
  var certWrongBtn=document.getElementById('certWrongBtn');
  var dueBtn=document.getElementById('dueBtn');
  function updateCount(){
    var cat=catSel?catSel.value:'all', diff=diffSel?diffSel.value:'all';
    var n = activeItems().filter(function(it){
      if(cat!=='all'&&it.category!==cat) return false;
      if(diff!=='all'&&String(it.difficulty)!==diff) return false;
      return true;
    }).length;
    var size=sizeSel?sizeSel.value:'20';
    var showing = (size==='all')?n:Math.min(n,parseInt(size,10)||20);
    if(countEl) countEl.textContent=(showing===n?n:showing+' of '+n)+' question'+(n!==1?'s':'')+' match';
    if(startBtn) startBtn.disabled=(n===0);
  }
  if(catSel) catSel.addEventListener('change',updateCount);
  if(diffSel) diffSel.addEventListener('change',updateCount);
  if(sizeSel) sizeSel.addEventListener('change',updateCount);
  updateCount();
  if(startBtn) startBtn.addEventListener('click',function(){
    var cat=catSel?catSel.value:'all';
    var diff=diffSel?diffSel.value:'all';
    var size=sizeSel?sizeSel.value:'20';
    startSession(cat,diff,size);
  });
  if(redoMissesBtn) redoMissesBtn.addEventListener('click',function(){
    startSessionWithQueue(missedItems());
  });
  if(certWrongBtn) certWrongBtn.addEventListener('click',function(){
    startSessionWithQueue(certWrongItems());
  });
  /* Deliberately NOT startSessionWithQueue: due cards keep most-overdue-first order
     rather than being shuffled — the schedule is the point of this focus mode. */
  if(dueBtn) dueBtn.addEventListener('click',function(){
    beginSession(dueQbItems());
  });
  /* Draft opt-in (WP-37). Persist, then re-render the whole setup so every count
     (pool size, match count, focus-mode buttons) reflects the new pool; refocus the
     toggle so keyboard users are not dropped at the top of the re-rendered screen. */
  var draftToggle=document.getElementById('draftToggle');
  if(draftToggle) draftToggle.addEventListener('change',function(){
    setIncludeDrafts(draftToggle.checked);
    showSetup();
    var t=document.getElementById('draftToggle');
    if(t) t.focus();
  });
}

function startSession(catFilter, diffFilter, sizeLimit){
  /* Due cards matching the same filters serve FIRST (most-overdue first, unshuffled —
     priority order is the point); the shuffled fresh selection fills the remainder of
     the size limit. A due card never appears twice in one queue. */
  var due = dueQbItems().filter(function(it){
    if(catFilter!=='all' && it.category!==catFilter) return false;
    if(diffFilter!=='all' && String(it.difficulty)!==diffFilter) return false;
    return true;
  });
  var cap = (sizeLimit==='all') ? Infinity : (parseInt(sizeLimit,10)||20);
  due = due.slice(0, cap===Infinity ? due.length : cap);
  var dueIds = {};
  due.forEach(function(it){ dueIds[it.id]=1; });
  var rest = buildQueue(activeItems().filter(function(it){ return !dueIds[it.id]; }),
                        catFilter, diffFilter, 'all');
  if(cap!==Infinity) rest = rest.slice(0, Math.max(0, cap-due.length));
  beginSession(due.concat(rest));
}

/* Focus-mode entry point: starts the exact queue passed in (shuffled), bypassing the
   category/difficulty/size filters entirely. */
function startSessionWithQueue(queue){
  beginSession(shuffle(queue));
}

function beginSession(queue){
  if(!queue.length){
    setRoot('<div class="err-box">No questions match the selected filters.</div>');
    return;
  }
  SESSION = {
    queue: queue,
    idx: 0,
    responses: [],
    confidence: null,
    tier1Key: null,
    displayOrder: [],
    tier2DisplayOrder: [],
    state: 'conf'  /* conf | tier2 | feedback */
  };
  showQuestion();
}

function showReviewItem(item){
  SESSION = {
    queue:[item], idx:0, responses:[], confidence:null, tier1Key:null,
    displayOrder:[], tier2DisplayOrder:[], state:'conf', reviewOnly:true
  };
  showQuestion();
  postReviewItemStatus('ready');
}

/* ---- session capsule (cw_sess_v1) — question-boundary checkpoint + resume --------
   Written ONLY from advance(), and only when there is a next question to show —
   never mid-question. showQuestion() resets confidence/tier1Key/state/displayOrder/
   tier2DisplayOrder on every entry (the option shuffles aren't reconstructable), so a
   mid-question restore would be structurally broken and is not attempted; the
   checkpoint is deleted instead, in showSummary(), on session completion. Never
   written for a reviewOnly (faculty-preview) session. Grading state is never
   duplicated here — qbRecord()/srsUpdate() already persist each answer
   per-interaction (commitResponse); the capsule stores position + session
   bookkeeping only, so a resumed showSummary() covers the WHOLE session without a
   second write against the SM-2 stats contract. */
function checkpointSession(){
  if(!SESSION || SESSION.reviewOnly) return;
  var now = Date.now();
  sessSave('qbank', {
    at: now,
    expiresAt: now + DAY,
    queueIds: SESSION.queue.map(function(it){ return it.id; }),
    idx: SESSION.idx,
    responses: SESSION.responses.map(function(r){
      return { id: r.item.id, correct: r.correct, confidence: r.confidence };
    })
  });
}

/* Resume path for ?resume=1. Rebuilds the queue from the capsule's queueIds filtered
   through activeItems() — an id removed or retired by a deploy between checkpoint and
   resume is silently dropped rather than crashing the restore (queueIds order is
   preserved). idx is RE-DERIVED by counting how many of the front (pre-checkpoint)
   queueIds survive that same filter, rather than trusted verbatim: trusting the stored
   idx directly would silently skip a still-unanswered question whenever a deploy
   retires/removes an item positioned BEFORE the checkpointed idx (the raw idx
   overshoots once the queue is filtered shorter). This exploits the invariant that
   responses.length === idx at every checkpoint — advance() checkpoints immediately
   after commitResponse() pushes a response, and this app has no
   skip-without-answering path, so counting surviving front ids gives the correct new
   position. Reconstructed responses are built from that identical surviving-front-id
   set, so the resumed summary population can never disagree with the resumed queue
   position. Absent/expired capsule (sessLoad owns load-validate-expire) or an empty
   resulting queue falls through to a normal setup start. Returns true iff a session
   was actually resumed. */
function tryResumeSession(){
  var cap = sessLoad('qbank', Date.now());
  if(!cap || !cap.queueIds || !cap.queueIds.length) return false;
  var idMap = {};
  activeItems().forEach(function(it){ idMap[it.id]=it; });
  var queue = cap.queueIds.map(function(id){ return idMap[id]; }).filter(Boolean);
  if(!queue.length) return false;
  var capIdx = (typeof cap.idx==='number' && cap.idx>=0) ? cap.idx : 0;
  var survivingFrontIds = cap.queueIds.slice(0, capIdx).filter(function(id){ return !!idMap[id]; });
  var idx = survivingFrontIds.length;
  var respById = {};
  (cap.responses||[]).forEach(function(r){ respById[r.id]=r; });
  var responses = survivingFrontIds.map(function(id){
    var r = respById[id];
    if(!r) return null;
    return {
      item: idMap[id], key: null, tier2Key: null,
      confidence: r.confidence, correct: r.correct, twoTierResult: null, ts: cap.at
    };
  }).filter(Boolean);
  SESSION = {
    queue: queue, idx: idx, responses: responses, confidence: null, tier1Key: null,
    displayOrder: [], tier2DisplayOrder: [], state: 'conf'
  };
  showQuestion();
  return true;
}

function showQuestion(){
  if(!SESSION || SESSION.idx >= SESSION.queue.length){
    showSummary(); return;
  }
  SESSION.confidence = null;
  SESSION.tier1Key = null;
  SESSION.state = 'conf';
  SESSION.displayOrder = [];
  SESSION.tier2DisplayOrder = [];
  updateProgress();
  var item = SESSION.queue[SESSION.idx];
  setRoot(renderQuestion(item));
  bindQuestion(item);
}

function bindQuestion(item){
  /* confidence buttons */
  var confBtns = root.querySelectorAll('.conf-btn');
  var confHint = document.getElementById('confHint');
  confBtns.forEach(function(btn){
    btn.addEventListener('click',function(){
      if(SESSION.state!=='conf') return;
      confBtns.forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      SESSION.confidence = btn.getAttribute('data-conf');
      if(confHint) confHint.classList.remove('show');
    });
  });
  /* tier1 option buttons */
  var optBtns = root.querySelectorAll('#optsList .opt');
  optBtns.forEach(function(btn){
    btn.addEventListener('click',function(){
      if(SESSION.state!=='conf') return;
      if(!SESSION.confidence){
        if(confHint) confHint.classList.add('show');
        /* briefly shake the confidence section */
        var cs=root.querySelector('.conf-section');
        if(cs){ cs.style.outline='2px solid var(--danger)'; cs.style.borderRadius='8px';
          setTimeout(function(){cs.style.outline='';cs.style.borderRadius='';},600); }
        return;
      }
      var key = btn.getAttribute('data-key');
      onTier1Answer(item, key);
    });
  });
}

function onTier1Answer(item, key){
  SESSION.tier1Key = key;
  var isCorrect = item.options.some(function(o){ return o.key===key && o.c; });
  /* lock tier1 options and highlight */
  var optBtns = root.querySelectorAll('#optsList .opt');
  optBtns.forEach(function(btn){
    btn.disabled = true;
    btn.classList.add('locked');
    var k = btn.getAttribute('data-key');
    if(k===key && isCorrect) btn.classList.add('selected-correct');
    else if(k===key && !isCorrect) btn.classList.add('selected-wrong');
    else if(item.options.some(function(o){return o.key===k&&o.c;})) btn.classList.add('correct-reveal');
  });
  /* lock confidence buttons */
  root.querySelectorAll('.conf-btn').forEach(function(b){ b.disabled=true; });
  if(item.type==='two-tier' && isCorrect){
    /* show tier2 before feedback */
    SESSION.state = 'tier2';
    var qcard = root.querySelector('.qcard');
    if(qcard){
      var t2html = renderTier2(item);
      qcard.insertAdjacentHTML('beforeend', t2html);
      bindTier2(item);
    }
  } else {
    /* for wrong tier1 on two-tier, still show tier2 (spec: "tier 2 still shown and answered — the feedback teaches against both selections") */
    if(item.type==='two-tier' && !isCorrect){
      SESSION.state = 'tier2';
      var qcard2 = root.querySelector('.qcard');
      if(qcard2){
        var t2html2 = renderTier2(item);
        qcard2.insertAdjacentHTML('beforeend', t2html2);
        bindTier2(item);
      }
    } else {
      /* sba / relational: show feedback directly */
      SESSION.state = 'feedback';
      var twoTierResult = null;
      commitResponse(item, key, null, SESSION.confidence, isCorrect, twoTierResult);
      showFeedback(item, key, null, SESSION.confidence, isCorrect, null);
    }
  }
}

function bindTier2(item){
  var t2Btns = root.querySelectorAll('#tier2Opts .opt');
  t2Btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      if(SESSION.state!=='tier2') return;
      var tier2Key = btn.getAttribute('data-tier2key');
      onTier2Answer(item, tier2Key);
    });
  });
}

function onTier2Answer(item, tier2Key){
  SESSION.state = 'feedback';
  var tier1Key = SESSION.tier1Key;
  var tier1Correct = item.options.some(function(o){ return o.key===tier1Key && o.c; });
  var tier2Correct = item.tier2.options.some(function(o){ return o.key===tier2Key && o.c; });
  /* lock tier2 options + highlight */
  var t2Btns = root.querySelectorAll('#tier2Opts .opt');
  t2Btns.forEach(function(btn){
    btn.disabled=true; btn.classList.add('locked');
    var k=btn.getAttribute('data-tier2key');
    if(k===tier2Key && tier2Correct) btn.classList.add('selected-correct');
    else if(k===tier2Key && !tier2Correct) btn.classList.add('selected-wrong');
    else if(item.tier2.options.some(function(o){return o.key===k&&o.c;})) btn.classList.add('correct-reveal');
  });
  /* scoring: both right = correct; right answer/wrong reason = shaky; wrong tier1 = wrong */
  var correct, twoTierResult;
  if(!tier1Correct){
    correct=false; twoTierResult='wrong';
  } else if(tier2Correct){
    correct=true; twoTierResult='both_right';
  } else {
    correct=true; twoTierResult='shaky';  /* right answer, wrong reason — cap at Hard */
  }
  commitResponse(item, tier1Key, tier2Key, SESSION.confidence, correct, twoTierResult);
  showFeedback(item, tier1Key, tier2Key, SESSION.confidence, correct, twoTierResult);
}

function commitResponse(item, key, tier2Key, confidence, correct, twoTierResult){
  if(SESSION && SESSION.reviewOnly){
    SESSION.responses.push({
      item:item, key:key, tier2Key:tier2Key, confidence:confidence,
      correct:correct, twoTierResult:twoTierResult, ts:Date.now()
    });
    return;
  }
  var rec = qbRecord(item, key, tier2Key, confidence, correct, twoTierResult);
  srsUpdate(item, confidence, correct, twoTierResult);
  SESSION.responses.push({
    item: item,
    key: key,
    tier2Key: tier2Key,
    confidence: confidence,
    correct: correct,
    twoTierResult: twoTierResult,
    ts: rec.ts
  });
}

function showFeedback(item, key, tier2Key, confidence, correct, twoTierResult){
  var fbHtml = getFeedbackHtml(item, key, tier2Key, confidence, correct, twoTierResult);
  var qcard = root.querySelector('.qcard');
  if(qcard){
    /* remove any tier2 section first if it already exists */
    var existing = qcard.querySelector('.feedback');
    if(existing) existing.parentNode.removeChild(existing);
    qcard.insertAdjacentHTML('beforeend', fbHtml);
    var _live=document.getElementById('qb-live');
    if(_live){ _live.textContent = (twoTierResult==='shaky'?'Right answer, shaky reasoning. ':correct?'Correct. ':'Incorrect. ') + (item.pearl||''); }
    /* scroll feedback into view */
    var fb = document.getElementById('feedbackPanel');
    if(fb) setTimeout(function(){ fb.scrollIntoView({behavior:'smooth',block:'nearest'}); },80);
  }
  if(SESSION && SESSION.reviewOnly) return;
  /* bind spa nav links */
  root.querySelectorAll('.fb-link[data-spa-nav="1"]').forEach(function(a){
    a.addEventListener('click',function(ev){
      ev.preventDefault();
      var href=a.getAttribute('href')||'';
      try{ window.parent.postMessage({type:'openPage',f:decodeURIComponent(href.replace(/^\?(?:page|tool)=/,''))},'*'); }
      catch(_){ window.location.href=href; }
    });
  });
  /* next button */
  var nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', advance);
}

function advance(){
  if(!SESSION) return;
  SESSION.idx++;
  /* Checkpoint at this question boundary only when there is a next question to
     resume into — completion is handled by showSummary()'s sessClear instead. */
  if(SESSION.idx < SESSION.queue.length) checkpointSession();
  showQuestion();
}

function showSummary(){
  /* Session complete (or a resume landed exactly at the end) — clear the capsule so
     a stale slot never lingers past its own session. Never touched for reviewOnly,
     which never reaches this function via advance() (no Next button is rendered
     for a faculty-preview session — see getFeedbackHtml/showFeedback). */
  if(!(SESSION && SESSION.reviewOnly)) sessClear('qbank');
  progLabel.textContent='Session complete';
  qprog.hidden=false;
  qprogFill.style.width='100%';
  setRoot(renderSummary());
  var moreBtn=document.getElementById('practiceMoreBtn');
  if(moreBtn) moreBtn.addEventListener('click',showSetup);
  var homeBtn=document.getElementById('goHomeBtn');
  if(homeBtn) homeBtn.addEventListener('click',function(){
    /* send parent SPA to Home page */
    try{ window.parent.postMessage({type:'openPage',f:'__home__'},'*'); }
    catch(_){}
  });
}

/* ---- init --------------------------------------------------------------------- */
(function init(){
  /* try relative path (built: /tools/question-bank-practice.html → /question_bank.json) */
  fetch('../question_bank.json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      BANK = data;
      if(REVIEW_CONTEXT){
        var reviewItem = (data.items || []).find(function(item){
          return item && item.id === REVIEW_CONTEXT.reviewItem && item.retired !== true;
        });
        if(!reviewItem){
          root.innerHTML = '<div class="err-box"><strong>This question is not present on the current deployment</strong></div>';
          postReviewItemStatus('not_found');
          return;
        }
        showReviewItem(reviewItem);
        return;
      }
      if(RESUME_REQUESTED && tryResumeSession()) return;
      showSetup();
      /* adaptive engine handoff: home may set cw_qb_focus to a blueprint category
         so the learner lands in their weakest area with the filter preselected. */
      try{ var _focus=localStorage.getItem('cw_qb_focus'); if(_focus){ localStorage.removeItem('cw_qb_focus');
        var _cs=document.getElementById('f-cat');
        if(_cs){ for(var _i=0;_i<_cs.options.length;_i++){ if(_cs.options[_i].value===_focus){ _cs.value=_focus; break; } }
          var _cnt=document.getElementById('itemCount'), _n=activeItems().filter(function(it){return it.category===_focus;}).length;
          if(_cnt) _cnt.textContent=_n+' question'+(_n!==1?'s':'')+' match'; } } }catch(_){ }
    })
    .catch(function(err){
      root.innerHTML='<div class="err-box">'
        +'<strong>Could not load question bank.</strong> '
        +'question_bank.json was not found alongside this tool. '
        +'Make sure the build ran successfully and question_bank.json is at the site root.'
        +'<br><small style="opacity:.7">'+esc(String(err))+'</small></div>';
      postReviewItemStatus('error');
    });
  /* handle filter count updates before bank loads */
  root.addEventListener('input',function(ev){
    var t=ev.target; if(t&&(t.id==='f-cat'||t.id==='f-diff'||t.id==='f-size')){
      var catSel=document.getElementById('f-cat'),diffSel=document.getElementById('f-diff'),sizeSel=document.getElementById('f-size'),countEl=document.getElementById('itemCount');
      if(!BANK||!countEl) return;
      var cat=catSel?catSel.value:'all',diff=diffSel?diffSel.value:'all';
      var n=activeItems().filter(function(it){
        return (cat==='all'||it.category===cat)&&(diff==='all'||String(it.difficulty)===diff);
      }).length;
      var size=sizeSel?sizeSel.value:'20';
      var showing=(size==='all')?n:Math.min(n,parseInt(size,10)||20);
      countEl.textContent=(showing===n?n:showing+' of '+n)+' question'+(n!==1?'s':'')+' match';
    }
  });
  /* dark mode sync from parent SPA */
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='theme'&&(d.mode==='dark'||d.mode==='light')){
      document.documentElement.setAttribute('data-theme',d.mode);
      try{localStorage.setItem('cw_theme',d.mode);}catch(_){}
    }
  });
  try{
    var t=localStorage.getItem('cw_theme');
    if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);
  }catch(_){}
})();
})();
</script>
