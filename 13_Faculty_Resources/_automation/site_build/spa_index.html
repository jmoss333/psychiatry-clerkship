<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cw_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inpatient Psychiatry — MS3 Clerkship</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A private learning hub for the third-year inpatient psychiatry clerkship.">
<script src="marked.min.js"></script>
<link rel="stylesheet" href="frontdoor.css">
<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2; --accent-border:#bfd8d3;
    --text:#2f2924; --focus:#155eef; --text-mid:#51473d; --text-light:#665a4f; --warning:#7a6234; --warning-light:#f5efe2;
    --success:#357160; --success-light:#e7f1ed; --danger:#a34132; --danger-light:#fbece9; --info:#41618a; --info-light:#eaf0f6;
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .layout>aside{background:var(--bg-alt);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;position:sticky;top:0;height:100vh}
  .layout>aside h1{font-family:var(--font-head);font-size:1.05rem;color:var(--primary-dark);margin:0 0 2px;padding-right:74px;white-space:nowrap}
  .layout>aside .by{font-size:.78rem;color:var(--text-light);margin-bottom:14px}
  .themebtn{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
  .themebtn:hover{border-color:var(--accent);color:var(--accent-dark)}
  /* Collapsible sidebar (desktop only — the ≤820px drawer keeps the full sidebar).
     html[data-side=rail] is set pre-paint from cw_side_collapsed so there is no flash. */
  .side-collapse{position:absolute;top:16px;right:54px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:.92rem;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .side-collapse:hover{border-color:var(--accent);color:var(--accent-dark)}
  .side-rail{display:none}
  @media(min-width:821px){
    .layout{transition:grid-template-columns .25s ease}
    html[data-side=rail] .layout{grid-template-columns:56px 1fr}
    html[data-side=rail] .layout>aside{padding:14px 10px}
    html[data-side=rail] .layout>aside>*:not(.side-rail){display:none}
    html[data-side=rail] .side-rail{display:flex;flex-direction:column;align-items:center;gap:10px}
  }
  .rail-expand{width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--accent-dark);cursor:pointer;font-size:.92rem;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .railbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .railbtn.rail-capture{border:1.5px dashed var(--border);background:transparent}
  .rail-expand:hover,.railbtn:hover{border-color:var(--accent);color:var(--accent-dark)}
  .rail-sep{width:24px;border-top:1px solid var(--border);margin:2px 0}
  .modetoggle{position:relative;display:flex;background:var(--primary-light);border:1px solid var(--border);border-radius:999px;padding:3px;margin:2px 0 14px}
  .modetoggle .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:999px;transition:transform .22s ease;z-index:0}
  .modetoggle.lib .knob{transform:translateX(100%)}
  .modetoggle button{flex:1;position:relative;z-index:1;border:none;background:transparent;font-family:inherit;font-size:.83rem;font-weight:700;color:var(--text-mid);padding:7px 4px;cursor:pointer;border-radius:999px}
  .modetoggle button.on{color:#fff}
  #content.pathmode{max-width:none;padding:0;margin:0}
  .pathframe{width:100%;height:calc(100vh - 46px);border:0;display:block}
  .search-wrap{position:relative;margin:0 0 12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  input.search{width:100%;padding:8px 28px 8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--text)}
  input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  .search-wrap .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text-light);cursor:pointer;font-size:1rem;display:none}
  .navsec-wrap{margin-top:4px}
  .navgroup-wrap{margin-top:8px}
  .navgroupsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-mid);font-weight:800;padding:8px 6px;border-radius:6px}
  .navgroupsec:hover{background:var(--primary-light);color:var(--text)}
  .navgroupsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navgroup-wrap.open>.navgroupsec .chev{transform:rotate(90deg)}
  .navgroupbody{display:none;padding-left:8px;border-left:1px solid var(--border);margin-left:6px}
  .navgroup-wrap.open>.navgroupbody{display:block}
  .navsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);font-weight:700;padding:7px 6px;border-radius:6px}
  .navsec:hover{background:var(--primary-light);color:var(--text-mid)}
  .navsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navsec-wrap.open>.navsec .chev{transform:rotate(90deg)}
  .navsec-t{flex:1;min-width:0}
  .navgroup{display:none;margin:1px 0 4px;padding-left:4px}
  .navsec-wrap.open>.navgroup{display:block}
  .navitem{display:flex;align-items:center;gap:4px;width:100%;text-align:left;border:none;background:transparent;color:var(--text);padding:6px 9px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.9rem;line-height:1.3}
  .navitem .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navitem-hidden{display:none}
  .navitem:hover{background:var(--primary-light)}
  .navitem.on{background:var(--accent);color:#fff}
  .navitem .tool-tag{flex:0 0 auto;font-size:.6rem;background:var(--accent-dark);color:#fff;border-radius:999px;padding:1px 6px;vertical-align:middle}
  .navitem.on .tool-tag{background:#fff;color:var(--accent-dark)}
  .layout>main{padding:0}
  .banner{background:var(--warning-light);border-bottom:1px solid var(--border);color:var(--text);font-size:.82rem;padding:8px 34px 8px 28px;position:relative}
  .banner.hide{display:none}
  .bannerx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.05rem;line-height:1;opacity:.55;padding:2px 6px}
  .bannerx:hover{opacity:1}
  .skel{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .skel .bar{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border) 25%,var(--bg-alt) 37%,var(--border) 63%);background-size:400% 100%;animation:skelsh 1.3s ease infinite;margin:11px 0}
  .skel .bar.title{height:26px;width:55%;margin:0 0 20px}
  .skel .bar.short{width:68%}
  @keyframes skelsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media(prefers-reduced-motion:reduce){.skel .bar{animation:none}}
  #content.toolmode{max-width:none;padding:0;margin:0;display:flex;flex-direction:column;height:calc(100vh - 46px)}
  .toolframe{width:100%;height:calc(100vh - 46px);border:0;display:block;background:var(--bg)}
  #content.toolmode .toolframe{flex:1 1 auto;height:auto;min-height:0}
  .pgfb{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
  .pgfb-b{background:none;border:1px solid var(--border);border-radius:999px;padding:6px 15px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.83rem}
  .pgfb-b:hover{border-color:var(--accent);color:var(--accent-dark)}
  .skip-link{position:absolute;left:12px;top:-52px;background:#fff;color:var(--text);border:2px solid var(--focus);border-radius:6px;padding:8px 12px;z-index:100;transition:top .15s}
  .skip-link:focus{top:12px}
  .drawer-backdrop{position:fixed;inset:0;z-index:19;background:rgba(47,41,36,.40)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .loading{color:var(--text-mid);padding:28px 4px}
  .error{padding:8px 4px}
  .governance-notice{border-radius:8px;font-size:.9rem;line-height:1.45;margin:0 0 16px;padding:9px 13px}
  .governance-notice .governance-title{display:block;font-weight:800}
  .governance-notice .governance-risk{display:block;font-size:.76rem;font-weight:750;letter-spacing:.02em;color:var(--text-mid);margin-top:2px}
  .governance-notice p{margin:6px 0 0}
  .governance-notice.pending-high{border:3px solid var(--danger);background:var(--danger-light);color:var(--text);padding:14px 18px}
  .governance-notice.pending-high .pgfb-b{margin-top:10px;background:var(--surface);color:var(--danger);border-color:var(--danger)}
  .governance-notice.pending-compact{border:1px solid var(--warning);background:var(--warning-light);color:var(--text)}
  .governance-notice.reviewed-receipt{display:inline-block;font-size:.76rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent-border);border-radius:999px;padding:3px 11px}
  .governance-notice.reviewed-receipt time{white-space:nowrap}
  .governance-notice.unavailable{border:1px dashed var(--text-light);background:var(--bg-alt);color:var(--text-mid);font-weight:600}
  #content.toolmode .governance-notice{margin:0;border-radius:0}
  .governance-badge{display:inline-block;flex:0 0 auto;border:1px solid currentColor;border-radius:999px;padding:1px 6px;font-size:.58rem;font-weight:800;line-height:1.35;color:var(--warning);background:var(--warning-light);vertical-align:middle;margin-left:5px}
  .governance-badge.high{color:var(--danger);background:var(--danger-light)}
  .navitem.on .governance-badge{color:var(--text);background:var(--surface)}
  .md-body{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .md-body h1{font-family:var(--font-head);color:var(--primary);font-size:2rem;margin:.2em 0 .4em}
  .md-body h2{font-family:var(--font-head);color:var(--text);font-size:1.4rem;margin:1.3em 0 .4em;border-bottom:1px solid var(--border);padding-bottom:4px}
  .md-body h3{font-size:1.1rem;margin:1.1em 0 .3em}
  .md-body a{color:var(--accent-dark)}
  .md-body table,.fd-article__body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92rem}
  .md-body .table-scroll,.fd-article__body .table-scroll{position:relative;margin:1em 0}
  .md-body .table-scroll-viewport,.fd-article__body .table-scroll-viewport{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .md-body .table-scroll table,.fd-article__body .table-scroll table{width:max-content;min-width:100%;margin:0}
  .table-scroll-hint{display:none;margin:0 0 5px;color:var(--text-light);font-size:.78rem;font-weight:700;letter-spacing:.02em}
  .md-body .table-scroll.is-scrollable .table-scroll-hint,.fd-article__body .table-scroll.is-scrollable .table-scroll-hint{display:block}
  .md-body .table-scroll.is-scrollable::after,.fd-article__body .table-scroll.is-scrollable::after{content:"";position:absolute;right:1px;bottom:1px;width:28px;height:calc(100% - 24px);pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface))}
  @media(max-width:820px){
    .md-body .table-scroll th,.md-body .table-scroll td,.fd-article__body .table-scroll th,.fd-article__body .table-scroll td{min-width:9rem}
    .md-body .table-scroll th:first-child,.md-body .table-scroll td:first-child,.fd-article__body .table-scroll th:first-child,.fd-article__body .table-scroll td:first-child{min-width:7rem}
  }
  .md-body th,.md-body td,.fd-article__body th,.fd-article__body td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .md-body th,.fd-article__body th{background:var(--primary-light)}
  .md-body blockquote{border-left:3px solid var(--accent);background:var(--accent-light);margin:1em 0;padding:8px 14px;border-radius:0 6px 6px 0;color:var(--text-mid)}
  .md-body code{background:var(--primary-light);padding:1px 5px;border-radius:4px;font-size:.86em}
  .md-body ul,.md-body ol{padding-left:1.4em}
  .toolnote{background:var(--accent-light);border:1px solid var(--accent);border-radius:10px;padding:18px;max-width:820px;margin:26px auto;text-align:center}
  .toolnote a.btn{display:inline-block;background:var(--primary-dark);color:#fff;text-decoration:none;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:10px}
  .srn{color:var(--text-light);font-size:.92rem;margin:.2em 0 0}
  .results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .result{display:block;border:1px solid var(--border);background:#fff;border-radius:10px;font-family:inherit}
  .result:hover{border-color:var(--accent);background:var(--accent-light)}
  .result-hit{display:block;width:100%;text-align:left;background:none;border:0;margin:0;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
  .result-chip{margin:0 14px 12px}
  .r-title{display:block;font-family:var(--font-head);font-size:1.06rem;color:var(--primary-dark);font-weight:600}
  .r-sec{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin:2px 0 4px}
  .r-snip{display:block;font-size:.86rem;color:var(--text-mid);line-height:1.45}
  mark{background:rgba(217,160,60,.34);color:inherit;padding:0 1px;border-radius:2px}
  /* unified topic template (Slice 4) */
  .topic-tpl{margin:6px 0 18px}
  .practice-panel{position:relative;border:1px solid #b9d2d0;border-left:7px solid var(--primary);border-radius:14px;background:linear-gradient(135deg,rgba(232,244,242,.92),rgba(255,252,247,.96));box-shadow:0 10px 26px rgba(47,41,36,.09);margin:8px 0 20px;overflow:hidden}
  .practice-panel::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(180deg,var(--primary),var(--accent));pointer-events:none}
  .practice-panel>summary{list-style:none}
  .practice-panel>summary::-webkit-details-marker{display:none}
  .practice-summary{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;cursor:pointer;background:rgba(255,255,255,.55);border-bottom:1px solid transparent}
  .practice-summary:focus-visible{outline:3px solid rgba(185,79,52,.34);outline-offset:-3px}
  .practice-panel[open] .practice-summary{border-bottom-color:#cfe1db}
  .practice-tab{flex:0 0 auto;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--primary-dark);border-radius:999px;padding:4px 9px}
  .practice-title{font-family:var(--font-head);font-size:1.08rem;font-weight:700;color:var(--primary-dark);line-height:1.2}
  .practice-sub{margin-left:auto;font-size:.76rem;color:var(--text-light);white-space:nowrap}
  .practice-hint{flex:0 0 auto;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);background:rgba(255,255,255,.86);border:1px solid #d6c8b6;border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(47,41,36,.06)}
  .practice-panel:not([open]) .practice-summary:hover .practice-hint{background:var(--accent-light);border-color:var(--accent)}
  .practice-hint-close{display:none}
  .practice-panel[open] .practice-hint-open{display:none}
  .practice-panel[open] .practice-hint-close{display:inline}
  .practice-chev{font-size:1.05rem;color:var(--accent-dark);transition:transform .16s ease}
  .practice-panel[open] .practice-chev{transform:rotate(90deg)}
  .practice-body{padding:14px 16px 16px}
  .practice-sections{display:grid;gap:12px}
  .practice-section{background:rgba(255,255,255,.72);border:1px solid #d9e5e0;border-radius:12px;padding:13px 14px}
  .practice-section-title{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--primary-dark);margin:0 0 8px}
  .practice-muted{font-size:.9rem;color:var(--text-mid);margin:0}
  .practice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .practice-action{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent-border);border-radius:999px;padding:8px 12px}
  .practice-action:hover{background:var(--surface);border-color:var(--accent)}
  .practice-action.is-safety{color:var(--primary-dark);background:var(--primary-light);border-color:#bdd5d1}
  .practice-action.is-case{color:var(--primary-dark);background:#fff;border-color:#d5c9bc}
  .practice-drills{border:1px solid #d9c597;background:#fffaf0;border-radius:12px;padding:11px 12px;margin:0 0 12px}
  .practice-drill-head{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--warning);margin:0 0 4px}
  .practice-drill-note{font-size:.88rem;color:var(--text-mid);margin:0}
  .practice-drill-actions{margin-top:9px}
  .practice-action.is-drill{align-items:flex-start;flex-direction:column;gap:2px;min-width:178px;color:var(--warning);background:#fff;border-color:#d9c597;border-radius:10px;padding:9px 11px}
  .practice-action.is-drill:hover{background:#fffaf0;border-color:var(--warning)}
  .practice-action-kicker{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--warning)}
  .practice-action-main{font-weight:800;color:var(--text)}
  .practice-action-arrow{font-size:.76rem;color:var(--warning)}
  .practice-action.is-review{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tpl-chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--border)}
  .tpl-chip.read{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.hy{color:var(--warning);background:var(--warning-light);border-color:var(--warning)}
  .tpl-chip.safety{color:var(--danger);background:var(--danger-light);border-color:var(--danger)}
  .tpl-chip.evidence{color:var(--accent-dark);background:var(--accent-light);border-color:var(--accent)}
  .tpl-chip.review{color:var(--success);background:var(--success-light);border-color:var(--success)}
  .tpl-chip.mode{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.mode.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .practice-panel .tpl-meta{margin:0 0 12px}
  .practice-mode-note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border:1px solid #d9e5e0;border-radius:12px;padding:11px 13px;margin:0 0 12px}
  .practice-mode-note .k{flex:0 0 auto;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark)}
  .practice-mode-note .v{font-size:.9rem;line-height:1.4;color:var(--text-mid)}
  .page-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:.2em 0 .25em}
  .page-title-row h1{margin:0}
  .page-title-row .markrev{font-size:.68rem;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:4px 9px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-family:inherit;white-space:nowrap;margin-top:.42rem}
  .page-title-row .markrev:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-light)}
  .page-title-row .markrev.on{background:var(--success-light);border-color:var(--success);color:var(--success)}
  .review-ledger{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:-2px 0 14px;padding:0;color:var(--text-mid)}
  .review-ledger .k{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark)}
  .review-ledger .v{font-size:.78rem;color:var(--text-mid);line-height:1.35}
  .review-ledger .revcount{font-weight:800;color:var(--text)}
  .review-ledger .review-date{color:var(--text-light)}
  /* .wd-tool was never in this list, so the tool chips shipped at 32px on a phone while the

<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="fdApp" class="fd-shell">
  <div id="fdChromeMount"></div>
  <div id="governanceMount"></div>
  <span id="routeStatus" class="vh-live" aria-live="polite"></span>
  <div id="fdCaptureMount"></div>
  <main id="content" class="fd-main" tabindex="-1"><div class="skel" role="status" aria-label="Loading"><div class="bar title"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div></div></main>
  <div id="fdOverlayMount"></div>
  <template id="fdCrisisTemplate"><!-- crisis-block-html --></template>
  <div id="fdNudgeMount"></div>
</div>
<script>
  /* Front Door owns navigation. The helpers below retain the canonical learner stores and
     governed-content contracts, but never create a second navigation tree or controller. */
  var contentEl=document.getElementById('content');
  var currentItem=null; var GOVERNANCE={status:'loading',items:{}}; var governanceFocusSlug=''; var SCROLL={};
  var FD_PROTOCOL_FAILURE_COPY='This safety protocol is unavailable right now—do not rely on this page for clinical guidance; use the crisis resources below and contact your supervising clinician.';
  /* Fetch and capture callbacks live in this script; the Front Door controller is installed by
     the following IIFE. Keep one shared dispatcher that is safe until that controller is ready. */
  var specialRefresh=function(){};
  function skel(){return '<div class="skel" role="status" aria-label="Loading"><div class="bar title"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div></div>';}
  fetch('governance.json')
    .then(function(r){if(!r.ok)throw new Error('governance unavailable');return r.json();})
    .then(function(d){GOVERNANCE={status:'ready',items:d.items||{}};rerenderCurrent();})
    .catch(function(){GOVERNANCE={status:'unavailable',items:{}};rerenderCurrent();});
  var TOPIC_META={};
  /* Metadata is also injected as FD_TOPIC_META. Keep the fetch for canonical quiz/SRS helpers,
     then refresh only the currently mounted Front Door surface. */
  fetch('topic_meta.json').then(function(r){return r.ok?r.json():{}}).then(function(d){ TOPIC_META=d||{}; srsDropPhantomTopics(); try{ specialRefresh(); }catch(_){ } }).catch(function(){});
  function makeCollapsible(body){
    if(!body) return;
    var kids=[].slice.call(body.children);
    var nH2=kids.filter(function(el){return el.tagName==='H2';}).length;
    if(nH2<4 || body.querySelector('.sec-c')) return;
    var groups=[],cur=null;
    kids.forEach(function(el){ if(el.tagName==='H2'){cur={h2:el,body:[]};groups.push(cur);} else if(cur){cur.body.push(el);} });
    var first=null;
    groups.forEach(function(g){
      var wrap=document.createElement('section'); wrap.className='sec-c';
      var hh=document.createElement('h2'); hh.className='sec-h';
      var btn=document.createElement('button'); btn.type='button'; btn.setAttribute('aria-expanded','false');
      btn.innerHTML='<span class="sec-chev" aria-hidden="true">▸</span>';
      var tt=document.createElement('span'); tt.textContent=g.h2.textContent; btn.appendChild(tt);
      hh.appendChild(btn);
      var bd=document.createElement('div'); bd.className='sec-b';
      g.body.forEach(function(n){ bd.appendChild(n); });
      body.insertBefore(wrap,g.h2); wrap.appendChild(hh); wrap.appendChild(bd); body.removeChild(g.h2);
      btn.onclick=function(){ var o=!wrap.classList.contains('open'); wrap.classList.toggle('open',o); btn.setAttribute('aria-expanded',String(o)); requestAnimationFrame(refreshTableScrollCues); };
      if(!first) first=wrap;
      if(bd.querySelector('iframe')){ wrap.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    });
    if(first){
      var bar=document.createElement('div'); bar.className='sec-toolbar';
      function mk(lbl,op){ var b=document.createElement('button'); b.type='button'; b.className='sec-all'; b.textContent=lbl;
        b.onclick=function(){ [].forEach.call(body.querySelectorAll('.sec-c'),function(w){ w.classList.toggle('open',op); var bb=w.querySelector('button[aria-expanded]'); if(bb) bb.setAttribute('aria-expanded',String(op)); }); requestAnimationFrame(refreshTableScrollCues); }; return b; }
      bar.appendChild(mk('Expand all',true)); bar.appendChild(mk('Collapse all',false));
      body.insertBefore(bar,first);
    }
  }
  function tableLabel(table,index){
    var section=table.closest&&table.closest('.sec-c'), sectionButton=section&&section.querySelector('.sec-h button');
    if(sectionButton&&sectionButton.textContent)return sectionButton.textContent.replace(/^[\s▸]+/,'').trim()+' table';
    var heading=table.previousElementSibling;
    while(heading&&heading.tagName!=='H1'&&heading.tagName!=='H2'&&heading.tagName!=='H3')heading=heading.previousElementSibling;
    return (heading&&heading.textContent?heading.textContent.trim()+' table':'Scrollable table '+(index+1));
  }
  function refreshTableScrollCues(){
    [].forEach.call(document.querySelectorAll('.table-scroll'),function(shell){
      var viewport=shell.querySelector('.table-scroll-viewport');
      shell.classList.toggle('is-scrollable',!!viewport&&viewport.scrollWidth>viewport.clientWidth+1);
    });
  }
  function enhanceTables(body){
    if(!body)return;
    [].forEach.call(body.querySelectorAll('table'),function(table,index){
      if(table.parentNode&&table.parentNode.classList.contains('table-scroll-viewport'))return;
      var shell=document.createElement('div'); shell.className='table-scroll';
      var hint=document.createElement('p'); hint.className='table-scroll-hint'; hint.setAttribute('aria-hidden','true'); hint.textContent='Scroll to see all columns →';
      var viewport=document.createElement('div'); viewport.className='table-scroll-viewport'; viewport.tabIndex=0; viewport.setAttribute('role','region'); viewport.setAttribute('aria-label',tableLabel(table,index));

    requestAnimationFrame(refreshTableScrollCues);
  }
  window.addEventListener('resize',refreshTableScrollCues);
  function progLoad(){ try{ return JSON.parse(localStorage.getItem('cw_progress_v1'))||{}; }catch(_){ return {}; } }
  function progSave(o){ try{ localStorage.setItem('cw_progress_v1',JSON.stringify(o)); }catch(_){ } }
  function reviewableItems(){ var out=[],seen={}, cols=(typeof FD_INDEX!=='undefined'&&FD_INDEX.columns)||[]; for(var c=0;c<cols.length;c++){ var items=cols[c].items||[]; for(var i=0;i<items.length;i++){ var it=items[i]; if(!it||it.kind!=='read'||seen[it.ref])continue; seen[it.ref]=1; out.push({f:it.ref,t:it.title}); } } return out; }
  function reviewStats(p){ p=p||progLoad(); var items=reviewableItems(), done=0; if(items.length){ for(var i=0;i<items.length;i++){ if(p[items[i].f]&&p[items[i].f].done)done++; } return {done:done,total:items.length}; } for(var k in p){ if(p[k]&&p[k].done)done++; } return {done:done,total:done||1}; }
  function reviewedCount(p){ return reviewStats(p).done; }
  function reviewableTotal(p){ return reviewStats(p).total; }
  function buildReviewButton(file,p){
    p=p||progLoad(); var done=!!(p[file]&&p[file].done);
    return '<button type="button" class="markrev'+(done?' on':'')+'" data-f="'+esc(file||'')+'" aria-pressed="'+(done?'true':'false')+'">'+(done?'✓ Read':'Mark as read')+'</button>';
  }
  function installTitleReviewButton(file){
    var h1=contentEl.querySelector('h1'); if(!h1)return null;
    var row=document.createElement('div'); row.className='page-title-row';
    h1.parentNode.insertBefore(row,h1); row.appendChild(h1);
    var b=document.createElement('span'); b.innerHTML=buildReviewButton(file); if(b.firstChild)row.appendChild(b.firstChild);
    return row;
  }
  function buildReviewLedger(file){
    var p=progLoad(), stats=reviewStats(p), done=!!(p[file]&&p[file].done), at=done&&p[file].at;
    var h='<div class="review-ledger" data-review-for="'+esc(file||'')+'"><span class="k">Study progress</span><span class="v"><span class="revcount">'+stats.done+' of '+stats.total+' pages read</span><span class="review-date">'+(at?(' · read '+esc(at)):' · not yet read')+'</span></span></div>';
    return h;
  }
  function refreshReviewLedger(file,p){
    p=p||progLoad(); var stats=reviewStats(p), done=!!(p[file]&&p[file].done), at=done&&p[file].at;
    [].forEach.call(contentEl.querySelectorAll('.revcount'),function(el){ el.textContent=stats.done+' of '+stats.total+' pages read'; });
    [].forEach.call(contentEl.querySelectorAll('.review-date'),function(el){ el.textContent=at?(' · read '+at):' · not yet read'; });
    [].forEach.call(contentEl.querySelectorAll('.markrev'),function(el){ if(el.getAttribute('data-f')!==file)return; el.classList.toggle('on',done); el.setAttribute('aria-pressed',String(done)); el.textContent=done?'✓ Read':'Mark as read'; });
  }

    try{ var q=JSON.parse(localStorage.getItem('cw_quiz_v1')||'{}'); Object.keys(q).forEach(function(f){ var e=q[f]; if(!e||!e.seen)return; var cats={}; blueprintOf(f).forEach(function(c){ cats[c]=1; }); var right=Math.max(0,(e.seen||0)-(e.wrong||0)); Object.keys(cats).forEach(function(c){ if(acc[c]){ acc[c].total+=e.seen; acc[c].correct+=right; } }); }); }catch(_){ }

  function fdSameStrings(a,b){
    if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
    for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; }
    return true;
  }

  function fdPlanMatches(index,plan){
    if(!fdActivePathValid(index)) return false;
    var weeks=index.weeks,path=index.path;
    if(!plan||typeof plan!=='object'||plan.pathId!==path.id||
       path.weekCount!==weeks.length||plan.weekCount!==weeks.length||!Array.isArray(plan.weeks)||
       plan.weeks.length!==weeks.length) return false;
    for(var i=0;i<weeks.length;i++){
      var stored=plan.weeks[i],canonical=weeks[i],cats=canonical.focusCategories||[];
      if(!stored||stored.week!==canonical.n||stored.title!=='Week '+canonical.n+' — '+canonical.title||
         !fdSameStrings(stored.allCats,cats)||!Array.isArray(stored.focus)) return false;
      for(var j=0;j<stored.focus.length;j++){
        if(cats.indexOf(stored.focus[j])<0||stored.focus.indexOf(stored.focus[j])!==j) return false;
      }
    }
    return true;
  }

  function fdPlacementUsable(record){
    if(!record||typeof record!=='object'||!Array.isArray(record.answers)||
       !record.answers.length||!record.byCat||typeof record.byCat!=='object'||
       Array.isArray(record.byCat)) return false;
    for(var i=0;i<record.answers.length;i++){
      var answer=record.answers[i];
      if(!answer||typeof answer.id!=='string'||!answer.id||typeof answer.cat!=='string'||
         typeof answer.correct!=='boolean'||SHELF_ORDER.indexOf(answer.cat)<0) return false;

  function fdLoadPlan(index){

          currentToolFrame&&event.source===currentToolFrame.contentWindow&&currentItem&&
          currentItem.f==='question-bank-practice.html'&&data.reviewItem===facultyPreviewRequest.reviewItem&&
          data.reviewKey===facultyPreviewRequest.reviewKey&&data.reviewToken===facultyPreviewRequest.reviewToken&&
          data.surface==='question'&&['ready','not_found','error'].indexOf(data.status)>=0&&
          Object.keys(data).sort().join(',')==='reviewItem,reviewKey,reviewToken,status,surface,type'){
        postFacultyPreviewStatus(data.status,'question');
      }
      return;
    }
    if(data.type==='openPage'&&data.f){fdOpenRef(data.f);return;}
    if(data.type==='openLibrary'&&fdController){fdController.dispatch({'data-fd-tab':'library'});return;}
    if(data.type==='search'&&fdController){fdController.dispatch({'data-fd-search':''});return;}
    if(data.type==='theme'&&(data.mode==='dark'||data.mode==='light')){
      document.documentElement.setAttribute('data-theme',data.mode);
      try{localStorage.setItem('cw_theme',data.mode);}catch(_){}
    }
  }

  /* The root state keeps only Front Door navigation. Completion, SRS, sessions, capture,
     calibration, placement, plan, export identity, and dates continue to hydrate from their
     canonical stores on every render. */
  TOPIC_META=FD_TOPIC_META;
  var fdStored=fdLoad();
  var fdRotation=LS('cw_rotation_start')||'';
  var fdWeek=fdRotationWeek(fdRotation,FD_INDEX.weeks,Date.now());
  fdStored.roles=FD_ROLES;
  fdStored.rotationStart=fdRotation;
  if(fdFindWeek(FD_INDEX,fdWeek))fdStored.week=fdWeek;
  var fdRouteParams=new URLSearchParams(location.search);
  var fdIncomingRef=fdRouteParams.get('page')||fdRouteParams.get('tool')||'';
  if(fdIncomingRef&&!fdIsLegacyRouteAlias(fdIncomingRef)&&!fdStored.role){
    fdStored.role=(FD_ROLES[0]&&FD_ROLES[0].id)||'reader';
    fdStored.browsing=true;
  }
  var fdInitial=fdResolveState(location.href,fdStored);
  fdInitial.done=fdProgressDoneMap(progLoad());
  fdInitial.rotationStart=fdRotation;
  fdRender(fdInitial);
  fdController=fdWire(fdApp,fdInitial,{
    window:window,document:document,index:FD_INDEX,roles:FD_ROLES,rotationStart:fdRotation,
    render:fdRender,renderTransient:fdRenderTransient,resourceHost:function(){return contentEl;},
    openResource:fdOpenResourceLive,openProgress:fdOpenProgress,
    externalModalOpen:function(){return !!capSheet;},
    facultyPreview:function(){return !!facultyPreviewRequest;},
    facultyPreviewLock:showFacultyPreviewLockNotice,
    synonyms:FD_CURRICULUM.synonyms||{}
  });
  function fdHydrationFocusSnapshot(){
    var active=document.activeElement;
    if(!active||active===document.body||active===document.documentElement)return null;
    var classes=[],attrs=[],i,name,value;
    if(active.classList){
      for(i=0;i<active.classList.length;i++){
        value=active.classList[i];
        if(/^(fd-|cap-)/.test(value))classes.push('.'+value);
      }
    }
    for(i=0;active.attributes&&i<active.attributes.length;i++){
      name=active.attributes[i].name;
      if(name==='id'||name==='href'||name==='data-capture-open'||/^data-(fd|cap)-/.test(name)){
        value=String(active.attributes[i].value||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"');
        attrs.push('['+name+'="'+value+'"]');
      }
    }
    var selector=String(active.tagName||'').toLowerCase()+classes.join('')+attrs.join('');
    var matches=[];
    try{matches=document.querySelectorAll(selector);}catch(_){matches=[];}
    var index=0;
    for(i=0;i<matches.length;i++){if(matches[i]===active){index=i;break;}}
    return {
      node:active,selector:selector,index:index,
      start:typeof active.selectionStart==='number'?active.selectionStart:null,
      end:typeof active.selectionEnd==='number'?active.selectionEnd:null,
      direction:active.selectionDirection||'none'
    };
  }
  function fdRestoreHydrationFocus(snapshot){
    if(!snapshot)return;
    var target=snapshot.node;
    if(!target||!target.isConnected){
      var matches=[];
      try{matches=document.querySelectorAll(snapshot.selector);}catch(_){matches=[];}
      target=matches[snapshot.index]||matches[0]||null;
    }
    if(!target||!target.focus)return;
    try{target.focus({preventScroll:true});}catch(_){try{target.focus();}catch(__){return;}}
    if(snapshot.start!==null&&target.setSelectionRange){
      try{target.setSelectionRange(snapshot.start,snapshot.end,snapshot.direction);}catch(_){ }
    }
  }
  specialRefresh=function(){
    if(!fdController)return;
    var focusSnapshot=fdHydrationFocusSnapshot();
    try{
      var state=fdController.getState();
      if(state.openId==='__progress__'&&contentEl.querySelector('#pgRoot'))fdOpenProgress(state,{host:contentEl});
      else if(!state.openId&&state.tab==='today')fdRender(state,{kind:'hydrate',baseChanged:false});
    }finally{
      fdRestoreHydrationFocus(focusSnapshot);
    }
  };
  fdApp.addEventListener('click',fdAuxClick);
  window.addEventListener('message',fdAuxMessage);
  if(fdInitial.openId==='__progress__')fdOpenProgress(fdInitial,{host:contentEl});
  else if(fdInitial.openId)fdOpenResourceLive(fdInitial.openId,{
    state:fdInitial,search:location.search,host:contentEl,
    getState:function(){ return fdController.getState(); },
    isCurrent:function(ref){return fdController.getState().openId===ref;}
  });
})();
</script>
