<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cw_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}try{if(localStorage.getItem('cw_side_collapsed')==='1'){document.documentElement.setAttribute('data-side','rail');}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inpatient Psychiatry — MS3 Clerkship</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A private learning hub for the third-year inpatient psychiatry clerkship.">
<script src="marked.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
    --text:#2f2924; --focus:#155eef; --text-mid:#51473d; --text-light:#665a4f; --warning:#7a6234; --warning-light:#f5efe2;
    --success:#357160; --success-light:#e7f1ed; --danger:#a34132; --danger-light:#fbece9; --info:#41618a; --info-light:#eaf0f6;
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  aside{background:var(--bg-alt);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;position:sticky;top:0;height:100vh}
  aside h1{font-family:var(--font-head);font-size:1.05rem;color:var(--primary-dark);margin:0 0 2px;padding-right:74px;white-space:nowrap}
  aside .by{font-size:.78rem;color:var(--text-light);margin-bottom:14px}
  .themebtn{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
  .themebtn:hover{border-color:var(--accent);color:var(--accent-dark)}
  /* Collapsible sidebar (desktop only — the ≤820px drawer keeps the full sidebar).
     html[data-side=rail] is set pre-paint from cw_side_collapsed so there is no flash. */
  .side-collapse{position:absolute;top:16px;right:54px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:.92rem;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .side-collapse:hover{border-color:var(--accent);color:var(--accent-dark)}
  .side-rail{display:none}
  @media(min-width:821px){
    .layout{transition:grid-template-columns .25s ease}
    html[data-side=rail] .layout{grid-template-columns:56px 1fr}
    html[data-side=rail] aside{padding:14px 10px}
    html[data-side=rail] aside>*:not(.side-rail){display:none}
    html[data-side=rail] .side-rail{display:flex;flex-direction:column;align-items:center;gap:10px}
  }
  .rail-expand{width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--accent-dark);cursor:pointer;font-size:.92rem;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .railbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
  .railbtn.rail-capture{border:1.5px dashed var(--border);background:transparent}
  .rail-expand:hover,.railbtn:hover{border-color:var(--accent);color:var(--accent-dark)}
  .rail-sep{width:24px;border-top:1px solid var(--border);margin:2px 0}
  .modetoggle{position:relative;display:flex;background:var(--primary-light);border:1px solid var(--border);border-radius:999px;padding:3px;margin:2px 0 14px}
  .modetoggle .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:999px;transition:transform .22s ease;z-index:0}
  .modetoggle.lib .knob{transform:translateX(100%)}
  .modetoggle button{flex:1;position:relative;z-index:1;border:none;background:transparent;font-family:inherit;font-size:.83rem;font-weight:700;color:var(--text-mid);padding:7px 4px;cursor:pointer;border-radius:999px}
  .modetoggle button.on{color:#fff}
  #content.pathmode{max-width:none;padding:0;margin:0}
  .pathframe{width:100%;height:calc(100vh - 46px);border:0;display:block}
  .search-wrap{position:relative;margin:0 0 12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  input.search{width:100%;padding:8px 28px 8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--text)}
  input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  .search-wrap .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text-light);cursor:pointer;font-size:1rem;display:none}
  .mode-companion{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:0;margin:0 0 12px;box-shadow:0 1px 3px rgba(59,51,44,.08);overflow:hidden}
  .mc-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-weight:900;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:10px;cursor:pointer}
  .mc-toggle:hover{background:var(--accent-light);color:var(--accent-dark)}
  .mc-chev{display:inline-block;color:var(--text-light);transition:transform .15s}
  .mc-toggle[aria-expanded="true"] .mc-chev{transform:rotate(90deg)}
  .mc-body{padding:0 10px 10px}
  .mc-body[hidden]{display:none}
  .mc-head{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 8px}
  .mc-home{border:1px solid var(--border);background:var(--bg-alt);color:var(--accent-dark);border-radius:999px;padding:3px 8px;font:inherit;font-size:.68rem;font-weight:800;cursor:pointer}
  .mc-home:hover{border-color:var(--accent);background:var(--accent-light)}
  .mc-modes{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
  .mc-mode{border:1px solid var(--border);background:var(--bg-alt);color:var(--text-mid);border-radius:999px;padding:3px 7px;font:inherit;font-size:.68rem;font-weight:800;cursor:pointer}
  .mc-mode.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mc-section{border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .mc-label{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);margin:0 0 4px}
  .mc-list{display:grid;gap:4px;grid-template-columns:minmax(0,1fr)}
  .mc-item{display:flex;align-items:center;gap:7px;width:100%;border:none;background:transparent;color:var(--text);text-align:left;border-radius:7px;padding:5px 6px;cursor:pointer;font:inherit;font-size:.82rem;line-height:1.2}
  .mc-item:hover{background:var(--accent-light);color:var(--accent-dark)}
  .mc-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-item .tag{flex:0 0 auto;color:var(--text-light);font-size:.6rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
  .mc-item.is-tool .tag{color:var(--accent-dark)}
  .mc-item.is-safety .tag{color:var(--primary-dark)}
  .mc-empty{font-size:.78rem;color:var(--text-light);line-height:1.35}
  .navsec-wrap{margin-top:4px}
  .navgroup-wrap{margin-top:8px}
  .navgroupsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-mid);font-weight:800;padding:8px 6px;border-radius:6px}
  .navgroupsec:hover{background:var(--primary-light);color:var(--text)}
  .navgroupsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navgroup-wrap.open>.navgroupsec .chev{transform:rotate(90deg)}
  .navgroupbody{display:none;padding-left:8px;border-left:1px solid var(--border);margin-left:6px}
  .navgroup-wrap.open>.navgroupbody{display:block}
  .navsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);font-weight:700;padding:7px 6px;border-radius:6px}
  .navsec:hover{background:var(--primary-light);color:var(--text-mid)}
  .navsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navsec-wrap.open>.navsec .chev{transform:rotate(90deg)}
  .navsec-t{flex:1;min-width:0}
  .navgroup{display:none;margin:1px 0 4px;padding-left:4px}
  .navsec-wrap.open>.navgroup{display:block}
  .navitem{display:flex;align-items:center;gap:4px;width:100%;text-align:left;border:none;background:transparent;color:var(--text);padding:6px 9px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.9rem;line-height:1.3}
  .navitem .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navitem-hidden{display:none}
  .navitem:hover{background:var(--primary-light)}
  .navitem.on{background:var(--accent);color:#fff}
  .navitem .tool-tag{flex:0 0 auto;font-size:.6rem;background:var(--accent-dark);color:#fff;border-radius:999px;padding:1px 6px;vertical-align:middle}
  .navitem.on .tool-tag{background:#fff;color:var(--accent-dark)}
  main{padding:0}
  .banner{background:var(--warning-light);border-bottom:1px solid var(--border);color:var(--text);font-size:.82rem;padding:8px 34px 8px 28px;position:relative}
  .banner.hide{display:none}
  .bannerx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.05rem;line-height:1;opacity:.55;padding:2px 6px}
  .bannerx:hover{opacity:1}
  .skel{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .skel .bar{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border) 25%,var(--bg-alt) 37%,var(--border) 63%);background-size:400% 100%;animation:skelsh 1.3s ease infinite;margin:11px 0}
  .skel .bar.title{height:26px;width:55%;margin:0 0 20px}
  .skel .bar.short{width:68%}
  @keyframes skelsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media(prefers-reduced-motion:reduce){.skel .bar{animation:none}}
  #content.toolmode{max-width:none;padding:0;margin:0}
  .toolframe{width:100%;height:calc(100vh - 46px);border:0;display:block;background:var(--bg)}
  .toolrev{background:var(--accent-light);color:var(--accent-dark);border-bottom:1px solid var(--border);font-size:.76rem;font-weight:600;padding:6px 16px;letter-spacing:.02em}
  #content.toolmode.hasrev .toolframe{height:calc(100vh - 46px - 30px)}
  .pgfb{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
  .pgfb-b{background:none;border:1px solid var(--border);border-radius:999px;padding:6px 15px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.83rem}
  .pgfb-b:hover{border-color:var(--accent);color:var(--accent-dark)}
  .skip-link{position:absolute;left:12px;top:-52px;background:#fff;color:var(--text);border:2px solid var(--focus);border-radius:6px;padding:8px 12px;z-index:100;transition:top .15s}
  .skip-link:focus{top:12px}
  .drawer-backdrop{position:fixed;inset:0;z-index:19;background:rgba(47,41,36,.40)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .loading{color:var(--text-mid);padding:28px 4px}
  .error{padding:8px 4px}
  .reviewed{display:inline-block;font-size:.76rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid #cfe1db;border-radius:999px;padding:3px 11px;margin:0 0 12px}
  .page-review-footer{margin:26px 0 0}
  .md-body{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .md-body h1{font-family:var(--font-head);color:var(--primary);font-size:2rem;margin:.2em 0 .4em}
  .md-body h2{font-family:var(--font-head);color:var(--text);font-size:1.4rem;margin:1.3em 0 .4em;border-bottom:1px solid var(--border);padding-bottom:4px}
  .md-body h3{font-size:1.1rem;margin:1.1em 0 .3em}
  .md-body a{color:var(--accent-dark)}
  .md-body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92rem}
  .md-body .table-scroll{position:relative;margin:1em 0}
  .md-body .table-scroll-viewport{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .md-body .table-scroll table{width:max-content;min-width:100%;margin:0}
  .table-scroll-hint{display:none;margin:0 0 5px;color:var(--text-light);font-size:.78rem;font-weight:700;letter-spacing:.02em}
  .md-body .table-scroll.is-scrollable .table-scroll-hint{display:block}
  .md-body .table-scroll.is-scrollable::after{content:"";position:absolute;right:1px;bottom:1px;width:28px;height:calc(100% - 24px);pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface))}
  @media(max-width:820px){
    .md-body .table-scroll th,.md-body .table-scroll td{min-width:9rem}
    .md-body .table-scroll th:first-child,.md-body .table-scroll td:first-child{min-width:7rem}
  }
  .md-body th,.md-body td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .md-body th{background:var(--primary-light)}
  .md-body blockquote{border-left:3px solid var(--accent);background:var(--accent-light);margin:1em 0;padding:8px 14px;border-radius:0 6px 6px 0;color:var(--text-mid)}
  .md-body code{background:var(--primary-light);padding:1px 5px;border-radius:4px;font-size:.86em}
  .md-body ul,.md-body ol{padding-left:1.4em}
  .toolnote{background:var(--accent-light);border:1px solid var(--accent);border-radius:10px;padding:18px;max-width:820px;margin:26px auto;text-align:center}
  .toolnote a.btn{display:inline-block;background:var(--primary-dark);color:#fff;text-decoration:none;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:10px}
  .srn{color:var(--text-light);font-size:.92rem;margin:.2em 0 0}
  .results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .result{display:block;border:1px solid var(--border);background:#fff;border-radius:10px;font-family:inherit}
  .result:hover{border-color:var(--accent);background:var(--accent-light)}
  .result-hit{display:block;width:100%;text-align:left;background:none;border:0;margin:0;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
  .result-chip{margin:0 14px 12px}
  .r-title{display:block;font-family:var(--font-head);font-size:1.06rem;color:var(--primary-dark);font-weight:600}
  .r-sec{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin:2px 0 4px}
  .r-snip{display:block;font-size:.86rem;color:var(--text-mid);line-height:1.45}
  mark{background:rgba(217,160,60,.34);color:inherit;padding:0 1px;border-radius:2px}
  /* unified topic template (Slice 4) */
  .topic-tpl{margin:6px 0 18px}
  .practice-panel{position:relative;border:1px solid #b9d2d0;border-left:7px solid var(--primary);border-radius:14px;background:linear-gradient(135deg,rgba(232,244,242,.92),rgba(255,252,247,.96));box-shadow:0 10px 26px rgba(47,41,36,.09);margin:8px 0 20px;overflow:hidden}
  .practice-panel::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(180deg,var(--primary),var(--accent));pointer-events:none}
  .practice-panel>summary{list-style:none}
  .practice-panel>summary::-webkit-details-marker{display:none}
  .practice-summary{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;cursor:pointer;background:rgba(255,255,255,.55);border-bottom:1px solid transparent}
  .practice-summary:focus-visible{outline:3px solid rgba(185,79,52,.34);outline-offset:-3px}
  .practice-panel[open] .practice-summary{border-bottom-color:#cfe1db}
  .practice-tab{flex:0 0 auto;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--primary-dark);border-radius:999px;padding:4px 9px}
  .practice-title{font-family:var(--font-head);font-size:1.08rem;font-weight:700;color:var(--primary-dark);line-height:1.2}
  .practice-sub{margin-left:auto;font-size:.76rem;color:var(--text-light);white-space:nowrap}
  .practice-hint{flex:0 0 auto;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);background:rgba(255,255,255,.86);border:1px solid #d6c8b6;border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(47,41,36,.06)}
  .practice-panel:not([open]) .practice-summary:hover .practice-hint{background:var(--accent-light);border-color:var(--accent)}
  .practice-hint-close{display:none}
  .practice-panel[open] .practice-hint-open{display:none}
  .practice-panel[open] .practice-hint-close{display:inline}
  .practice-chev{font-size:1.05rem;color:var(--accent-dark);transition:transform .16s ease}
  .practice-panel[open] .practice-chev{transform:rotate(90deg)}
  .practice-body{padding:14px 16px 16px}
  .practice-sections{display:grid;gap:12px}
  .practice-section{background:rgba(255,255,255,.72);border:1px solid #d9e5e0;border-radius:12px;padding:13px 14px}
  .practice-section-title{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--primary-dark);margin:0 0 8px}
  .practice-muted{font-size:.9rem;color:var(--text-mid);margin:0}
  .practice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .practice-action{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--accent-dark);background:var(--accent-light);border:1px solid #bfd8d3;border-radius:999px;padding:8px 12px}
  .practice-action:hover{background:var(--surface);border-color:var(--accent)}
  .practice-action.is-safety{color:var(--primary-dark);background:var(--primary-light);border-color:#bdd5d1}
  .practice-action.is-case{color:var(--primary-dark);background:#fff;border-color:#d5c9bc}
  .practice-drills{border:1px solid #d9c597;background:#fffaf0;border-radius:12px;padding:11px 12px;margin:0 0 12px}
  .practice-drill-head{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--warning);margin:0 0 4px}
  .practice-drill-note{font-size:.88rem;color:var(--text-mid);margin:0}
  .practice-drill-actions{margin-top:9px}
  .practice-action.is-drill{align-items:flex-start;flex-direction:column;gap:2px;min-width:178px;color:var(--warning);background:#fff;border-color:#d9c597;border-radius:10px;padding:9px 11px}
  .practice-action.is-drill:hover{background:#fffaf0;border-color:var(--warning)}
  .practice-action-kicker{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--warning)}
  .practice-action-main{font-weight:800;color:var(--text)}
  .practice-action-arrow{font-size:.76rem;color:var(--warning)}
  .practice-action.is-review{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tpl-chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--border)}
  .tpl-chip.read{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.hy{color:var(--warning);background:var(--warning-light);border-color:var(--warning)}
  .tpl-chip.safety{color:var(--danger);background:var(--danger-light);border-color:var(--danger)}
  .tpl-chip.evidence{color:var(--accent-dark);background:var(--accent-light);border-color:var(--accent)}
  .tpl-chip.review{color:var(--success);background:var(--success-light);border-color:var(--success)}
  .tpl-chip.mode{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.mode.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .practice-panel .tpl-meta{margin:0 0 12px}
  .practice-mode-note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border:1px solid #d9e5e0;border-radius:12px;padding:11px 13px;margin:0 0 12px}
  .practice-mode-note .k{flex:0 0 auto;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark)}
  .practice-mode-note .v{font-size:.9rem;line-height:1.4;color:var(--text-mid)}
  .page-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:.2em 0 .25em}

<script>
  var navEl=document.getElementById('nav'), contentEl=document.getElementById('content');

  (function(){var _b=document.getElementById('banner'),_bx=document.getElementById('bannerX');try{if(localStorage.getItem('cw_banner_dismissed')==='1'&&_b)_b.classList.add('hide');}catch(_){ } if(_bx)_bx.addEventListener('click',function(){if(_b)_b.classList.add('hide');try{localStorage.setItem('cw_banner_dismissed','1');}catch(_){ }});})();

  fetch('topic_meta.json').then(function(r){return r.ok?r.json():{}}).then(function(d){ TOPIC_META=d||{}; srsDropPhantomTopics(); try{ if(window.__renderModeCompanion) window.__renderModeCompanion(); }catch(_){ } try{ specialRefresh(); }catch(_){ } if(currentItem&&TOPIC_META[currentItem.f]&&contentEl&&!contentEl.querySelector('.topic-tpl')) show(currentItem); }).catch(function(){});
  function makeCollapsible(body){

      text:String(text).slice(0,CAP_MAX),at:Date.now(),ctx:capCtx(),triaged:false});
    capEvict(d.items);

  }
  function capRemove(id){ var d=capRead(); for(var i=0;i<d.items.length;i++){ if(d.items[i].id===id){ d.items.splice(i,1); break; } } capWrite(d); }
  function capMarkTriaged(id){ var d=capRead(); for(var i=0;i<d.items.length;i++){ if(d.items[i].id===id){ d.items[i].triaged=true; break; } } capWrite(d); }
  /* P4 — the one sanctioned egress. The stamp lives inside the payload builder so every copy path
     carries it, matching the supervised-draft pattern in decisional-capacity-module.html. */
  function capClipboardText(){
    var d=capRead(), lines=['Questions from the unit, brought to supervision. Written by a trainee for teaching discussion — contains no patient information.',''];
    for(var i=0;i<d.items.length;i++){ if(!d.items[i].triaged) lines.push('- '+d.items[i].text); }
    return lines.join('\n');

  /* ---- end ward capture store ---- */
  /* ^ load-bearing test anchor: tests/ward-capture.test.mjs slices from "var CAP_MAX=" to this
     comment and executes the real functions. Keep it. Text-only assertions are exactly how
     "Due today counts cards nothing can serve" survived (PR #291). */

  /* ---- triage card, rendered into renderHome ----
     Routes each capture through the existing runSearch. runSearch is NOT extracted: it closes over
     module-scope SI/VOCAB and calls tok()/idf() in this same top-level script, and the card renders
     from here, so the bindings are already in scope. All controls use data-cap-* attributes only —
     deliberately not data-f — so nothing collides with the generic .hm-li branches in
     __afterSpecial, which would navigate without marking the capture triaged. */
  function capTriageHtml(){
    var d=capRead(), open=[];
    for(var i=0;i<d.items.length;i++){ if(!d.items[i].triaged) open.push(d.items[i]); }
    if(!open.length)return '';
    var h='<div class="hm-sec"><h2>Questions from the unit <span style="font-weight:400;color:var(--text-light)">· '+open.length+' waiting</span></h2>';
    if(!SI){ h+='<div class="sub" style="margin:0 0 8px">Matching is unavailable right now — your questions are safe on this device.</div>'; }
    for(var j=0;j<open.length;j++){
      var it=open[j], hit=null;
      if(SI){ var res=runSearch(it.text); if(res.length)hit=res[0].d; }
      h+='<div class="cap-tri"><p class="cap-tri-q">'+esc(it.text)+'</p>';
      if(hit){
        h+='<button class="hm-li" data-cap-open="'+esc(it.id)+'" data-cap-f="'+esc(hit.f)+'"><span class="t">'+esc(hit.t)+'</span><span class="sec">Open →</span></button>';
        /* Offer the review route only when it would actually do something. The topicHasQuiz guard
           already lives inside seedSRS (that placement was the phantom-card fix), so calling it
           here is about display honesty, not safety — a quizless page would silently no-op. */
        if(typeof topicHasQuiz==='function' && topicHasQuiz(hit.f)){
          h+='<button class="hm-li" data-cap-review="'+esc(it.id)+'" data-cap-f="'+esc(hit.f)+'"><span class="t">Review this topic</span><span class="sec">Schedule →</span></button>';
        }
      }
      h+='<button class="hm-li" data-cap-drop="'+esc(it.id)+'"><span class="t">Done with this one</span><span class="sec">Dismiss</span></button></div>';
    }

  function capTriageClick(el){
    var id=el.getAttribute('data-cap-open')||el.getAttribute('data-cap-review')||el.getAttribute('data-cap-drop');

    if(el.hasAttribute('data-cap-copy')){
      var payload=capClipboardText();
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(payload).then(function(){ el.textContent='Copied ✓'; },function(){ el.textContent='Copy failed'; }); }

    }

  /* ---- capture sheet: own dialog, own focus trap ----

  var capSheet=null, capBackdrop=null, capInvoker=null;

    if(!capSheet)return [];
    var all=capSheet.querySelectorAll('button,textarea,[href],input,select,[tabindex]:not([tabindex="-1"])'), out=[];
    for(var i=0;i<all.length;i++){ if(!all[i].disabled && all[i].offsetParent!==null) out.push(all[i]); }
    return out;
  }

    if(!capSheet)return;
    if(e.key==='Escape'){ e.preventDefault(); capClose(); return; }
    if(e.key!=='Tab')return;

  function capClose(){

    document.removeEventListener('keydown',capKeydown,true);
    var opens=document.querySelectorAll('.capture-open');
    for(var i=0;i<opens.length;i++)opens[i].setAttribute('aria-expanded','false');
    /* Two-invoker focus return. There are two mount points and the viewport can cross 820px while
       the dialog is open, so the recorded invoker may be display:none by the time we close. Same
       guard shape as closeSheet's, which spa-shell-a11y.test.mjs pins. */
    var inv=capInvoker; capInvoker=null;
    if(inv && inv.isConnected && inv.offsetParent!==null){ try{ inv.focus(); return; }catch(_){ } }
    if(contentEl){ try{ contentEl.focus({preventScroll:true}); }catch(_){ } }
  }
  function capListHtml(){
    var d=capRead(), open=[];
    for(var i=0;i<d.items.length;i++){ if(!d.items[i].triaged) open.push(d.items[i]); }
    if(!open.length)return '';
    var h='<ul class="cap-list">';
    for(var j=0;j<open.length;j++){ h+='<li><span>'+esc(open[j].text)+'</span><button type="button" class="x" data-cap-del="'+esc(open[j].id)+'" aria-label="Delete this question">&times;</button></li>'; }
    return h+'</ul><div class="cap-acts"><button type="button" class="cap-btn danger" id="capEraseAll">Erase all captures</button></div>';
  }
  function capRenderBody(){
    if(!capSheet)return;
    var body=capSheet.querySelector('#capListWrap'); if(body)body.innerHTML=capListHtml();
  }
  function capOpen(invoker){

      + '<p class="cap-warn"><strong>The question, not the patient.</strong> No names, initials, room or bed numbers, dates, or MRNs — write what you want to understand, not who you saw. Stays on this device.</p>'
      + '<textarea id="capText" maxlength="280" rows="4" aria-label="Your question, no patient identifiers" placeholder="What did you want to look up later?"></textarea>'
      /* P3 — always-visible disclosure, not dismissible, because storage is on by default */
      + '<p class="cap-disclose">Saved on this device only, never sent anywhere. Erase all captures below.</p>'
      + '<div id="capHold"></div>'
      + '<div class="cap-acts"><button type="button" class="cap-btn primary" id="capSave">Save</button>'
      + '<button type="button" class="cap-btn" id="capCancel">Cancel</button></div>'
      + '<div id="capListWrap"></div>';

  function capSave(force){

        + '<b>This may contain patient details.</b>'
        + '<div class="cap-acts"><button type="button" class="cap-btn" id="capHoldEdit">Edit</button>'
        + '<button type="button" class="cap-btn" id="capHoldSave">No patient details — save</button></div></div>';

  /* Re-render whichever special view is live (Today's hmRoot or Progress's pgRoot) and re-run

  (function capWire(){
    var opens=document.querySelectorAll('.capture-open');

       session — a capture affordance there would offer to write learner state from a reviewer's
       seat. Remove the mounts entirely rather than merely disabling them, so nothing focusable is
       left in the preview's tab order. Same rule sw_register.js applies when it skips SW
       registration on a preview route. */
    if(typeof facultyPreviewRequest!=='undefined' && facultyPreviewRequest){
      for(var k=0;k<opens.length;k++){ if(opens[k].parentNode)opens[k].parentNode.removeChild(opens[k]); }

  /* ---------- Search (mirrors rc-search: tokenize -> synonym expand -> TF-IDF + prefix/substring bonus) ---------- */
  var SI=null, VOCAB=[];
  var STOP={a:1,an:1,and:1,are:1,as:1,at:1,be:1,by:1,"for":1,from:1,has:1,"in":1,is:1,it:1,of:1,on:1,or:1,that:1,the:1,to:1,was:1,"with":1,you:1,your:1};

     runs from the nav bootstrap in the same tick that starts this ~475 KB fetch. Without it the
     capture triage card paints its degraded "matching unavailable" state on nearly every cold load
     and never corrects. Same specialRefresh() idiom the topic_meta fetch uses for its own race.
     Gated on hmRoot (not dual-root) deliberately: the triage card is a Today-only surface. */
  fetch('search-index.json').then(function(r){return r.json()}).then(function(d){ SI=d; VOCAB=Object.keys(d.postings).sort(); if(document.getElementById('hmRoot')&&window.renderHome)specialRefresh(); })
    .catch(function(){ searchEl.placeholder='Search unavailable'; searchEl.disabled=true; });

  function idf(t){ return Math.log(1 + SI.n/((SI.df[t]||1))); }
  function runSearch(q){
    if(!SI) return [];
    var qt=tok(q); if(!qt.length) return [];
    var score={}, cover={};
    qt.forEach(function(term){

      var sy=SI.synonyms[term]||[];
      for(var s=0;s<sy.length;s++){ if(SI.postings[sy[s]] && !toks[sy[s]]) toks[sy[s]]=0.6; }
      var hasSynonyms=sy.length>0;
      if(term.length>=3 && !hasSynonyms){ for(var i=0;i<VOCAB.length;i++){ var v=VOCAB[i]; if(v!==term && v.indexOf(term)===0 && !toks[v]) toks[v]=0.5; } }
      var hit={};
      Object.keys(toks).forEach(function(t){
        var w=toks[t], inv=idf(t), post=SI.postings[t];

      });

    });

      var d=SI.docs[id], s=score[id]*(1+0.6*((cover[id]||1)-1));
      if(d.t.toLowerCase().indexOf(ql)>=0) s+=25;
      return {id:id,s:s,d:d};
    });

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    }

  }
  function restore(){ if(currentItem) show(currentItem,null); else { var f=navEl.querySelector('.navitem'); if(f) f.click(); } }
  /* Practice-action chip: at most one per result row, priority quiz > communicationCases > relatedTools.
     Reuses TOPIC_META (already in memory for topic-page "Test yourself" widgets) — no new data loads.
     The communicationCases href is built inline (case-specific deep link), mirroring the same
     '?tool=communication-practice.html&case='+id pattern buildPracticeTools already uses at ~line 740. */
  function resultActionChip(d){
    var m=TOPIC_META&&TOPIC_META[d.f];
    if(!m)return '';
    if(m.quiz){
      var qh=(d.k==='tool'?'?tool=':'?page=')+encodeURIComponent(d.f);
      return '<a class="practice-action result-chip" href="'+esc(qh)+'"'+ctaAttrs(qh)+'>Test yourself →</a>';
    }
    if(Array.isArray(m.communicationCases)&&m.communicationCases.length){
      var ch='?tool=communication-practice.html&case='+encodeURIComponent(m.communicationCases[0]);
      return '<a class="practice-action result-chip" href="'+esc(ch)+'"'+ctaAttrs(ch)+'>Spoken drill →</a>';
    }
    if(Array.isArray(m.relatedTools)&&m.relatedTools.length){
      var th='?tool='+encodeURIComponent(m.relatedTools[0]);
      return '<a class="practice-action result-chip" href="'+esc(th)+'"'+ctaAttrs(th)+'>'+esc(practiceToolLabel(m.relatedTools[0]))+' →</a>';
    }
    return '';
  }
  function renderResults(q){
    if(facultyPreviewRequest){if(q)showFacultyPreviewLockNotice();return;}
    sxEl.style.display = q ? 'block' : 'none';
    if(!q.trim()){ restore(); return; }
    var res=runSearch(q), html='<h1>Search</h1>';
    if(!res.length){ html+='<p class="srn">No matches for <strong>'+esc(q)+'</strong>. Try a symptom, diagnosis, drug, or tool name.</p>'; }
    else{
      html+='<p class="srn">'+res.length+' result'+(res.length>1?'s':'')+' for <strong>'+esc(q)+'</strong></p><div class="results">';
      res.forEach(function(r){
        html+='<div class="result"><button type="button" class="result-hit" data-i="'+r.id+'"><span class="r-title">'+hl(r.d.t,q)+(r.d.k==='tool'?' <span class="tool-tag">tool</span>':'')+'</span><span class="r-sec">'+esc(r.d.sec)+'</span><span class="r-snip">'+hl(r.d.snip,q)+'&hellip;</span></button>'+resultActionChip(r.d)+'</div>';
      });
      html+='</div>';
    }
    contentEl.innerHTML=html;
    var bs=contentEl.querySelectorAll('.result-hit');
    for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ var d=SI.docs[this.getAttribute('data-i')]; searchEl.value=''; sxEl.style.display='none'; var _nb=document.querySelector('.navitem[data-f="'+d.f+'"]'); if(_nb){_nb.click();}else{show(d,null);} }; }
  }
  var dt;
  searchEl.addEventListener('input',function(){ clearTimeout(dt); var q=searchEl.value; dt=setTimeout(function(){ renderResults(q); },130); });
  searchEl.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ var res=runSearch(searchEl.value); if(res.length){ var d=res[0].d; searchEl.value=''; sxEl.style.display='none'; var _nb=document.querySelector('.navitem[data-f="'+d.f+'"]'); if(_nb){_nb.click();}else{show(d,null);} } }
    else if(e.key==='Escape'){ searchEl.value=''; sxEl.style.display='none'; restore(); }
  });
  sxEl.onclick=function(){ searchEl.value=''; sxEl.style.display='none'; searchEl.focus(); restore(); };
</script>

        var tile=e.target.closest?e.target.closest('button.hm-tile'):null;
        if(tile){ if(tile.getAttribute('data-act')==='review'){ navClick('review.html'); return; } var tf=tile.getAttribute('data-f'); if(tf)navClick(tf); return; }
        /* Exact-value match only: the pretest delegation never covers #hmRoot (scoped to
           #ptRoot/#planRoot and bound lazily), so the phase chip's unset-state button is handled
           here. Must stay narrower than [data-pt] — plan/pretest buttons below use the same
           attribute and are handled by the .hm-li branch. */
        var ps=e.target.closest?e.target.closest('[data-pt="start"]'):null; if(ps){ navClick('__start__'); return; }
        var li=e.target.closest?e.target.closest('.hm-li'):null; if(li){ var act=li.getAttribute('data-act'); if(act==='review'){ navClick('review.html'); return; } if(act==='start'){ navClick('__start__'); return; } if(act==='studyexport'){ if(window.exportStudy)window.exportStudy(); return; } var pr=li.getAttribute('data-practice'); if(pr){ try{localStorage.setItem('cw_qb_focus',pr);}catch(_){ } navClick('question-bank-practice.html'); return; } var pt=li.getAttribute('data-pt'); if(pt){ if(pt==='plan')renderStoredPlan(); else if(pt==='pretest')startPretest(); return; } var ff=li.getAttribute('data-f'); if(ff)navClick(ff); return; }
        var dm=e.target.closest?e.target.closest('[data-dash-mode]'):null; if(dm){ setDashboardMode(dm.getAttribute('data-dash-mode')); root.outerHTML=(f==='__progress__'&&window.renderProgress)?window.renderProgress():window.renderHome(); window.__afterSpecial(f); return; }
        var b=e.target.closest?e.target.closest('[data-act]'):null; if(b){ var a=b.getAttribute('data-act'); if(a==='review')navClick('review.html'); }
      });
    } else {
      root.addEventListener('click',function(e){
        var it=e.target.closest?e.target.closest('.it[data-check]'):null;
        if(it && !(e.target.closest&&e.target.closest('a'))){ var key=it.getAttribute('data-check'); var st={}; try{ st=JSON.parse(LS('cw_firstday')||'{}')||{}; }catch(_){ st={}; } st[key]=!st[key]; try{ localStorage.setItem('cw_firstday',JSON.stringify(st)); }catch(_){ } it.classList.toggle('on',!!st[key]); var bx=it.querySelector('.bx'); if(bx)bx.textContent=st[key]?'✓':''; return; }
        var m=e.target.closest?e.target.closest('[data-act]'):null; if(m){ var act=m.getAttribute('data-act'); if(act==='path'){ if(typeof showPath==='function')showPath(); } else if(act==='lib'){ navClick('__home__'); } else if(act==='home'){ navClick('__home__'); } else if(act==='pretest'){ startPretest(); } }
      });
      var tk=root.querySelector('#stTrack'); if(tk)tk.addEventListener('change',function(){ try{localStorage.setItem('cw_track',tk.value);}catch(_){ } });
      var wkk=root.querySelector('#stWeek'); if(wkk)wkk.addEventListener('change',function(){ try{localStorage.setItem('cw_start_week',wkk.value);}catch(_){ } });
      var sh=root.querySelector('#stShelf'); if(sh)sh.addEventListener('change',function(){ try{localStorage.setItem('cw_shelf_date',sh.value);}catch(_){ } });
    }
  };
})();
</script>
