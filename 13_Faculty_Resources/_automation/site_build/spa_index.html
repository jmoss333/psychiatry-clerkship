<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cw_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inpatient Psychiatry — MS3 Clerkship</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A private learning hub for the third-year inpatient psychiatry clerkship.">
<script src="marked.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2; --accent-border:#bfd8d3;
    --text:#2f2924; --focus:#155eef; --text-mid:#51473d; --text-light:#665a4f; --warning:#7a6234; --warning-light:#f5efe2;
    --success:#357160; --success-light:#e7f1ed; --danger:#a34132; --danger-light:#fbece9; --info:#41618a; --info-light:#eaf0f6;
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .banner{background:var(--warning-light);border-bottom:1px solid var(--border);color:var(--text);font-size:.82rem;padding:8px 34px 8px 28px;position:relative}
  .banner.hide{display:none}
  .bannerx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.05rem;line-height:1;opacity:.55;padding:2px 6px}
  .bannerx:hover{opacity:1}
  .skel{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .skel .bar{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border) 25%,var(--bg-alt) 37%,var(--border) 63%);background-size:400% 100%;animation:skelsh 1.3s ease infinite;margin:11px 0}
  .skel .bar.title{height:26px;width:55%;margin:0 0 20px}
  .skel .bar.short{width:68%}
  @keyframes skelsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media(prefers-reduced-motion:reduce){.skel .bar{animation:none}}
  #content.toolmode{max-width:none;padding:0;margin:0;display:flex;flex-direction:column;height:calc(100vh - 46px)}
  .toolframe{width:100%;height:calc(100vh - 46px);border:0;display:block;background:var(--bg)}
  #content.toolmode .toolframe{flex:1 1 auto;height:auto;min-height:0}
  .pgfb{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
  .pgfb-b{background:none;border:1px solid var(--border);border-radius:999px;padding:6px 15px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.83rem}
  .pgfb-b:hover{border-color:var(--accent);color:var(--accent-dark)}
  .skip-link{position:absolute;left:12px;top:-52px;background:#fff;color:var(--text);border:2px solid var(--focus);border-radius:6px;padding:8px 12px;z-index:100;transition:top .15s}
  .skip-link:focus{top:12px}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .loading{color:var(--text-mid);padding:28px 4px}
  .error{padding:8px 4px}
  .governance-notice{border-radius:8px;font-size:.9rem;line-height:1.45;margin:0 0 16px;padding:9px 13px}
  .governance-notice .governance-title{display:block;font-weight:800}
  .governance-notice .governance-risk{display:block;font-size:.76rem;font-weight:750;letter-spacing:.02em;color:var(--text-mid);margin-top:2px}
  .governance-notice p{margin:6px 0 0}
  .governance-notice.pending-high{border:3px solid var(--danger);background:var(--danger-light);color:var(--text);padding:14px 18px}
  .governance-notice.pending-high .pgfb-b{margin-top:10px;background:var(--surface);color:var(--danger);border-color:var(--danger)}
  .governance-notice.pending-compact{border:1px solid var(--warning);background:var(--warning-light);color:var(--text)}
  .governance-notice.reviewed-receipt{display:inline-block;font-size:.76rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent-border);border-radius:999px;padding:3px 11px}
  .governance-notice.unavailable{border:1px dashed var(--text-light);background:var(--bg-alt);color:var(--text-mid);font-weight:600}
  #content.toolmode .governance-notice{margin:0;border-radius:0}
  .governance-badge{display:inline-block;flex:0 0 auto;border:1px solid currentColor;border-radius:999px;padding:1px 6px;font-size:.58rem;font-weight:800;line-height:1.35;color:var(--warning);background:var(--warning-light);vertical-align:middle;margin-left:5px}
  .governance-badge.high{color:var(--danger);background:var(--danger-light)}
  .navitem.on .governance-badge{color:var(--text);background:var(--surface)}
  .md-body{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .md-body h1{font-family:var(--font-head);color:var(--primary);font-size:2rem;margin:.2em 0 .4em}
  .md-body h2{font-family:var(--font-head);color:var(--text);font-size:1.4rem;margin:1.3em 0 .4em;border-bottom:1px solid var(--border);padding-bottom:4px}
  .md-body h3{font-size:1.1rem;margin:1.1em 0 .3em}
  .md-body a{color:var(--accent-dark)}
  .md-body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92rem}
  .md-body .table-scroll{position:relative;margin:1em 0}
  .md-body .table-scroll-viewport{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .md-body .table-scroll table{width:max-content;min-width:100%;margin:0}
  .table-scroll-hint{display:none;margin:0 0 5px;color:var(--text-light);font-size:.78rem;font-weight:700;letter-spacing:.02em}
  .md-body .table-scroll.is-scrollable .table-scroll-hint{display:block}
  .md-body .table-scroll.is-scrollable::after{content:"";position:absolute;right:1px;bottom:1px;width:28px;height:calc(100% - 24px);pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface))}
  @media(max-width:820px){
    .md-body .table-scroll th,.md-body .table-scroll td{min-width:9rem}
    .md-body .table-scroll th:first-child,.md-body .table-scroll td:first-child{min-width:7rem}
  }
  .md-body th,.md-body td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .md-body th{background:var(--primary-light)}
  .md-body blockquote{border-left:3px solid var(--accent);background:var(--accent-light);margin:1em 0;padding:8px 14px;border-radius:0 6px 6px 0;color:var(--text-mid)}
  .md-body code{background:var(--primary-light);padding:1px 5px;border-radius:4px;font-size:.86em}
  .md-body ul,.md-body ol{padding-left:1.4em}
  .toolnote{background:var(--accent-light);border:1px solid var(--accent);border-radius:10px;padding:18px;max-width:820px;margin:26px auto;text-align:center}
  .toolnote a.btn{display:inline-block;background:var(--primary-dark);color:#fff;text-decoration:none;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:10px}
  .srn{color:var(--text-light);font-size:.92rem;margin:.2em 0 0}
  .results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .result{display:block;border:1px solid var(--border);background:#fff;border-radius:10px;font-family:inherit}
  .result:hover{border-color:var(--accent);background:var(--accent-light)}
  .result-hit{display:block;width:100%;text-align:left;background:none;border:0;margin:0;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
  .result-chip{margin:0 14px 12px}
  .r-title{display:block;font-family:var(--font-head);font-size:1.06rem;color:var(--primary-dark);font-weight:600}
  .r-sec{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin:2px 0 4px}
  .r-snip{display:block;font-size:.86rem;color:var(--text-mid);line-height:1.45}
  mark{background:rgba(217,160,60,.34);color:inherit;padding:0 1px;border-radius:2px}
  /* unified topic template (Slice 4) */
  .topic-tpl{margin:6px 0 18px}
  .practice-panel{position:relative;border:1px solid #b9d2d0;border-left:7px solid var(--primary);border-radius:14px;background:linear-gradient(135deg,rgba(232,244,242,.92),rgba(255,252,247,.96));box-shadow:0 10px 26px rgba(47,41,36,.09);margin:8px 0 20px;overflow:hidden}
  .practice-panel::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(180deg,var(--primary),var(--accent));pointer-events:none}
  .practice-panel>summary{list-style:none}
  .practice-panel>summary::-webkit-details-marker{display:none}
  .practice-summary{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;cursor:pointer;background:rgba(255,255,255,.55);border-bottom:1px solid transparent}
  .practice-summary:focus-visible{outline:3px solid rgba(185,79,52,.34);outline-offset:-3px}
  .practice-panel[open] .practice-summary{border-bottom-color:#cfe1db}
  .practice-tab{flex:0 0 auto;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--primary-dark);border-radius:999px;padding:4px 9px}
  .practice-title{font-family:var(--font-head);font-size:1.08rem;font-weight:700;color:var(--primary-dark);line-height:1.2}
  .practice-sub{margin-left:auto;font-size:.76rem;color:var(--text-light);white-space:nowrap}
  .practice-hint{flex:0 0 auto;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);background:rgba(255,255,255,.86);border:1px solid #d6c8b6;border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(47,41,36,.06)}
  .practice-panel:not([open]) .practice-summary:hover .practice-hint{background:var(--accent-light);border-color:var(--accent)}
  .practice-hint-close{display:none}
  .practice-panel[open] .practice-hint-open{display:none}
  .practice-panel[open] .practice-hint-close{display:inline}
  .practice-chev{font-size:1.05rem;color:var(--accent-dark);transition:transform .16s ease}
  .practice-panel[open] .practice-chev{transform:rotate(90deg)}
  .practice-body{padding:14px 16px 16px}
  .practice-sections{display:grid;gap:12px}
  .practice-section{background:rgba(255,255,255,.72);border:1px solid #d9e5e0;border-radius:12px;padding:13px 14px}
  .practice-section-title{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--primary-dark);margin:0 0 8px}
  .practice-muted{font-size:.9rem;color:var(--text-mid);margin:0}
  .practice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .practice-action{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent-border);border-radius:999px;padding:8px 12px}
  .practice-action:hover{background:var(--surface);border-color:var(--accent)}
  .practice-action.is-safety{color:var(--primary-dark);background:var(--primary-light);border-color:#bdd5d1}
  .practice-action.is-case{color:var(--primary-dark);background:#fff;border-color:#d5c9bc}
  .practice-drills{border:1px solid #d9c597;background:#fffaf0;border-radius:12px;padding:11px 12px;margin:0 0 12px}
  .practice-drill-head{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--warning);margin:0 0 4px}
  .practice-drill-note{font-size:.88rem;color:var(--text-mid);margin:0}
  .practice-drill-actions{margin-top:9px}
  .practice-action.is-drill{align-items:flex-start;flex-direction:column;gap:2px;min-width:178px;color:var(--warning);background:#fff;border-color:#d9c597;border-radius:10px;padding:9px 11px}
  .practice-action.is-drill:hover{background:#fffaf0;border-color:var(--warning)}
  .practice-action-kicker{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--warning)}
  .practice-action-main{font-weight:800;color:var(--text)}
  .practice-action-arrow{font-size:.76rem;color:var(--warning)}
  .practice-action.is-review{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tpl-chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--border)}
  .tpl-chip.read{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.hy{color:var(--warning);background:var(--warning-light);border-color:var(--warning)}
  .tpl-chip.safety{color:var(--danger);background:var(--danger-light);border-color:var(--danger)}
  .tpl-chip.evidence{color:var(--accent-dark);background:var(--accent-light);border-color:var(--accent)}
  .tpl-chip.review{color:var(--success);background:var(--success-light);border-color:var(--success)}
  .tpl-chip.mode{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.mode.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .practice-panel .tpl-meta{margin:0 0 12px}
  .practice-mode-note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border:1px solid #d9e5e0;border-radius:12px;padding:11px 13px;margin:0 0 12px}
  .practice-mode-note .k{flex:0 0 auto;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark)}
  .practice-mode-note .v{font-size:.9rem;line-height:1.4;color:var(--text-mid)}
  .page-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:.2em 0 .25em}
  .page-title-row h1{margin:0}
  .page-title-row .markrev{font-size:.68rem;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:4px 9px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-family:inherit;white-space:nowrap;margin-top:.42rem}
  .page-title-row .markrev:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-light)}
  .page-title-row .markrev.on{background:var(--success-light);border-color:var(--success);color:var(--success)}
  .review-ledger{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:-2px 0 14px;padding:0;color:var(--text-mid)}
  .review-ledger .k{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark)}
  .review-ledger .v{font-size:.78rem;color:var(--text-mid);line-height:1.35}
  .review-ledger .revcount{font-weight:800;color:var(--text)}
  .review-ledger .review-date{color:var(--text-light)}
  /* .wd-tool was never in this list, so the tool chips shipped at 32px on a phone while the
     mode chips beside them were correctly bumped to 44px — a ward tool is used one-handed at
     the bedside, so these are exactly the wrong controls to leave under the touch target. */
  /* .hm-li is every tappable row on Today (dashboard actions, capture triage, resume, Progress).
     Two-line rows already cleared 44px on their own, but .wd-card .hm-li trims padding to 7px, so
     single-line dashboard actions shipped at ~35px. min-height (not padding) so the two-line rows
     are unchanged; .hm-li already sets align-items:center, so short rows just centre in the box. */
  @media(max-width:560px){.page-title-row{display:block}.page-title-row .markrev{margin:.25rem 0 .1rem}.mc-mode,.wd-mode,.wd-tool{min-height:44px;padding-top:10px;padding-bottom:10px}.hm-li{min-height:44px}}
  .in30{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:0 0 14px}
  .practice-panel .in30{background:transparent;border-left:none;border-radius:0;padding:0;margin:0}
  .in30 .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:6px}
  .in30 .one{font-family:var(--font-head);font-size:1.12rem;line-height:1.4;margin-bottom:8px;color:var(--text)}
  .practice-panel .in30 .lbl{display:none}
  .practice-panel .in30 .one{font-size:1.02rem;margin-bottom:8px}
  .in30 ul{margin:0;padding:0;list-style:none}
  .in30 li{position:relative;padding-left:24px;margin:5px 0;font-size:.95rem}
  .in30 li::before{content:"\2713";position:absolute;left:0;color:var(--accent);font-weight:700}
  .workflow-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;margin:0 0 16px}
  .workflow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .workflow-title{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark)}
  .workflow-stage{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .workflow-stage span{font-size:.72rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--border);border-radius:999px;padding:4px 8px}
  .workflow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .workflow-step{border:1px solid var(--border);border-radius:10px;background:var(--bg-alt);padding:10px 12px}
  .workflow-step .k{font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-light);margin-bottom:5px}
  .workflow-step .v{font-size:.92rem;line-height:1.45;color:var(--text)}
  .workflow-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .workflow-actions a{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;color:var(--accent-dark);border:1px solid var(--border);border-radius:999px;padding:7px 11px;background:var(--accent-light)}
  .workflow-actions a:hover{border-color:var(--accent);background:var(--surface)}
  .practice-panel .workflow-card{border:none;border-radius:0;background:transparent;padding:0;margin:0}
  .practice-panel .workflow-head{margin-bottom:9px}
  .practice-panel .workflow-title{display:none}
  .practice-panel .workflow-step{background:rgba(247,250,249,.86)}
  .practice-panel .workflow-actions{display:none}
  @media(max-width:680px){.practice-summary{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.practice-sub{grid-column:2/4;margin-left:0;white-space:normal}.practice-hint{grid-column:2/3;justify-self:start}.workflow-head{display:block}.workflow-stage{justify-content:flex-start;margin-top:8px}.workflow-grid{grid-template-columns:1fr}}
  .cantmiss{display:flex;gap:11px;background:var(--danger-light);border-left:3px solid var(--danger);border-radius:0 10px 10px 0;padding:12px 15px;margin:0 0 14px}
  .cantmiss .ico{color:var(--danger);flex:0 0 auto;font-size:1.05rem;line-height:1.4}
  .cantmiss .tx{font-size:.95rem} .cantmiss b{color:var(--danger)}
  .practice-panel .cantmiss{margin:10px 0 0}
  .minitree{border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin:0 0 14px;background:var(--surface)}
  .minitree .lbl{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-light);margin-bottom:8px}
  .minitree .ro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .minitree .ro .c{font-size:.82rem;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:3px 9px}
  .minitree .fm{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:8px;padding:8px 11px;font-size:.92rem}
  .minitree .fm b{color:var(--accent-dark)}
  .minitree a{display:inline-block;margin-top:8px;font-size:.84rem;color:var(--accent-dark)}
  .practice-panel .minitree{background:rgba(255,255,255,.72);margin:10px 0 0}
  .tyourself{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 16px;background:var(--surface)}
  .practice-panel .tyourself{border:none;background:transparent;border-radius:0;padding:0;margin:0}
  .tyourself .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark);margin-bottom:8px}
  .practice-panel .tyourself .lbl{display:none}
  .tyourself .q{font-family:var(--font-head);font-size:1.05rem;margin-bottom:10px;color:var(--text)}
  .tyo{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--bg-alt);border-radius:9px;padding:9px 12px;margin:6px 0;cursor:pointer;font:inherit;color:var(--text)}
  .tyo:hover{border-color:var(--accent)}
  .tyo.correct{border-color:var(--success);background:var(--success-light)}
  .tyo.wrong{border-color:var(--danger);background:var(--danger-light)}
  .tyfb{font-size:.9rem;color:var(--text-mid);margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--bg-alt);display:none}
  .tyfb.show{display:block}
  .md-body .toolcta{display:inline-block;background:var(--primary-dark);color:var(--on-brand);text-decoration:none;border-radius:8px;padding:10px 16px;font-weight:600;margin:2px 0 18px}
  .md-body .minitree a,.md-body .in30 a{text-decoration:underline}
  /* collapsible in-page sections (long readings) */
  .md-body .sec-toolbar{display:flex;gap:8px;margin:10px 0 12px}
  .md-body .sec-all{font-size:.8rem;border:1px solid var(--border);background:var(--surface);color:var(--accent-dark);border-radius:999px;padding:5px 13px;cursor:pointer;font-family:inherit}
  .md-body .sec-all:hover{border-color:var(--accent)}
  .md-body .sec-c{border:1px solid var(--border);border-radius:10px;margin:9px 0;background:var(--surface);overflow:hidden}

<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="fd-shell">
  <!-- Standing disclaimer. A compliance surface, not chrome: this is the only place either
       sentence appears, and it is the site's standing statement that the clinical content is
       synthetic and that some pages are not yet faculty-attested. Kept as STATIC markup rather
       than folded into fdRender's output so that no failing surface, and no state, can take the
       disclaimer down with it. The wording is byte-identical to the pre-front-door shell because
       resident_section.py's RESIDENT_REBRAND rewrites it by literal replacement for the resident
       site — editing it here silently mis-brands that build or aborts it. Pinned by
       tests/fd-shell-boot.test.mjs. -->
  <div class="banner" id="banner"><span id="bannerText">Private teaching site for the MS3 inpatient psychiatry rotation. Educational use; fictional composites only, no PHI. Some pages are pending faculty review.</span><button class="bannerx" id="bannerX" type="button" aria-label="Dismiss notice">&times;</button></div>
  <!-- Route announcements for assistive tech. announceRoute() writes here; the old mobile title
       bar that used to duplicate it on small screens is gone with the sidebar, so this is now the
       single announcement channel at every width. -->
  <span id="routeStatus" class="vh-live" aria-live="polite"></span>
  <!-- Governance notice mount. fdRender writes the review-status notice here for the open page OR
       tool — one call site for both, so the two renderings cannot drift the way the tool branch
       and the md branch of the deleted show() did. (The renderer is NAMED rather than written out
       here on purpose: tests/fd-shell-boot.test.mjs counts its call sites, and a comment
       reproducing the call inflates the count and makes that assertion unfalsifiable — a trap this
       plan has now sprung twice.)
       It lives OUTSIDE #content deliberately, and there are two reasons rather than one:
       (a) #content is fully overwritten on every fdRender, so a compliance notice inside it would
           be collateral damage of a tab switch; and
       (b) the pending-high variant is role="alert", which fires on INSERTION — inside #content it
           would be re-inserted, and therefore re-shouted at a screen-reader user, every time the
           student ticks a checkbox or flips the theme. fdMount only writes a mount whose markup
           actually changed, so out here the alert fires once per route, which is what an alert
           means. -->
  <div id="governanceNotice"></div>
  <!-- The content root. fdRender(state) owns everything inside it: the header (fdHeader + fdTabs)
       and <main class="fd-main">. Keeps id="content" because the skip link, announceRoute()'s
       focus move, capClose()'s focus return, and the faculty-preview surfaces all address it. -->
  <div id="content" tabindex="-1"></div>
  <!-- Tool frame mount. Written separately from #content for the SAME reason the overlays below
       are, and the reason is sharper here: fdMount replaces #content wholesale whenever the body
       markup changes, and re-inserting an <iframe> reloads it. A tool opened from the front door
       holds real in-progress state — a half-scored CIWA, a question mid-answer, a standardized-
       patient conversation — so a theme toggle (which changes the header's aria-pressed and
       nothing else the student can see) would silently throw all of it away. Keyed on the tool's
       own markup, this mount is written only when the OPEN TOOL changes.
       Placed before the overlays so an open sheet or search panel still paints above it. -->
  <div id="fdTool" class="fd-toolmount"></div>
  <!-- Overlay mounts. The four portalled surfaces are position:fixed and are written separately
       from #content so an open sheet or search panel is not re-created (and its input focus lost)
       every time the page body behind it re-renders. -->
  <!-- Crisis contacts for the protocol sheet, rendered at BUILD time from crisis_resources.json
       (988 and the rest live in that file and nowhere else; crisis_block.py replaces the marker
       below and build_deploy.py aborts the build if it ever goes missing). It sits in a <template>
       so it is inert markup the parser keeps but never paints: fd_sheet.js draws the sheet, and a
       statically-placed block would either sit unread behind the panel or duplicate itself inside
       it. fdCrisisHtml() reads it once and hands it to fdSheet as a parameter, the same shape
       fdReader already takes its article body in. -->
  <template id="fdCrisisSource"><!-- crisis-block-html --></template>
  <div id="fdSheet"></div>
  <div id="fdSearch"></div>
  <div id="fdNudge"></div>
</div>
<script>
  var contentEl=document.getElementById('content');
  /* currentItem is still the governance/capture layer's notion of "what is open": refreshGovernanceNotice()
     and capCtx() both read it. Task 4 sets it when it wires routing; until then it stays null and both
     read that correctly as "no page open". */
  var currentItem=null; var GOVERNANCE={status:'loading',items:{}}; var governanceFocusSlug='';
  (function(){var _b=document.getElementById('banner'),_bx=document.getElementById('bannerX');try{if(localStorage.getItem('cw_banner_dismissed')==='1'&&_b)_b.classList.add('hide');}catch(_){ } if(_bx)_bx.addEventListener('click',function(){if(_b)_b.classList.add('hide');try{localStorage.setItem('cw_banner_dismissed','1');}catch(_){ }});})();
  function skel(){return '<div class="skel" role="status" aria-label="Loading"><div class="bar title"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="bar"></div></div>';}
  fetch('governance.json')
    .then(function(r){if(!r.ok)throw new Error('governance unavailable');return r.json();})
    .then(function(d){GOVERNANCE={status:'ready',items:d.items||{}};rerenderCurrent();})
    .catch(function(){GOVERNANCE={status:'unavailable',items:{}};rerenderCurrent();});
  var TOPIC_META={};
  function progLoad(){ try{ return JSON.parse(localStorage.getItem('cw_progress_v1'))||{}; }catch(_){ return {}; } }
  function progSave(o){ try{ localStorage.setItem('cw_progress_v1',JSON.stringify(o)); }catch(_){ } }
  function topicHasQuiz(file){ var m=(typeof TOPIC_META!=='undefined'&&TOPIC_META)?TOPIC_META[file]:null; return !!(m&&m.quiz&&m.quiz.q&&m.quiz.o&&m.quiz.o.length); }
  function seedSRS(file){ try{ if(!topicHasQuiz(file))return; var s=JSON.parse(localStorage.getItem('cw_srs_v1')||'null'); if(!s||s.v!==1){ s={v:1,cards:{},day:{lastDay:'',newToday:0},stats:{streak:0,lastStudy:'',totalReviews:0,correct:0,seen:0},settings:{newPerDay:12}}; } var id='TOPIC#'+file; if(!s.cards[id]){ s.cards[id]={ease:2.5,ivl:0,reps:0,lapses:0,due:Date.now(),last:0}; localStorage.setItem('cw_srs_v1',JSON.stringify(s)); } }catch(_){ } }
  /* One-time self-healing migration: drop never-graded TOPIC# cards whose topic has no
     servable quiz — they were seeded by the unguarded seedSRS, can never be graded in
     Daily Review, and inflate "Due today" forever. Runs whenever topic_meta loads;
     idempotent; deliberately refuses to run on an empty TOPIC_META (failed fetch). */
  function srsDropPhantomTopics(){ try{ if(typeof TOPIC_META==='undefined'||!TOPIC_META||!Object.keys(TOPIC_META).length)return; var s=JSON.parse(localStorage.getItem('cw_srs_v1')||'null'); if(!s||s.v!==1||!s.cards)return; var changed=false; for(var id in s.cards){ if(id.indexOf('TOPIC#')!==0)continue; var c=s.cards[id]; if(c&&!c.reps&&!topicHasQuiz(id.slice(6))){ delete s.cards[id]; changed=true; } } if(changed){ localStorage.setItem('cw_srs_v1',JSON.stringify(s)); } }catch(_){ } }
  /* No view refresh here: the old `renderHome()` call at this spot DISCARDED its return value
     (renderHome returns an HTML string; it does not touch the DOM) — a silent no-op since the
     tile row landed. The sole caller (the topic_meta fetch above) now runs specialRefresh()
     unconditionally, which is also what actually fixes the cold-load "0 matched" dashboard. */
  /* ---- end srs seed + phantom migration ---- */
  function toolExtraFromParams(sp){ var out=''; try{ sp.forEach(function(v,k){ if(k!=='tool'&&k!=='page') out+='&'+encodeURIComponent(k)+'='+encodeURIComponent(v); }); }catch(_){} return out; }
  /* ---- governance notice ---- */
  /* Consumes governance.json (Task 3's public projection of 13_Faculty_Resources/reviewed.json).
     Fetch-only, in-memory (GOVERNANCE above) — this feature stores nothing in localStorage. */
  function toolFrameSuffixWithGovernance(extra){
    var params=new URLSearchParams(String(extra||'').replace(/^&/,''));
    params.set('governed','1');
    return '?'+params.toString();
  }
  function riskLabel(entry){
    function tc(s){ return String(s||'').replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}); }
    return tc(entry.riskKind||'general')+' · '+tc(entry.riskLevel||'low')+' risk';
  }
  /* Pure function of (GOVERNANCE, item) — no contentEl/DOM dependency, so it is safe to
     call speculatively (e.g. before GOVERNANCE has resolved) and to slice+execute in tests.
     Warning prose comes only from the entry above — never from buildTpl's unrelated,
     pre-existing per-page metadata chip (a different, non-governance concept). */
  function renderGovernanceNotice(item){
    var entry=(GOVERNANCE.status==='ready'&&item)?GOVERNANCE.items[item.f]:null;
    if(!entry){
      return '<div class="governance-notice unavailable">Review status unavailable—verify with faculty</div>';
    }
    if(entry.status==='pending'&&entry.riskLevel==='high'){
      return '<section class="governance-notice pending-high" role="alert" tabindex="-1">'
        +'<strong class="governance-title">Pending faculty review</strong>'
        +'<span class="governance-risk">'+esc(riskLabel(entry))+'</span>'
        +'<p>'+esc(entry.warning||entry.reason||'Faculty review is pending.')+'</p>'
        +(entry.reason?'<p>'+esc(entry.reason)+'</p>':'')
        +'<button type="button" class="pgfb-b">Feedback on this page →</button>'
        +'</section>';
    }
    if(entry.status==='pending'){
      return '<div class="governance-notice pending-compact" role="status">'
        +'<strong class="governance-title">Pending faculty review</strong>'
        +'<span class="governance-risk">'+esc(riskLabel(entry))+'</span>'
        +(entry.reason?'<span>'+esc(entry.reason)+'</span>':'')
        +'</div>';
    }
    return '<div class="governance-notice reviewed-receipt">Reviewed by '+esc(entry.reviewer||'faculty')+(entry.reviewedAt?(' · '+esc(entry.reviewedAt)):'')+'</div>';
  }
  /* Nav/search rows carry only the compact {status,riskKind,riskLevel} triplet baked into
     nav.json/search-index.json at build time (Task 3) — independent of the GOVERNANCE fetch
     above, so no loading race here. Text conveys the full status; never color alone. */
  function governanceBadge(triplet){
    if(!triplet||triplet.status!=='pending')return '';
    var high=triplet.riskLevel==='high';
    var label=high?'Pending review · High risk':'Pending review';
    return '<span class="governance-badge'+(high?' high':'')+'" aria-label="'+label+'">'+label+'</span>';
  }
  /* Queries the #governanceNotice mount, not contentEl: the notice moved out of #content when the
     front door landed (see the mount's own comment in the body). Both readers of the rendered
     notice — this one and refreshGovernanceNotice below — were retargeted together; leaving either
     pointed at contentEl would make it silently find nothing and do nothing. */
  function governanceNoticeHost(){ return document.getElementById('governanceNotice'); }
  function focusPendingHighNotice(){
    var host=governanceNoticeHost();
    var notice=host&&host.querySelector('.governance-notice.pending-high');
    if(!notice)return false;
    try{ notice.focus(); }catch(_){ }
    return true;
  }
  /* Focus a high-risk warning after a normal route change only. Never during faculty-preview
     initialization (the console iframe owns focus there) or browser-history restoration —
     except to complete a navigation whose focus-take was deferred because GOVERNANCE had not
     resolved yet (see refreshGovernanceNotice's governanceFocusSlug check).

     ---- The announceRoute race, and how it is settled -----------------------------------------
     Task 5 left this function unwired because restoring the deleted call AT THE DELETED POSITION
     would have lost a race it used to win. In the deleted shell, show() announced and then focused
     in the same breath. In the front door the two are separated: fdApply renders, THEN announces
     (announceRoute moves focus to #content), THEN decides focus in fdFocusAfterRender. Called from
     the old position — inside the render — this would run BEFORE announceRoute and be silently
     overwritten by it.

     They are not in conflict; they are in ORDER, and the order is: announceRoute first, this
     second. The single call site is fd_wire.js's fdFocusAfterRender, in the `routed` branch —
     which is the one place the shell has already agreed decides post-render focus, so there is
     still exactly one such decision point and no branch can fight another.

     announceRoute WINS on two paths, deliberately:
       - BOOT. announceRoute skips its own focus move on the first render, and this is not called
         there either. It does not need to be: #governanceNotice precedes #content in the document,
         so on a cold load the notice is already the first thing in reading order. Focusing it
         would move focus to where the user is standing anyway.
       - POPSTATE. It re-announces but never calls fdFocusAfterRender, which is the structural form
         of this function's own fromHistory guard: a back press restores a page, it does not
         re-raise its warning.
     What is left is the case the focus move exists for — a route change the student just made,
     where announceRoute has moved them INTO #content and PAST the notice. */
  function focusGovernanceNotice(opts){
    if(facultyPreviewRequest)return;
    if(opts&&opts.fromHistory)return;
    if(focusPendingHighNotice()){ governanceFocusSlug=''; }
    else if(GOVERNANCE.status!=='ready'){ governanceFocusSlug=currentItem&&currentItem.f; }
    else{ governanceFocusSlug=''; }
  }
  /* Runs once, when governance.json settles (see the fetch below) — surgically swaps just the
     existing .governance-notice element for a freshly rendered one. Deliberately NOT a full
     show() replay: that would refetch page content (flicker) or, worse, recreate the tool
     iframe and discard any in-progress state inside it. Content refreshes even during a
     faculty preview (so a slow fetch does not leave "unavailable" showing indefinitely); only
     the focus-take is skipped there. */
  function refreshGovernanceNotice(){
    if(!currentItem||currentItem.k==='special')return;
    var host=governanceNoticeHost();
    var el=host&&host.querySelector('.governance-notice');
    if(!el)return;
    var wrap=document.createElement('div'); wrap.innerHTML=renderGovernanceNotice(currentItem);
    if(!wrap.firstChild)return;
    el.parentNode.replaceChild(wrap.firstChild,el);
    if(!facultyPreviewRequest&&governanceFocusSlug===currentItem.f){
      governanceFocusSlug='';
      focusPendingHighNotice();
    }
  }
  function rerenderCurrent(){ refreshGovernanceNotice(); }
  /* ---- end governance notice ---- */
  function readFacultyPreviewRequest(){
    var sp=new URLSearchParams(location.search);
    var pageValues=sp.getAll('page'), toolValues=sp.getAll('tool');
    var reviewItemValues=sp.getAll('reviewItem');
    var page=pageValues[0]||'', tool=toolValues[0]||'';
    var reviewItem=reviewItemValues[0]||'';
    var reviewKey=sp.get('reviewKey')||'';
    var reviewToken=sp.get('reviewToken')||'';
    var protocolKeys=['reviewKey','reviewToken'];
    for(var i=0;i<protocolKeys.length;i++){
      if(sp.getAll(protocolKeys[i]).length!==1)return null;
    }
    if(!/^[0-9a-f]{32}$/.test(reviewToken))return null;
    if(page&&pageValues.length===1&&toolValues.length===0&&reviewItemValues.length===0
        &&reviewKey==='page:'+page){
      return Object.freeze({surface:'page',reviewKey:reviewKey,reviewToken:reviewToken});
    }
    if(tool&&toolValues.length===1&&pageValues.length===0&&reviewItemValues.length===0
        &&reviewKey==='tool:'+tool){
      return Object.freeze({surface:'tool',reviewKey:reviewKey,reviewToken:reviewToken});
    }
    if(tool==='question-bank-practice.html'&&toolValues.length===1
        &&pageValues.length===0&&reviewItem&&reviewItemValues.length===1
        &&reviewKey==='question:'+reviewItem){
      return Object.freeze({
        surface:'question',reviewItem:reviewItem,
        reviewKey:reviewKey,reviewToken:reviewToken
      });
    }
    return null;
  }
  var facultyPreviewRequest=readFacultyPreviewRequest();
  /* Service-worker registration (SW_REGISTER) goes here, not up by the theme/banner boot
     code: this script has no wrapping IIFE, so facultyPreviewRequest — declared with `var`
     right above — reads as `undefined` (not a ReferenceError, but not the real value either)
     at any earlier point in this same script. This is the first point after its assignment,
     which keeps registration as early in the boot sequence as the guard allows. */
  /*__SW_REGISTER__*/
  var facultyPreviewRouteBase=location.pathname+location.search;
  var facultyPreviewRoute=facultyPreviewRouteBase+location.hash;
  var facultyPreviewLastStatus='';
  var currentToolFrame=null;
  function postFacultyPreviewStatus(status,surface){
    if(!facultyPreviewRequest)return;
    if(['ready','not_found','error'].indexOf(status)<0)return;
    if(surface!==facultyPreviewRequest.surface)return;
    if(facultyPreviewLastStatus==='not_found'||facultyPreviewLastStatus==='error')return;
    if(status===facultyPreviewLastStatus)return;
    facultyPreviewLastStatus=status;
    window.parent.postMessage({
      type:'faculty-preview-status',
      reviewKey:facultyPreviewRequest.reviewKey,
      reviewToken:facultyPreviewRequest.reviewToken,
      status:status,
      surface:surface
    },'*');
  }
  function exactQuestionSuffixMatches(extra){
    if(!facultyPreviewRequest||facultyPreviewRequest.surface!=='question')return false;
    var sp=new URLSearchParams(String(extra||'').replace(/^&/,''));
    if(Array.from(sp.keys()).sort().join(',')!=='reviewItem,reviewKey,reviewToken')return false;
    return sp.getAll('reviewItem').length===1
      &&sp.getAll('reviewKey').length===1
      &&sp.getAll('reviewToken').length===1
      &&sp.get('reviewItem')===facultyPreviewRequest.reviewItem
      &&sp.get('reviewKey')===facultyPreviewRequest.reviewKey
      &&sp.get('reviewToken')===facultyPreviewRequest.reviewToken;
  }
  function facultyPreviewMatchesItem(item,opts){
    if(!facultyPreviewRequest||!item)return true;
    if(facultyPreviewRequest.surface==='page'){
      return item.k==='md'&&facultyPreviewRequest.reviewKey==='page:'+item.f;
    }
    if(facultyPreviewRequest.surface==='tool'){
      return item.k==='tool'&&facultyPreviewRequest.reviewKey==='tool:'+item.f;
    }
    return facultyPreviewRequest.surface==='question'
      &&item.k==='tool'&&item.f==='question-bank-practice.html'
      &&exactQuestionSuffixMatches(opts&&opts.toolExtra);
  }
  function restoreFacultyPreviewRoute(){
    if(!facultyPreviewRequest||location.pathname+location.search===facultyPreviewRouteBase)return;
    try{history.replaceState({f:currentItem&&currentItem.f},'',facultyPreviewRoute);}catch(_){}
  }
  function showFacultyPreviewLockNotice(){
    if(!facultyPreviewRequest)return;
    var notice=document.getElementById('faculty-preview-lock-notice');
    if(!notice){
      notice=document.createElement('div'); notice.id='faculty-preview-lock-notice';
      notice.className='banner'; notice.setAttribute('role','status');
      contentEl.parentNode.insertBefore(notice,contentEl);
    }
    notice.textContent='Open the full page from the faculty console to navigate elsewhere';
    restoreFacultyPreviewRoute();
  }
  document.addEventListener('click',function(ev){
    if(!facultyPreviewRequest)return;
    var link=ev.target.closest?ev.target.closest('a[href]'):null;
    if(!link)return;
    var target;
    try{target=new URL(link.getAttribute('href')||'',location.href);}catch(_){return;}
    if(target.origin!==location.origin||target.pathname!==location.pathname)return;
    if(!target.searchParams.has('page')&&!target.searchParams.has('tool'))return;
    ev.preventDefault(); ev.stopPropagation(); showFacultyPreviewLockNotice();
  },true);
  function pageTitle(it){ return it ? (it.t+' \u2014 MS3 Psychiatry Clerkship') : 'Inpatient Psychiatry \u2014 MS3 Clerkship'; }
  var routeAnnounced=false;
  function announceRoute(item){
    var rs=document.getElementById('routeStatus');
    if(rs){ rs.textContent=!item?'':((item.f==='__home__'?'Today':(item.f==='__progress__'?'Progress':(item.f==='__start__'?'Start here':(item.f==='__path__'?'Learning Path':item.t))))+' loaded'); }
    // Skip the focus move on the very first render so initial keyboard position
    // (nav/search) is not stolen; announce-only is correct for page load.
    if(routeAnnounced){ try{ contentEl.focus({preventScroll:true}); }catch(_){ try{ contentEl.focus(); }catch(__){ } } }
    routeAnnounced=true;
  }
  function setRoute(it, replace, opts){ if(facultyPreviewRequest){restoreFacultyPreviewRoute();document.title=pageTitle(it);return;} var extra=(it&&it.k==='tool'&&opts&&opts.toolExtra)?opts.toolExtra:''; var q = it ? ((it.k==='tool'?'?tool=':'?page=')+encodeURIComponent(it.f)+extra) : location.pathname; try{ if(replace) history.replaceState({f:it&&it.f},'',q); else if(location.search!==q) history.pushState({f:it&&it.f},'',q); }catch(_){ } document.title=pageTitle(it); }
  /* ---- faculty-console preview: the tool surface ----
     Both functions below are RETARGETED from contentEl to the #fdTool mount (Plan 3 Task 5).
     #content now holds the front door's own header and tab row, so overwriting it would delete
