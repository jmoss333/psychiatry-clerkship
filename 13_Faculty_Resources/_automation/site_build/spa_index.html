     question-bank-practice.html, where tests/sess-capsule.test.mjs pins both its behaviour and its
     wiring. tests/resume-card.test.mjs, which existed only for this consumer, went with it. */

  /* ---- calib panel ---- */
  /* Metacognition panel (phase 1): swaps in for the legacy calibrationSummary() card on
     renderProgress once there's enough ledger history (>=20 cw_calib_v1 qb events) to be more
     informative than the current-state summary above it. Below threshold, renderProgress falls
     back to calibrationSummary() unchanged — see the caller. Counts here read the FULL
     history ledger (calibRead()), not the single-record-per-item cw_qb_v1 snapshot, EXCEPT
     for the confidently-wrong count, which intentionally reads cw_qb_v1 — same predicate as
     question-bank-practice.html's certWrongItems() (certWrong===true). Retired-item parity
     with certWrongItems() (which filters through activeItems()) is closed via the
     build-injected RETIRED_QB_IDS — both counters skip since-retired records. */
  function renderCalibPanel(){
    var ledger=(typeof calibRead==='function')?calibRead():{qb:[],rev:[]};
    var qbEvents=ledger.qb||[];
    if(qbEvents.length<20) return '';
    var LVL=[['certain','Certain'],['likely','Likely'],['guess','Guess']];
    var bins={guess:{n:0,correct:0},likely:{n:0,correct:0},certain:{n:0,correct:0}};
    qbEvents.forEach(function(ev){ if(!ev||ev.re!==0||!bins[ev.p])return; bins[ev.p].n++; if(ev.a===1)bins[ev.p].correct++; });
    var barsHtml='';
    LVL.forEach(function(pair){ var b=bins[pair[0]]; if(b.n<5)return; var acc=Math.round(100*b.correct/b.n); barsHtml+='<div class="brow"><span class="lab">'+pair[1]+'</span><span class="track"><span class="fill" style="width:'+acc+'%"></span></span><span class="pc">'+acc+'% · '+b.n+'</span></div>'; });
    var h='<div class="hm-sec"><h2>Confidence calibration <span style="font-weight:400;color:var(--text-light)">· are you right when you feel sure?</span></h2>';
    h+='<div class="sub" style="margin:0 0 8px">Counts every attempt, not just your latest — numbers may differ from the earlier summary.</div>';
    if(barsHtml){ h+='<div class="hm-bars">'+barsHtml+'</div>'; }
    else{ h+='<div class="sub" style="margin:0 0 8px">Not enough attempts yet at any one confidence level to show bars — keep practicing.</div>'; }
    var qbv1={}; try{ qbv1=JSON.parse(localStorage.getItem('cw_qb_v1')||'{}')||{}; }catch(_){ qbv1={}; }
    var certWrong=0; Object.keys(qbv1).forEach(function(id){ var r=qbv1[id]; if(isRetiredQb(id))return; if(r&&r.certWrong===true)certWrong++; });
    if(certWrong>0){
      h+='<div class="sub" style="margin:8px 0 0">You were <strong>confidently wrong</strong> on '+certWrong+' item'+(certWrong===1?'':'s')+' — those are the highest-yield to revisit.</div>';
      h+='<button class="hm-li" data-f="question-bank-practice.html" style="border-bottom:none"><span class="t">Practice your confidently-wrong items</span><span class="sec">Practice →</span></button>';
    }
    var revEvents=ledger.rev||[], seenIdDay={};
    revEvents.forEach(function(ev){ if(ev&&ev.sug==='Again'&&ev.p!=='Again'){ var day=new Date(ev.ts).toDateString(); seenIdDay[ev.id+'|'+day]=1; } });
    var divergeCount=Object.keys(seenIdDay).length;
    if(divergeCount>0){ h+='<div class="sub" style="margin:8px 0 0">You graded yourself higher than the app suggested on '+divergeCount+' card'+(divergeCount===1?'':'s')+' flagged <strong>Again</strong> — worth a second look.</div>'; }
    h+='</div>';
    return h;
  }
  /* ---- end calib panel ---- */

  /* "Mon Aug 10 · Week 2 · Ward" — the Today header context stamp (design 2a). Week is
     COMPUTED from cw_rotation_start (a date, set on Start-here) so it advances on its own;
     the legacy static cw_start_week pick is honored as a fallback for learners who set it
     before the date field existed (that key no longer has a writer). Sentinels: 0 = date set
     but rotation not started yet, 7 = past week 6 — both suppress the Week part rather than
     falling back to a stale static pick. */
  function rotationWeek(){
    /* Date parsing goes through the injected shelfDaysUntil() — the one legal local-midnight
       parse site (the phase-chip contract bans inline midnight-suffix date parses here).
       For a past start date, -shelfDaysUntil(start) is exactly the full days elapsed. */
    if(typeof shelfDaysUntil!=='function')return null;
    var du=shelfDaysUntil(LS('cw_rotation_start')||'');
    if(du==null)return null;
    if(du>0)return 0;
    var wk=Math.floor(-du/7)+1; return wk<=6?wk:7;
  }
  /* ---- Front door: build-injected data + pure renderer modules (Plan 3 Task 1) ----
     Nothing below calls into this yet -- Task 3 wires it into rendering. The five
     literals are needles build_deploy.py replaces with real JSON (verified-replacement:
     a missing/duplicated needle aborts the build rather than shipping an empty page).
     Marker ORDER is load-bearing and pinned by tests/fd-inject.test.mjs: fd_state calls
     localDayIndex from the PHASE_POLICY snippet above, and fd_path/fd_reader call
     fdTodayProgress/fdRow from fd_today -- each module's own unit suite concatenates its
     own dependencies, so no other test sees a wrong page order. */
  var FD_CURRICULUM={};
  var FD_TOPIC_META={};
  /* communication_cases.json — the 12 spoken-drill cases, id -> title. Injected rather than
     fetched because the reader needs a drill's TITLE at first paint; a fetch would render 51
     topics' drill links as raw ids until it landed. Audience-neutral: one file, both sites, so
     resident_section.py has no needle to swap for it. */
  var FD_COMMUNICATION_CASES={};
  var FD_TOOL_REGISTRY={};
  var FD_SITE_MANIFEST={};
  var FD_ROLES=[];

  /*__FD_STATE__*/

  /*__FD_DATA__*/

  /*__FD_DUE__*/

  /*__FD_TODAY__*/

  /*__FD_SHELL__*/

  /*__FD_PATH__*/

  /*__FD_LIBRARY__*/

  /*__FD_READER__*/

  /*__FD_SEARCH__*/

  /*__FD_SHEET__*/

  /*__FD_WIRE__*/

  /* ---- front door render ---- */
  /* The whole page body from state, as one string. Each surface is independently guarded: an
     unguarded throw in the old renderHome() blanked the entire page rather than one region, and
     spec §6 makes that isolation a requirement rather than a nicety. A failed surface renders a
     minimal fallback and leaves the header and tabs usable.

     The fallback copy depends on WHERE the failure happened, because "use another tab" is only
     true when there are tabs. The first-run wizard renders no header and no tab row, so a student
     hitting a failure there has an otherwise empty page — pointing them at chrome that is not on
     screen is worse than saying nothing. */
  function fdFallbackHtml(name){
    var text=(String(name).indexOf('setup')===0)
      ? 'Setup could not load. Reload the page to try again.'
      : 'This section could not load. Try reloading, or use another tab.';
    return '<div class="fd-fallback">'+text+'</div>';
  }
  /* `name` is what makes a swallowed failure findable. Without the warn, a surface that throws is
     invisible in development — the page just quietly shows a placeholder — which is exactly when
     you want to see it. Costs nothing in production and is wrapped because a console-less host
     (or a page that has shimmed it away) must not turn a degraded surface into a hard failure. */
  function fdSurface(name, fn){
    try{ return fn(); }
    catch(e){
      try{
        if(typeof console!=='undefined'&&console.warn){
          console.warn('front door: the "'+name+'" surface failed to render', e);
        }
      }catch(_){ }
      return fdFallbackHtml(name);
    }
  }

  /* The crisis-contact block, rendered at build time from crisis_resources.json into the
     #fdCrisisSource <template> (crisis_block.py; the build ABORTS if the marker is gone). Read
     once and cached: it is static markup that cannot change at runtime, and fdSheet is called on
     every render. '' when the template is absent — which cannot happen in a built site, because
     the marker is asserted twice during the build, but a renderer must not throw over a missing
     element either way.

     A getter rather than a global initialised at parse time: this script runs in <body>, but so
     does the template, and reading the DOM lazily removes any dependence on which of the two the
     parser reached first. */
  var FD_CRISIS_HTML=null;
  function fdCrisisHtml(){
    if(FD_CRISIS_HTML===null){
      var host=null;
      try{ host=document.getElementById('fdCrisisSource'); }catch(_){ }
      FD_CRISIS_HTML=host?String(host.innerHTML||''):'';
    }
    return FD_CRISIS_HTML;
  }

  /* fdBuildIndex joins curriculum -> topic_meta -> tool_registry -> site_manifest. Memoised
     because it is pure over build-injected data that cannot change at runtime, and it walks every
     shipped page — rebuilding it on each re-render would put that walk in the keystroke path. */
  var FD_INDEX_CACHE=null;
  function fdIndex(){
    if(!FD_INDEX_CACHE){
      FD_INDEX_CACHE=fdBuildIndex(FD_CURRICULUM, FD_TOPIC_META, FD_TOOL_REGISTRY, FD_SITE_MANIFEST,
        FD_COMMUNICATION_CASES);
    }
    return FD_INDEX_CACHE;
  }

  /* Setup step 2 shows the chosen role's display NAME. fd_shell.js renders it but deliberately
     does not know curriculum.json's role list (fd_shell.js:96) — resolving it is the caller's. */
  function fdRoleName(id){
    var list=FD_ROLES||[];
    for(var i=0;i<list.length;i++){ if(list[i]&&list[i].id===id) return list[i].name; }
    return '';
  }

  /* Writes only when the markup actually changed. An unconditional innerHTML assignment on a
     closed overlay rebuilds an empty div on every render; on an OPEN one it would destroy and
     recreate the search input mid-keystroke, taking focus and caret with it. */
  function fdMount(id, html){
    var el=document.getElementById(id);
    if(el && el.innerHTML!==html) el.innerHTML=html;
  }

  /* ---- tool surface ----
     22 interactive tools reach the learner ONLY through this, plus every cta[] deep link in
     topic_meta.json. The contract below is transcribed from the tool branch of the deleted
     show() (spa_index.html @098ad50:1127-1136), not reinvented:

       contentEl.innerHTML = <the governance notice>
         + '<iframe class="toolframe" src="tools/'+item.f
         + esc(<the GOVERNED suffix helper, over opts.toolExtra>)
         + '" title="'+esc(item.t)+'"></iframe>';

     (The two helper calls are named rather than quoted verbatim: tests/surface-governance-ui.test.mjs
     counts occurrences of those exact expressions to prove BOTH iframe paths route through the
     governed helper, and a comment reproducing one would inflate the count to three and make the
     assertion unfalsifiable — the same cannot-fail shape this plan has now hit six times.)

     Preserved verbatim: the governance notice ABOVE the frame; `tools/`+the raw slug (not
     encodeURIComponent — the preflight path in loadFacultyPreviewTool encodes, the plain src
     never did, and a slug is [a-z0-9._-] either way); the query suffix routed through the
     GOVERNED helper so the tool's own status block defers to the shell's notice; esc() on both
     the suffix and the title.

     Changed, with reasons: the frame moved out of #content into its own mount (see the #fdTool
     comment in the body — an iframe re-inserted by a re-render reloads, taking the tool's
     in-progress state with it), and the class became .fd-toolframe so frontdoor.css owns the
     sizing that #content.toolmode used to.

     *** THE QUERY SUFFIX IS THE PART THAT LOOKS OPTIONAL AND IS NOT. *** &case=, &scenario= and
     &resume=1 are what make communicationHref()/familyAction()'s "practice this exact case"
     links land on that case rather than the tool's front page. Dropping them breaks those links
     with no error: the tool opens, at the wrong place. FD_TOOL_EXTRA is captured once at boot
     (it is the only point at which the original address is still known) and is replayed onto the
     ref the link named and no other — carrying one tool's arguments into another tool would be
     worse than dropping them. */
  function fdToolOpts(ref){
    return (FD_TOOL_EXTRA&&FD_TOOL_EXTRA_REF===ref)?{toolExtra:FD_TOOL_EXTRA}:undefined;
  }
  function fdToolFrameHtml(item, opts){
    return '<iframe class="fd-toolframe" src="tools/'+item.f
      +esc(toolFrameSuffixWithGovernance(opts&&opts.toolExtra))
      +'" title="'+esc(item.t)+'"></iframe>';
  }
  /* Written only when the OPEN TOOL changes. Everything else that re-renders the page (the theme
     toggle, a ward capture being saved, the nudge timing out) leaves the frame alone, which is
     the whole reason it lives outside #content. '' when no tool is open, which also removes a
     closed tool's frame rather than leaving it running behind the next surface. */
  var FD_TOOL_MOUNTED='';
  function fdToolSync(item){
    var ref=item?item.f:'';
    if(FD_TOOL_MOUNTED===ref) return;
    FD_TOOL_MOUNTED=ref;
    currentToolFrame=null;
    if(!ref){ fdMount('fdTool',''); return; }
    /* A faculty preview does NOT get the plain frame: the console waits on a
       'faculty-preview-status' message that only the preflight path posts, so a plain iframe
       here would leave the reviewer's console spinning on a tool that had in fact loaded.
       currentItem is set here rather than left to fdRoute() because at BOOT the first render
       runs before fdRoute does, and loadFacultyPreviewTool's async guard reads it. */
    var opts=fdToolOpts(ref);
    if(facultyPreviewRequest){
      currentItem=item;
      fdMount('fdTool', skel());
      loadFacultyPreviewTool(item, opts);
      return;
    }
    fdMount('fdTool', fdToolFrameHtml(item, opts));
  }
  /* ---- end tool surface ---- */

  /* ---- Progress & mastery ----
     Spec §1: "Port, demoted — a reading-pane page, not a fourth tab". Routed as an open item
     (?page=__progress__, k:'special' — see FD_REF_PROGRESS in fd_wire.js) and reached from the
     foot of Today.

     *** DELIBERATELY NOT A frontdoor/ MODULE. *** Every other surface is a pure function of the
     build-injected index; this one is a composition of DERIVATIONS over four learner stores
     (cw_qb_v1, cw_quiz_v1, cw_srs_v1, cw_calib_v1) through masteryByBlueprint(),
     calibrationSummary() and renderCalibPanel(), all of which already live in this script and
     read storage themselves. Extracting a pure shell around them would mean either a second
     snippet marker (the plan budgets one for fd_due.js) or hoisting three impure helpers into a
     module that must not have them. It is guarded by fdSurface() like every other surface, so a
     throw in here still leaves the header, the tabs and the tool frame usable.

     What did NOT survive the swap, and is not resurrected here: the pretest/placement flow, the
     stored 6-week plan, and the section/high-yield coverage scans. All of them read navScan() /
     WEEK_MAP / buildPlan(), which Task 3 deleted with the sidebar-era shell; the curriculum index
     is now the source of week structure and re-deriving a parallel one would be the second source
     spec §2.2 exists to prevent. tests/mastery-weakflag.test.mjs still slices buildPlan() and is
     on the plan's expected-failure list for Task 8.

     Copy rule: this page ships to BOTH sites unrebranded, so the old "for the clerkship study"
     wording is reworded rather than ported — "clerkship" is on shell-copy.test.mjs's banned
     list. Same reason "shelf" is "exam" throughout. */
  function fdProgressBars(rows){
    var out='<div class="fd-bars">';
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var pct=(r.score==null)?0:r.score;
      var label=(r.score==null)?'not started':(r.score+'%'+(r.conf==='low'?' · few':''));
      out+='<div class="fd-bar">'+
        '<span class="fd-bar__label">'+fdEsc(r.label)+'</span>'+
        '<span class="fd-bar__track"><span class="fd-bar__fill" style="width:'+pct+'%"></span></span>'+
        '<span class="fd-bar__value">'+fdEsc(label)+'</span>'+
        '</div>';
    }
    return out+'</div>';
  }
  /* Weakest first, and only where a wrong answer actually happened: masteryByBlueprint()'s own
     comment explains why miss>0 is required — a perfect 1/1 shrinks to 63%, which would otherwise
     flag every category weak after a single correct answer in each. */
  function fdProgressWeak(rows){
    var weak=[], i;
    for(i=0;i<rows.length;i++){
      if(rows[i].score!=null&&rows[i].score<70&&rows[i].miss>0) weak.push(rows[i]);
    }
    weak.sort(function(a,b){ return a.score-b.score; });
    weak=weak.slice(0,3);
    if(!weak.length) return '';
    var out='<h2 class="fd-sectionhead">Practice your weakest areas</h2><div class="fd-list">';
    for(i=0;i<weak.length;i++){
      out+='<button type="button" class="fd-progressrow" data-fd-practice="'+fdEsc(weak[i].c)+'">'+
        '<span class="fd-progressrow__title">'+fdEsc(weak[i].label)+'</span>'+
        '<span class="fd-progressrow__meta">'+weak[i].score+'% · practice →</span>'+
        '</button>';
    }
    return out+'</div>';
  }
  function fdProgressCoverage(idx, done){
    var total=0, marked=0, ref;
    for(ref in (idx.byRef||{})){ total++; if(done[ref]) marked++; }
    if(!total) return '';
    return '<p class="fd-progress__coverage">'+marked+' of '+total+
      ' shipped pages and tools marked done.</p>';
  }
  function fdProgress(idx, state){
    var st=state||{}, done=st.done||{};
    var rows=masteryByBlueprint();
    var started=false, i;
    for(i=0;i<rows.length;i++){ if(rows[i].score!=null){ started=true; break; } }

    var out='<div class="fd-progress">';
    out+=fdReaderBackButton(fdReaderBackLabel(st.fromTab));
    out+='<h1 class="fd-h1">Progress</h1>';
    out+='<p class="fd-sub">From your activity on this device — pages marked done, practice '+
      'answers, and confidence. Nothing leaves this browser unless you export it below.</p>';
    out+=fdProgressCoverage(idx, done);

    out+='<h2 class="fd-sectionhead">Mastery by exam-blueprint area</h2>';
    if(!started){
      out+='<p class="fd-progress__empty">Answer practice questions (or a topic quiz) and this '+
        'fills in — one bar per blueprint area.</p>';
    }
    out+=fdProgressBars(rows);
    out+=fdProgressWeak(rows);

    /* The metacognition panel when the ledger is deep enough, the current-state summary when it
       is not — the same threshold and the same defensive typeof guard the deleted renderProgress
       used, because renderCalibPanel() returns '' below 20 recorded question-bank events. */
    var calPanel=(typeof renderCalibPanel==='function')?renderCalibPanel():'';
    if(calPanel){ out+=calPanel; }
    else {
      var cal=calibrationSummary();
      if(cal.total>=1){
        var levels=[['certain','Certain'],['likely','Likely'],['guess','Guess']];
        var calRows=[];
        for(i=0;i<levels.length;i++){
          var e=cal.lv[levels[i][0]];
          calRows.push({ label:levels[i][1], score:e.n?Math.round(100*e.correct/e.n):null,
                         conf:e.n?'solid':'none', miss:0, c:levels[i][0] });
        }
        out+='<h2 class="fd-sectionhead">Confidence calibration</h2>';
        out+=fdProgressBars(calRows);
        if(cal.certWrong>0){
          out+='<p class="fd-progress__note">You were <strong>confidently wrong</strong> on '+
            cal.certWrong+' item'+(cal.certWrong===1?'':'s')+' — those are the highest-yield to '+
            'revisit.</p>';
        }
      }
    }

    /* *** THE ONLY WRITER OF cw_shelf_date. *** fdExamCountdown() (fd_state.js) and phasePolicy()
       (phase_policy.js) both prefer this date over their rotation-grid fallback, and its only
       previous setter was the date field on the Start-here screen Task 3 deleted — so between
       that deletion and this field the countdown ran on the fallback permanently, silently, with
       no test failing. It is here rather than in the first-run wizard because the wizard is seen
       once and an exam date is the thing most likely to be learned later or changed.

       There is deliberately NO rotation-START field beside it, even though the deleted screen had
       one. cw_rotation_start is written only by fdSetRotationWeek(), which snaps to the Monday of
       the chosen week; fd_state.js:50-54 records that a non-Monday value makes the exam countdown
       drift upward as time passes. A free date input would let exactly that be typed in. */
    out+='<h2 class="fd-sectionhead">Your exam date</h2>';
    out+='<p class="fd-progress__note">Optional. Set it and the countdown on Today counts to your '+
      'date instead of the end of the rotation grid.</p>';
    /* id and attribute are spelled "exam", not "shelf": tests/shell-copy.test.mjs bans "shelf"
       from copy that ships to both sites unrebranded, and an id attribute is rendered text like
       any other. The STORE key stays cw_shelf_date — phasePolicy() and fdExamCountdown() both
       read it and a key is not copy. */
    out+='<p class="fd-progress__field"><label for="fdExamDate">Exam date</label>'+
      '<input id="fdExamDate" type="date" data-fd-examdate value="'+fdEsc(st.examDate||'')+'"></p>';

    out+='<h2 class="fd-sectionhead">Help evaluate this site</h2>';
    out+='<p class="fd-progress__note">Optional. Export your anonymous learning activity for the '+
      'teaching-evaluation study — no name and no patient information, only what you reviewed and '+
      'answered on this site.</p>';
    out+='<button type="button" class="fd-btn fd-btn--ghost" data-fd-studyexport>'+
      'Export my anonymous progress</button>';
    out+='<p class="fd-progress__note" id="studyMsg"></p>';

    /* The A2HS instruction. Its only home was the deleted Start-here screen; it lands here rather
       than in the wizard for the same reason the exam date does — the wizard is a transition seen
       once, and "how do I keep this working on the ward with no signal" is a question that occurs
       later. Copy is byte-identical to the deleted line (tests/shell-copy.test.mjs extracts it as
       shared shell copy; the ANCHOR moved from <p class="sub st-a2hs"> to .fd-a2hs and Task 8
       repoints the extractor). */
    out+='<p class="fd-a2hs">On iPhone: Share ⬆ → Add to Home Screen keeps this site working offline.</p>';
    out+='</div>';
    return out;
  }
  /* ---- end Progress & mastery ---- */

  function fdRender(state){
    var st=state||{};
    /* An unusable index means curriculum.json itself is broken, which the build is supposed to
       make impossible (spec §6: a ref to an unshipped slug fails the build). Degrade to an empty
       index rather than throw: each surface then renders its own empty state and the header and
       tab row still work, which is the same isolation rule applied one level up. */
    var idx;
    try{ idx=fdIndex(); }catch(e){ idx={byRef:{}, weeks:[], columns:[], kit:[]}; }

    /* The wizard is a TRANSITION, not a place, so it is gated on an explicit step (st.setup,
       session-only, owned by fd_wire.js) rather than on "no week is set".

       Gating step 2 on `week==null` — which is what this branch did before the wiring existed —
       made two shipped affordances unreachable. The wizard's own "Not on rotation — just browse"
       tile deliberately sets NO week, so it re-entered step 2 forever; and the header week pill
       (data-fd-change-week) could never show step 2 at all for a student who already had a week.
       Role is the setup-complete marker, exactly as it is in the prototype: a student with a role
       and no week lands in the app, where fd_today.js's "30-second setup" card asks the same
       question in a place they can ignore. */
    /* One vocabulary for "what kind of thing is open": fdRouteItem() (fd_wire.js) is what
       setRoute/pageTitle/announceRoute/capCtx already read, and it is memoised, so asking it is
       cheap and cannot disagree with the route it produced. */
    var openRoute=st.openId?fdRouteItem(st.openId):null;

    /* Which screen is up, decided ONCE, because two things downstream depend on the answer and
       getting them out of step is invisible:

       (1) *** THE WIZARD IS SKIPPED ON A FACULTY-PREVIEW ROUTE. *** A reviewer's frame carries no
           cw_frontdoor_v1, so `!st.role` is true there for every preview — and the console would
           be shown the first-run role picker instead of the page or tool under review, with a
           'ready' status posted for it. A reviewer is not setting up a rotation; setup is a
           learner transition and a preview is not a learner session. Found by driving the page.
       (2) The tool frame must not mount BEHIND the wizard. It lives outside #content, so the
           wizard's full-viewport screen does not cover it — it sits underneath, stealing flex
           height from the screen the student is supposed to be reading, and loading a tool
           nobody asked for. */
    var wizard='';
    if(!facultyPreviewRequest){
      if(!st.role||st.setup==='role') wizard='role';
      else if(st.setup==='week') wizard='week';
    }
    var openTool=(!wizard&&openRoute&&openRoute.k==='tool')?openRoute:null;

    var body;
    if(wizard==='role'){
      body=fdSurface('setup-role', function(){ return fdSetupRole(FD_ROLES); });
    } else if(wizard==='week'){
      body=fdSurface('setup-week', function(){ return fdSetupWeek(idx.weeks, fdRoleName(st.role)); });
    } else {
      body=fdSurface('header', function(){ return fdHeader(st); });
      body+=openTool?'<main class="fd-main fd-main--tool" id="fdMain">':'<main class="fd-main" id="fdMain">';
      if(openTool){
        /* Deliberately spare: a back link out of the frame and the review-status notice, nothing
           more. The tool renders its own title and its own controls inside the iframe, and the
           deleted show() put nothing but the notice above it either — a second <h1> outside the
           frame would duplicate the tool's own heading in the a11y tree. Marking a tool done is
           still reachable: its row on Today and Path carries the same .fd-check every read has. */
        body+=fdSurface('tool', function(){
          return '<div class="fd-toolpane">'+
            fdReaderBackButton(fdReaderBackLabel(st.fromTab))+
          '</div>';
        });
      } else if(openRoute&&openRoute.k==='special'){
        body+=fdSurface('progress', function(){ return fdProgress(idx, st); });
      } else if(st.openId){
        /* fdReader's state calls the open item `ref`; the persisted key is `openId` (FD_KEYS in
           fd_state.js). Mapped here, at one site, rather than letting two names for the same thing
           travel across the module boundary. */
        body+=fdSurface('reader', function(){
          return fdReader(idx, {ref:st.openId, week:st.week, fromTab:st.fromTab, done:st.done,
            quiz:st.quiz},
            (FD_BODY||{})[st.openId]||'');
        });
      } else if(st.tab==='path'){
        body+=fdSurface('path', function(){ return fdPath(idx, st); });
      } else if(st.tab==='library'){
        body+=fdSurface('library', function(){ return fdLibrary(idx); });
      } else {
        body+=fdSurface('today', function(){ return fdToday(idx, st); });
      }
      body+='</main>';
    }
    fdMount('content', body);

    /* ---- the review-status notice, for BOTH the page path and the tool path ------------------
       Task 5 rewired only the tool branch, which left the asymmetry this replaces: a tool showed
       its review status and a markdown page showed none at all — including a page whose ledger
       entry is `pending` at `high` risk, where showing nothing is the one outcome the whole
       governance feature exists to prevent.

       ONE call site, not two. The deleted show() rendered its own copy in each branch, and the
       faculty-preview loader rendered a third; that is how three renderings of one compliance
       statement drift. What decides whether a notice appears is the ROUTE, not the surface: any
       open page or tool gets one, __progress__ (k:'special', a slug no ledger has ever heard of)
       and the bare tabs get none, and the wizard suppresses it because a first-run role picker is
       not a page under review.

       Written to its own mount rather than into `body` — see the mount's comment for the two
       reasons (survives a #content rebuild; role="alert" fires once per route, not once per
       click). The wrapper class is what gives it the front door's own measure and gutters; the
       .governance-notice element inside is the pre-existing one refreshGovernanceNotice swaps in
       place when governance.json settles late. */
    var govItem=(!wizard&&openRoute&&openRoute.k!=='special')?openRoute:null;
    fdMount('governanceNotice', fdSurface('governance', function(){
      if(!govItem) return '';
      return '<div class="fd-govnotice">'+renderGovernanceNotice(govItem)+'</div>';
    }));

    /* The tool frame, after #content so the back link and the notice above it already exist.
       Guarded like every other surface: a throw here (a broken index entry, a mount that is not
       in the document) must not take the header and tabs down with it. */
    fdSurface('toolframe', function(){ fdToolSync(openTool); return ''; });

    /* The three portalled overlays go to their own mounts, never into #content: they are
       position:fixed, and rebuilding them whenever the page behind them re-renders would drop the
       search input's focus and caret. Each renderer returns '' when its surface is closed. */
    fdMount('fdSheet', fdSurface('sheet', function(){
      return fdSheet(idx, FD_TOPIC_META, st, fdCrisisHtml());
    }));
    fdMount('fdSearch', fdSurface('search', function(){
      if(!st.searchOpen) return '';
      return fdSearchOverlay(idx, st.query||'', (FD_CURRICULUM&&FD_CURRICULUM.synonyms)||{}, st);
    }));
    fdMount('fdNudge', fdSurface('nudge', function(){
      if(!st.nudgeRef) return '';
      return fdNudge((idx.byRef||{})[st.nudgeRef]);
    }));

    return body;
  }
  /* ---- end front door render ---- */

  /* ---- front door boot ---- */
  /* State assembly, first paint, then wiring. The listeners themselves live in fd_wire.js (the
     delegated click, the keyboard map, the search panel's input, popstate); this block composes
     the state they read, captures the deep link's tool params, and calls fdWire() once at the
     end. The cw_theme toggle below is the exception that stays here: it predates the wiring and
     touches the document element rather than front-door state. */

  /* The reader's bodyHtml. marked is loaded in <head>; this is the only site that turns a shipped
     markdown page into HTML, and it is the same fetch-and-parse the deleted show() performed.
     Cached per ref, so re-opening a page (or re-rendering around it) never refetches; a failed
     fetch caches '' so a dead slug cannot spin. */
  var FD_BODY={}, FD_BODY_PENDING={};
  function fdFetchBody(ref, done){
    if(!ref || FD_BODY[ref]!==undefined || FD_BODY_PENDING[ref]) return;
    FD_BODY_PENDING[ref]=1;
    fetch('content/'+ref)
      .then(function(r){
        if(!r.ok){
          /* The status the faculty console is waiting for. The deleted show() posted it from its
             own md branch; this is the same fetch, so it is the same place. Without it a page
             preview reported nothing at all — the console spun on a page that had in fact loaded,
             and on one that did not exist alike. Found by driving a preview route. */
          var pageError=new Error('page unavailable');
          pageError.facultyPreviewStatus=(r.status===404)?'not_found':'error';
          throw pageError;
        }
        return r.text();
      })
      .then(function(txt){
        /* Same front-matter strip the old loader used: the Generated:/Audience: lines above the
           first H2 are build metadata, not prose the learner should read. */
        txt=(function(_t){
          var _i=_t.indexOf('\n## ');
          var _h=_i>-1?_t.slice(0,_i):_t;
          var _r=_i>-1?_t.slice(_i):'';
          return _h.replace(/^[ \t]*(Generated|Audience):.*$/gim,'').replace(/\n{3,}/g,'\n\n')+_r;
        })(txt);
        FD_BODY[ref]=marked.parse(txt);
        postFacultyPreviewStatus('ready','page');
      })
      .catch(function(err){
        FD_BODY[ref]='';
        postFacultyPreviewStatus((err&&err.facultyPreviewStatus)||'error','page');
      })
      .then(function(){ delete FD_BODY_PENDING[ref]; if(done) done(); });
  }

  /* cw_progress_v1 IS the front door's done map — fd_state.js deliberately persists no copy of it
     (two sources for one fact silently desync). Its values are {done:true,at:'YYYY-MM-DD'}
     records; the modules only test truthiness, but flattening to booleans here means no future
     record shape can accidentally read as done. */
  function fdDoneMap(){
    var p=progLoad(), out={}, k;
    for(k in p){ if(p[k]&&p[k].done) out[k]=true; }
    return out;
  }

  /* The Continue card's ring reads state.ringPct and nothing else supplies it — left unset it
     draws a 0% ring beside "5 of 7 done", which is a lie on the most-read line of the front door.
     This is the TRUE percentage, not the animated one: fdRingStep()'s 600ms sweep needs a partial
     DOM update (a full fdRender thirty-odd times over 600ms would rebuild #content on every frame
     and take focus with it), and no task in the plan owns that yet. */
  function fdWeekPct(st){
    if(typeof st.week!=='number'||isNaN(st.week)) return 0;
    try{ return fdTodayProgress(fdItemsForWeek(fdIndex(), st.week), st.done).pct; }
    catch(_){ return 0; }
  }

  /* State is composed from three sources on every render, never held in a fourth copy:
     the address bar and cw_frontdoor_v1 (through fdResolveState — spec §2.1's precedence rule,
     stated once, in fd_wire.js), the derived stores (cw_rotation_start, cw_progress_v1,
     cw_srs_v1), and FD_TRANSIENT for the session-only fields that are deliberately persisted
     nowhere. Recomposing rather than caching is what keeps a store written by another surface
     (the ward-capture sheet, the theme toggle, a second tab) from rendering stale. */
  function fdCurrentState(){
    var stored=fdLoad();
    var st=fdResolveState(location.href, stored);
    var s=srsState();
    /* Derived, never persisted: cw_rotation_start is the single source (see FD_KEYS in
       fd_state.js). null means no rotation date is stored, which every renderer already reads as
       "browsing, no week set". */
    st.week=rotationWeek();
    st.done=fdDoneMap();
    st.streak=(s&&s.stats&&s.stats.streak)||0;
    st.theme=document.documentElement.getAttribute('data-theme')||'light';
    st.nowMs=Date.now();
    /* Path opens on the student's own week until they browse elsewhere. */
    if(st.viewWeek===undefined) st.viewWeek=st.week;
    st.ringPct=fdWeekPct(st);
    /* The two runtime stores no pure renderer can reach (cw_srs_v1's due queue, cw_capture_v1's
       waiting questions), plus the exam date the Progress field edits. Read through fd_wire.js —
       see fdDueState/fdCaptureState/fdExamDate — so fd_due.js stays a pure function of what
       arrives here. `preview` is not a store: it is the faculty-preview flag, carried in state so
       fd_today.js can OMIT the capture control on a reviewer's route rather than render one the
       wiring then has to defend against (rule 1 of the two the deleted capWire enforced). */
    st.due=fdDueState();
    st.preview=!!facultyPreviewRequest;
    st.examDate=fdExamDate();
    for(var k in FD_TRANSIENT){ st[k]=FD_TRANSIENT[k]; }
    /* Last, and after the transients: fdCaptureState runs each capture through fdSearchResults,
       which reads state (its next-unread fallback). Composing it before the transients were
       merged would hand it a state missing them. */
    st.capture=fdCaptureState(st);
    return st;
  }

  /* Only a MARKDOWN ref has a body to fetch. Without the kind gate this fetched
     content/mse.html for every tool and content/__progress__ for the Progress page — a 404 per
     open, caught and cached as '', so nothing broke visibly and nothing failed a test; it just
     put a guaranteed-failing request on the critical path of half the site's content. */
  function fdRerender(){
    var st=fdCurrentState();
    if(st.openId&&fdRouteItem(st.openId).k==='md') fdFetchBody(st.openId, fdRerender);
    return fdRender(st);
  }
  /* specialRefresh() in the first script defers to this: the ward-capture store lives there and
     cannot see inside this IIFE. */
  window.__fdRerender=fdRerender;

  /* The cw_theme toggle. This REPLACES the listener that was bound to the sidebar's #themeBtn —
     same body, re-targeted, not new wiring. Delegated rather than element-bound because the
     control now lives in fdHeader() and the header is re-rendered on every state change, which
     would drop an element-bound listener on the first tab switch. Kept in this task rather than
     deferred with the rest of the event wiring because a toggle nothing can reach is precisely
     the regression it exists to prevent: all 21 clinical tools inherit data-theme through
     clinical-warm.css, and the pre-paint <head> script is the only other half of this pair. */
  document.addEventListener('click',function(ev){
    var btn=(ev.target&&ev.target.closest)?ev.target.closest('[data-fd-theme]'):null;
    if(!btn) return;
    var next=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('cw_theme',next); }catch(_){ }
    fdRerender();
  });

  /* TOPIC_META is handed the already-inlined FD_TOPIC_META instead of refetching topic_meta.json:
     the build inlines that same object into this page, so the old fetch pulled a second copy of a
     238 KB file over the wire on every cold load. The assignment reaches the first script's global
     because that is where the surviving ward-capture store reads it (topicHasQuiz). */
  try{ TOPIC_META=FD_TOPIC_META; srsDropPhantomTopics(); }catch(_){ }

  /* A deep link's extra params — &case=, &scenario=, &resume=1, all three shipped by
     communicationHref()/familyAction() — are captured once, here, because toolExtraFromParams()
     is a first-script global and this is the only place the ORIGINAL address is still known.
     fd_wire.js replays them onto the ref the link named and onto no other.

     *** THIS MUST RUN BEFORE THE FIRST RENDER. *** It used to sit after it, which was harmless
     while nothing consumed the extras. The tool surface consumes them at MOUNT time, and the
     mount is written once per open tool and never rewritten — so a deep link arriving with
     &case= painted the tool without its case and never got a second chance, because nothing
     re-renders after the boot route. The block reads only the address bar; it has no dependency
     on anything the render produces. */
  var bootRouted=false;
  try{
    var sp0=new URLSearchParams(location.search);
    var deep0=sp0.get('page')||sp0.get('tool');
    bootRouted=!!(deep0||sp0.get('tab'));
    if(deep0){ FD_TOOL_EXTRA_REF=deep0; FD_TOOL_EXTRA=toolExtraFromParams(sp0); }
  }catch(_){ }

  try{ fdRerender(); }
  catch(e){
    /* fdRender guards every surface itself, so reaching here means state ASSEMBLY failed — a
       corrupt store, or no localStorage at all (private mode, spec §6). Paint the first-run
       screen from literals rather than leaving the page blank. */
    try{ fdRender({role:'', tab:'today', done:{}, nowMs:Date.now()}); }catch(_){ }
  }

  /* Listeners first, so a click during the route normalisation below is not dropped. Guarded so
     a wiring failure leaves a READABLE page rather than a blank one — but named on the console,
     because an inert front door is the one degradation nothing on screen can hint at: every
     control still looks like a control. Same reasoning as fdSurface's warn. */
  try{ fdWire(); }
  catch(e){
    try{
      if(typeof console!=='undefined'&&console.warn){
        console.warn('front door: event wiring failed — the page is read-only', e);
      }
    }catch(_){ }
  }

  /* Normalise the address to what is actually on screen, with replaceState so this tab's first
     history entry is not a duplicate the back button lands on. Deliberately skipped for a bare
     URL that resumed nothing: rewriting it there would strip unrelated query params from a link
     the front door does not own. */
  try{
    var boot=fdCurrentState();
    if(boot.openId||bootRouted) fdRoute(boot, true);
    else document.title=pageTitle(null);
    /* A followed deep link becomes "where I was" — the same re-sync popstate does, and for the
       same reason: cw_frontdoor_v1's whole job is to resume, so leaving it pointing at whatever
       preceded the link means a student who arrives by cta and closes the tab comes back to a
       page they were not reading. */
    if(bootRouted){
      var bootBlob=fdLoad();
      bootBlob.openId=boot.openId; bootBlob.tab=boot.tab;
      fdSave(bootBlob);
    }
    fdAnnounce(boot);
  }catch(_){ }
  /* ---- end front door boot ---- */
})();
</script>
</body>
</html>
