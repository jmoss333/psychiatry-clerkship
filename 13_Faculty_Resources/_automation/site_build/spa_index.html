<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cw_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inpatient Psychiatry — MS3 Clerkship</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A private learning hub for the third-year inpatient psychiatry clerkship.">
<script src="marked.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
    --text:#2f2924; --focus:#155eef; --text-mid:#51473d; --text-light:#665a4f; --warning:#7a6234; --warning-light:#f5efe2;
    --success:#357160; --success-light:#e7f1ed; --danger:#a34132; --danger-light:#fbece9; --info:#41618a; --info-light:#eaf0f6;
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  aside{background:var(--bg-alt);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;position:sticky;top:0;height:100vh}
  aside h1{font-family:var(--font-head);font-size:1.15rem;color:var(--primary);margin:0 0 2px}
  aside .by{font-size:.78rem;color:var(--text-light);margin-bottom:14px}
  .themebtn{position:absolute;top:16px;right:14px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
  .themebtn:hover{border-color:var(--accent);color:var(--accent-dark)}
  .modetoggle{position:relative;display:flex;background:var(--primary-light);border:1px solid var(--border);border-radius:999px;padding:3px;margin:2px 0 14px}
  .modetoggle .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:999px;transition:transform .22s ease;z-index:0}
  .modetoggle.lib .knob{transform:translateX(100%)}
  .modetoggle button{flex:1;position:relative;z-index:1;border:none;background:transparent;font-family:inherit;font-size:.83rem;font-weight:700;color:var(--text-mid);padding:7px 4px;cursor:pointer;border-radius:999px}
  .modetoggle button.on{color:#fff}
  #content.pathmode{max-width:none;padding:0;margin:0}
  .pathframe{width:100%;height:calc(100vh - 46px);border:0;display:block}
  .search-wrap{position:relative;margin:0 0 12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  input.search{width:100%;padding:8px 28px 8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--text)}
  input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  .search-wrap .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text-light);cursor:pointer;font-size:1rem;display:none}
  .navsec-wrap{margin-top:4px}
  .navgroup-wrap{margin-top:8px}
  .navgroupsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-mid);font-weight:800;padding:8px 6px;border-radius:6px}
  .navgroupsec:hover{background:var(--primary-light);color:var(--text)}
  .navgroupsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navgroup-wrap.open>.navgroupsec .chev{transform:rotate(90deg)}
  .navgroupbody{display:none;padding-left:8px;border-left:1px solid var(--border);margin-left:6px}
  .navgroup-wrap.open>.navgroupbody{display:block}
  .navsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);font-weight:700;padding:7px 6px;border-radius:6px}
  .navsec:hover{background:var(--primary-light);color:var(--text-mid)}
  .navsec .chev{display:inline-block;font-size:.62rem;transition:transform .15s;flex:0 0 auto}
  .navsec-wrap.open>.navsec .chev{transform:rotate(90deg)}
  .navsec-t{flex:1;min-width:0}
  .navgroup{display:none;margin:1px 0 4px;padding-left:4px}
  .navsec-wrap.open>.navgroup{display:block}
  .navitem{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--text);padding:6px 9px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.9rem;line-height:1.3}
  .navitem-hidden{display:none}
  .navitem:hover{background:var(--primary-light)}
  .navitem.on{background:var(--accent);color:#fff}
  .navitem .tool-tag{font-size:.6rem;background:var(--accent-dark);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .navitem.on .tool-tag{background:#fff;color:var(--accent-dark)}
  main{padding:0}
  .banner{background:var(--warning-light);border-bottom:1px solid var(--border);color:var(--text);font-size:.82rem;padding:8px 34px 8px 28px;position:relative}
  .banner.hide{display:none}
  .bannerx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.05rem;line-height:1;opacity:.55;padding:2px 6px}
  .bannerx:hover{opacity:1}
  .skel{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .skel .bar{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border) 25%,var(--bg-alt) 37%,var(--border) 63%);background-size:400% 100%;animation:skelsh 1.3s ease infinite;margin:11px 0}
  .skel .bar.title{height:26px;width:55%;margin:0 0 20px}
  .skel .bar.short{width:68%}
  @keyframes skelsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media(prefers-reduced-motion:reduce){.skel .bar{animation:none}}
  #content.toolmode{max-width:none;padding:0;margin:0}
  .toolframe{width:100%;height:calc(100vh - 46px);border:0;display:block;background:var(--bg)}
  .toolrev{background:var(--accent-light);color:var(--accent-dark);border-bottom:1px solid var(--border);font-size:.76rem;font-weight:600;padding:6px 16px;letter-spacing:.02em}
  #content.toolmode.hasrev .toolframe{height:calc(100vh - 46px - 30px)}
  .pgfb{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
  .pgfb-b{background:none;border:1px solid var(--border);border-radius:999px;padding:6px 15px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.83rem}
  .pgfb-b:hover{border-color:var(--accent);color:var(--accent-dark)}
  .skip-link{position:absolute;left:12px;top:-52px;background:#fff;color:var(--text);border:2px solid var(--focus);border-radius:6px;padding:8px 12px;z-index:100;transition:top .15s}
  .skip-link:focus{top:12px}
  .drawer-backdrop{position:fixed;inset:0;z-index:19;background:rgba(47,41,36,.40)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .loading{color:var(--text-mid);padding:28px 4px}
  .error{padding:8px 4px}
  .reviewed{display:inline-block;font-size:.76rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid #cfe1db;border-radius:999px;padding:3px 11px;margin:0 0 12px}
  .page-review-footer{margin:26px 0 0}
  .md-body{max-width:820px;margin:0 auto;padding:26px 28px 60px}
  .md-body h1{font-family:var(--font-head);color:var(--primary);font-size:2rem;margin:.2em 0 .4em}
  .md-body h2{font-family:var(--font-head);color:var(--text);font-size:1.4rem;margin:1.3em 0 .4em;border-bottom:1px solid var(--border);padding-bottom:4px}
  .md-body h3{font-size:1.1rem;margin:1.1em 0 .3em}
  .md-body a{color:var(--accent-dark)}
  .md-body table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .md-body th,.md-body td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .md-body th{background:var(--primary-light)}
  .md-body blockquote{border-left:3px solid var(--accent);background:var(--accent-light);margin:1em 0;padding:8px 14px;border-radius:0 6px 6px 0;color:var(--text-mid)}
  .md-body code{background:var(--primary-light);padding:1px 5px;border-radius:4px;font-size:.86em}
  .md-body ul,.md-body ol{padding-left:1.4em}
  .toolnote{background:var(--accent-light);border:1px solid var(--accent);border-radius:10px;padding:18px;max-width:820px;margin:26px auto;text-align:center}
  .toolnote a.btn{display:inline-block;background:var(--primary-dark);color:#fff;text-decoration:none;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:10px}
  .srn{color:var(--text-light);font-size:.92rem;margin:.2em 0 0}
  .results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .result{display:block;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;font-family:inherit}
  .result:hover{border-color:var(--accent);background:var(--accent-light)}
  .r-title{display:block;font-family:var(--font-head);font-size:1.06rem;color:var(--primary-dark);font-weight:600}
  .r-sec{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin:2px 0 4px}
  .r-snip{display:block;font-size:.86rem;color:var(--text-mid);line-height:1.45}
  mark{background:rgba(217,160,60,.34);color:inherit;padding:0 1px;border-radius:2px}
  /* unified topic template (Slice 4) */
  .topic-tpl{margin:6px 0 18px}
  .practice-panel{position:relative;border:1px solid #b9d2d0;border-left:7px solid var(--primary);border-radius:14px;background:linear-gradient(135deg,rgba(232,244,242,.92),rgba(255,252,247,.96));box-shadow:0 10px 26px rgba(47,41,36,.09);margin:8px 0 20px;overflow:hidden}
  .practice-panel::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(180deg,var(--primary),var(--accent));pointer-events:none}
  .practice-panel>summary{list-style:none}
  .practice-panel>summary::-webkit-details-marker{display:none}
  .practice-summary{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;cursor:pointer;background:rgba(255,255,255,.55);border-bottom:1px solid transparent}
  .practice-summary:focus-visible{outline:3px solid rgba(185,79,52,.34);outline-offset:-3px}
  .practice-panel[open] .practice-summary{border-bottom-color:#cfe1db}
  .practice-tab{flex:0 0 auto;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--primary-dark);border-radius:999px;padding:4px 9px}
  .practice-title{font-family:var(--font-head);font-size:1.08rem;font-weight:700;color:var(--primary);line-height:1.2}
  .practice-sub{margin-left:auto;font-size:.76rem;color:var(--text-light);white-space:nowrap}
  .practice-hint{flex:0 0 auto;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);background:rgba(255,255,255,.86);border:1px solid #d6c8b6;border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(47,41,36,.06)}
  .practice-panel:not([open]) .practice-summary:hover .practice-hint{background:var(--accent-light);border-color:var(--accent)}
  .practice-hint-close{display:none}
  .practice-panel[open] .practice-hint-open{display:none}
  .practice-panel[open] .practice-hint-close{display:inline}
  .practice-chev{font-size:1.05rem;color:var(--accent-dark);transition:transform .16s ease}
  .practice-panel[open] .practice-chev{transform:rotate(90deg)}
  .practice-body{padding:14px 16px 16px}
  .practice-sections{display:grid;gap:12px}
  .practice-section{background:rgba(255,255,255,.72);border:1px solid #d9e5e0;border-radius:12px;padding:13px 14px}
  .practice-section-title{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--primary-dark);margin:0 0 8px}
  .practice-muted{font-size:.9rem;color:var(--text-mid);margin:0}
  .practice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .practice-action{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--accent-dark);background:var(--accent-light);border:1px solid #bfd8d3;border-radius:999px;padding:8px 12px}
  .practice-action:hover{background:var(--surface);border-color:var(--accent)}
  .practice-action.is-safety{color:var(--primary-dark);background:var(--primary-light);border-color:#bdd5d1}
  .practice-action.is-case{color:var(--primary);background:#fff;border-color:#d5c9bc}
  .practice-action.is-review{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .tpl-chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--border)}
  .tpl-chip.read{color:var(--text-mid);background:var(--bg-alt)}
  .tpl-chip.hy{color:var(--warning);background:var(--warning-light);border-color:var(--warning)}
  .tpl-chip.safety{color:var(--danger);background:var(--danger-light);border-color:var(--danger)}
  .tpl-chip.evidence{color:var(--accent-dark);background:var(--accent-light);border-color:var(--accent)}
  .tpl-chip.review{color:var(--success);background:var(--success-light);border-color:var(--success)}
  .practice-panel .tpl-meta{margin:0 0 12px}
  .page-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:.2em 0 .25em}
  .page-title-row h1{margin:0}
  .page-title-row .markrev{font-size:.68rem;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:4px 9px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-family:inherit;white-space:nowrap;margin-top:.42rem}
  .page-title-row .markrev:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-light)}
  .page-title-row .markrev.on{background:var(--success-light);border-color:var(--success);color:var(--success)}
  .review-ledger{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:-2px 0 14px;padding:0;color:var(--text-mid)}
  .review-ledger .k{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark)}
  .review-ledger .v{font-size:.78rem;color:var(--text-mid);line-height:1.35}
  .review-ledger .revcount{font-weight:800;color:var(--text)}
  .review-ledger .review-date{color:var(--text-light)}
  @media(max-width:560px){.page-title-row{display:block}.page-title-row .markrev{margin:.25rem 0 .1rem}}
  .in30{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:0 0 14px}
  .practice-panel .in30{background:transparent;border-left:none;border-radius:0;padding:0;margin:0}
  .in30 .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:6px}
  .in30 .one{font-family:var(--font-head);font-size:1.12rem;line-height:1.4;margin-bottom:8px;color:var(--text)}
  .practice-panel .in30 .lbl{display:none}
  .practice-panel .in30 .one{font-size:1.02rem;margin-bottom:8px}
  .in30 ul{margin:0;padding:0;list-style:none}
  .in30 li{position:relative;padding-left:24px;margin:5px 0;font-size:.95rem}
  .in30 li::before{content:"\2713";position:absolute;left:0;color:var(--accent);font-weight:700}
  .workflow-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;margin:0 0 16px}
  .workflow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .workflow-title{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark)}
  .workflow-stage{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .workflow-stage span{font-size:.72rem;font-weight:700;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--border);border-radius:999px;padding:4px 8px}
  .workflow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .workflow-step{border:1px solid var(--border);border-radius:10px;background:var(--bg-alt);padding:10px 12px}
  .workflow-step .k{font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-light);margin-bottom:5px}
  .workflow-step .v{font-size:.92rem;line-height:1.45;color:var(--text)}
  .workflow-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .workflow-actions a{display:inline-flex;align-items:center;text-decoration:none;font-size:.84rem;font-weight:700;color:var(--accent-dark);border:1px solid var(--border);border-radius:999px;padding:7px 11px;background:var(--accent-light)}
  .workflow-actions a:hover{border-color:var(--accent);background:var(--surface)}
  .practice-panel .workflow-card{border:none;border-radius:0;background:transparent;padding:0;margin:0}
  .practice-panel .workflow-head{margin-bottom:9px}
  .practice-panel .workflow-title{display:none}
  .practice-panel .workflow-step{background:rgba(247,250,249,.86)}
  .practice-panel .workflow-actions{display:none}
  @media(max-width:680px){.practice-summary{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.practice-sub{grid-column:2/4;margin-left:0;white-space:normal}.practice-hint{grid-column:2/3;justify-self:start}.workflow-head{display:block}.workflow-stage{justify-content:flex-start;margin-top:8px}.workflow-grid{grid-template-columns:1fr}}
  .cantmiss{display:flex;gap:11px;background:var(--danger-light);border-left:3px solid var(--danger);border-radius:0 10px 10px 0;padding:12px 15px;margin:0 0 14px}
  .cantmiss .ico{color:var(--danger);flex:0 0 auto;font-size:1.05rem;line-height:1.4}
  .cantmiss .tx{font-size:.95rem} .cantmiss b{color:var(--danger)}
  .practice-panel .cantmiss{margin:10px 0 0}
  .minitree{border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin:0 0 14px;background:var(--surface)}
  .minitree .lbl{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-light);margin-bottom:8px}
  .minitree .ro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .minitree .ro .c{font-size:.82rem;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:3px 9px}
  .minitree .fm{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:8px;padding:8px 11px;font-size:.92rem}
  .minitree .fm b{color:var(--accent-dark)}
  .minitree a{display:inline-block;margin-top:8px;font-size:.84rem;color:var(--accent-dark)}
  .practice-panel .minitree{background:rgba(255,255,255,.72);margin:10px 0 0}
  .tyourself{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 16px;background:var(--surface)}
  .practice-panel .tyourself{border:none;background:transparent;border-radius:0;padding:0;margin:0}
  .tyourself .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark);margin-bottom:8px}
  .practice-panel .tyourself .lbl{display:none}
  .tyourself .q{font-family:var(--font-head);font-size:1.05rem;margin-bottom:10px;color:var(--text)}
  .tyo{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--bg-alt);border-radius:9px;padding:9px 12px;margin:6px 0;cursor:pointer;font:inherit;color:var(--text)}
  .tyo:hover{border-color:var(--accent)}
  .tyo.correct{border-color:var(--success);background:var(--success-light)}
  .tyo.wrong{border-color:var(--danger);background:var(--danger-light)}
  .tyfb{font-size:.9rem;color:var(--text-mid);margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--bg-alt);display:none}
  .tyfb.show{display:block}
  .md-body .toolcta{display:inline-block;background:var(--primary-dark);color:var(--on-brand);text-decoration:none;border-radius:8px;padding:10px 16px;font-weight:600;margin:2px 0 18px}
  .md-body .minitree a,.md-body .in30 a{text-decoration:underline}
  /* collapsible in-page sections (long readings) */
  .md-body .sec-toolbar{display:flex;gap:8px;margin:10px 0 12px}
  .md-body .sec-all{font-size:.8rem;border:1px solid var(--border);background:var(--surface);color:var(--accent-dark);border-radius:999px;padding:5px 13px;cursor:pointer;font-family:inherit}
  .md-body .sec-all:hover{border-color:var(--accent)}

  function navScan(){ var p=(typeof progLoad==='function')?progLoad():{}, meta=(typeof TOPIC_META!=='undefined')?TOPIC_META:{}; var hy=[],cov={}; var wraps=document.querySelectorAll('#nav .navsec-wrap'); [].forEach.call(wraps,function(w){ var sec=((w.querySelector('.navsec-t')||{}).textContent)||''; if(sec==='Overview')return; [].forEach.call(w.querySelectorAll('.navitem'),function(b){ var it=b._item; if(!it)return; if(it.k==='md'){ if(!cov[sec])cov[sec]={done:0,tot:0}; cov[sec].tot++; if(p[it.f]&&p[it.f].done)cov[sec].done++; } if(meta[it.f]&&meta[it.f].hy&&!(p[it.f]&&p[it.f].done))hy.push({f:it.f,t:it.t,sec:sec}); }); }); return {hy:hy,cov:cov}; }
  function allNavItems(){ var out=[]; [].forEach.call(document.querySelectorAll('#nav .navitem'),function(b){ var it=b._item; if(it&&it.k!=='special')out.push({f:it.f,t:it.t,k:it.k}); }); return out; }
  function dashboardState(){ try{return JSON.parse(localStorage.getItem('cw_dashboard_v1')||'{}')||{};}catch(_){return {};} }
  function dashboardMode(){ var st=dashboardState(); return st.mode||'ward'; }
  function setDashboardMode(mode){ try{localStorage.setItem('cw_dashboard_v1',JSON.stringify({mode:mode,at:new Date().toISOString().slice(0,10)}));}catch(_){ } }
  function itemsForMode(mode){ var meta=(typeof TOPIC_META!=='undefined')?TOPIC_META:{}, out=[], seen={}; allNavItems().forEach(function(it){ var m=meta[it.f]; if(m&&Array.isArray(m.workflowModes)&&m.workflowModes.indexOf(mode)>=0&&!seen[it.f]){ seen[it.f]=1; out.push(it); } }); return out; }
  var CASE_TITLES={suicide_direct_question_001:'Ask About Suicide Directly',psychosis_validation_001:'Validate Psychosis Without Colluding',guardedness_privacy_001:'Respond To Guardedness',rupture_limit_setting_001:'Repair After A Limit',bpd_rupture_repair_001:'Repair A BPD Rupture',medication_ambivalence_001:'Medication Ambivalence',mania_limit_sleep_001:'Offer A Sleep-Restoring Plan In Mania',family_meeting_opening_001:'Open A Family Meeting',collateral_questions_001:'Ask Better Collateral Questions',family_conflict_discharge_001:'De-escalate Family Conflict Around Discharge'};
  var FAMILY_SCENARIO_TITLES={collateral_baseline_safety_001:'Practice Collateral Call',family_meeting_opening_001:'Prepare Family Meeting',discharge_barrier_map_001:'Map Family Safety Roles',high_expressed_emotion_001:'Reset High-Emotion Family Talk',psychosis_family_psychoeducation_001:'Explain Psychosis To Family',family_involvement_boundaries_001:'Set Family Boundaries'};
  var CASE_PRIORITY={ward:['guardedness_privacy_001','psychosis_validation_001','medication_ambivalence_001','mania_limit_sleep_001'],family:['family_meeting_opening_001','collateral_questions_001','family_conflict_discharge_001'],safety:['suicide_direct_question_001','family_conflict_discharge_001','rupture_limit_setting_001'],shelf:['suicide_direct_question_001','psychosis_validation_001','medication_ambivalence_001'],'5min':['suicide_direct_question_001','psychosis_validation_001','medication_ambivalence_001','family_meeting_opening_001']};
  function caseAction(id){ return {f:'communication-practice.html',t:CASE_TITLES[id]||'What Do You Say Next?',k:'tool',caseId:id,href:'?tool=communication-practice.html&case='+encodeURIComponent(id)}; }
  function familyAction(id,title){ return {f:'family-systems.html',t:title||FAMILY_SCENARIO_TITLES[id]||'Family Systems Practice',k:'tool',scenarioId:id,href:'?tool=family-systems.html&scenario='+encodeURIComponent(id)}; }
  function casesForMode(mode){ var meta=(typeof TOPIC_META!=='undefined')?TOPIC_META:{}, seen={}, ids=[]; allNavItems().forEach(function(it){ var m=meta[it.f]; if(m&&Array.isArray(m.workflowModes)&&m.workflowModes.indexOf(mode)>=0&&Array.isArray(m.communicationCases)){ m.communicationCases.forEach(function(id){ if(!seen[id]){seen[id]=1;ids.push(id);} }); } }); var pri=CASE_PRIORITY[mode]||[]; ids.sort(function(a,b){ var ai=pri.indexOf(a),bi=pri.indexOf(b); if(ai<0)ai=99;if(bi<0)bi=99; return ai-bi; }); return ids.map(caseAction); }
  function compactActions(arr){ var out=[]; for(var i=0;i<arr.length;i++){ if(arr[i])out.push(arr[i]); } return out; }
  function actionRow(it, note){ var label=note||(it.caseId?'case':it.k); if(it.href){ return '<a class="hm-li" href="'+esc(it.href)+'"><span class="t">'+esc(it.t)+'</span><span class="sec">'+esc(label)+'</span></a>'; } return '<button class="hm-li" data-f="'+esc(it.f)+'"><span class="t">'+esc(it.t)+'</span><span class="sec">'+esc(label)+'</span></button>'; }
  function renderWardDashboard(){
    var mode=dashboardMode(), modes=[['ward','Ward'],['shelf','Shelf'],['family','Family'],['safety','Safety'],['5min','5 minutes']];

    var defaults={
      ward:{before:[{f:'doc_oral.md',t:'Rounding Prep',k:'md'},{f:'pg_interview.md',t:'Interview & MSE',k:'md'}],after:[casePicks[0]||caseAction('guardedness_privacy_001'),{f:'ddx.md',t:'Differential Dx Scaffolds',k:'md'}],leave:[{f:'review.html',t:'Daily Review',k:'tool'},{f:'reflection.html',t:'Reflection & Identity',k:'tool'}]},
      shelf:{before:[{f:'question-bank-practice.html',t:'Practice Questions',k:'tool'},{f:'shelf.md',t:'COMAT & Shelf Review',k:'md'}],after:[{f:'active-recall.html',t:'Active Recall',k:'tool'},{f:'review.html',t:'Daily Review',k:'tool'}],leave:[{f:'reading_map.md',t:'Weekly Reading Map',k:'md'}]},
      family:{before:[familyAction('family_meeting_opening_001','Prepare Family/Collateral Conversation'),{f:'family_playbook.md',t:'Family Meeting Playbook',k:'md'}],after:[familyAction('collateral_baseline_safety_001'),casePicks[0]||caseAction('family_meeting_opening_001')],leave:[familyAction('discharge_barrier_map_001'),{f:'reflection.html',t:'Reflection & Identity',k:'tool'}]},
      safety:{before:[{f:'pg_suicide.md',t:'Suicide Risk & Safety',k:'md'},casePicks[0]||caseAction('suicide_direct_question_001')],after:[familyAction('discharge_barrier_map_001'),{f:'cssrs.html',t:'C-SSRS Suicide Screen',k:'tool'}],leave:[{f:'review.html',t:'Daily Review',k:'tool'}]},
      '5min':{before:[casePicks[0]||caseAction('suicide_direct_question_001')],after:[familyAction('collateral_baseline_safety_001','Ask Better Collateral Questions'),casePicks[1]||caseAction('psychosis_validation_001')],leave:[{f:'review.html',t:'Daily Review',k:'tool'}]}
    };
    var pack=defaults[mode]||defaults.ward;
    if(matches.length){
      if(mode==='family'){
        pack={before:[familyAction('family_meeting_opening_001','Prepare Family/Collateral Conversation'),{f:'family_playbook.md',t:'Family Meeting Playbook',k:'md'}],after:compactActions([familyAction('collateral_baseline_safety_001'),casePicks[0]||caseAction('family_meeting_opening_001')]).slice(0,2),leave:[familyAction('discharge_barrier_map_001'),{f:'exp_family.md',t:'Family & Discharge',k:'md'}]};
      } else if(mode==='safety'){
        pack={before:matches.slice(0,1).concat(pack.before).slice(0,2),after:compactActions([familyAction('discharge_barrier_map_001'),casePicks[0],pack.after[0]]).slice(0,2),leave:pack.leave};
      } else if(mode==='5min'){
        pack={before:matches.slice(0,1).concat(pack.before).slice(0,2),after:compactActions([familyAction('collateral_baseline_safety_001','Ask Better Collateral Questions'),casePicks[0]]).slice(0,2),leave:pack.leave};
      } else {
        pack={before:matches.slice(0,2),after:casePicks.slice(0,1).concat(matches.slice(2,3),pack.after).slice(0,2),leave:pack.leave};
      }
    }
    var h='<div class="wd"><div class="wd-head"><h2>Today on the unit</h2><div class="wd-modes">'+modes.map(function(m){return '<button type="button" class="wd-mode'+(mode===m[0]?' on':'')+'" data-dash-mode="'+m[0]+'">'+m[1]+'</button>';}).join('')+'</div></div>';
    h+='<div class="wd-grid"><div class="wd-card"><h3>Before rounds</h3>'+pack.before.map(function(x){return actionRow(x,'open');}).join('')+'</div><div class="wd-card"><h3>After rounds</h3>'+pack.after.map(function(x){return actionRow(x,'practice');}).join('')+'</div><div class="wd-card"><h3>Before leaving</h3>'+pack.leave.map(function(x){return actionRow(x,'review');}).join('')+'</div></div></div>';
    return h;
  }

  /* ---- Concept B: Progress home ---- */
  function weakTopics(){
    var lookup={}, wraps=document.querySelectorAll('#nav .navsec-wrap');
    [].forEach.call(wraps,function(w){ var sec=((w.querySelector('.navsec-t')||{}).textContent)||''; [].forEach.call(w.querySelectorAll('.navitem'),function(b){ var it=b._item; if(it&&it.k==='md') lookup[it.f]={t:it.t,sec:sec}; }); });
    var p=(typeof progLoad==='function')?progLoad():{}, out=[], seen={};
    function add(f,reason){ if(!f||seen[f]||!lookup[f]||(p[f]&&p[f].done))return; seen[f]=1; out.push({f:f,t:lookup[f].t,sec:lookup[f].sec,reason:reason}); }
    try{ var q=JSON.parse(localStorage.getItem('cw_quiz_v1')||'{}'); Object.keys(q).forEach(function(f){ if(q[f]&&q[f].wrong>0) add(f,'missed the quiz'); }); }catch(_){ }
    var s=srsState(); if(s&&s.cards){ for(var id in s.cards){ if(id.indexOf('TOPIC#')===0 && (s.cards[id].lapses||0)>0) add(id.slice(6),'stumbled in review'); } }
    try{ var qb=JSON.parse(localStorage.getItem('cw_qb_v1')||'{}'); Object.keys(qb).forEach(function(id){ var r=qb[id]; if(r&&!r.correct&&r.pages&&r.pages.length){ r.pages.forEach(function(f){ add(f,'missed in practice bank'); }); } }); }catch(_){ }
    return out;
  }
  function safeLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } }
  function studyId(){ try{ var k=localStorage.getItem('cw_study_id'); if(!k){ k='S-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Date.now().toString(36).slice(-4).toUpperCase(); localStorage.setItem('cw_study_id',k); } return k; }catch(_){ return 'S-ANON'; } }
  window.exportStudy=function(){
    var payload={ study_id:studyId(), exported_at:new Date().toISOString(), schema:'clerkship-study-v1',
      progress:safeLS('cw_progress_v1'), srs:safeLS('cw_srs_v1'), quiz:safeLS('cw_quiz_v1') };
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='clerkship_study_'+payload.study_id+'_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    var s=document.getElementById('studyMsg'); if(s) s.textContent='Exported ✓  anonymous — study ID '+payload.study_id+'. Thank you!';
  };
  window.renderHome=function(){
    var scan=navScan();
    var rev=0, tot=0; for(var _ck in scan.cov){ rev+=scan.cov[_ck].done; tot+=scan.cov[_ck].tot; }
    var pct=tot?Math.round(rev/tot*100):0; var dc=dueCount(); var s=srsState();
    var streak=(s&&s.stats&&s.stats.streak)||0;
    var last=LS('cw_last'); var shelf=LS('cw_shelf_date'); var shelfDays=null;
    if(shelf){ var t=new Date(shelf+'T00:00:00').getTime(); if(!isNaN(t)) shelfDays=Math.ceil((t-Date.now())/86400000); }
    var fresh=(rev===0 && dc.due===0 && !last);
    var h='<div class="hm" id="hmRoot"><h1>Your progress</h1>';
    if(fresh){ h+='<p class="sub">Welcome — nothing tracked yet. Open any content page and tap <strong>Mark reviewed</strong>, or start a review session, and this page fills in.</p>'; }
    else{ h+='<p class="sub">Where you are, and the next best thing to do.</p>'; }
    h+=renderWardDashboard();
    h+='<div class="hm-grid">';
    h+='<div class="hm-card"><div class="k">Review coverage</div><div class="hm-row"><div class="hm-ring" style="--p:'+pct+'"><i>'+pct+'%</i></div><div class="v">'+rev+'<small> / '+tot+' pages</small></div></div></div>';
    h+='<div class="hm-card"><div class="k">Due today</div><div class="v">'+dc.due+(dc.overdue?'<small> · '+dc.overdue+' overdue</small>':'')+'</div>'+(dc.due?'<button class="hm-btn" data-act="review">Start review</button>':'<span class="hm-empty">Nothing due — nice.</span>')+'</div>';
    h+='<div class="hm-card"><div class="k">Study streak</div><div class="v">'+streak+'<small> day'+(streak===1?'':'s')+'</small></div></div>';
    h+='<div class="hm-card"><div class="k">Shelf countdown</div><div class="v">'+(shelfDays!=null?(shelfDays>=0?shelfDays+'<small> days</small>':'<small>past</small>'):'<small>set a date on Start here</small>')+'</div></div>';
    h+='</div>';
    if(last&&LAB[last]===undefined){ h+='<div class="hm-sec"><h2>Continue where you left off</h2><button class="hm-li" data-f="'+last+'"><span class="t">Resume your last page</span><span class="sec">Resume →</span></button></div>'; }
    var weak=weakTopics();
    if(weak.length){ h+='<div class="hm-sec"><h2>Focus next · your weak spots</h2>'; weak.slice(0,5).forEach(function(x){ h+='<button class="hm-li" data-f="'+x.f+'"><span class="t">'+esc(x.t)+'</span><span class="sec">'+esc(x.reason)+'</span></button>'; }); h+='</div>'; }
    if(scan.hy.length){ h+='<div class="hm-sec"><h2>High-yield · not yet reviewed</h2>'; scan.hy.slice(0,8).forEach(function(x){ h+='<button class="hm-li" data-f="'+x.f+'"><span class="t">'+x.t+'</span><span class="sec">'+x.sec+'</span></button>'; }); h+='</div>'; }
    var covk=Object.keys(scan.cov); if(covk.length){ h+='<div class="hm-sec"><h2>Coverage by section</h2><div class="hm-bars">'; covk.forEach(function(k){ var c=scan.cov[k]; var p=c.tot?Math.round(c.done/c.tot*100):0; h+='<div class="brow"><span class="lab">'+k+'</span><span class="track"><span class="fill" style="width:'+p+'%"></span></span><span class="pc">'+c.done+'/'+c.tot+'</span></div>'; }); h+='</div></div>'; }
    h+='<div class="hm-sec"><h2>Help evaluate this site <span style="font-weight:400;color:var(--text-light)">· optional</span></h2><div class="sub" style="margin:0 0 8px">Export your anonymous learning activity for the clerkship study — no name and no patient information, only what you reviewed and answered on this site.</div><button class="hm-li" data-act="studyexport"><span class="t">Export my anonymous progress</span><span class="sec">Export ↓</span></button><div id="studyMsg" class="hm-empty" style="margin-top:6px"></div></div>';
    h+='<div class="hm-sec"><h2>New here?</h2><button class="hm-li" data-act="start"><span class="t">Open the Start-here orientation</span><span class="sec">Start →</span></button></div>';
    h+='</div>'; return h;
  };

  /* ---- Concept A: Start here ---- */
  window.renderStart=function(){
    var track=LS('cw_track')||'MS3'; var wk=parseInt(LS('cw_start_week')||'1',10)||1; var shelf=LS('cw_shelf_date')||'';

    var checks=[ {k:'orient',t:'Read the orientation packet',pg:'orientation.md'}, {k:'interview',t:'Skim the Interview & MSE pocket guide',pg:'pg_interview.md'}, {k:'mse',t:'Try the Mental Status Exam tool',tool:'mse.html'}, {k:'suicide',t:'Review the Suicide Risk & Safety card',pg:'pg_suicide.md'}, {k:'week',t:'Look at this week on the reading map',pg:'reading_map.md'} ];
    var wkOpts=''; for(var i=1;i<=6;i++){ wkOpts+='<option value="'+i+'"'+(i===wk?' selected':'')+'>Week '+i+'</option>'; }

    h+='<div class="st-sec-h">Set your rotation</div><div class="st-row">';
    h+='<div class="st-field"><label for="stTrack">Track</label><select id="stTrack"><option value="MS3"'+(track==='MS3'?' selected':'')+'>MS3 student</option><option value="Resident"'+(track==='Resident'?' selected':'')+'>Resident</option></select></div>';

    h+='</div>';
    h+='<div class="st-sec-h">Quick tools</div><div class="st-tools">'+qk.map(function(k){ var s=SAFE[k]?' is-safety':''; return '<a class="tl-chip'+s+'" href="?tool='+k+'" data-tool="'+k+'" aria-label="Open the '+(LAB[k]||'tool')+' tool">'+(LAB[k]||k)+'</a>'; }).join('')+'</div>';
    h+='<div class="st-actions"><button class="hm-btn" data-act="home">Go to my progress home</button><button class="hm-btn ghost" data-act="lib">Just start browsing</button></div>';
    h+='</div>'; return h;
  };

  window.__afterSpecial=function(f){
    try{ localStorage.setItem('cw_seen_start','1'); }catch(_){ }
    var root=document.getElementById(f==='__start__'?'stRoot':'hmRoot'); if(!root)return;
    hydrate(root);
    if(f==='__home__'){
      root.addEventListener('click',function(e){
        var li=e.target.closest?e.target.closest('.hm-li'):null; if(li){ var act=li.getAttribute('data-act'); if(act==='review'){ navClick('review.html'); return; } if(act==='start'){ navClick('__start__'); return; } if(act==='studyexport'){ if(window.exportStudy)window.exportStudy(); return; } var ff=li.getAttribute('data-f'); if(ff)navClick(ff); return; }
        var dm=e.target.closest?e.target.closest('[data-dash-mode]'):null; if(dm){ setDashboardMode(dm.getAttribute('data-dash-mode')); root.outerHTML=window.renderHome(); window.__afterSpecial('__home__'); return; }
        var b=e.target.closest?e.target.closest('[data-act]'):null; if(b){ var a=b.getAttribute('data-act'); if(a==='review')navClick('review.html'); }
      });
    } else {
      root.addEventListener('click',function(e){
        var it=e.target.closest?e.target.closest('.it[data-check]'):null;
        if(it && !(e.target.closest&&e.target.closest('a'))){ var key=it.getAttribute('data-check'); var st={}; try{ st=JSON.parse(LS('cw_firstday')||'{}')||{}; }catch(_){ st={}; } st[key]=!st[key]; try{ localStorage.setItem('cw_firstday',JSON.stringify(st)); }catch(_){ } it.classList.toggle('on',!!st[key]); var bx=it.querySelector('.bx'); if(bx)bx.textContent=st[key]?'✓':''; return; }

      var sh=root.querySelector('#stShelf'); if(sh)sh.addEventListener('change',function(){ try{localStorage.setItem('cw_shelf_date',sh.value);}catch(_){ } });
    }
  };
})();
