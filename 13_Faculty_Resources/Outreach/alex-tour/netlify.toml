# psychiatry-workforce-tour (base directory: 13_Faculty_Resources/Outreach/alex-tour).
# `ignore = "/bin/false"` = ALWAYS BUILD, NEVER "CANCEL": with a base directory set, Netlify
# would otherwise cancel every build whose commit did not touch this directory, and it
# records a cancel as a FAILED deploy (state "error"), which is what a "Deploy failed"
# notification fires on. Cost: a ~10 s no-build deploy per event. See sp-proxy/netlify.toml
# and GIT_AND_DEPLOY_PLAN.md §7.
[build]
  publish = "."
  ignore = "/bin/false"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-cpNxvnuTgOxGYoDASXyglZWy3SWCjU7FbusmlZHeN8M='; style-src 'self' 'sha256-cesDg4xZTmZRbJAfkQYj3KCxKTTUt01KzSqAMONJOIQ='; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
