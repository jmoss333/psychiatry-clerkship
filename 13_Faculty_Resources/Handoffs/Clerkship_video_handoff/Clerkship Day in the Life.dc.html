<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clerkship Hub — One Day on the Unit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&amp;family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; }
  </style>
</helmet>
<div id="cw-day-root" data-screen-label="t=0s" style="position: fixed; inset: 0;">
  <x-import component-from-global-scope="ClerkshipDayVideo" from="./animations.jsx ./ios-frame.jsx ./day-video.jsx" autoplay="{{ autoplay }}" loop="{{ loop }}" hint-size="100%,100%"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;autoplay&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Playback&quot; },
  &quot;loop&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Playback&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    return {
      autoplay: this.props.autoplay ?? true,
      loop: this.props.loop ?? true,
    };
  }
}
</script>
</body>
</html>
