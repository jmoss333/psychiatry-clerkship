<!DOCTYPE html>
<html lang="en">
<head>
<!-- [CLERKSHIP-META v1] tool="Algorithms & Decision Aids" version="1.0" built="2026-06-29" category="acute-safety" audience="trainee,ms3" settings="inpatient" time="scan" summary="Visual decision-support for the can't-miss inpatient syndromes: rule-out-first decision trees, the agitation escalation ladder, NMS-vs-serotonin-syndrome matrix, alcohol-withdrawal timeline, and CIWA-Ar score bands. One visual grammar: red = rule out first, teal = first move. Educational; fictional composites only; no PHI; AI-drafted, pending faculty attestation." -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Algorithms &amp; Decision Aids</title>
<meta name="description" content="Visual decision aids for inpatient psychiatry: rule-out-first decision trees, the agitation escalation ladder, NMS vs serotonin syndrome, the alcohol-withdrawal timeline, and CIWA-Ar score bands.">
<style>
  :root{
    --bg:#f6f3ee; --bg2:#faf6f0; --surface:#ffffff; --surface2:#faf6f0; --border:#ddd3c6; --border2:#ebe5da;
    --text:#3b332c; --mid:#64574b; --light:#6b5d4f;
    --primary:#c25a3c; --primary-d:#a84830; --primary-ink:#a8431f; --primary-l:#f3ebe5;
    --accent:#2a6b5e; --accent-d:#1e5248; --accent-l:#edf4f2;
    --success:#357160; --success-l:#e9f1ec;
    --warning:#7a6234; --warning-l:#f5efe2;
    --danger:#a34132; --danger-l:#fbefec;
    --info:#41618a; --info-l:#eef3f7;
    --on-brand:#ffffff;
    --shadow:0 1px 3px rgba(59,51,44,.06);
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
  }
  [data-theme="dark"]{
    --bg:#1a1816; --bg2:#211d1a; --surface:#2a2520; --surface2:#332e28; --border:#3d3630; --border2:#2f2a25;
    --text:#e8e2da; --mid:#b3a596; --light:#8a7c6e;
    --primary:#d4896e; --primary-d:#dd9277; --primary-ink:#e6a98f; --primary-l:rgba(212,137,110,.16);
    --accent:#5aad9a; --accent-d:#6cbcaa; --accent-l:rgba(90,173,154,.16);
    --success:#5aad8e; --success-l:rgba(90,173,142,.16);
    --warning:#c4a45c; --warning-l:rgba(196,164,92,.16);
    --danger:#d46858; --danger-l:rgba(212,104,88,.16);
    --info:#7a9ec4; --info-l:rgba(122,158,196,.16);
    --on-brand:#211d1a;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;transition:background .2s,color .2s}
  .wrap{max-width:840px;margin:0 auto;padding:20px 18px 70px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-d)}
  h1{font-family:var(--font-head);color:var(--primary);font-size:1.7rem;margin:.12em 0 .1em;font-weight:600}
  .sub{color:var(--light);font-size:.9rem;max-width:62ch;margin:0 0 4px}
  .opt-pill{display:inline-block;font-size:.68rem;font-weight:700;color:var(--accent-d);background:var(--accent-l);border:1px solid var(--border2);border-radius:999px;padding:2px 9px;margin:8px 0 0}
  .tbtn{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--mid);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
  .tbtn:hover{border-color:var(--accent)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px;font-size:.8rem;color:var(--mid)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:.8em;height:.8em;border-radius:3px;display:inline-block}
  .sw.d{background:var(--danger)} .sw.t{background:var(--accent)} .sw.w{background:var(--warning)}
  .nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:6px 0 4px;display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--mid);border-radius:999px;padding:7px 13px;font:inherit;font-size:.86rem;cursor:pointer;white-space:nowrap}
  .nav button.on{background:var(--primary);color:var(--on-brand);border-color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
  .card h2{font-family:var(--font-head);font-size:1.12rem;margin:0 0 3px;color:var(--text);font-weight:600}
  .card .cap{font-size:.84rem;color:var(--light);margin:0 0 10px}
  /* nodes & chips */
  .node{border-radius:11px;padding:10px 13px;margin:8px 0;border:1px solid var(--border)}
  .node .nlabel{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:.72rem;color:#fff}
  .node.ro{background:var(--danger-l);border-color:var(--danger)} .node.ro .nlabel{color:var(--danger)} .node.ro .num{background:var(--danger)}
  .node.dx{background:var(--surface2)} .node.dx .nlabel{color:var(--mid)} .node.dx .num{background:var(--mid)}
  .node.fm{background:var(--accent-l);border-color:var(--accent)} .node.fm .nlabel{color:var(--accent-d)} .node.fm .num{background:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.82rem;border-radius:999px;padding:4px 10px;border:1px solid var(--border);background:var(--surface)}
  .chip.d{background:var(--danger-l);border-color:var(--danger);color:var(--danger)}
  .fm .fmtext{font-size:.95rem;color:var(--text)}
  .branch{display:flex;align-items:center;gap:8px;margin:8px 2px;font-size:.84rem;color:var(--warning)}
  .branch .arr{color:var(--light)}
  .escape{background:var(--warning-l);border:1px dashed var(--warning);border-radius:9px;padding:7px 11px;font-size:.84rem;color:var(--warning)}
  .rounds{margin-top:10px;font-size:.84rem;color:var(--mid);border-left:3px solid var(--accent);background:var(--accent-l);border-radius:7px;padding:8px 11px}
  .rounds b{color:var(--accent-d)}
  .connector{height:14px;width:2px;background:var(--border);margin:0 auto}
  /* ladder */
  .rung{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);border-left-width:5px;border-radius:10px;padding:10px 13px;margin:7px 0;background:var(--surface)}
  .rung .rn{font-family:var(--font-head);font-size:1rem;color:var(--light);flex:0 0 auto;width:1.2em;text-align:center}
  .rung .rt{font-weight:600} .rung .rd{font-size:.85rem;color:var(--mid)}
  /* matrix */
  .mtx{width:100%;border-collapse:collapse;font-size:.86rem}
  .mtx th,.mtx td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
  .mtx thead th{font-family:var(--font-head);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
  .mtx thead th.nms{color:var(--warning)} .mtx thead th.ss{color:var(--danger)}
  .mtx td.f{color:var(--light);font-weight:600;width:26%}
  .both{margin-top:10px;background:var(--accent-l);border-radius:9px;padding:9px 12px;font-size:.86rem;color:var(--accent-d)}
  /* timeline */
  .tl{position:relative;margin:4px 0 0;padding-left:8px}
  .tstep{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:start;padding:6px 0}
  .tstep .tt{font-family:var(--font-head);font-size:.92rem;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .tstep .tb{border-left:3px solid var(--border);padding:0 0 10px 14px;position:relative}
  .tstep .tb::before{content:"";position:absolute;left:-7px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .tstep.warn .tb::before{background:var(--warning)} .tstep.dgr .tb::before{background:var(--danger)}
  .tstep .th{font-weight:600} .tstep.dgr .th{color:var(--danger)}
  .tstep .ts{font-size:.85rem;color:var(--mid)}
  /* meter */
  .meter{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:6px 0}
  .meter .seg{display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;color:#fff}
  .meter .s1{background:var(--success);flex:1} .meter .s2{background:var(--warning);flex:1.3} .meter .s3{background:var(--danger);flex:1}
  .bands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .band{display:flex;gap:9px;align-items:baseline;font-size:.88rem}
  .band .bk{font-weight:700;flex:0 0 64px}
  .band.s1 .bk{color:var(--success)} .band.s2 .bk{color:var(--warning)} .band.s3 .bk{color:var(--danger)}
  .note{font-size:.84rem;color:var(--light);margin-top:8px}
  .disc{font-size:.78rem;color:var(--light);border-top:1px solid var(--border);margin-top:24px;padding-top:12px}
  a.more{color:var(--accent-d);font-size:.85rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var e=React.createElement, useState=React.useState, useEffect=React.useEffect;

// ---- theme (shared key with the rest of the hub) ----
function initialTheme(){
  try{var s=localStorage.getItem("cw_theme"); if(s==="dark"||s==="light")return s;}catch(_){}
  try{ if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) return "dark"; }catch(_){}
  return "light";
}

// ---- content (sourced from the hub's own teaching pages; standard inpatient management) ----
var TREES=[
 {id:"agitation",title:"Agitated patient",
  ruleOut:["Hypoglycemia","Hypoxia","Delirium","Intoxication / withdrawal","Pain / retention","Head injury"],
  medical:"Found a medical driver? Treat the cause first.",
  psych:["Mania","Psychosis","Agitation in dementia","Behavioral / personality","Akathisia (drug-induced)"],
  firstMove:"Secure team + exit safety → verbal de-escalation → offer oral PRN. IM only if there is imminent danger.",
  rounds:"“Agitated, but glucose and vitals are normal and there’s no delirium — I treated it as behavioral, de-escalated, and offered oral PRN.”"},
 {id:"delirium",title:"Confused / fluctuating",
  ruleOut:["Infection","Meds / anticholinergics","Metabolic (Na, glucose, uremia)","Hypoxia","Withdrawal","Intracranial event"],
  medical:"Delirium is medical — the cause is almost always found.",
  psych:["Dementia (chronic, not fluctuating)","Depression (pseudodementia)","Primary psychosis (rare)"],
  firstMove:"Find and treat the cause, stop deliriogenic meds, reorient / nonpharmacologic measures. Avoid benzodiazepines unless withdrawal-related.",
  rounds:"“Acute, fluctuating inattention — delirium until proven otherwise; I’m working up the cause, not labeling it psychiatric.”"},
 {id:"catatonia",title:"Catatonia",
  ruleOut:["Malignant catatonia / NMS","Nonconvulsive status","Severe metabolic / CNS cause"],
  medical:"Exclude malignant catatonia / NMS before any antipsychotic.",
  psych:["Mood disorder (most common)","Psychotic disorder","Autistic / medical-psychiatric"],
  firstMove:"Lorazepam challenge; hold antipsychotics (can precipitate malignant catatonia); consider ECT.",
  rounds:"“Mutism, posturing, waxy flexibility — Bush-Francis positive; I did a lorazepam challenge and held the antipsychotic.”"},
 {id:"psychosis",title:"New psychosis",
  ruleOut:["Substance / intoxication","Delirium","Autoimmune (anti-NMDA)","Seizure / CNS lesion","Medication-induced"],
  medical:"Rule out secondary causes before a primary diagnosis.",
  psych:["Schizophrenia spectrum","Mood disorder with psychosis","Brief psychotic disorder"],
  firstMove:"Medical workup first; don’t anchor on schizophrenia at a first presentation.",
  rounds:"“First-episode psychosis — I screened for substances, delirium, and autoimmune causes before calling it primary.”"},
 {id:"hyperthermia",title:"Hyperthermia + rigidity",
  ruleOut:["Serotonin syndrome (clonus, hyperreflexia)","NMS (lead-pipe rigidity, days)","Malignant hyperthermia (anesthetics)","Anticholinergic (dry, normal reflexes)"],
  medical:"Identify the trigger and the toxidrome.",
  psych:[],
  firstMove:"Stop the offending agent, cool, supportive care; agent-specific — cyproheptadine for serotonin syndrome, dantrolene / bromocriptine for NMS.",
  rounds:"“Hyperthermic and rigid — clonus plus a serotonergic trigger points to serotonin syndrome; agent stopped, supportive care, cyproheptadine considered.”"}
];

var LADDER=[
 {t:"Lower stimulation",d:"Quieter space, fewer people, reduce inputs.",tone:"accent"},
 {t:"One calm voice + limit-setting",d:"Open posture, name the feeling, set kind clear limits.",tone:"accent"},
 {t:"Offer oral PRN (collaborative)",d:"Offer — don’t force — oral medication and real choices.",tone:"warning"},
 {t:"IM PRN — imminent danger only",d:"When risk is imminent and oral has failed or isn’t possible.",tone:"danger"},
 {t:"Restraint — last resort",d:"Time-limited, continuous monitoring, debrief afterward.",tone:"danger"}
];

var MATRIX={
 rows:[
  ["Trigger","Dopamine blocker (antipsychotic, antiemetic) or dopaminergic withdrawal","Serotonergic excess (SSRI + tramadol / MAOI / linezolid)"],
  ["Onset","Days (1–3)","Hours (< 24 h)"],
  ["Neuromuscular","“Lead-pipe” rigidity","Clonus, hyperreflexia, myoclonus (lower-limb)"],
  ["Reflexes","Decreased","Increased"],
  ["Pupils / gut","Normal","Mydriasis, hyperactive bowel sounds"],
  ["Labs","Marked CK ↑","Variable"],
  ["Resolution","Days–weeks","~24 h after removal"],
  ["Specific Rx","Dantrolene, bromocriptine","Cyproheptadine"]
 ],
 both:"Both: stop the offending agent, aggressive cooling, supportive care, benzodiazepines for agitation/rigidity."
};

var TIMELINE=[
 {t:"6–12 h",h:"Minor withdrawal",s:"Tremor, anxiety, headache, autonomic arousal.",tone:""},
 {t:"12–24 h",h:"Alcoholic hallucinosis",s:"Visual hallucinations with a clear sensorium.",tone:"warn"},
 {t:"24–48 h",h:"Withdrawal seizures",s:"Generalized tonic-clonic; can occur without prior signs.",tone:"warn"},
 {t:"48–72 h+",h:"Delirium tremens",s:"Confusion, fever, autonomic instability — a medical emergency with real mortality.",tone:"dgr"}
];

var VIEWS=[["trees","Decision trees"],["ladder","Agitation ladder"],["nmsss","NMS vs SS"],["withdrawal","Withdrawal timeline"],["ciwa","CIWA-Ar bands"]];

function Tree(t){
  return e("div",{className:"card"},
    e("h2",null,t.title),
    e("div",{className:"node ro"},
      e("div",{className:"nlabel"},e("span",{className:"num"},"1"),"Rule out first — can’t-miss mimics"),
      e("div",{className:"chips"}, t.ruleOut.map(function(x,i){return e("span",{className:"chip d",key:i},x);}))
    ),
    e("div",{className:"connector"}),
    e("div",{className:"escape"}, t.medical),
    e("div",{className:"connector"}),
    t.psych.length? e("div",{className:"node dx"},
      e("div",{className:"nlabel"},e("span",{className:"num"},"2"),"Psychiatric differential"),
      e("div",{className:"chips"}, t.psych.map(function(x,i){return e("span",{className:"chip",key:i},x);}))
    ):null,
    t.psych.length? e("div",{className:"connector"}):null,
    e("div",{className:"node fm"},
      e("div",{className:"nlabel"},e("span",{className:"num"},t.psych.length?"3":"2"),"First move"),
      e("div",{className:"fmtext"}, t.firstMove)
    ),
    e("div",{className:"rounds"}, e("b",null,"On rounds · "), t.rounds)
  );
}

function App(){
  var th=useState(initialTheme()),theme=th[0],setTheme=th[1];
  var vw=useState("trees"),view=vw[0],setView=vw[1];
  useEffect(function(){ try{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("cw_theme",theme);}catch(_){} },[theme]);

  function body(){
    if(view==="trees") return e("div",null, TREES.map(function(t){return e(React.Fragment,{key:t.id}, Tree(t));}));
    if(view==="ladder") return e("div",{className:"card"},
      e("h2",null,"Agitation escalation ladder"),
      e("div",{className:"cap"},"Least restrictive first. Climb only as far as the risk requires — and document why."),
      LADDER.map(function(r,i){
        var col = r.tone==="danger"?"var(--danger)":r.tone==="warning"?"var(--warning)":"var(--accent)";
        return e("div",{className:"rung",key:i,style:{borderLeftColor:col}},
          e("div",{className:"rn"}, i+1),
          e("div",null, e("div",{className:"rt"}, r.t), e("div",{className:"rd"}, r.d)));
      })
    );
    if(view==="nmsss") return e("div",{className:"card"},
      e("h2",null,"NMS vs serotonin syndrome"),
      e("div",{className:"cap"},"Two hyperthermic emergencies that look alike at the door. The reflexes split them: rigidity + hyporeflexia (NMS) vs clonus + hyperreflexia (serotonin)."),
      e("table",{className:"mtx"},
        e("thead",null,e("tr",null,e("th",null,""),e("th",{className:"nms"},"NMS"),e("th",{className:"ss"},"Serotonin syndrome"))),
        e("tbody",null, MATRIX.rows.map(function(r,i){
          return e("tr",{key:i}, e("td",{className:"f"},r[0]), e("td",null,r[1]), e("td",null,r[2]));
        }))
      ),
      e("div",{className:"both"}, MATRIX.both)
    );
    if(view==="withdrawal") return e("div",{className:"card"},
      e("h2",null,"Alcohol withdrawal timeline"),
      e("div",{className:"cap"},"Time since the last drink predicts the syndrome. Treat with symptom-triggered benzodiazepines (CIWA-Ar) and give thiamine before glucose."),
      e("div",{className:"tl"}, TIMELINE.map(function(s,i){
        return e("div",{className:"tstep "+(s.tone||""),key:i},
          e("div",{className:"tt"}, s.t),
          e("div",{className:"tb"}, e("div",{className:"th"}, s.h), e("div",{className:"ts"}, s.s)));
      }))
    );
    if(view==="ciwa") return e("div",{className:"card"},
      e("h2",null,"CIWA-Ar score bands"),
      e("div",{className:"cap"},"Symptom-triggered dosing keyed to the total score — less total benzodiazepine than fixed schedules."),
      e("div",{className:"meter"},
        e("div",{className:"seg s1"},"≤8"), e("div",{className:"seg s2"},"9–19"), e("div",{className:"seg s3"},"≥20")),
      e("div",{className:"bands"},
        e("div",{className:"band s1"}, e("span",{className:"bk"},"≤ 8"), e("span",null,"Minimal–mild — supportive care, PRN only.")),
        e("div",{className:"band s2"}, e("span",{className:"bk"},"9–19"), e("span",null,"Moderate — symptom-triggered benzodiazepine; reassess hourly.")),
        e("div",{className:"band s3"}, e("span",{className:"bk"},"≥ 20"), e("span",null,"Severe — high DTs risk; aggressive treatment, consider higher level of care."))),
      e("div",{className:"note"},"Brief teaching reference — use the full CIWA-Ar tool for scoring. ",
        e("a",{className:"more",href:"./withdrawal.html"},"Open the CIWA-Ar / COWS tool →"))
    );
  }

  return e("div",{className:"wrap"},
    e("div",{className:"head"},
      e("div",null,
        e("div",{className:"eyebrow"},"Visual learning"),
        e("h1",null,"Algorithms & Decision Aids"),
        e("div",{className:"sub"},"The can’t-miss inpatient syndromes as pictures. One grammar throughout: ",
          e("strong",{style:{color:"var(--danger)"}},"red = rule out first"),", ",
          e("strong",{style:{color:"var(--accent-d)"}},"teal = first move"),".")
      ),
      e("button",{className:"tbtn","aria-label":"Toggle light/dark theme",title:"Toggle theme",
        onClick:function(){setTheme(theme==="dark"?"light":"dark");}}, theme==="dark"?"☀":"☾")
    ),
    e("span",{className:"opt-pill"},"Optional · quick reference"),
    e("div",{className:"legend"},
      e("span",null,e("span",{className:"sw d"}),"Rule out first / can’t-miss"),
      e("span",null,e("span",{className:"sw w"}),"Caution / escalate"),
      e("span",null,e("span",{className:"sw t"}),"First move")
    ),
    e("div",{className:"nav"}, VIEWS.map(function(v){
      return e("button",{key:v[0],className:view===v[0]?"on":"",onClick:function(){setView(v[0]);}}, v[1]);
    })),
    body(),
    e("div",{className:"disc"},"Educational decision support — fictional composites only, no PHI. AI-drafted, pending faculty attestation; verify against current guidelines and your team before clinical use. ",e("br"),"Joshua Moss, MD | Psychiatrist")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
