# Netlify configuration — INTENTIONALLY minimal.
#
# Build command, publish directory, and the Git-LFS env vars are set per-site in each
# site's Netlify UI, NOT here, because:
#   1. Two sites (une-ms3-psychiatry, mmc-psychiatry-residents-sanford) share this one repo
#      with DIFFERENT build commands / publish dirs — a single toml can't express both.
#   2. GIT_LFS_ENABLED must live in the UI: netlify.toml is read AFTER the repo is cloned,
#      too late to affect the LFS checkout.
#
# The only setting here says: ALWAYS BUILD, NEVER "CANCEL".
#
# Until 2026-09-03 this file carried a build-ignore hook (netlify-ignore.sh) that cancelled
# the build when a push changed only _automation/*.md or _automation/surveillance/**. It was
# retired because Netlify records an ignore-command cancel as a FAILED deploy: the deploy
# record gets state "error" and the message "Failed during stage 'checking build content for
# changes': Canceled build due to no content change", the dashboard files it under
# "Unsuccessful", and the site's "Deploy failed" email notification fires on it. That email
# is the only alarm for a broken production deploy (added after the 2026-08-31 GitHub-LFS
# budget outage left a broken Interview Room in front of students with nobody told), and it
# is worthless if a routine no-op cancel rings it. See GIT_AND_DEPLOY_PLAN.md §7.
#
# What the hook saved is not worth the false alarms: a doc-only push now costs one ~40 s
# build per site, publishes byte-identical output, and does not move the service-worker
# VERSION (a content hash that already excludes commit-stamped files — common.py), so no
# learner re-downloads anything. Git-LFS bandwidth is unaffected on either fetch path: the
# legacy clone-time fetch ran BEFORE the hook, and the cached-pull path reads from Netlify's
# build cache. Exit code 1 from the ignore command means "content changed, build".
#
# 2026-09-10 — WHAT CHANGED AND WHAT DELIBERATELY DID NOT. The SATELLITE sites (sp-proxy,
# faculty-console, metrics, alex-tour) no longer always build: each now runs
# `13_Faculty_Resources/_automation/site_build/netlify_ignore_scoped.sh` and skips a
# PRODUCTION build whose diff does not touch its own directory. Netlify bills a production
# deploy at 15 credits (~$0.10) flat while build minutes, previews, branch deploys and
# cancelled deploys are free, so always-build across five sites was charging about
# $110/month for byte-identical republishes.
#
# THIS FILE KEEPS `/bin/false`, on purpose. It governs une-ms3-psychiatry and
# mmc-psychiatry-residents-sanford, which are built from the WHOLE repository by
# build_and_check.sh — there is no directory whose absence from a diff proves their output
# is unchanged, and shipping a learner a stale page to save a dime is the wrong trade. The
# only cost that changed here is that this file is now the exception rather than the rule.
#
# The alarm this rule was protecting moved too: `bin/check_netlify_deploy_health.py`, run
# daily by maintenance-production-canary.yml, reads deploy state from the Netlify API and
# discards exactly the "Canceled build due to no content change" cancel. Keep the "Deploy
# failed" email ON for these two sites; turn it OFF on the satellites.
# Numbers: 13_Faculty_Resources/_automation/NETLIFY_COST_REDUCTION_PLAN.md.
[build]
  ignore = "/bin/false"
