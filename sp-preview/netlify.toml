# Isolated faculty/engineering preview. Never deploy this config to either learner site.
[build]
  command = "npm ci && npm --prefix ../sp-proxy ci --omit=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/dana-preview"
  to = "/.netlify/functions/dana-preview"
  status = 200
  force = true


[[redirects]]
  from = "/api/practice-moment"
  to = "/.netlify/functions/practice-moment"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
