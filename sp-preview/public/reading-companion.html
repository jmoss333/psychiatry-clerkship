<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protected reading companion</title><link rel="stylesheet" href="reading-companion.css"><script type="module" src="reading-companion.js"></script></head>
<body><main><h1>Reading companion pilot</h1><p>Read the reviewed source, then explore a fixed question. AI explanations may be incomplete. This pilot accepts no patient details or written answers.</p><form id="access"><label for="key">Pilot access key</label><input id="key" type="password" autocomplete="off" required><button>Open reviewed reading</button></form><p id="status" role="status" aria-live="polite" aria-atomic="true"></p><button id="cancel" hidden>Cancel request</button><section id="reading" hidden><h2>Reviewed source</h2><div id="attribution"></div><div id="source"></div><h2>Explore this reading</h2><div id="presets"></div><p id="recall-question" hidden></p><button id="reveal" hidden>Reveal source-based explanation</button><div class="actions"><button id="clear">Clear</button></div><section aria-labelledby="results-heading"><h2 id="results-heading" tabindex="-1">AI explanation · check against the source</h2><div id="results"></div></section></section></main></body></html>
