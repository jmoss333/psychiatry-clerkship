<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Faculty feedback · Interview Room</title><link rel="stylesheet" href="./styles.css"><script src="./feedback.js" defer></script></head>
<body><main class="shell feedback-review-shell"><header class="masthead"><h1>Faculty feedback</h1><span class="preview-badge">Private review</span></header>
<section class="panel"><p>Saved Dana and Morgan debriefs. Ratings are faculty judgments, not automated scores.</p><form id="feedback-unlock"><label for="feedback-key">Private review key</label><input id="feedback-key" type="password" autocomplete="off" required maxlength="128"><button type="submit" class="primary">Open feedback</button></form><div id="feedback-actions" hidden><button id="feedback-refresh" type="button">Refresh feedback</button><button id="feedback-lock" type="button">Close private view</button></div><p id="feedback-status" role="status" aria-live="polite"></p></section>
<section id="feedback-records" aria-label="Saved faculty feedback"></section></main></body></html>
