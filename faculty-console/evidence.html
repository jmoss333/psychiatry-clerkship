<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Evidence review · Faculty console</title>
<style>
:root{color-scheme:light;--canvas:#eef2ef;--surface:#fff;--ink:#17211b;--muted:#5a665e;--line:#cbd5ce;--primary:#3f5c45}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:1rem/1.6 'Avenir Next','Segoe UI',sans-serif}main{max-width:1200px;margin:auto;padding:clamp(1rem,3vw,2.5rem)}h1,h2,h3{line-height:1.2}h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3rem);font-weight:normal}h2{font-size:1.5rem}p,blockquote{max-width:78ch}a{color:var(--primary)}article{background:var(--surface);padding:clamp(1rem,3vw,2rem);margin:2rem 0;border:1px solid var(--line)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}.comparison>section{min-width:0}blockquote{margin:.5rem 0;padding:.75rem 1rem;border-left:3px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.changed{border-left-color:#805000}.candidate{border-top:1px solid var(--line);padding:1rem 0}.flag{color:#805000;font-weight:600}label{display:block;margin:.8rem 0 .25rem}input,select,textarea,button{font:inherit;max-width:100%;min-height:44px}textarea{display:block;width:100%;min-height:90px}button{background:var(--primary);color:white;border:0;border-radius:4px;padding:.5rem 1rem;cursor:pointer;margin:.7rem .7rem .7rem 0}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{margin:1rem 0}summary{cursor:pointer}small{color:var(--muted)}:focus-visible{outline:3px solid #9b5d00;outline-offset:3px}.failure{border-left:4px solid #805000;padding:.5rem 1rem;background:#fff4d6}[role=status]{min-height:1.6em;white-space:pre-wrap} @media(max-width:700px){.comparison{grid-template-columns:1fr}}
</style></head><body><main><a href="./">Back to faculty console</a><h1>Evidence review</h1><p>Review what changed in a source alongside the teaching it may affect. These are review candidates; saving a disposition does not attest or publish clinical content.</p>
<form id="login"><label for="key">Faculty key</label><input id="key" type="password" autocomplete="current-password" required><button>Open evidence inbox</button></form><p role="status" id="status" aria-live="polite"></p><div id="inbox"></div></main><script type="module" src="./evidence-review.mjs"></script></body></html>
