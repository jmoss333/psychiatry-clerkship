<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Faculty Question Review Workbench</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #eef2ef;
    --surface: #ffffff;
    --ink: #17211b;
    --muted: #5a665e;
    --line: #cbd5ce;
    --primary: #3f5c45;
    --primary-text: #ffffff;
    --primary-soft: #e7eee8;
    --ready: #315238;
    --ready-soft: #edf5ee;
    --warning: #805000;
    --warning-soft: #fff4d6;
    --blocked: #8b2f2a;
    --blocked-soft: #fff0ee;
    --focus: #9b5d00;
    --shadow: 0 12px 32px rgb(23 33 27 / 0.08);
  }

  * { box-sizing: border-box; }

  html {
    min-width: 0;
    background: var(--canvas);
    text-size-adjust: 100%;
  }

  body {
    min-width: 0;
    margin: 0;
    overflow-x: hidden;
    background: var(--canvas);
    color: var(--ink);
    font: 0.95rem/1.5 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  button,
  input,
  select,
  textarea {
    max-width: 100%;
    font: inherit;
  }

  button,
  a,
  input,
  select,
  textarea {
    touch-action: manipulation;
  }

  button {
    min-height: 2.5rem;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    padding: 0.55rem 0.85rem;
  }

  button:hover:not(:disabled) { border-color: var(--primary); }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.56;
  }

  button.primary {
    border-color: var(--primary);
    background: var(--primary);
    color: var(--primary-text);
    font-weight: 700;
  }

  button.quiet { background: transparent; }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  a { color: var(--primary); }

  input[type="text"],
  input[type="password"],
  input[type="search"],
  select,
  textarea {
    width: 100%;
    min-width: 0;
    min-height: 2.6rem;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    background: var(--surface);
    color: var(--ink);
    padding: 0.55rem 0.65rem;
  }

  textarea {
    resize: vertical;
    line-height: 1.45;
  }

  input[readonly] {
    background: #f3f5f3;
    color: var(--muted);
  }

  fieldset { min-width: 0; }

  label,
  legend {
    color: var(--ink);
    font-size: 0.82rem;
    font-weight: 700;
  }

  .skip-link {
    position: fixed;
    z-index: 10;
    inset-block-start: 0.5rem;
    inset-inline-start: 0.5rem;
    translate: 0 -180%;
    border: 2px solid var(--primary);
    background: var(--surface);
    padding: 0.55rem 0.75rem;
  }

  .skip-link:focus { translate: 0; }

  .wrap {
    width: min(100%, 82rem);
    margin-inline: auto;
    padding: 1.25rem clamp(0.75rem, 2.4vw, 2rem) 4rem;
  }

  .sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    clip-path: inset(50%) !important;
    white-space: nowrap !important;
  }

  .eyebrow {
    margin: 0 0 0.2rem;
    color: var(--primary);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  h1,
  h2,
  h3,
  p { overflow-wrap: anywhere; }

  h1 {
    margin: 0;
    font-size: clamp(1.35rem, 3vw, 1.85rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  h2 {
    margin: 0;
    font-size: 1.12rem;
    line-height: 1.25;
  }

  h3 { font-size: 0.98rem; }

  .muted,
  .hint { color: var(--muted); }

  .hint {
    margin: 0.35rem 0 0;
    font-size: 0.8rem;
  }

  .login-shell {
    width: min(100%, 34rem);
    margin: clamp(2rem, 12vh, 7rem) auto 0;
  }

  .login-panel {
    margin-block-start: 1.25rem;
    border: 1px solid var(--line);
    border-block-start: 0.35rem solid var(--primary);
    background: var(--surface);
    box-shadow: var(--shadow);
    padding: clamp(1rem, 4vw, 1.5rem);
  }

  .field { min-width: 0; }

  .field label { display: block; margin-block-end: 0.3rem; }

  .field-error {
    border-inline-start: 0.25rem solid var(--blocked);
    color: var(--blocked);
    font-weight: 700;
    padding-inline-start: 0.65rem;
  }

  .login-actions,
  .header-actions,
  .content-actions,
  .session-actions,
  .batch-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.65rem;
  }

  .login-actions { margin-block-start: 1rem; }

  .console-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    padding-block-end: 1rem;
  }

  .console-subtitle { margin: 0.3rem 0 0; color: var(--muted); }

  .reviewer-strip {
    display: grid;
    grid-template-columns: minmax(12rem, 22rem) minmax(0, 1fr);
    align-items: end;
    gap: 0.9rem 1.25rem;
    border-block: 1px solid var(--line);
    background: rgb(255 255 255 / 0.58);
    padding: 0.85rem 0;
  }

  .reviewer-note { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.82rem; }

  .tab-nav { margin-block: 1rem; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    border-block-end: 1px solid var(--line);
  }

  .tab {
    margin-block-end: -1px;
    border: 0;
    border-block-end: 3px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
  }

  .tab[aria-selected="true"] {
    border-block-end-color: var(--primary);
    color: var(--ink);
  }

  [role="tabpanel"]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 4px;
  }

  .workbench {
    display: grid;
    grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
    align-items: start;
    gap: 1rem;
  }

  .queue-panel,
  .review-panel,
  .content-panel {
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .queue-panel { box-shadow: var(--shadow); }

  .panel-heading {
    border-block-end: 1px solid var(--line);
    padding: 0.9rem 1rem;
  }

  .panel-heading p { margin: 0.25rem 0 0; }

  .queue-filters {
    min-width: 0;
    margin: 0;
    border: 0;
    border-block-end: 1px solid var(--line);
    padding: 0.85rem 1rem 1rem;
  }

  .queue-filters legend { padding: 0; }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.7rem;
    margin-block-start: 0.55rem;
  }

  .filter-search { grid-column: 1 / -1; }

  .count-strip {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    margin: 0;
    border-block-end: 1px solid var(--line);
    background: #f8faf8;
  }

  .count-strip div {
    min-width: 0;
    border-inline-end: 1px solid var(--line);
    padding: 0.55rem 0.3rem;
    text-align: center;
  }

  .count-strip div:last-child { border-inline-end: 0; }

  .count-strip dt {
    color: var(--muted);
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .count-strip dd {
    margin: 0.1rem 0 0;
    font: 700 0.9rem/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  .queue-meta {
    margin: 0;
    border-block-end: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 0.55rem 1rem;
  }

  .queue-list {
    max-height: min(54rem, calc(100vh - 18rem));
    overflow-y: auto;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .queue-row {
    position: relative;
    display: grid;
    grid-template-columns: 2.6rem minmax(0, 1fr);
    min-width: 0;
    border-block-end: 1px solid var(--line);
    background: var(--surface);
  }

  .queue-row::before {
    position: absolute;
    z-index: 1;
    inset: 0 auto 0 0;
    width: 0.3rem;
    background: var(--muted);
    content: "";
  }

  .queue-row.gate-ready::before { background: var(--ready); }
  .queue-row.gate-warning::before { background: var(--warning); }
  .queue-row.gate-blocked::before { background: var(--blocked); }

  .batch-check {
    display: grid;
    place-items: center;
    min-width: 0;
    margin: 0;
    border-inline-end: 1px solid var(--line);
    cursor: pointer;
  }

  .batch-check:has(input:disabled) { cursor: not-allowed; }

  .batch-check input { width: 1rem; height: 1rem; }

  .queue-choice {
    width: 100%;
    min-width: 0;
    min-height: 5.4rem;
    border: 0;
    border-radius: 0;
    background: transparent;
    padding: 0.7rem 0.75rem;
    text-align: start;
  }

  .queue-choice:hover { background: #f6f8f6; }

  .queue-choice[aria-current="true"] {
    background: var(--primary-soft);
    box-shadow: inset 0 0 0 2px var(--primary);
  }

  .queue-id,
  .question-id,
  .data-text {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  .data-text {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .queue-id { display: block; font-size: 0.76rem; font-weight: 800; }

  .queue-stem {
    display: -webkit-box;
    overflow: hidden;
    margin-block-start: 0.25rem;
    color: var(--ink);
    font-size: 0.8rem;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .queue-detail {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.35rem;
    margin-block-start: 0.4rem;
    color: var(--muted);
    font-size: 0.7rem;
  }

  .gate-label {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-weight: 800;
  }

  .gate-label.ready { color: var(--ready); }
  .gate-label.warning { color: var(--warning); }
  .gate-label.blocked { color: var(--blocked); }

  .empty-queue { margin: 0; color: var(--muted); padding: 1.25rem 1rem; }

  .batch-summary {
    border-block-start: 1px solid var(--line);
    background: #f8faf8;
    padding: 0.75rem 1rem;
  }

  .batch-summary p { flex: 1 1 12rem; margin: 0; font-size: 0.78rem; }

  .batch-copy { min-width: 0; flex: 1 1 12rem; }

  .batch-confirmation { flex: 1 0 100%; }

  .batch-warning { color: var(--warning); font-weight: 700; }

  .review-panel { min-height: 28rem; }

  .review-sheet { padding: clamp(1rem, 2.4vw, 1.6rem); }

  .review-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    border-block-end: 1px solid var(--line);
    padding-block-end: 1rem;
  }

  .review-heading p { margin: 0.25rem 0 0; }

  .workflow-rail {
    margin-block: 1rem 1.25rem;
    border-block: 1px solid var(--line);
    background: #f8faf8;
  }

  .workflow-rail ol {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .workflow-rail li {
    position: relative;
    min-width: 0;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 800;
    padding: 0.65rem 0.7rem;
    text-align: center;
  }

  .workflow-rail li + li { border-inline-start: 1px solid var(--line); }

  .workflow-rail li + li::before {
    position: absolute;
    inset-block-start: 50%;
    inset-inline-start: 0;
    translate: -50% -50%;
    background: #f8faf8;
    color: var(--muted);
    content: "→";
    padding-inline: 0.15rem;
  }

  .workflow-rail li.complete { color: var(--ready); }

  .workflow-rail li.current {
    background: var(--primary-soft);
    color: var(--ink);
    box-shadow: inset 0 -3px 0 var(--primary);
  }

  .action-feedback:empty { display: none; }

  .action-result,
  .action-error,
  .guard-panel {
    margin-block: 1rem;
    border: 1px solid var(--line);
    border-inline-start: 0.35rem solid var(--ready);
    background: var(--ready-soft);
    padding: 0.85rem 0.9rem;
  }

  .action-error,
  .conflict-alert,
  .guard-panel {
    border-inline-start-color: var(--blocked);
    background: var(--blocked-soft);
  }

  .guard-panel h3,
  .conflict-alert h3 { margin: 0 0 0.35rem; }

  .guard-panel p,
  .conflict-alert p { margin: 0.35rem 0; }

  body:has(.modal-panel) { overflow: hidden; }

  .modal-panel {
    position: fixed;
    z-index: 100;
    inset-block-start: 50%;
    inset-inline-start: 50%;
    width: min(calc(100% - 2rem), 38rem);
    max-height: calc(100vh - 2rem);
    overflow: auto;
    margin: 0;
    box-shadow: 0 0 0 100vmax rgb(23 33 27 / 0.48), 0 1rem 3rem rgb(23 33 27 / 0.24);
    translate: -50% -50%;
  }

  .guard-actions,
  .draft-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-block-start: 0.75rem;
  }

  .editor-section {
    margin: 1rem 0 0;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 0.85rem 0.9rem 1rem;
  }

  .editor-section > legend {
    color: var(--primary);
    padding-inline: 0.35rem;
  }

  .editor-section > .field + .field,
  .teaching-section > .field + .field,
  .tier-two > .field + .field { margin-block-start: 0.85rem; }

  .editor-grid,
  .option-grid,
  .review-safety-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.85rem;
  }

  .checkbox-fieldset {
    margin: 0.85rem 0 0;
    border: 0;
    padding: 0;
  }

  .checkbox-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.8rem;
    margin-block-start: 0.35rem;
  }

  .checkbox-grid label,
  .checkbox-line,
  .radio-choice,
  .human-confirmations label,
  .warning-acknowledgements label {
    display: flex;
    align-items: flex-start;
    gap: 0.45rem;
  }

  .checkbox-line { margin-block-start: 0.85rem; }

  .checkbox-grid input,
  .checkbox-line input,
  .radio-choice input,
  .human-confirmations input,
  .warning-acknowledgements input {
    flex: 0 0 auto;
    width: 1rem;
    height: 1rem;
    margin-block-start: 0.18rem;
  }

  .option-grid { margin-block-start: 0.9rem; }

  .tier-cardinality-actions {
    display: flex;
    justify-content: flex-end;
    margin-block-start: 0.8rem;
  }

  .option-card {
    min-width: 0;
    margin: 0;
    border: 1px solid var(--line);
    background: #f8faf8;
    padding: 0.75rem;
  }

  .option-card > legend { padding-inline: 0.3rem; }

  .option-card > * + * { margin-block-start: 0.7rem; }

  .option-card .field { margin-block-start: 0.7rem; }

  .option-card.compact { background: var(--surface); }

  .governed-fields {
    display: grid;
    grid-template-columns: minmax(12rem, 0.42fr) minmax(0, 1fr);
    gap: 1rem;
    background: #f8faf8;
  }

  .governed-fields > legend { grid-column: 1 / -1; }

  .governed-fields .question-facts {
    border-inline-start: 1px solid var(--line);
    padding-inline-start: 1rem;
  }

  .review-safety-grid {
    align-items: start;
    margin-block-start: 1rem;
  }

  .change-summary,
  .safety-note {
    min-width: 0;
    margin: 0;
  }

  .change-summary {
    border-inline-start: 0.3rem solid var(--primary);
    background: #f8faf8;
    padding: 0.8rem 0.9rem;
  }

  .change-summary h3 { margin: 0 0 0.35rem; }

  .change-summary p { margin: 0; }

  .change-summary ul { margin: 0.35rem 0 0; padding-inline-start: 1.2rem; }

  .checks-stale { color: var(--warning); font-weight: 700; }

  .checks-current { color: var(--ready); font-weight: 700; }

  .issue-group h4 { margin: 0.65rem 0 0.25rem; }

  .issue-group.blocked h4 { color: var(--blocked); }

  .issue-group.warning h4 { color: var(--warning); }

  .draft-actions { justify-content: flex-end; }

  .human-confirmations,
  .warning-acknowledgements {
    margin-block-start: 1rem;
    border: 1px solid var(--line);
    padding: 0.8rem 0.9rem 0.9rem;
  }

  .human-confirmations label + label,
  .warning-acknowledgements label + label { margin-block-start: 0.65rem; }

  .human-confirmations[disabled],
  .warning-acknowledgements[disabled] { color: var(--muted); }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.22rem 0.55rem;
    font-size: 0.75rem;
    font-weight: 800;
    white-space: nowrap;
  }

  .status-chip.ready { background: var(--ready-soft); color: var(--ready); }
  .status-chip.warning { background: var(--warning-soft); color: var(--warning); }
  .status-chip.blocked { background: var(--blocked-soft); color: var(--blocked); }

  .overview-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(12rem, 0.38fr);
    gap: 1rem 1.5rem;
    margin-block-start: 1.25rem;
  }

  .stem-copy { margin: 0; font-size: clamp(1rem, 2vw, 1.17rem); line-height: 1.55; }

  .question-facts {
    margin: 0;
    border-inline-start: 1px solid var(--line);
    padding-inline-start: 1rem;
  }

  .question-facts div + div { margin-block-start: 0.65rem; }

  .question-facts dt { color: var(--muted); font-size: 0.72rem; font-weight: 700; }
  .question-facts dd { margin: 0.1rem 0 0; }

  .source-note,
  .safety-note {
    margin-block-start: 1.2rem;
    border-inline-start: 0.3rem solid var(--primary);
    background: #f8faf8;
    padding: 0.8rem 0.9rem;
  }

  .source-note h3,
  .safety-note h3 { margin: 0 0 0.3rem; }

  .source-note p,
  .safety-note p { margin: 0; }

  .safety-note.warning { border-inline-start-color: var(--warning); background: var(--warning-soft); }
  .safety-note.blocked { border-inline-start-color: var(--blocked); background: var(--blocked-soft); }

  .issue-list { margin: 0.5rem 0 0; padding-inline-start: 1.2rem; }

  .session-review {
    min-width: 0;
    margin-block-start: 1.25rem;
    border: 1px solid var(--line);
    padding: 0.8rem 0.9rem 0.9rem;
  }

  .session-review p { margin: 0.15rem 0 0.75rem; }

  .review-placeholder {
    border-block-start: 1px solid var(--line);
    color: var(--muted);
    margin: 1.25rem 0 0;
    padding-block-start: 1rem;
  }

  .content-panel { padding: 1rem; }

  .content-toolbar {
    display: grid;
    grid-template-columns: repeat(2, minmax(10rem, 15rem)) minmax(0, 1fr);
    align-items: end;
    gap: 0.75rem;
    border-block-end: 1px solid var(--line);
    padding-block-end: 1rem;
  }

  .content-actions { justify-content: flex-end; }

  .content-list { margin: 0; padding: 0; list-style: none; }

  .content-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 0.75rem;
    border-block-end: 1px solid var(--line);
    padding: 0.7rem 0;
  }

  .content-row input { width: 1rem; height: 1rem; }

  .content-title { margin: 0; font-weight: 700; }
  .content-meta { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.76rem; }

  .content-status { color: var(--muted); font-size: 0.75rem; font-weight: 700; }

  .save-strip {
    position: sticky;
    z-index: 2;
    inset-block-end: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    border-block-start: 1px solid var(--line);
    background: rgb(238 242 239 / 0.96);
    padding-block: 0.75rem;
  }

  .save-strip p { margin: 0; }

  .loading-state,
  .error-panel {
    width: min(100%, 38rem);
    margin: 4rem auto 0;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 1.2rem;
  }

  .error-panel { border-inline-start: 0.35rem solid var(--blocked); }
  .error-panel h1 { font-size: 1.2rem; }

  @media (max-width: 900px) {
    .overview-grid { grid-template-columns: minmax(0, 1fr); }
    .question-facts { border-inline-start: 0; border-block-start: 1px solid var(--line); padding: 0.8rem 0 0; }
    .content-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .content-actions { grid-column: 1 / -1; justify-content: flex-start; }
    .editor-grid,
    .option-grid,
    .review-safety-grid,
