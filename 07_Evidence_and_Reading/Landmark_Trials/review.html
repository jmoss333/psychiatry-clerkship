<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daily Review — Spaced Repetition</title>
<style>
:root{
  --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --surface2:#faf6f0; --hover:#f0e9e0;
  --border:#ddd3c6; --border2:#e7ded2;
  --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
  --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
  --text:#2f2924; --text-mid:#51473d; --text-light:#665a4f;
  --warning:#7a6234; --warning-light:#f4ecd9; --success:#357160; --success-light:#e4f1ec;
  --danger:#a34132; --danger-light:#f4e3df; --info:#41618a; --info-light:#e7eef6;
  --focus:#155eef; --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 2px 10px rgba(0,0,0,.08); --shadow-lg:0 8px 28px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:18px 18px 64px}
.topline{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px;flex:none}
.ttl{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.18rem;line-height:1.15}
.by{color:var(--text-light);font-size:.78rem}
.thmbtn{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--text);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:1rem;flex:none}
.thmbtn:hover{background:var(--hover)}
.lead{color:var(--text-mid);font-size:.95rem;margin:2px 0 16px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
@media(max-width:540px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-sm)}
.stat .num{font-family:"Source Serif 4",Georgia,serif;font-size:1.5rem;font-weight:700;line-height:1}
.stat .lab{color:var(--text-light);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.stat.due .num{color:var(--primary-dark)} .stat.streak .num{color:var(--accent-dark)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:none;border-radius:11px;padding:13px 18px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--primary);color:#fff;flex:1;min-width:200px}
.btn.primary:hover{background:var(--primary-dark)}
.btn.primary:disabled{background:var(--border);color:var(--text-light);cursor:default}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-mid)}
.btn.ghost:hover{background:var(--hover)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.panel h2{font-family:"Source Serif 4",Georgia,serif;font-size:1.04rem;margin:0 0 7px}
.muted{color:var(--text-light);font-size:.86rem}
.setrow{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:.9rem;color:var(--text-mid)}
.setrow input[type=range]{flex:1;accent-color:var(--primary)}
.linkrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-mid);border-radius:999px;padding:6px 13px;font-size:.84rem;cursor:pointer;text-decoration:none;font-family:inherit}
.chip:hover{background:var(--hover)}
.danger{color:var(--danger)}
/* session */
.sess{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden}
.sbar{height:5px;background:var(--border2)}
.sbar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.sinner{padding:18px 18px 20px}
.smeta{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.deckchip{background:var(--accent-light);color:var(--accent-dark);border-radius:999px;padding:3px 11px;font-size:.74rem;font-weight:600;letter-spacing:.02em}
.snew{background:var(--info-light);color:var(--info)}
.scount{margin-left:auto;color:var(--text-light);font-size:.8rem}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;line-height:1.4;margin:2px 0 15px}
.oeaudio{margin:0 0 14px;border:1px solid var(--border2);border-radius:9px;padding:8px 11px;background:var(--bg-alt)}
.oeaudio summary{cursor:pointer;font-size:.85rem;color:var(--accent-dark);font-weight:600;list-style:none}
.oeaudio audio{width:100%;margin-top:9px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:11px;padding:11px 13px;font-size:.95rem;color:var(--text);cursor:pointer;font-family:inherit;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--primary);background:var(--hover)}
.opt .kx{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--text-light);margin-top:1px}
.opt.correct{border-color:var(--success);background:var(--success-light)} .opt.correct .kx{background:var(--success);border-color:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-light)} .opt.wrong .kx{background:var(--danger);border-color:var(--danger);color:#fff}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin:13px 0 4px;padding:11px 13px;border-radius:10px;background:var(--bg-alt);border:1px solid var(--border2);font-size:.9rem;color:var(--text-mid)}
.fb b{color:var(--text)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.gr{border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:10px 6px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--text);text-align:center}
.gr .gk{display:block;font-size:.68rem;font-weight:500;color:var(--text-light);margin-top:2px}
.gr.again:hover,.gr.again.sug{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}
.gr.hard:hover,.gr.hard.sug{border-color:var(--warning);background:var(--warning-light);color:var(--warning)}
.gr.good:hover,.gr.good.sug{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
.gr.easy:hover,.gr.easy.sug{border-color:var(--success);background:var(--success-light);color:var(--success)}
.sfoot{display:flex;gap:12px;align-items:center;margin-top:14px;color:var(--text-light);font-size:.82rem}
.sfoot .end{margin-left:auto;background:none;border:none;color:var(--text-light);cursor:pointer;font-family:inherit;text-decoration:underline;font-size:.82rem}
.done{ text-align:center;padding:26px 18px}
.done .big{font-family:"Source Serif 4",Georgia,serif;font-size:1.4rem;margin:6px 0}
.sig{color:var(--text-light);font-size:.78rem;text-align:center;margin-top:22px;line-height:1.5}
.err{background:var(--danger-light);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:14px 16px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var e=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;
var DAY=86400000, KEY="cw_srs_v1";
var framed=(window.self!==window.top);

/* ---------- store ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function yestStr(){var d=new Date(Date.now()-DAY);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function freshStore(){return {v:1,cards:{},day:{lastDay:"",newToday:0},stats:{streak:0,lastStudy:"",totalReviews:0,correct:0,seen:0},settings:{newPerDay:12}};}
function loadS(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){s.cards=s.cards||{};s.day=s.day||{lastDay:"",newToday:0};s.stats=s.stats||freshStore().stats;s.settings=s.settings||{newPerDay:12};return s;}}catch(_){ } return freshStore();}
function saveS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(_){ }}
function rollDay(s){var t=todayStr();if(s.day.lastDay!==t){s.day.lastDay=t;s.day.newToday=0;}return s;}
function bumpStreak(s){var t=todayStr();if(s.stats.lastStudy===t)return;s.stats.streak=(s.stats.lastStudy===yestStr()?(s.stats.streak||0)+1:1);s.stats.lastStudy=t;}

/* ---------- SM-2-lite ---------- */
function applyGrade(st,g){
  st=st||{ease:2.5,ivl:0,due:0,reps:0,lapses:0};
  var ease=st.ease||2.5, ivl=st.ivl||0, reps=st.reps||0, lapses=st.lapses||0;
  if(g===0){ease=Math.max(1.3,ease-0.20);reps=0;lapses++;ivl=0;}
  else if(g===1){ease=Math.max(1.3,ease-0.15);ivl=reps===0?1:Math.max(1,Math.round(ivl*1.2));reps++;}
  else if(g===2){ivl=reps===0?1:(reps===1?3:Math.round(ivl*ease));reps++;}
  else {ease=ease+0.15;ivl=reps===0?3:Math.round((ivl||1)*ease*1.3);reps++;}
  ivl=Math.min(ivl,365);
  return {ease:ease,ivl:ivl,reps:reps,lapses:lapses,due:(g===0?Date.now():Date.now()+ivl*DAY),last:Date.now()};
}
function maturity(st){if(!st||!st.reps)return "new";if(st.ivl>=21)return "mature";if(st.lapses&&st.ivl<1)return "learning";return "young";}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- theme ---------- */
function toggleTheme(setTheme){var nx=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("cw_theme",nx);}catch(_){ } setTheme(nx); if(framed){try{window.parent.postMessage({type:"theme",mode:nx},"*");}catch(_){ }}}

function App(){
  var ld=useState(null),cards=ld[0],setCards=ld[1];
  var er=useState(false),err=er[0],setErr=er[1];
  var sv=useState(loadS()),store=sv[0],setStore=sv[1];
  var ses=useState(null),sess=ses[0],setSess=ses[1]; // {queue,pos,chosen,revealed,reviewed,correct,fresh}
  var th=useState((document.documentElement.getAttribute("data-theme")==="dark")?"dark":"light"),theme=th[0],setTheme=th[1];
  var tick=useState(0),setTick=tick[1];
  var sessRef=useRef(null); sessRef.current=sess;

  useEffect(function(){
    Promise.all([
      fetch("quizzes.json").then(function(r){return r.ok?r.json():{decks:[]};}).catch(function(){return {decks:[]};}),
      fetch("../topic_meta.json").then(function(r){return r.ok?r.json():{};}).catch(function(){return {};})
    ]).then(function(res){
      var j=res[0]||{}, tm=res[1]||{}, out=[];
      (j.decks||[]).forEach(function(d){ (d.questions||[]).forEach(function(q,i){ if(!q||!q.q||!q.o)return; out.push({id:d.id+"#"+i,deck:d.id,deckTitle:d.title||d.id,q:q.q,o:q.o,audio:d.audio||null,audioDur:d.audioDur||null}); }); });
      function pretty(k){ return k.replace(/^t_/,"").replace(/\.md$/,"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();}); }
      Object.keys(tm).forEach(function(k){ if(k.charAt(0)==="_")return; var m=tm[k]; if(m&&m.quiz&&m.quiz.q&&m.quiz.o&&m.quiz.o.length){ out.push({id:"TOPIC#"+k,deck:"TOPIC",deckTitle:"Topic · "+pretty(k),q:m.quiz.q,o:m.quiz.o.map(function(o){return {t:o.t,c:!!o.c,fb:(o.c?(m.quiz.why||""):"")};})}); } });
      if(!out.length){ setErr(true); return; }
      setCards(out);
    }).catch(function(){setErr(true);});
  },[]);
  useEffect(function(){ function onMsg(ev){var d=ev.data||{};if(d.type==="theme"&&(d.mode==="dark"||d.mode==="light")){document.documentElement.setAttribute("data-theme",d.mode);setTheme(d.mode);}} window.addEventListener("message",onMsg); return function(){window.removeEventListener("message",onMsg);}; },[]);
  useEffect(function(){ function onKey(ev){ var s=sessRef.current; if(!s)return; var k=ev.key; if(!s.revealed){ var n=parseInt(k,10); if(n>=1&&n<=s.card.o.length){choose(n-1);} } else { if(k==="1")grade(0); else if(k==="2")grade(1); else if(k==="3")grade(2); else if(k==="4")grade(3); } } window.addEventListener("keydown",onKey); return function(){window.removeEventListener("keydown",onKey);}; },[]);

  function persist(s){saveS(s);setStore(Object.assign({},s));}

  /* dashboard metrics */
  function metrics(){
    var now=Date.now(),due=0,neu=0,learn=0,young=0,mature=0,seen=0;
    if(cards){ var s=rollDay(loadS()); cards.forEach(function(c){var st=s.cards[c.id]; if(!st){neu++;return;} seen++; var m=maturity(st); if(m==="mature")mature++; else if(m==="young")young++; else learn++; if(st.due<=now)due++; }); }
    var newRemain=cards?Math.max(0,(store.settings.newPerDay||12)-(rollDay(loadS()).day.newToday||0)):0;
    return {due:due,neu:neu,newRemain:Math.min(newRemain,neu),learn:learn,young:young,mature:mature,seen:seen};
  }

  function start(ahead){
    var s=rollDay(loadS()); var now=Date.now(); var due=[],neu=[],fut=[];
    cards.forEach(function(c){var st=s.cards[c.id]; if(!st)neu.push(c); else if(st.due<=now)due.push(c); else fut.push([c,st.due]);});
    shuffle(due); shuffle(neu);
    var newRemain=Math.max(0,(s.settings.newPerDay||12)-(s.day.newToday||0));
    var q=due.concat(neu.slice(0,newRemain));
    if(ahead){ fut.sort(function(a,b){return a[1]-b[1];}); q=q.concat(fut.map(function(x){return x[0];})); }
    if(!q.length){ setSess({empty:true}); return; }
    saveS(s); setStore(Object.assign({},s));
    setSess({queue:q,pos:0,card:q[0],chosen:-1,revealed:false,reviewed:0,correct:0,total:q.length});
  }
  function choose(i){ var s=sessRef.current; if(!s||s.revealed)return; var ns=Object.assign({},s); ns.chosen=i; ns.revealed=true; setSess(ns); }
  function correctIdx(card){ for(var i=0;i<card.o.length;i++){if(card.o[i].c)return i;} return -1; }
  function grade(g){
    var s=sessRef.current; if(!s||!s.revealed)return;
    var st=loadS(); st=rollDay(st);
    var card=s.card; var existed=!!st.cards[card.id];
    var was=st.cards[card.id]; st.cards[card.id]=applyGrade(was,g);
    if(!existed){ st.day.newToday=(st.day.newToday||0)+1; }
    bumpStreak(st);
    st.stats.totalReviews=(st.stats.totalReviews||0)+1;
    var ci=correctIdx(card); var gotIt=(s.chosen===ci);
    st.stats.seen=(st.stats.seen||0)+1; if(gotIt)st.stats.correct=(st.stats.correct||0)+1;
    saveS(st); setStore(Object.assign({},st));
    // advance queue
    var q=s.queue.slice(); var pos=s.pos;
    if(g===0){ q.push(card); } // requeue lapses to end of this session
    var nextPos=pos+1;
    var reviewed=s.reviewed+1, correct=s.correct+(gotIt?1:0);
    if(nextPos>=q.length){ setSess({finished:true,reviewed:reviewed,correct:correct}); return; }
    setSess({queue:q,pos:nextPos,card:q[nextPos],chosen:-1,revealed:false,reviewed:reviewed,correct:correct,total:s.total});
  }
  function endSession(){ setSess(null); setTick(function(x){return x+1;}); }
  function setNewPerDay(v){ var s=loadS(); s.settings.newPerDay=v; persist(s); }
  function resetAll(){ if(!window.confirm("Reset all spaced-repetition progress? This clears your review schedule and streak. Reading progress elsewhere is unaffected."))return; try{localStorage.removeItem(KEY);}catch(_){ } setStore(freshStore()); setSess(null); setTick(function(x){return x+1;}); }

  var head=e("div",{className:"topline"},
    e("div",{className:"logo"},"ψ"),
    e("div",null,e("div",{className:"ttl"},"Daily Review"),e("div",{className:"by"},"Spaced repetition · Joshua Moss, MD")),
    e("button",{className:"thmbtn",onClick:function(){toggleTheme(setTheme);},title:"Toggle dark mode","aria-label":"Toggle dark mode"}, theme==="dark"?"☀":"☾"));

  if(err) return e("div",{className:"wrap"},head,e("div",{className:"err"},"Could not load the question bank (quizzes.json). Open this tool from the hub so it can find its data, then try again."));
  if(!cards) return e("div",{className:"wrap"},head,e("div",{className:"panel muted"},"Loading the question bank…"));

  /* ---- active session ---- */
  if(sess && sess.queue){
    var c=sess.card, ci=correctIdx(c), pctp=Math.round(100*sess.pos/Math.max(1,sess.total));
    var gotIt=(sess.chosen===ci);
    var fbOpt=c.o[sess.chosen]||{}; var corrOpt=c.o[ci]||{};
    var isNew=!loadS().cards[c.id];
    return e("div",{className:"wrap"},head,
      e("div",{className:"sess"},
        e("div",{className:"sbar"},e("i",{style:{width:pctp+"%"}})),
        e("div",{className:"sinner"},
          e("div",{className:"smeta"},
            e("span",{className:"deckchip"+(isNew?" snew":"")}, isNew?"New":"Review"),
            e("span",{className:"deckchip",style:{background:"var(--bg-alt)",color:"var(--text-light)"}}, c.deckTitle.length>42?c.deckTitle.slice(0,40)+"…":c.deckTitle),
            e("span",{className:"scount"}, (sess.pos+1)+" / "+sess.total)),
          e("div",{className:"qtext"}, c.q),
          c.audio? e("details",{className:"oeaudio"}, e("summary",null,"🎧 Listen — paper overview"+(c.audioDur?(" · "+c.audioDur):"")), e("audio",{controls:true,preload:"none",src:"../audio_oe/"+c.audio})) : null,
          e("div",{className:"opts"}, c.o.map(function(o,i){
            var cls="opt"; if(sess.revealed){ if(i===ci)cls+=" correct"; else if(i===sess.chosen)cls+=" wrong"; else cls+=" dim"; }
            return e("button",{key:i,className:cls,disabled:sess.revealed,onClick:function(){choose(i);}},
              e("span",{className:"kx"}, String.fromCharCode(65+i)),
              e("span",null,o.t));
          })),
          sess.revealed? e("div",{className:"fb"},
            e("b",null, gotIt?"✓ Correct. ":"✗ Not quite. "),
            (fbOpt.fb||corrOpt.fb||"") ) : null,
          sess.revealed? e("div",{className:"grades"},
            e("button",{className:"gr again"+(!gotIt?" sug":""),onClick:function(){grade(0);}},"Again",e("span",{className:"gk"},"<10m")),
            e("button",{className:"gr hard",onClick:function(){grade(1);}},"Hard",e("span",{className:"gk"},"1")),
            e("button",{className:"gr good"+(gotIt?" sug":""),onClick:function(){grade(2);}},"Good",e("span",{className:"gk"},"↑")),
            e("button",{className:"gr easy",onClick:function(){grade(3);}},"Easy",e("span",{className:"gk"},"↑↑"))
          ) : e("div",{className:"muted",style:{marginTop:"10px"}},"Pick the best answer (or press 1–"+c.o.length+")."),
          e("div",{className:"sfoot"},
            e("span",null,"✓ "+sess.correct+" correct"),
            e("button",{className:"end",onClick:endSession},"End session"))
        )));
  }

  /* ---- session finished / empty ---- */
  if(sess && sess.finished){
    var rt=sess.reviewed?Math.round(100*sess.correct/sess.reviewed):0;
    return e("div",{className:"wrap"},head,
      e("div",{className:"sess"},e("div",{className:"done"},
        e("div",{style:{fontSize:"2rem"}},"🎉"),
        e("div",{className:"big"},"Session complete"),
        e("div",{className:"muted"},sess.reviewed+" cards reviewed · "+rt+"% correct · "+(store.stats.streak||1)+"-day streak"),
        e("div",{style:{marginTop:"16px"}},
          e("button",{className:"btn primary",style:{minWidth:"0",flex:"none",padding:"11px 22px"},onClick:endSession},"Back to dashboard")))));
  }
  if(sess && sess.empty){
    return e("div",{className:"wrap"},head,
      e("div",{className:"panel"},e("h2",null,"All caught up ✓"),
        e("div",{className:"muted"},"Nothing is due right now and you’ve hit today’s new-card limit. Come back tomorrow, or study ahead below."),
        e("div",{style:{marginTop:"12px"}},e("button",{className:"btn ghost",onClick:function(){start(true);}},"Study ahead"),
          e("button",{className:"btn ghost",style:{marginLeft:"8px"},onClick:endSession},"Back"))));
  }

  /* ---- dashboard ---- */
  var m=metrics();
  var canStart=(m.due+m.newRemain)>0;
  return e("div",{className:"wrap"},head,
    e("div",{className:"lead"},"Spaced repetition schedules each board-style question to return just before you’d forget it. A few minutes a day beats cramming. Grade yourself honestly."),
    e("div",{className:"statgrid"},
      e("div",{className:"stat due"},e("div",{className:"num"},m.due+m.newRemain),e("div",{className:"lab"},"Due now")),
      e("div",{className:"stat streak"},e("div",{className:"num"},store.stats.streak||0),e("div",{className:"lab"},"Day streak")),
      e("div",{className:"stat"},e("div",{className:"num"},m.mature+m.young),e("div",{className:"lab"},"Learned")),
      e("div",{className:"stat"},e("div",{className:"num"},store.stats.seen?Math.round(100*(store.stats.correct||0)/store.stats.seen):0)+"%",e("div",{className:"lab"},"Retention"))),
    e("div",{className:"cta"},
