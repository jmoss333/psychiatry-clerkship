<style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var e=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;
var DAY=86400000, KEY="cw_srs_v1";
var framed=(window.self!==window.top);

/* ---------- store ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
/* Deterministic per-(card, local day) display order for answer options. quizzes.json stores
   50.3% of correct answers in first position and options rendered unshuffled since launch,
   inflating the retention stat and SM-2 intervals. Seeding by id+day keeps the order stable
   across React re-renders and same-day resumes (no mid-question reshuffle when revealing),
   while re-scrambling tomorrow so repeat exposures can't lean on position memory. Letters
   are display-position-derived (String.fromCharCode(65+pos)), so relabeling is automatic. */
/* FNV-1a seed + xorshift32 steps — NOT a bare LCG: an LCG's low-order bits cycle with tiny
   periods, and `% (j+1)` reads exactly those bits (first attempt produced only 5 of the 24
   possible orders and NEVER left the stored-first option in first place — a new bias in
   place of the old one). Verified across 200 ids: 24/24 permutations, first-position ≈ 1/4. */
function optOrder(card){var s=String(card.id)+"|"+todayStr(),seed=2166136261,i;for(i=0;i<s.length;i++){seed^=s.charCodeAt(i);seed=Math.imul(seed,16777619)>>>0;}var idx=card.o.map(function(_,j){return j;});for(var j=idx.length-1;j>0;j--){seed^=seed<<13;seed>>>=0;seed^=seed>>>17;seed^=seed<<5;seed>>>=0;var k=seed%(j+1);var t=idx[j];idx[j]=idx[k];idx[k]=t;}return idx;}
function yestStr(){var d=new Date(Date.now()-DAY);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function freshStore(){return {v:1,cards:{},day:{lastDay:"",newToday:0},stats:{streak:0,lastStudy:"",totalReviews:0,correct:0,seen:0,choiceSeen:0,choiceCorrect:0,recallSeen:0,recallGoodEasy:0},settings:{newPerDay:12}};}
/* #324 backfill: sliders set before userSet existed. Every cw_srs_v1 writer defaults
   newPerDay to 12, so a non-12 value proves an explicit choice. Learners who explicitly
   chose exactly 12 are irreducibly indistinguishable from the default and stay cappable. */
function loadS(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){s.cards=s.cards||{};s.day=s.day||{lastDay:"",newToday:0};s.stats=s.stats||freshStore().stats;s.settings=s.settings||{newPerDay:12};if(!('userSet' in s.settings) && s.settings.newPerDay && s.settings.newPerDay!==12){ s.settings.userSet=true; }return s;}}catch(_){ } return freshStore();}
function saveS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(_){ }}
function rollDay(s){var t=todayStr();if(s.day.lastDay!==t){s.day.lastDay=t;s.day.newToday=0;}return s;}
function bumpStreak(s){var t=todayStr();if(s.stats.lastStudy===t)return;s.stats.streak=(s.stats.lastStudy===yestStr()?(s.stats.streak||0)+1:1);s.stats.lastStudy=t;}

/* ---------- SM-2 ---------- */
/* Migrated 2026-08-03 to the canonical shared SM-2 grader (applyGrade, build-
   injected from site_build/sm2_apply_grade.js) — master-plan decision D7,
   accepted. Deltas vs. the old SM-2-lite for existing cards: (1) first-Good
   schedules 1 d, was the 1→3-day ladder; (2) first-Easy schedules 4 d, was
   3 d; (3) reps no longer reset on a lapse; (4) same-session requeue of
   misses (q.push(card) below) is unchanged. */
var GRADE_NAMES=["Again","Hard","Good","Easy"]; // grade buttons stay 0-3; mapped onto the canonical string grades
/*__SM2_APPLY_GRADE__*/

/*__CALIB_LOG__*/
/*__PHASE_POLICY__*/
/*__BLOCK_STORE__*/
/*__SESSION_RECEIPT__*/
/*__FAM_RETRIEVAL__*/
/*__CONCEPT_RECALL__*/

/* Readable label for a content ref ("t_mood.md" -> "Mood"). Shared by the topic-card titles and
   the receipt's re-read links so one page never gets two spellings. */
function prettyRef(k){ return String(k||"").replace(/^t_/,"").replace(/^pg_/,"").replace(/\.md$/,"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();}); }

/* Family retrieval cards for the daily queue — the third card source, after the landmark decks
   and the per-topic quizzes. One card per authored prompt per scenario, under the SAME ids
   family-systems-practice.html writes (famCardId, injected above), so a prompt graded in either
   place moves one schedule rather than two. The reveal text is the scenario's own authored
   content; nothing clinical originates here.

   These cards are why the queue needed a second shape: a family prompt has no options to pick,
   so it is answered aloud and then self-rated against the model. See card.kind below. */
function famRecallCards(data){
  var list=(data&&data.scenarios)||[], out=[], i, j;
  if(Object.prototype.toString.call(list)!=='[object Array]') return out;
  for(i=0;i<list.length;i++){
    var it=list[i]; if(!it||!it.id) continue;
    var prompts=famRetrievalFor(it);
    for(j=0;j<prompts.length;j++){
      var rp=prompts[j]; if(!rp||!rp.id||!rp.prompt) continue;
      var reveal=famRevealContent(it,rp); if(reveal==null) continue;
      out.push({
        id:famCardId(it.id,rp.id), deck:"FAM", deckTitle:"Family · "+(it.title||it.id),
        kind:"recall", seededOnly:true, q:rp.prompt, reveal:reveal,
        page:(it.linkedPages&&it.linkedPages[0])||null
      });
    }
  }
  return out;
}

/* Which cards this tool may put in front of a learner. A card marked `seededOnly` qualifies
   only once it already has a schedule — i.e. the learner has met it in the tool that authored
   it. That is deliberate on both ends: the due row counts DUE cards, which by definition
   already have a schedule, so serving exactly those closes the counted-but-never-served gap;
   and every seededOnly card is written to be answered with its own tool's context on screen (a
   family prompt beside its scenario, a reasoning step beside its patient brief), not sprung
   cold as a new card here. So this page reviews what the tools taught; it never introduces.

   The flag is per-card and not per-kind: the family cards are `recall` and the communication
   and reasoning cards are `choice`, but all three are seeded by their own tool. Decks and topic
   quizzes carry no flag and remain the only sources feeding the daily new-card allowance. */
function queueable(card, cardState){ return !card || !card.seededOnly || !!cardState; }

/* ---------- review lanes ---------- */
function reviewLane(card){ return /^(?:AR|SP)-\d+#\d+$/.test(String(card&&card.id||''))?'landmark':'clerkship'; }
function reviewLaneAllows(card,lane,cardState,now){
  if(lane==='all')return !!cardState&&cardState.due<=now;
  return reviewLane(card)===lane;
}
function reviewInitialLane(search){
  var q=new URLSearchParams(search||'');
  if(q.get('block')==='1'||q.get('lane')==='all')return 'all';
  return q.get('lane')==='landmark'?'landmark':'clerkship';
}
function reviewFocusedCard(cards,search,companions){
  var id=new URLSearchParams(search||'').get('focus');
  var pairs=companions&&companions.pairs||[];
  if(!id||!pairs.some(function(p){return p.clinicalCardId===id||p.articleCardId===id;}))return null;
  return (cards||[]).filter(function(c){return c.id===id;})[0]||null;
}
function reviewFocusAllowed(card,cardState,newRemaining){ return !!card&&(!!cardState||newRemaining>0); }
/* A changed answer must be seen again even when the old card has a long interval.
   Record the revision in the shared store only after the verified, revised card loads;
   keep prior grades and stats, and bring just its due date forward once. */
var REVIEW_CARD_REVISIONS={
  'AR-24#5':{revision:'2026-09-27-catie-persistence-metabolic',
    question:'In CATIE phase 1, what trade-off was observed among the studied non-clozapine antipsychotics?'}
};
function reviewReopenRevisedCards(cards,stored,now){
  if(!stored||!stored.cards||!Number.isFinite(now))return false;
  var revisions=stored.reviewCardRevisions;
  if(!revisions||typeof revisions!=='object'||Array.isArray(revisions))revisions={};
  var changed=false;
  (cards||[]).forEach(function(card){
    var spec=card&&REVIEW_CARD_REVISIONS[card.id];
    if(!spec||card.q!==spec.question||revisions[card.id]===spec.revision)return;
    revisions[card.id]=spec.revision;changed=true;
    var previous=stored.cards[card.id];
    if(previous&&(!Number.isFinite(previous.due)||previous.due>now))previous.due=now;
  });
  if(changed)stored.reviewCardRevisions=revisions;
  return changed;
}
function reviewVerifiedArticles(out){
  if(!out||!Array.isArray(out.decks)||!out.decks.length||out.deckCount!==out.decks.length||
      !Number.isInteger(out.questionCount)||out.questionCount<1)throw Error('article feed incomplete');
  var count=0;
  out.decks.forEach(function(deck){
    if(!deck||typeof deck.id!=='string'||!Array.isArray(deck.questions)||!deck.questions.length)throw Error('article deck incomplete');
    deck.questions.forEach(function(q){
      if(!q||typeof q.q!=='string'||!q.q||!Array.isArray(q.o)||!q.o.length)throw Error('article question incomplete');
      count++;
    });
  });
  if(count!==out.questionCount)throw Error('article count mismatch');
  return out;
}
function reviewVerifiedCompanions(out){
  if(!out||out.schemaVersion!==1||!Array.isArray(out.pairs))throw Error('companion feed incomplete');
  out.pairs.forEach(function(pair){
    if(!pair||!pair.articleCardId||!pair.clinicalCardId||!pair.result||!pair.limitation||!pair.url)
      throw Error('companion pair incomplete');
  });
  return out;
}
function reviewVerifiedTopics(out){
  if(!out||typeof out!=='object'||Array.isArray(out))throw Error('topic feed incomplete');
  var count=0;
  Object.keys(out).forEach(function(key){
    if(key.charAt(0)==='_')return;
    var quiz=out[key]&&out[key].quiz;
    if(quiz==null)return;
    if(!quiz.q||!Array.isArray(quiz.o)||!quiz.o.length||!quiz.o.some(function(option){return option&&option.c;}))
      throw Error('topic question incomplete');
    count++;
  });
  if(!count)throw Error('topic feed has no questions');
  return out;
}
function reviewVerifiedCases(out,kind){
  var key=kind==='family'?'scenarios':'cases';
  if(!out||!Array.isArray(out[key])||!out[key].length)throw Error('practice feed incomplete');
  if(kind==='family'&&out.scenarios.some(function(item){
    var prompts=item&&famRetrievalFor(item);
    return !item||!item.id||!prompts.length||famRecallCards({scenarios:[item]}).length!==prompts.length;
  }))throw Error('family cards incomplete');
  if(kind==='communication'&&commChoiceCards(out).length!==out.cases.length)throw Error('communication cards incomplete');
  if(kind==='reasoning'&&out.cases.some(function(item){
    return !item||!Array.isArray(item.steps)||!item.steps.length||reasonChoiceCards({cases:[item]}).length!==item.steps.length;
  }))throw Error('reasoning cards incomplete');
  return out;
}
function reviewMissingDueIds(cards,stored,now){
  var loaded={},missing=[];
  (cards||[]).forEach(function(card){loaded[card.id]=true;});
  Object.keys(stored&&stored.cards||{}).forEach(function(id){
    var state=stored.cards[id];
    if(!state||!Number.isFinite(state.due)||state.due>now)return;
