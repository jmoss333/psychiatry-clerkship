<style>
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:root{
  --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --surface2:#faf6f0; --hover:#f0e9e0;

}

.gr{border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:10px 6px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--text);text-align:center}
.gr:disabled{opacity:.38;cursor:default}
.gr .gk{display:block;font-size:.68rem;font-weight:500;color:var(--text-light);margin-top:2px}
.gr.again:hover,.gr.again.sug{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}

.done .big{font-family:"Source Serif 4",Georgia,serif;font-size:1.4rem;margin:6px 0}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var e=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;
var DAY=86400000, KEY="cw_srs_v1";
var framed=(window.self!==window.top);

/* ---------- store ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
/* Deterministic per-(card, local day) display order for answer options. quizzes.json stores
   50.3% of correct answers in first position and options rendered unshuffled since launch,
   inflating the retention stat and SM-2 intervals. Seeding by id+day keeps the order stable
   across React re-renders and same-day resumes (no mid-question reshuffle when revealing),
   while re-scrambling tomorrow so repeat exposures can't lean on position memory. Letters
   are display-position-derived (String.fromCharCode(65+pos)), so relabeling is automatic. */
/* FNV-1a seed + xorshift32 steps — NOT a bare LCG: an LCG's low-order bits cycle with tiny
   periods, and `% (j+1)` reads exactly those bits (first attempt produced only 5 of the 24
   possible orders and NEVER left the stored-first option in first place — a new bias in
   place of the old one). Verified across 200 ids: 24/24 permutations, first-position ≈ 1/4. */
function optOrder(card){var s=String(card.id)+"|"+todayStr(),seed=2166136261,i;for(i=0;i<s.length;i++){seed^=s.charCodeAt(i);seed=Math.imul(seed,16777619)>>>0;}var idx=card.o.map(function(_,j){return j;});for(var j=idx.length-1;j>0;j--){seed^=seed<<13;seed>>>=0;seed^=seed>>>17;seed^=seed<<5;seed>>>=0;var k=seed%(j+1);var t=idx[j];idx[j]=idx[k];idx[k]=t;}return idx;}
function yestStr(){var d=new Date(Date.now()-DAY);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function freshStore(){return {v:1,cards:{},day:{lastDay:"",newToday:0},stats:{streak:0,lastStudy:"",totalReviews:0,correct:0,seen:0},settings:{newPerDay:12}};}
/* #324 backfill: sliders set before userSet existed. Every cw_srs_v1 writer defaults
   newPerDay to 12, so a non-12 value proves an explicit choice. Learners who explicitly
   chose exactly 12 are irreducibly indistinguishable from the default and stay cappable. */
function loadS(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){s.cards=s.cards||{};s.day=s.day||{lastDay:"",newToday:0};s.stats=s.stats||freshStore().stats;s.settings=s.settings||{newPerDay:12};if(!('userSet' in s.settings) && s.settings.newPerDay && s.settings.newPerDay!==12){ s.settings.userSet=true; }return s;}}catch(_){ } return freshStore();}
function saveS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(_){ }}
function rollDay(s){var t=todayStr();if(s.day.lastDay!==t){s.day.lastDay=t;s.day.newToday=0;}return s;}
function bumpStreak(s){var t=todayStr();if(s.stats.lastStudy===t)return;s.stats.streak=(s.stats.lastStudy===yestStr()?(s.stats.streak||0)+1:1);s.stats.lastStudy=t;}

/* ---------- SM-2 ---------- */
/* Migrated 2026-08-03 to the canonical shared SM-2 grader (applyGrade, build-
   injected from site_build/sm2_apply_grade.js) — master-plan decision D7,
   accepted. Deltas vs. the old SM-2-lite for existing cards: (1) first-Good
   schedules 1 d, was the 1→3-day ladder; (2) first-Easy schedules 4 d, was
   3 d; (3) reps no longer reset on a lapse; (4) same-session requeue of
   misses (q.push(card) below) is unchanged. */
var GRADE_NAMES=["Again","Hard","Good","Easy"]; // grade buttons stay 0-3; mapped onto the canonical string grades
/*__SM2_APPLY_GRADE__*/

/*__CALIB_LOG__*/
/*__PHASE_POLICY__*/
/*__BLOCK_STORE__*/
/*__SESSION_RECEIPT__*/
/*__FAM_RETRIEVAL__*/

/* Readable label for a content ref ("t_mood.md" -> "Mood"). Shared by the topic-card titles and
   the receipt's re-read links so one page never gets two spellings. */
function prettyRef(k){ return String(k||"").replace(/^t_/,"").replace(/^pg_/,"").replace(/\.md$/,"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();}); }

/* Family retrieval cards for the daily queue — the third card source, after the landmark decks
   and the per-topic quizzes. One card per authored prompt per scenario, under the SAME ids
   family-systems-practice.html writes (famCardId, injected above), so a prompt graded in either
   place moves one schedule rather than two. The reveal text is the scenario's own authored
   content; nothing clinical originates here.

   These cards are why the queue needed a second shape: a family prompt has no options to pick,
   so it is answered aloud and then self-rated against the model. See card.kind below. */
function famRecallCards(data){
  var list=(data&&data.scenarios)||[], out=[], i, j;
  if(Object.prototype.toString.call(list)!=='[object Array]') return out;
  for(i=0;i<list.length;i++){
    var it=list[i]; if(!it||!it.id) continue;
    var prompts=famRetrievalFor(it);
    for(j=0;j<prompts.length;j++){
      var rp=prompts[j]; if(!rp||!rp.id||!rp.prompt) continue;
      var reveal=famRevealContent(it,rp); if(reveal==null) continue;
      out.push({
        id:famCardId(it.id,rp.id), deck:"FAM", deckTitle:"Family · "+(it.title||it.id),
        kind:"recall", seededOnly:true, q:rp.prompt, reveal:reveal,
        page:(it.linkedPages&&it.linkedPages[0])||null
      });
    }
  }
  return out;
}

/* Which cards this tool may put in front of a learner. A card marked `seededOnly` qualifies
   only once it already has a schedule — i.e. the learner has met it in the tool that authored
   it. That is deliberate on both ends: the due row counts DUE cards, which by definition
   already have a schedule, so serving exactly those closes the counted-but-never-served gap;
   and every seededOnly card is written to be answered with its own tool's context on screen (a
   family prompt beside its scenario, a reasoning step beside its patient brief), not sprung
   cold as a new card here. So this page reviews what the tools taught; it never introduces.

   The flag is per-card and not per-kind: the family cards are `recall` and the communication
   and reasoning cards are `choice`, but all three are seeded by their own tool. Decks and topic
   quizzes carry no flag and remain the only sources feeding the daily new-card allowance. */
function queueable(card, cardState){ return !card || !card.seededOnly || !!cardState; }

/* Map a tool's authored choices onto the queue's option shape. Both tools grade an option by
   `quality` rather than a boolean, so `best` becomes the correct answer and the option's own
   feedback becomes its explanation.

   Rejecting anything but exactly one `best` is the point of the guard, not a formality:
   correctIdx() takes the FIRST option flagged correct, so a case authored with two bests would
   score a learner who picked the second one wrong, and one authored with none would mark every
   answer wrong. Returning null drops that case from the queue instead — the tools themselves
   still teach it, and the schema validators still see it. */
function choiceOptions(choices){
  var arr=(Object.prototype.toString.call(choices)==='[object Array]')?choices:[], out=[], best=0, i;
  for(i=0;i<arr.length;i++){
    var ch=arr[i];
    if(!ch||typeof ch.text!=='string'||!ch.text) return null;
    var isBest=(ch.quality==='best'); if(isBest) best++;
    out.push({t:ch.text, c:isBest, fb:typeof ch.feedback==='string'?ch.feedback:""});
  }
  return (out.length>1&&best===1)?out:null;
}

/* Communication cards — one per case, under the SAME ids communication-practice.html writes.
   The case prompt is self-contained (it quotes the patient), so it needs no stem. What the
   review cannot reproduce is that tool's twenty-second spoken rep before the choices appear;
   this is recognition practice on a line the learner has already tried to say. */
function commChoiceCards(data){
  var list=(data&&data.cases)||[], out=[], i;
  if(Object.prototype.toString.call(list)!=='[object Array]') return out;
  for(i=0;i<list.length;i++){
    var c=list[i]; if(!c||!c.id||!c.prompt) continue;
    var opts=choiceOptions(c.choices); if(!opts) continue;
    out.push({
      id:"COMM#"+c.id, deck:"COMM", deckTitle:"Communication · "+(c.title||c.id),
      kind:"choice", seededOnly:true, q:c.prompt, o:opts, stem:c.setting||null
    });
  }
  return out;
}

/* Reasoning cards — one per STEP, under the same ids diagnostic-reasoning.html writes. A case's
   steps test different moves and a learner can be solid on one and lost on the next, so they
   schedule separately.

   The patient brief rides along as the card's stem because it is NOT optional context: a step
   asks things like "which one-liner best captures the syndrome", which is unanswerable without
   the case. In the tool the brief is on screen throughout; a step without it here would be a
   different, harder, and unfair question. A step whose case has no brief is dropped rather than
   served bare. */
function reasonChoiceCards(data){
  var list=(data&&data.cases)||[], out=[], i, j;
  if(Object.prototype.toString.call(list)!=='[object Array]') return out;
  for(i=0;i<list.length;i++){
    var c=list[i]; if(!c||!c.id||!c.patientBrief) continue;
    var steps=(Object.prototype.toString.call(c.steps)==='[object Array]')?c.steps:[];
    for(j=0;j<steps.length;j++){
      var st=steps[j]; if(!st||!st.id||!st.prompt) continue;
      var opts=choiceOptions(st.choices); if(!opts) continue;
      out.push({
        id:"REASON#"+c.id+"#"+st.id, deck:"REASON",
        deckTitle:"Reasoning · "+(c.title||c.id)+" · "+(st.title||st.id),
        kind:"choice", seededOnly:true, q:st.prompt, o:opts, stem:c.patientBrief
      });
    }
  }
  return out;
}

/* A reveal is either the scenario's opening line (a string) or one of its authored sections
   (a list). Rendered as text, never as markup. */
function revealNodes(reveal){
  if(typeof reveal==='string') return e("p",{className:"rvl__p"}, reveal);
  var arr=(Object.prototype.toString.call(reveal)==='[object Array]')?reveal:[];
  return e("ul",{className:"rvl__list"}, arr.map(function(x,i){ return e("li",{key:i}, x); }));
}
/* effectiveNewPerDay: the single helper BOTH the metrics() display and start()'s
   queue-build call — patching only one leaves the other unthrottled. An explicit
   learner choice (setNewPerDay, which sets settings.userSet) always wins over the
   rotation-phase cap; phasePolicy() itself never throws, but the try/catch keeps
   this helper safe even if that contract ever changes. */
function effectiveNewPerDay(s){
  var set=(s.settings&&s.settings.newPerDay)||12;
  if(s.settings&&s.settings.userSet) return set;             /* explicit choice always wins */
  var cap=12; try{ cap=phasePolicy().newPerDayCap; }catch(_){ }
  return Math.min(set, cap);
}
var gradedThisSession={}; // session-local: has card.id already been graded once this session? (a requeued Again-card's 2nd grade sets calibLog's rq flag). Reset in start().
function maturity(st){if(!st||!st.reps)return "new";if(st.ivl>=21)return "mature";if(st.lapses&&st.ivl<=1)return "learning";return "young";}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- theme ---------- */
function toggleTheme(setTheme){var nx=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("cw_theme",nx);}catch(_){ } setTheme(nx); if(framed){try{window.parent.postMessage({type:"theme",mode:nx},"*");}catch(_){ }}}

function App(){
  var ld=useState(null),cards=ld[0],setCards=ld[1];
  var er=useState(false),err=er[0],setErr=er[1];
  var sv=useState(loadS()),store=sv[0],setStore=sv[1];
  var ses=useState(null),sess=ses[0],setSess=ses[1]; // {queue,pos,chosen,revealed,reviewed,correct,fresh}
  var th=useState((document.documentElement.getAttribute("data-theme")==="dark")?"dark":"light"),theme=th[0],setTheme=th[1];
  var tick=useState(0),setTick=tick[1];
  var sessRef=useRef(null); sessRef.current=sess;
  var blockAutoStart=useRef(null), blockLimit=useRef(null);
  useEffect(function(){ if(cards&&blockAutoStart.current&&!sess){ blockLimit.current=blockAutoStart.current; blockAutoStart.current=null; start(false); } },[cards]);

  useEffect(function(){
    Promise.all([
      fetch("quizzes.json").then(function(r){return r.ok?r.json():{decks:[]};}).catch(function(){return {decks:[]};}),
      fetch("../topic_meta.json").then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}),
      fetch("../family_systems_scenarios.json").then(function(r){return r.ok?r.json():{scenarios:[]};}).catch(function(){return {scenarios:[]};}),
      fetch("../communication_cases.json").then(function(r){return r.ok?r.json():{cases:[]};}).catch(function(){return {cases:[]};}),
      /* the res build overwrites this file with reasoning_cases_resident.json, so one path
         serves the right audience without the page knowing which site it is on */
      fetch("../reasoning_cases.json").then(function(r){return r.ok?r.json():{cases:[]};}).catch(function(){return {cases:[]};})
    ]).then(function(res){
      /* One builder per source, concatenated into the single queue. A source that fails to load
         contributes nothing and the rest still runs; another source later is a builder plus a
         fetch. Order matters only for which cards a same-due-time tie serves first — the queue
         is sorted by due date below. */
      var j=res[0]||{}, tm=res[1]||{}, fam=res[2]||{}, comm=res[3]||{}, reason=res[4]||{}, out=[];
      (j.decks||[]).forEach(function(d){ (d.questions||[]).forEach(function(q,i){ if(!q||!q.q||!q.o)return; out.push({id:d.id+"#"+i,deck:d.id,deckTitle:d.title||d.id,kind:"choice",q:q.q,o:q.o,audio:d.audio||null,audioDur:d.audioDur||null}); }); });
      Object.keys(tm).forEach(function(k){ if(k.charAt(0)==="_")return; var m=tm[k]; if(m&&m.quiz&&m.quiz.q&&m.quiz.o&&m.quiz.o.length){ out.push({id:"TOPIC#"+k,deck:"TOPIC",deckTitle:"Topic · "+prettyRef(k),kind:"choice",q:m.quiz.q,o:m.quiz.o.map(function(o){return {t:o.t,c:!!o.c,fb:(o.c?(m.quiz.why||""):"")};})}); } });
      out=out.concat(famRecallCards(fam));
      out=out.concat(commChoiceCards(comm));

      try{ var bp=new URLSearchParams(location.search); if(bp.get("block")==="1"){ var lim=parseInt(bp.get("limit")||"",10); blockAutoStart.current=(lim>=1&&lim<=50)?lim:5; } }catch(_){ }
    }).catch(function(){setErr(true);});
  },[]);
  useEffect(function(){ function onMsg(ev){var d=ev.data||{};if(d.type==="theme"&&(d.mode==="dark"||d.mode==="light")){document.documentElement.setAttribute("data-theme",d.mode);setTheme(d.mode);}} window.addEventListener("message",onMsg); return function(){window.removeEventListener("message",onMsg);}; },[]);
  useEffect(function(){ function onKey(ev){ var s=sessRef.current; if(!s||!s.card)return; var k=ev.key; if(!s.revealed){ if(s.card.kind==='recall'){ if(k==="Enter")revealCard(); } else { var n=parseInt(k,10); if(s.card.o&&n>=1&&n<=s.card.o.length){choose(optOrder(s.card)[n-1]);} } } else { if(k==="1")grade(0); else if(k==="2")grade(1); else if(k==="3")grade(2); else if(k==="4")grade(3); } } window.addEventListener("keydown",onKey); return function(){window.removeEventListener("keydown",onKey);}; },[]);

  function persist(s){saveS(s);setStore(Object.assign({},s));}

    var newRemain=cards?Math.max(0,effectiveNewPerDay(store)-(rollDay(loadS()).day.newToday||0)):0;
    return {due:due,neu:neu,newRemain:Math.min(newRemain,neu),learn:learn,young:young,mature:mature,seen:seen};
  }

  function start(ahead){
    var s=rollDay(loadS()); var now=Date.now(); var due=[],neu=[],fut=[];

    /* Overdue-first: sort by how overdue each card is (ratio, not raw days) so

       keep light variety without undoing the ordering. */
    function ratio(c){var st=s.cards[c.id]; return (now-st.due)/((st.ivl||1)*DAY);}
    due.sort(function(a,b){ return ratio(b)-ratio(a); });
    for(var i=0;i<due.length;i+=5){ var band=due.slice(i,i+5); shuffle(band); for(var j=0;j<band.length;j++) due[i+j]=band[j]; }
    shuffle(neu);
    var newRemain=Math.max(0,effectiveNewPerDay(s)-(s.day.newToday||0));
    var q=due.concat(neu.slice(0,newRemain));
    if(ahead){ fut.sort(function(a,b){return a[1]-b[1];}); q=q.concat(fut.map(function(x){return x[0];})); }

    var limit=blockLimit.current; blockLimit.current=null; var fromBlock=(typeof limit==='number'&&limit>=1);

  }
  function choose(i){ var s=sessRef.current; if(!s||s.revealed)return; var ns=Object.assign({},s); ns.chosen=i; ns.revealed=true; setSess(ns); }
  /* A recall card carries no options, so -1 is the honest answer rather than a crash. */
  function correctIdx(card){ if(!card||!card.o)return -1; for(var i=0;i<card.o.length;i++){if(card.o[i].c)return i;} return -1; }
  function revealCard(){ var s=sessRef.current; if(!s||s.revealed)return; var ns=Object.assign({},s); ns.chosen=-1; ns.revealed=true; setSess(ns); }
  function grade(g){
    var s=sessRef.current; if(!s||!s.revealed)return;
    var isRecall=!!(s.card&&s.card.kind==='recall');
    /* Objectively missed answers cannot self-grade Good/Easy — tapping Easy on a miss
       inflated SM-2 intervals. Wrong => Again or Hard only; the buttons disable to match,
       and this guard also covers the keyboard shortcuts (keys 3/4). A recall card has no
       objective outcome — the learner is rating their own answer against the model — so all

    st.cards[card.id]=applyGrade(was,GRADE_NAMES[g],{fuzzKey:card.id});
    if(!existed){ st.day.newToday=(st.day.newToday||0)+1; }
    bumpStreak(st);
    st.stats.totalReviews=(st.stats.totalReviews||0)+1;
    var ci=correctIdx(card); var gotIt=isRecall?(g>=2):(s.chosen===ci);
    st.stats.seen=(st.stats.seen||0)+1; if(gotIt)st.stats.correct=(st.stats.correct||0)+1;
    saveS(st); setStore(Object.assign({},st));

    calibLog({s:'rev',id:card.id,p:GRADE_NAMES[g]||g,sug:sug,a:gotIt?1:0,rq:rq,ts:Date.now()});

    var q=s.queue.slice(); var pos=s.pos;
    if(g===0){ q.push(card); } // requeue lapses to end of this session
    var nextPos=pos+1;
    var reviewed=s.reviewed+1, correct=s.correct+(gotIt?1:0);
    var misses=(s.misses||[]).slice(); if(!gotIt&&!misses.some(function(m){return m.id===card.id;})) misses.push({id:card.id,deckTitle:card.deckTitle,q:card.q,page:card.page||null});
    if(nextPos>=q.length){ setSess({finished:true,reviewed:reviewed,correct:correct,misses:misses,fromBlock:!!s.fromBlock}); return; }
    setSess({queue:q,pos:nextPos,card:q[nextPos],chosen:-1,revealed:false,reviewed:reviewed,correct:correct,total:s.total,misses:misses,fromBlock:!!s.fromBlock});
  }
  function endSession(){ setSess(null); setTick(function(x){return x+1;}); }
  function setNewPerDay(v){ var s=loadS(); s.settings.newPerDay=v; s.settings.userSet=true; persist(s); }
  function resetAll(){ if(!window.confirm("Reset all spaced-repetition progress? This clears your review schedule and streak. This also clears your calibration history. Reading progress elsewhere is unaffected."))return; try{localStorage.removeItem(KEY);}catch(_){ } calibClear(); setStore(freshStore()); setSess(null); setTick(function(x){return x+1;}); }

  var head=e("div",{className:"topline"},
    e("div",{className:"logo"},"ψ"),
    e("div",null,e("div",{className:"ttl"},"Daily Review"),e("div",{className:"by"},"Spaced repetition · Joshua Moss, MD")),
    e("button",{className:"thmbtn",onClick:function(){toggleTheme(setTheme);},title:"Toggle dark mode","aria-label":"Toggle dark mode"}, theme==="dark"?"☀":"☾"));

  if(err) return e("div",{className:"wrap"},head,e("div",{className:"err"},"Could not load the question bank (quizzes.json). Open this tool from the hub so it can find its data, then try again."));
  if(!cards) return e("div",{className:"wrap"},head,e("div",{className:"panel muted"},"Loading the question bank…"));

  /* ---- active session ---- */
  if(sess && sess.queue){
    var c=sess.card, isRecall=(c.kind==='recall');
    var ci=correctIdx(c), pctp=Math.round(100*sess.pos/Math.max(1,sess.total));
    var gotIt=(!isRecall&&sess.chosen===ci);
    /* single source of truth: feeds the 'sug' className below AND grade()'s calibLog event via

    var sug=isRecall?'':(gotIt?'Good':'Again');
    var fbOpt=(!isRecall&&c.o[sess.chosen])||{}; var corrOpt=(!isRecall&&c.o[ci])||{};
    var isNew=!loadS().cards[c.id];
    return e("div",{className:"wrap"},head,
      e("div",{className:"sess"},
        e("div",{className:"sbar"},e("i",{style:{width:pctp+"%"}})),
        e("div",{className:"sinner"},
          e("div",{className:"smeta"},
            e("span",{className:"deckchip"+(isNew?" snew":"")}, isNew?"New":"Review"),
            e("span",{className:"deckchip",style:{background:"var(--bg-alt)",color:"var(--text-light)"}}, c.deckTitle.length>42?c.deckTitle.slice(0,40)+"…":c.deckTitle),
            e("span",{className:"scount"}, (sess.pos+1)+" / "+sess.total)),

          c.stem? e("p",{className:"stemtext"}, c.stem) : null,
          e("div",{className:"qtext"}, c.q),

            : e("div",{className:"opts"}, optOrder(c).map(function(oi,pos){

            sess.revealed

              : ""),
          sess.revealed? e("div",{className:"grades"},
            e("button",{className:"gr again"+(sug==='Again'?" sug":""),onClick:function(){grade(0);}},"Again",e("span",{className:"gk"},"<10m")),
            e("button",{className:"gr hard",onClick:function(){grade(1);}},"Hard",e("span",{className:"gk"},"1")),
            e("button",{className:"gr good"+(sug==='Good'?" sug":""),onClick:function(){grade(2);},disabled:!isRecall&&!gotIt,title:(isRecall||gotIt)?null:"Missed items can only be graded Again or Hard"},"Good",e("span",{className:"gk"},"↑")),
            e("button",{className:"gr easy",onClick:function(){grade(3);},disabled:!isRecall&&!gotIt,title:(isRecall||gotIt)?null:"Missed items can only be graded Again or Hard"},"Easy",e("span",{className:"gk"},"↑↑"))
          ) : e("div",{className:"muted",style:{marginTop:"10px"}},
              isRecall
                ? "Answer out loud or on scratch first, then reveal. Nothing is recorded."

          e("div",{className:"sfoot"},
            e("span",null,"✓ "+sess.correct+" correct"),
            e("button",{className:"end",onClick:endSession},"End session"))
        )));
  }

  /* ---- session finished / empty ---- */
  if(sess && sess.finished){
    var rt=sess.reviewed?Math.round(100*sess.correct/sess.reviewed):0;
    var missed=(sess.misses||[]).length;
    if(!sess.receipt){
      /* Built once per finished session: cwReceipt writes (block step, never a page here) and

      sess.receipt=cwReceipt({

        stats:[{label:"Reviewed",value:String(sess.reviewed)},{label:"Held",value:String(sess.correct),tone:"good"},{label:"Came back",value:String(missed),tone:missed?"warn":"plain"}],
        reread:(sess.misses||[]).slice(0,5).map(function(m){ var topic=/^TOPIC#/.test(m.id)?m.id.slice(6):null; var ref=topic||m.page||null; return {tag:"Missed",warn:true,title:m.q,note:m.deckTitle,ref:ref,refTitle:ref?prettyRef(ref):null}; }),

    pp.phase!=="unset"? e("div",{className:"sub"}, pp.label) : null,

      e("button",{className:"btn ghost",onClick:function(){start(true);}},"Study ahead")),
    e("div",{className:"panel"},
      e("h2",null,"How it works"),

      e("div",{className:"setrow"},
        e("span",null,"New cards / day"),
        e("input",{type:"range",min:5,max:30,step:1,value:store.settings.newPerDay||12,onChange:function(ev){setNewPerDay(+ev.target.value);}}),
        e("b",null,store.settings.newPerDay||12)),
      e("div",{className:"linkrow"},
        e("a",{className:"chip",href:"../index.html?tool=shelf-mode.html"},"Browse full quiz bank"),
        e("button",{className:"chip danger",onClick:resetAll},"Reset progress"))),
    e("div",{className:"sig"},"Joshua Moss, MD | Psychiatrist · Educational; fictional composites only, no PHI.",e("br"),"Spacing schedule is stored only in this browser.")
  );
}
