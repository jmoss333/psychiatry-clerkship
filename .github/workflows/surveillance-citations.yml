name: Surveillance — Citation Validity

# Weekly: verify the authoritative SOURCE URLs in source_registry.yaml (which live
# in YAML and are never seen by the lychee link crawler) and any DOIs/PMIDs cited in
# curriculum text still resolve. Failures become idempotent GitHub issues (P2 batched
# to the monthly digest). Complements the lychee link-monitor; does not replace it.
#
# No extra secrets required (uses GITHUB_TOKEN). Stdlib-only checker.

on:
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC (1h after the link monitor)
  workflow_dispatch:
  repository_dispatch:
    types: [surveillance-citations]

permissions:
  contents: write                # commit dated report under history/
  issues: write                  # open findings as issues

concurrency:
  group: surveillance-citations
  cancel-in-progress: false

jobs:
  citation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Check source URLs + cited DOIs/PMIDs -> findings
        run: >-
          python3 13_Faculty_Resources/_automation/surveillance/bin/run_citation_check.py
          --out findings.json

      - name: Sync findings -> issues + report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 13_Faculty_Resources/_automation/surveillance/bin/sync_findings.py
          --findings findings.json --job link-source-monitor

      - name: Rebuild faculty status page
        run: python3 13_Faculty_Resources/_automation/surveillance/bin/build_status.py

      - name: Commit report + status
        run: |
          git config user.name "surveillance-bot"
          git config user.email "surveillance-bot@users.noreply.github.com"
          git add 13_Faculty_Resources/_automation/surveillance
          git commit -m "surveillance: citation check $(date -u +%F)" || { echo "no changes"; exit 0; }
          git push || (git pull --rebase --autostash && git push)
