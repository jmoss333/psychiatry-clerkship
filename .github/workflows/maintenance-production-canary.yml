name: Maintenance — Production Learner Canary

on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # Crawl with the specs of the revision production SERVES, not main's. The learner
      # sites publish `release`, which the release train moves three times a day and can
      # hold, so main's specs can run any number of merges ahead of the live sites: on
      # 2026-09-27 #839 changed a feature and its test together, the held train had not
      # shipped the feature, and this crawl went red against a healthy site. `release` is
      # not the answer either -- the train's scheduled run starts as late as 09:24 and
      # Netlify can still be building when the crawl begins. Both sites publish the
      # revision they were built from, so read it (with the parity tool's bounded
      # rechecks for a staggered rollout) and check out exactly that. If the sites
      # disagree or cannot be read, nothing is crawled against a guess: this step fails
      # red and the parity step below records the mismatch.
      - name: Resolve the revision production serves
        id: served
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/production_revision_parity.py
          --attempts 3 --retry-delay 60
          --out "$RUNNER_TEMP/served-revision.json"
          --github-output "$GITHUB_OUTPUT"

      # lfs: false is load-bearing. Git LFS bandwidth is metered (10 GB/month per account)
      # and a daily media checkout would spend it; the crawl reads media from the sites.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.served.outputs.revision }}
          path: served
          lfs: false
          persist-credentials: false

      - name: Install Playwright and Chromium
        run: |
          cd served/tests/smoke
          npm ci
          npx playwright install chromium --with-deps

      # canary-* is a narrower set than the nav-* projects CI runs against a local build:
      # production serving truth only, no client-runtime fault injection. See
      # tests/smoke/playwright.config.js (CANARY_SHARED_SPECS) for the rationale.
      # --workers=2 and --retries=2 are for the network, not for flaky assertions: these
      # requests cross the public internet to Netlify's edge, where a burst of parallel
      # crawlers earns connection resets that say nothing about the site.
      - name: Crawl both public learner sites
        run: |
          cd served/tests/smoke
          npx playwright test --project=canary-ms3 --project=canary-res --workers=2 --retries=2
        env:
          MS3_BASE_URL: https://une-ms3-psychiatry.netlify.app
          RES_BASE_URL: https://mmc-psychiatry-residents-sanford.netlify.app

      - name: Build content-free release twin
        if: always()
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/production_canary.py
          --config 13_Faculty_Resources/_automation/maintenance/maintenance_config.json
          --source-sha "$GITHUB_SHA"
          --out "$RUNNER_TEMP/release-twin.json"

      # THE PRODUCTION-DEPLOY ALARM. The satellite sites now SKIP no-op builds via
      # 13_Faculty_Resources/_automation/site_build/netlify_ignore_scoped.sh, and Netlify
      # files a skip as a FAILED deploy — so the per-site "Deploy failed" email can no longer
      # tell a routine skip from a broken build. This reads production deploy state from the
      # Netlify API and discards exactly the no-content-change cancel.
      #
      # It runs `if: always()` for the same reason the release twin does: a broken crawl and
      # a frozen deploy are different failures and neither may hide the other. In fact this
      # is the one that sees a deploy FREEZE at all — a site whose builds are all failing
      # keeps serving its last good publish, so the crawl above stays green while the site
      # silently stops updating. That is exactly what happened on 2026-08-31.
      #
      # Inert until the NETLIFY_AUTH_TOKEN repository secret exists: with no token the tool
      # prints a warning annotation, records status "skipped" in the receipt, and exits 0. A
      # daily steward that goes red for a missing secret teaches everyone to ignore it.
      - name: Read Netlify production deploy health
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >-
          python3 bin/check_netlify_deploy_health.py
          --out "$RUNNER_TEMP/netlify-deploy-health.json"

      # Compare the revisions actually served, independently of crawl/API health.
      # Two rechecks allow a brief staggered rollout; unreadable data is never a pass.
      - name: Check learner production revision parity
        if: always()
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/production_revision_parity.py
          --attempts 3 --retry-delay 60
          --out "$RUNNER_TEMP/production-revision-parity.json"

      - name: Upload production canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-production-canary-${{ github.run_id }}
          path: |
            served/tests/smoke/test-results/
            ${{ runner.temp }}/served-revision.json
            ${{ runner.temp }}/release-twin.json
            ${{ runner.temp }}/netlify-deploy-health.json
            ${{ runner.temp }}/production-revision-parity.json
          if-no-files-found: warn
          retention-days: 90
