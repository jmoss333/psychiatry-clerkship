name: Firecrawl synthetic known-change test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firecrawl-synthetic-known-change
  cancel-in-progress: false
jobs:
  known-change:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Test one controlled fixture change
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 13_Faculty_Resources/_automation/surveillance/bin/run_firecrawl_known_change.py
          --out-dir "$RUNNER_TEMP/firecrawl-known-change"
      - name: Upload controlled-change evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firecrawl-known-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecrawl-known-change
          if-no-files-found: error
          retention-days: 90
