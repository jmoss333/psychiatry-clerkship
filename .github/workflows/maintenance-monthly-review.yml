name: Maintenance — Evidence and Operations Review

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-monthly
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    env:
      RUN_DIR: ${{ runner.temp }}/maintenance-monthly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install evidence validation dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Build evidence and operations review
        id: monthly
        run: |
          mkdir -p "$RUN_DIR"
          set +e
          python3 tools/evidence_registry/validate.py --check-generated
          evidence_code=$?
          python3 13_Faculty_Resources/_automation/maintenance/monthly_review.py \
            --out-json "$RUN_DIR/monthly.json" \
            --out-md "$RUN_DIR/monthly.md"
          review_code=$?
          set -e
          if [ "$evidence_code" -ne 0 ] && [ "$review_code" -eq 0 ]; then
            review_code=2
          fi
          echo "exit_code=$review_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload evidence and operations review
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-monthly-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-monthly/
          if-no-files-found: warn
          retention-days: 90

      - name: Route evidence and operations review
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/maintenance_issue.py
          --kind monthly
          --report "$RUN_DIR/monthly.json"
          --run-url "$RUN_URL"
          --artifact-url "$ARTIFACT_URL"

      - name: Preserve monthly gate result
        id: enforce
        if: always()
        run: |
          code="${{ steps.monthly.outputs.exit_code }}"
          case "$code" in
            "0") exit 0 ;;
            "1"|"2") exit "$code" ;;
            *) exit 2 ;;
          esac
