name: Maintenance — Rotation Readiness

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-rotation
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build rotation readiness passport
        id: rotation
        run: |
          mkdir -p "$RUNNER_TEMP/maintenance-rotation"
          set +e
          python3 13_Faculty_Resources/_automation/maintenance/rotation_readiness.py \
            --config 13_Faculty_Resources/_automation/maintenance/rotation_blocks.json \
            --out-json "$RUNNER_TEMP/maintenance-rotation/rotation.json" \
            --out-md "$RUNNER_TEMP/maintenance-rotation/rotation.md"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload rotation readiness passport
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-rotation-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-rotation/
          if-no-files-found: warn
          retention-days: 90

      - name: Route due rotation review
        if: ${{ always() && steps.rotation.outputs.exit_code == '10' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/maintenance_issue.py
          --kind rotation
          --report "$RUNNER_TEMP/maintenance-rotation/rotation.json"
          --run-url "$RUN_URL"
          --artifact-url "$ARTIFACT_URL"

      - name: Translate rotation routing result
        id: enforce
        if: always()
        run: |
          code="${{ steps.rotation.outputs.exit_code }}"
          case "$code" in
            "0"|"10") exit 0 ;;
            "1"|"2") exit "$code" ;;
            *) exit 2 ;;
          esac
