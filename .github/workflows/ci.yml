name: CI — build, test, validate

# Fast pre-merge gate on every PR: unit test + topic_meta contract + no hard-coded
# machine paths + full site build & static QA harness. Mirrors what Netlify runs, so
# breakage turns a PR red instead of only surfacing at deploy time.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Agent docs parity — AGENTS.md must equal CLAUDE.md
        run: |
          if ! cmp -s CLAUDE.md AGENTS.md; then
            echo "::error::AGENTS.md is out of sync with CLAUDE.md — run: cp CLAUDE.md AGENTS.md"
            exit 1
          fi
          echo "agent docs parity OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint — no hard-coded machine paths in tracked Python
        run: |
          if git grep -nE "/(Users|sessions)/[a-z]" -- "*.py"; then
            echo "::error::hard-coded /Users or /sessions path in tracked .py — derive from __file__"; exit 1
          fi
          echo "path lint OK"

      - name: Unit — media guard
        run: python3 13_Faculty_Resources/_automation/site_build/test_media_guard.py

      - name: Validate — topic_meta.json contract
        run: python3 13_Faculty_Resources/_automation/validate_topic_meta.py

      - name: Validate — longitudinal case contract
        run: python3 13_Faculty_Resources/_automation/test_longitudinal_case.py

      - name: Validate — family systems scenarios contract
        run: python3 13_Faculty_Resources/_automation/test_family_systems_scenarios.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit — root node regression tests (tests/*.test.mjs)
        run: node --test tests/*.test.mjs

      - name: Validate — WCAG AA contrast tokens
        run: node tests/contrast-check.mjs

      - name: Install — managed SP proxy dependencies
        run: npm --prefix sp-proxy ci

      - name: Test — SP Interview and managed proxy
        run: |
          npm --prefix sp-proxy test
          bash _prototypes/sp-interview/tests/run-all.sh
          python3 13_Faculty_Resources/_automation/test_validate_attestation_consistency.py

      - name: Build + static QA gate (ms3)
        run: bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh ms3

      - name: Build + static QA gate (res)
        run: bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh res

  smoke-tests:
    name: Smoke tests (nav crawl · faculty console · LFS · visual)
    runs-on: ubuntu-latest
    needs: build-test-validate
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build sites (ms3 + res)
        run: |
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh ms3
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh res

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.46.1-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          cd tests/smoke
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve built sites and faculty console on localhost
        run: |
          python3 -m http.server 4200 --directory _build/ms3 &
          python3 -m http.server 4201 --directory _build/res &
          python3 -m http.server 4202 --directory faculty-console &
          # Fail closed unless every required surface accepts connections.
          for port in 4200 4201 4202; do
            ready=false
            for i in $(seq 1 15); do
              if curl -sf "http://localhost:$port/" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              echo "::error::Server on port $port did not become ready"
              exit 1
            fi
          done
          echo "Servers ready"

      - name: "Check 1: nav crawl — ms3 + res"
        run: |
          cd tests/smoke
          npx playwright test --project=nav-ms3 --project=nav-res

      - name: "Check 1a: Interview Room acceptance — ms3"
        run: |
          cd tests/smoke
          npx playwright test --project=interview-room
        env:
          SP_INTERVIEW_BASE_URL: http://localhost:4200/tools/

      - name: "Check 1b: Unified faculty attestation workspace"
        run: |
          cd tests/smoke
          npx playwright test --project=faculty-console

      - name: "Check 2: LFS integrity — Netlify deploy preview"
        run: |
          cd tests/smoke
          # Derive the deploy-preview URL from the PR number (if this is a PR run).
          # Netlify deploy previews use the pattern:
          #   https://deploy-preview-{PR}--{site-slug}.netlify.app
          # Probe first; skip gracefully if the deploy isn't live yet.
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ]; then
            MS3_CANDIDATE="https://deploy-preview-${PR_NUM}--une-ms3-psychiatry.netlify.app"
            RES_CANDIDATE="https://deploy-preview-${PR_NUM}--mmc-psychiatry-residents-sanford.netlify.app"
            if curl -sf --head --max-time 8 "$MS3_CANDIDATE" >/dev/null 2>&1; then
              export MS3_DEPLOY_URL="$MS3_CANDIDATE"
              export RES_DEPLOY_URL="$RES_CANDIDATE"
              echo "Deploy preview ready — LFS check will run against $MS3_CANDIDATE"
            else
              echo "Deploy preview not yet live — LFS check will be skipped (set MS3_DEPLOY_URL manually to force)"
            fi
          fi
          npx playwright test --project=lfs
        env:
          # Override by setting repository variables MS3_DEPLOY_URL / RES_DEPLOY_URL
          MS3_DEPLOY_URL: ${{ vars.MS3_DEPLOY_URL }}
          RES_DEPLOY_URL: ${{ vars.RES_DEPLOY_URL }}

      - name: "Check 3: visual regression — resident site"
        run: |
          cd tests/smoke
          npx playwright test --project=visual

      - name: Upload smoke test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ github.run_number }}
          path: |
            tests/smoke/test-results/
          retention-days: 14
