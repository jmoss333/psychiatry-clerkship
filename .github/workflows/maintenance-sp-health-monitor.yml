name: Maintenance — Interview Room Health Monitor

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Check public content-free Interview Room receipt
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/sp_health_monitor.py
          --url https://sp-interview-proxy.netlify.app/api/sp/health-status
          --out "$RUNNER_TEMP/sp-health-monitor.json"

      - name: Upload Interview Room monitor receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-sp-health-${{ github.run_id }}
          path: ${{ runner.temp }}/sp-health-monitor.json
          if-no-files-found: warn
          retention-days: 90
