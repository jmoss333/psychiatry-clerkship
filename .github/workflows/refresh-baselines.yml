name: Refresh visual baselines

# Triggered manually to regenerate tests/smoke/baseline/*.png using the same
# Ubuntu/Chromium environment as the smoke-tests CI job.
#
# When to run:
#   - After an intentional UI/layout change that makes the visual check fail
#   - After changing the visual-regression.spec.js capture config
#   - If baselines become stale for any other reason
#
# How to run:
#   GitHub → Actions tab → "Refresh visual baselines" → Run workflow → pick the PR's branch
#   (never main, release, attest/pending or attestations: the first step refuses them)
#
# What one dispatch does, and why each part is there:
#   1. Builds the sites and forces Playwright to rewrite EVERY snapshot the visual
#      project produces (not a fixed count: the archetype set in
#      visual-regression.spec.js decides how many).
#   2. Commits tests/smoke/baseline/ and nothing else. The message carries no CI-skip
#      token, so Netlify builds the PR's deploy previews on it as on any push.
#   3. Runs the governance/content guard (bin/check_governance_separation.py) over each
#      open PR's range, with the new commit as the head, BEFORE pushing. ci.yml runs that
#      guard only on pull_request events, and step 5's run is a workflow_dispatch, so this
#      is where the head gets judged. The guard's output is in this run's log.
#   4. Pushes. A push made with this workflow's GITHUB_TOKEN starts no workflow at all,
#      which is why step 5 exists.
#   5. Starts ci.yml on the branch (workflow_dispatch is the one event that token can
#      start). Its build-test-validate and smoke-tests runs attach to the new head, and
#      those are the checks main's ruleset requires, so the PR can merge when they are
#      green, with no hand-made follow-up commit. With no open PR from the branch, it
#      pushes and stops. Opening the PR then runs the ordinary pull_request CI, guard
#      included.
#
# Until 2026-09-25 this committed with a CI-skip token. The PR head then carried no
# required checks, and #669 needed two extra commits (both empty; the first quoted the
# token in its own body, so it skipped again). tests/maintenance/test_refresh_baselines_pins.py
# pins every part of the flow above.

on:
  workflow_dispatch:

permissions:
  contents: write       # push the refreshed baselines back to the dispatching branch
  actions: write        # start ci.yml on the new commit (step 5)
  pull-requests: read   # find the open PRs whose ranges the guard judges (step 3)

jobs:
  refresh-baselines:
    name: Regenerate visual baselines (Ubuntu/Chromium)
    runs-on: ubuntu-latest

    steps:
      # Fail fast, before a ten-minute build. This workflow may only ever write
      # baselines onto a feature branch: main and release are protected and only
      # fast-forward, attest/pending carries console-authored attestations (and is the
      # one branch whose CI also needs check_attestation_hashes, which this flow does
      # not run), and attestations is the ledger's orphan branch.
      - name: Refuse branches a refresh must never write to
        env:
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::dispatch this on a PR branch, not a $REF_TYPE"; exit 1
          fi
          case "$BRANCH" in
            main|release|attest/pending|attestations)
              echo "::error::refresh baselines on the PR's feature branch, never on $BRANCH"; exit 1 ;;
          esac
          echo "Refreshing baselines on $BRANCH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          # The guard in step 3 reads the whole PR range, back to its base.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # build_and_check.sh runs the Python validators first; jsonschema became a
      # validator dependency in #253, after this workflow was written (same
      # install line as ci.yml's schema-validation step).
      - name: Install — validator dependencies
        run: python3 -m pip install --requirement requirements.txt PyYAML==6.0.2

      - name: Build sites (ms3 + res)
        run: |
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh ms3
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh res

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Same derived key as ci.yml — a Playwright bump rolls both caches.
          key: playwright-${{ hashFiles('tests/smoke/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: cd tests/smoke && npm ci && npx playwright install chromium --with-deps

      - name: Serve built sites on localhost
        run: |
          python3 -m http.server 4200 --directory _build/ms3 &
          python3 -m http.server 4201 --directory _build/res &
          for port in 4200 4201; do
            for i in $(seq 1 15); do
              curl -sf "http://localhost:$port/" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          echo "Servers ready"

      - name: Regenerate baselines
        run: |
          cd tests/smoke
          # `changed` (the bare flag's default) rewrites only screenshots that fail
          # the normal comparison threshold. A refresh must replace every baseline.
          npx playwright test visual-regression.spec.js --project=visual --update-snapshots=all

      - name: Commit, guard, push, and start CI on the new commit
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/baseline/
          if git diff --staged --quiet; then
            echo "No baseline changes — images already match this environment. Nothing pushed, no CI started."
            exit 0
          fi
          git commit --quiet -m "chore(smoke): refresh visual baselines (Ubuntu/Chromium)" -m "Regenerated by $RUN_URL"

          # The commit may carry baseline images and nothing else.
          outside=$(git diff --name-only HEAD~1 HEAD | grep -v '^tests/smoke/baseline/' || true)
          if [ -n "$outside" ]; then
            echo "::error::the refresh commit touches paths outside tests/smoke/baseline/:"
            echo "$outside"
            exit 1
          fi

          # Step 3: judge each open PR's range with this commit as its head, before
          # pushing. A red guard (exit 1) or a could-not-check (exit 2) stops here.
          bases=$(gh pr list --head "$BRANCH" --state open --json baseRefOid --jq '.[].baseRefOid')
          for base in $bases; do
            git fetch --no-tags --quiet origin "$base"
            python3 bin/check_governance_separation.py --base "$base" --head HEAD --head-branch "$BRANCH"
          done

          # Step 4.
          git push origin "HEAD:$BRANCH"

          # Step 5.
          if [ -z "$bases" ]; then
            echo "No open PR from $BRANCH: pushed $(git rev-parse --short HEAD) without starting CI."
            echo "Opening the PR runs the ordinary pull_request CI, governance guard included."
            exit 0
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) and started ci.yml on $BRANCH:"
          echo "its build-test-validate and smoke-tests runs are this head's required checks."
