name: Refresh visual baselines

# Triggered manually to regenerate tests/smoke/baseline/*.png using the same
# Ubuntu/Chromium environment as the smoke-tests CI job.
#
# When to run:
#   - After an intentional UI/layout change that makes the visual check fail
#   - After changing the visual-regression.spec.js capture config
#   - If baselines become stale for any other reason
#
# How to run:
#   GitHub → Actions tab → "Refresh visual baselines" → Run workflow → pick the PR's branch
#   (never main, release, attest/pending or attestations: the first step refuses them)
#
# What one dispatch does, and why each part is there:
#   1. Builds the sites and forces Playwright to rewrite EVERY snapshot the visual
#      project produces (not a fixed count: the archetype set in
#      visual-regression.spec.js decides how many).
#   2. Commits tests/smoke/baseline/ and nothing else. The message carries no CI-skip
#      token, so Netlify builds the PR's deploy previews on it as on any push.
#   3. Runs the governance/content guard (bin/check_governance_separation.py) over each
#      open PR's range (from its merge-base with the PR's base branch, as the PR's own diff
#      is), with the new commit as the head, BEFORE pushing, so a refresh never hands a PR
#      a head its own CI guard would refuse. The guard's output is in this run's log.
#   4. Pushes, as the baseline GitHub App when one is configured (Setup, below). A push
#      made with an App's token is an ordinary push: it starts the PR's own pull_request
#      CI on the new head, governance guard included, and that run's build-test-validate
#      and smoke-tests are the checks main's ruleset counts. With no open PR from the
#      branch it pushes and stops; opening the PR runs the same pull_request CI.
#
# Why an App. A push made with this workflow's own GITHUB_TOKEN does not start the PR's
# CI unattended. On 2026-09-27 (#839) GitHub created that pull_request run as
# "action_required" and held it for a maintainer's "Approve and run". Until then this
# workflow also started ci.yml by workflow_dispatch on the new commit, on the theory that
# a dispatch run's checks satisfy the ruleset. They do not: #839's dispatch run went
# green on the head while the PR still listed both required checks as "Expected —
# Waiting for status to be reported", and the PR became mergeable only after the held
# pull_request run was approved and passed. The dispatch cost a duplicate ~20-minute CI
# run and satisfied nothing, so it is gone, and so is the actions: write it needed.
#
# Setup (the owner, once). Create a GitHub App with one repository permission,
# Contents: Read and write, and no webhook. Install it on this repository only. Set the
# repository VARIABLE BASELINE_APP_CLIENT_ID to the App's Client ID and the repository
# SECRET BASELINE_APP_PRIVATE_KEY to a private key the App generated. Until the variable
# is set, the workflow pushes with GITHUB_TOKEN and ends with a notice saying where to
# click "Approve and run". Once the variable is set, a missing or wrong key fails the
# token step, and the run, rather than quietly falling back.
#
# Until 2026-09-25 this committed with a CI-skip token. The PR head then carried no
# required checks, and #669 needed two extra commits (both empty; the first quoted the
# token in its own body, so it skipped again). tests/maintenance/test_refresh_baselines_pins.py
# pins every part of the flow above.

on:
  workflow_dispatch:

permissions:
  contents: write       # push the refreshed baselines when no baseline App is configured
  pull-requests: read   # find the open PRs whose ranges the guard judges (step 3)

jobs:
  refresh-baselines:
    name: Regenerate visual baselines (Ubuntu/Chromium)
    runs-on: ubuntu-latest

    steps:
      # Fail fast, before a ten-minute build. This workflow may only ever write
      # baselines onto a feature branch: main and release are protected and only
      # fast-forward, attest/pending carries console-authored attestations (and is the
      # one branch whose CI also needs check_attestation_hashes, which this flow does
      # not run), and attestations is the ledger's orphan branch.
      - name: Refuse branches a refresh must never write to
        env:
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::dispatch this on a PR branch, not a $REF_TYPE"; exit 1
          fi
          case "$BRANCH" in
            main|release|attest/pending|attestations)
              echo "::error::refresh baselines on the PR's feature branch, never on $BRANCH"; exit 1 ;;
          esac
          echo "Refreshing baselines on $BRANCH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          # The guard in step 3 reads the whole PR range, back to its base.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # build_and_check.sh runs the Python validators first; jsonschema became a
      # validator dependency in #253, after this workflow was written (same
      # install line as ci.yml's schema-validation step).
      - name: Install — validator dependencies
        run: python3 -m pip install --requirement requirements.txt PyYAML==6.0.2

      - name: Build sites (ms3 + res)
        run: |
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh ms3
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh res

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Same derived key as ci.yml — a Playwright bump rolls both caches.
          key: playwright-${{ hashFiles('tests/smoke/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: cd tests/smoke && npm ci && npx playwright install chromium --with-deps

      - name: Serve built sites on localhost
        run: |
          python3 -m http.server 4200 --directory _build/ms3 &
          python3 -m http.server 4201 --directory _build/res &
          for port in 4200 4201; do
            for i in $(seq 1 15); do
              curl -sf "http://localhost:$port/" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          echo "Servers ready"

      - name: Regenerate baselines
        run: |
          cd tests/smoke
          # `changed` (the bare flag's default) rewrites only screenshots that fail
          # the normal comparison threshold. A refresh must replace every baseline.
          npx playwright test visual-regression.spec.js --project=visual --update-snapshots=all

      # Step 4's identity. Skipped, leaving the token empty, until the owner sets the
      # variable (Setup, above). The token reaches only this repository, carries only
      # contents: write, and the action revokes it when the job ends.
      - name: Mint the baseline App's token
        id: app-token
        if: ${{ vars.BASELINE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BASELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit, guard, and push the new commit
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The App's token lives in an unexported shell variable from here on, so the
          # guard below (code from the branch) and every other child starts without it.
          app_token="${APP_TOKEN:-}"
          unset APP_TOKEN
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/baseline/
          if git diff --staged --quiet; then
            echo "No baseline changes — images already match this environment. Nothing pushed."
            exit 0
          fi
          git commit --quiet -m "chore(smoke): refresh visual baselines (Ubuntu/Chromium)" -m "Regenerated by $RUN_URL"

          # The commit may carry baseline images and nothing else.
          outside=$(git diff --name-only HEAD~1 HEAD | grep -v '^tests/smoke/baseline/' || true)
          if [ -n "$outside" ]; then
            echo "::error::the refresh commit touches paths outside tests/smoke/baseline/:"
            echo "$outside"
            exit 1
          fi

          # Step 3: judge each open PR's range with this commit as its head, before
          # pushing. A red guard (exit 1) or a could-not-check (exit 2) stops here.
          # The range starts at the merge-base, as the PR's own diff does. baseRefOid is
          # the base branch's CURRENT tip, and once that moves past the branch's fork
          # point, a diff from the tip counts every newer main commit, reversed, as this
          # branch's change: a false L1 the first time main takes content and governance.
          # (ci.yml can diff from the tip because it checks out the PR's merge commit.)
          tips=$(gh pr list --head "$BRANCH" --state open --json baseRefOid --jq '.[].baseRefOid')
          for tip in $tips; do
            git fetch --no-tags --quiet origin "$tip"
            base=$(git merge-base "$tip" HEAD)
            python3 bin/check_governance_separation.py --base "$base" --head HEAD --head-branch "$BRANCH"
          done

          # Step 4. With the App's token, this one command authenticates as the App: the
          # empty extraheader clears the GITHUB_TOKEN header actions/checkout persisted,
          # and the next one puts the App's in its place. Nothing is written to disk.
          push_auth=()
          if [ -n "$app_token" ]; then
            basic=$(printf 'x-access-token:%s' "$app_token" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            push_auth=(-c "http.https://github.com/.extraheader="
                       -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          git ${push_auth[@]+"${push_auth[@]}"} push origin "HEAD:$BRANCH"
          short=$(git rev-parse --short HEAD)

          if [ -z "$tips" ]; then
            echo "No open PR from $BRANCH: pushed $short."
            echo "Opening the PR runs the ordinary pull_request CI, governance guard included."
            exit 0
          fi
          if [ -n "$app_token" ]; then
            echo "Pushed $short as the baseline App: the PR's own pull_request CI starts on it,"
            echo "and that run's build-test-validate and smoke-tests are this head's required checks."
            exit 0
          fi
          echo "::notice title=Approve the PR's CI run::Pushed $short with GITHUB_TOKEN because no baseline App is configured. If GitHub holds the PR's pull_request CI run for a maintainer, as it did on #839, open the PR, then Checks, then that CI run, then Approve and run. Merge on that run's result. The Setup note at the top of refresh-baselines.yml removes this click."
