name: Refresh visual baselines

# Triggered manually to regenerate tests/smoke/baseline/*.png using the same
# Ubuntu/Chromium environment as the smoke-tests CI job.
#
# When to run:
#   - After an intentional UI/layout change that makes the visual check fail
#   - After changing the visual-regression.spec.js capture config
#   - If baselines become stale for any other reason
#
# How to run:
#   GitHub → Actions tab → "Refresh visual baselines" → Run workflow → pick branch
#
# The job builds the sites, runs Playwright with --update-snapshots, and commits
# the updated PNGs back to the same branch. CI is skipped on that commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-baselines:
    name: Regenerate visual baselines (Ubuntu/Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build sites (ms3 + res)
        run: |
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh ms3
          bash 13_Faculty_Resources/_automation/site_build/build_and_check.sh res

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Same derived key as ci.yml — a Playwright bump rolls both caches.
          key: playwright-${{ hashFiles('tests/smoke/package-lock.json') }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: cd tests/smoke && npm ci && npx playwright install chromium --with-deps

      - name: Serve built sites on localhost
        run: |
          python3 -m http.server 4200 --directory _build/ms3 &
          python3 -m http.server 4201 --directory _build/res &
          for port in 4200 4201; do
            for i in $(seq 1 15); do
              curl -sf "http://localhost:$port/" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          echo "Servers ready"

      - name: Regenerate baselines
        run: |
          cd tests/smoke
          npx playwright test --project=visual --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/baseline/
          if git diff --staged --quiet; then
            echo "No baseline changes — images already match this environment."
          else
            git commit -m "chore(smoke): refresh visual baselines (Ubuntu/Chromium) [skip ci]"
            git push
            echo "Baselines updated and pushed."
          fi
