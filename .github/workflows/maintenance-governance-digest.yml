name: Maintenance — Faculty Governance Digest

on:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      RUN_DIR: ${{ runner.temp }}/maintenance-governance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Build faculty governance digest
        id: governance
        run: |
          mkdir -p "$RUN_DIR"
          set +e
          node 13_Faculty_Resources/_automation/maintenance/governance_digest.mjs \
            --out-json "$RUN_DIR/governance.json" \
            --out-md "$RUN_DIR/governance.md"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload faculty governance digest
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-governance/
          if-no-files-found: warn
          retention-days: 90

      - name: Route faculty governance review
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 13_Faculty_Resources/_automation/maintenance/maintenance_issue.py
          --kind governance
          --report "$RUN_DIR/governance.json"
          --run-url "$RUN_URL"
          --artifact-url "$ARTIFACT_URL"

      - name: Preserve governance gate result
        id: enforce
        if: always()
        run: |
          code="${{ steps.governance.outputs.exit_code }}"
          case "$code" in
            "0") exit 0 ;;
            "1"|"2") exit "$code" ;;
            *) exit 2 ;;
          esac
