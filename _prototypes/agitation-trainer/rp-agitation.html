<style>

  *,*::before,*::after{box-sizing:border-box}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp4);box-shadow:var(--shadow-sm);margin-bottom:var(--sp3)}
  .modebar{display:inline-flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px;margin-bottom:var(--sp3);background:var(--bg-alt)}
  .modebar button{border:none;background:transparent;padding:7px 16px;border-radius:var(--radius-pill);font:inherit;font-size:.85rem;font-weight:700;color:var(--text-mid);cursor:pointer;min-height:40px}
  .modebar button.on{background:var(--accent);color:var(--on-brand)}
  .disc{border-radius:var(--radius-md);padding:var(--sp2) var(--sp3);font-size:.84rem;margin-bottom:var(--sp3)}
  .disc.teach{background:var(--info-light);color:var(--info);border:1px solid var(--info)}
  /* play layout: ladder rail + main */
  .play{display:grid;grid-template-columns:190px 1fr;gap:var(--sp3);align-items:start}
  .rail{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp3);box-shadow:var(--shadow-sm)}
  .rail .rlbl{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);margin-bottom:8px}
  .rung{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius-sm);margin:3px 0;opacity:.5;border:1px solid transparent}
  .rung .rn{width:22px;height:22px;border-radius:6px;background:var(--bg-alt);border:1px solid var(--border);font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-mid);flex:none}
  .rung .rt{font-size:.82rem;line-height:1.2}
  .rung.reached{opacity:1}
  .rung.reached .rn{background:var(--accent-light);color:var(--accent-dark);border-color:var(--accent)}
  .rung.current{opacity:1;background:var(--accent-light);border-color:var(--accent)}
  .rung.current .rn{background:var(--accent);color:var(--on-brand);border-color:var(--accent)}
  .rung.top.current{background:var(--danger-light);border-color:var(--danger)}
  .rung.top.current .rn{background:var(--danger);border-color:var(--danger)}
  .railnote{font-size:.72rem;color:var(--text-light);margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
  .pills{display:none;gap:6px;flex-wrap:wrap;margin-bottom:var(--sp2)}
  .pill{font-size:.72rem;border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px 9px;color:var(--text-light)}
  .pill.current{background:var(--accent);color:var(--on-brand);border-color:var(--accent)}
  .steplabel{text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:700;color:var(--accent-dark);margin:0 0 4px}
  .qtext{font-family:var(--font-head);font-size:1.18rem;margin:0 0 var(--sp3)}
  .stemgrid{display:flex;flex-wrap:wrap;gap:8px;margin:var(--sp2) 0 0}
  .vital{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;font-size:.82rem;color:var(--text-mid)}
  .vital b{color:var(--text)}
  .metarow{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--text-light);margin-top:var(--sp2)}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:12px 14px;margin:8px 0;cursor:pointer;font:inherit;color:var(--text)}
  .opt:hover{border-color:var(--accent);background:var(--accent-light)}
  .opt.on{border-color:var(--accent);background:var(--accent-light);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt .num{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--bg-alt);border:1px solid var(--border);font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-mid)}
  .opt.on .num{background:var(--accent);color:var(--on-brand);border-color:var(--accent)}
  .opt .lab{flex:1;min-width:0}
  .senior{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px dashed var(--accent);background:var(--accent-light);border-radius:var(--radius-md);padding:12px 14px;margin:12px 0 0;cursor:pointer;font:inherit;color:var(--accent-dark);font-weight:700}
  .senior.on{border-style:solid;box-shadow:inset 0 0 0 1px var(--accent)}
  .senior .ico{font-size:1.1rem}
  .localchip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;border:1px dashed var(--warning);color:var(--warning);background:var(--warning-light);border-radius:var(--radius-pill);padding:3px 10px;margin:6px 6px 0 0}
  .localchip.set{border-style:solid;border-color:var(--success);color:var(--success);background:var(--success-light)}
  .verdict{border-radius:var(--radius-md);padding:12px 14px;margin:10px 0;font-size:.92rem;border:1px solid}
  .verdict.good{background:var(--success-light);color:var(--success);border-color:var(--success)}
  .verdict.caution{background:var(--warning-light);color:var(--warning);border-color:var(--warning)}
  .verdict.hazard{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}
  .verdict .vh{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .stopnote{font-size:.82rem;margin-top:6px;font-style:italic}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:var(--sp3)}
  .btn{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-weight:600;cursor:pointer;font:inherit;background:var(--surface);color:var(--accent-dark);min-height:44px}
  .btn.primary{background:var(--primary-dark);color:var(--on-brand);border-color:var(--primary-dark)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .nudge{color:var(--danger);font-size:.85rem;margin-top:8px}
  .trace .node{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:6px 0}
  .trace .marker{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-brand);font-weight:700;font-size:.85rem}
  .m.good{background:var(--success)} .m.caution{background:var(--warning)} .m.hazard{background:var(--danger)} .m.neutral{background:var(--text-light)}
  .nodecard{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 13px}
  .pearl{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:10px 13px;font-size:.9rem;margin:8px 0}
  .cite{font-size:.8rem;color:var(--text-light)}
  details.cites{margin-top:8px} details.cites summary{cursor:pointer;font-size:.82rem;color:var(--accent-dark)}
  .disc.footer{position:fixed;left:0;right:0;bottom:0;background:var(--danger-light);color:var(--danger);border-top:1px solid var(--danger);font-size:.8rem;padding:8px 14px;text-align:center;margin:0;z-index:20}
  .flag{background:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 14px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.82rem;min-height:44px}
  .flag:hover{border-color:var(--danger);color:var(--danger)}
  .refmap h3{font-family:var(--font-head);color:var(--primary-dark);margin:var(--sp3) 0 6px;font-size:1.05rem}
  .refmap ul{margin:4px 0 0;padding-left:1.3em}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:3px solid var(--focus,#155eef);outline-offset:2px}
  @media(prefers-reduced-motion:no-preference){.opt:active,.btn:active,.senior:active{transform:scale(.98)}}
  @media(max-width:640px){.play{grid-template-columns:1fr}.rail{display:none}.pills{display:flex}.shell{padding:var(--sp3) var(--sp2) 96px}h1{font-size:1.5rem}}

<body>
<button class="themebtn" id="themebtn" aria-label="Toggle light/dark theme">◐</button>
<main class="shell" id="root"></main>
<div class="disc footer" role="note">Teaching trainer — <b>not clinical decision support</b> and it does not generate orders. In a real emergency, call your senior/attending and follow local protocol.</div>
<div id="live" class="visually-hidden" aria-live="polite"></div>
<script>
(function(){
  "use strict";
  var e=React.createElement, useState=React.useState, useEffect=React.useEffect;
  var LS={mode:'rp_agit_v1_mode', flags:'rp_flags'};
  var FACULTY_FEEDBACK_EMAIL=""; /* {{LOCAL: faculty_feedback_email }} */
  // Least-restrictive ladder (design-aligned). Higher number = more restrictive.
  var LADDER=[{r:1,t:"Environment"},{r:2,t:"Verbal de-escalation"},{r:3,t:"Offered PRN"},{r:4,t:"Involuntary med"},{r:5,t:"Restraint"}];
  var RUNG={space_safety:1,env:1,deesc:2,offer_po:3,activate_help:0,sga:3,benzo:3,combo:3,d2_typical:3,treat_cause:1,im_if_danger:4,call_senior:0};
  function announce(m){try{document.getElementById('live').textContent=m;}catch(e){}}

  // Transmits one rp_flags entry through the shared Netlify "library-feedback" form (see
  // 13_Faculty_Resources/Feedback/feedback.html) so a content flag reaches faculty instead of
  // sitting silently in localStorage. Fire-and-forget: never throws, never blocks the UI.
  // Offline contract — if fetch is unavailable/blocked or the response isn't a Netlify
  // success, cb(false) fires and the entry stays unsent in rp_flags; flushFlags() retries
  // unsent entries sequentially on the next tool load and stops at the first failure, so the
  // queue drains in order once connectivity returns rather than reordering or dropping flags.
  function flagSend(entry,cb){
    if(typeof fetch!=='function'){if(cb)cb(false);return;}
    try{
      var body='form-name=library-feedback&site='+encodeURIComponent((typeof location!=='undefined'&&location.hostname)||'')+
        '&page='+encodeURIComponent((entry.tool||'rp-agitation')+' ['+(entry.ctx||'')+'] v'+(entry.v||''))+
        '&type='+encodeURIComponent('content-flag')+
        '&message='+encodeURIComponent(entry.reason||'');
      fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
        .then(function(r){if(cb)cb(!!r&&(r.status===200||r.ok||r.status===303));})
        .catch(function(){if(cb)cb(false);});
    }catch(err){if(cb)cb(false);}
  }
  function markFlagSent(at){
    try{
      var arr=JSON.parse(localStorage.getItem(LS.flags)||'[]');
      var changed=false;
      for(var i=0;i<arr.length;i++){if(arr[i]&&arr[i].at===at&&!arr[i].sent){arr[i].sent=true;changed=true;break;}}
      if(changed)localStorage.setItem(LS.flags,JSON.stringify(arr));
    }catch(err){}
  }
  // Flushes unsent rp_flags entries (this tool's and rp-brief-psych's — they share one key)
  // sequentially, stopping at the first failure so later entries stay queued for next load.
  function flushFlags(){
    try{
      var arr=JSON.parse(localStorage.getItem(LS.flags)||'[]');
      if(!Array.isArray(arr))return;
      var pending=arr.filter(function(x){return x&&!x.sent;});
      var i=0;
      (function step(){
        if(i>=pending.length)return;
        flagSend(pending[i],function(ok){
          if(!ok)return;
          markFlagSent(pending[i].at);
          i++;step();
        });
      })();
    }catch(err){}
  }

  function LocalChip(props){var tok=props.token;if(!tok)return null;var set=tok.value!==null&&tok.value!==undefined;
    return e('span',{className:'localchip'+(set?' set':''),title:tok.label},set?('Local · '+tok.value):('⚠ '+(tok.placeholder||'Confirm locally')));}
  function FlagButton(props){
    function onFlag(){var reason=window.prompt('Flag this content — reason + note:');if(reason===null)return;
      var entry={tool:'rp-agitation',v:'0.2.0',ctx:props.ctx||'',reason:reason,at:new Date().toISOString()};
      try{var a=JSON.parse(localStorage.getItem(LS.flags)||'[]');a.push(entry);localStorage.setItem(LS.flags,JSON.stringify(a));}catch(e){}
      flagSend(entry,function(ok){if(ok)markFlagSent(entry.at);}); // fire-and-forget; local save above already happened regardless of network
      if(FACULTY_FEEDBACK_EMAIL){var s=encodeURIComponent('[Content flag] rp-agitation v0.2.0');var b=encodeURIComponent('Context: '+(props.ctx||'')+'\n'+reason);window.location.href='mailto:'+FACULTY_FEEDBACK_EMAIL+'?subject='+s+'&body='+b;}
      else{announce('Flag saved locally.');alert('Flag saved locally. Confirm the faculty feedback email (LOCAL_POLICY) to enable email routing.');}}
    return e('button',{className:'flag',onClick:onFlag},'⚑ Flag content');
  }
  function tokenById(pack,id){var a=(pack.localPolicies||[]).filter(function(t){return t.id===id;});return a[0]||null;}
  var ALWAYS_SHOW=['note','im_olanzapine_benzo'];
  function pharmVerdict(choice,scenario){
    var ctx=[scenario.trueEtiology].concat(scenario.populationFlags||[]);var haz=[],caut=[];
    if(choice.hazardIf)Object.keys(choice.hazardIf).forEach(function(k){if(ctx.indexOf(k)>=0)haz.push(choice.hazardIf[k]);});
    if(choice.cautionIf)Object.keys(choice.cautionIf).forEach(function(k){if(ctx.indexOf(k)>=0||ALWAYS_SHOW.indexOf(k)>=0)caut.push(choice.cautionIf[k]);});
    var level=haz.length?'hazard':(caut.length?'caution':'good');var notes=haz.concat(caut);
    if(!notes.length){if(choice.id==='treat_cause')notes=['Addressing the underlying cause is often the highest-yield first move.'];
      else if(choice.id==='im_if_danger')notes=['Reserve parenteral/involuntary routes for imminent danger after de-escalation; follow restraint policy.'];
      else notes=['Reasonable class-level choice for this presentation — confirm the specific agent/dose against local formulary.'];}
    return {level:level,notes:notes,hard:haz.length>0};
  }

  function LadderRail(props){
    var cur=props.rung||0;
    return e('div',{className:'rail','aria-label':'Least-restrictive ladder'},
      e('div',{className:'rlbl'},'Least-restrictive ladder'),
      LADDER.slice().reverse().map(function(x){
        var cls='rung'+(x.r<=cur&&cur>0?' reached':'')+(x.r===cur?' current':'')+(x.r===5?' top':'');
        return e('div',{className:cls,key:x.r}, e('span',{className:'rn'},x.r), e('span',{className:'rt'},x.t));
      }),
      e('div',{className:'railnote'},'Climb only as high as the situation requires. “Call your senior” is never the wrong move.'));
  }
  function Pills(props){var cur=props.rung||0;
    return e('div',{className:'pills','aria-hidden':'true'}, LADDER.map(function(x){
      return e('span',{className:'pill'+(x.r===cur?' current':''),key:x.r}, x.r+' · '+x.t);}));
  }

  function App(){
    var s0=useState('loading'),phase=s0[0],setPhase=s0[1];
    var sp=useState(null),pack=sp[0],setPack=sp[1];
    var sm=useState((function(){try{return localStorage.getItem(LS.mode)||'guided';}catch(e){return 'guided';}})()),mode=sm[0],setMode=sm[1];
    var ss=useState(null),scenario=ss[0],setScenario=ss[1];
    var si=useState(0),step=si[0],setStep=si[1];
    var sc=useState({}),choices=sc[0],setChoices=sc[1];
    var sn=useState(false),nudge=sn[0],setNudge=sn[1];

    useEffect(function(){
      fetch('./rp-agitation.pack.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){setPack(d);setPhase('home');}).catch(function(){setPhase('error');});
    },[]);
    useEffect(function(){flushFlags();},[]); // drain any rp_flags entries left unsent from a previous offline session
    useEffect(function(){document.getElementById('themebtn').onclick=function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('cw_theme',c);}catch(e){}};},[]);
    useEffect(function(){
      function onKey(ev){if(phase!=='play'||!scenario)return;var n=parseInt(ev.key,10);if(isNaN(n)||n<1)return;var o=currentOptions();if(n>o.length)return;pick(o[n-1]);}
      document.addEventListener('keydown',onKey);return function(){document.removeEventListener('keydown',onKey);};
    });

    function setModeP(m){setMode(m);try{localStorage.setItem(LS.mode,m);}catch(e){}}
    function startPlay(){var list=pack.content.scenarios;var scn=mode==='challenge'?list[Math.floor(Math.random()*list.length)]:list[0];
      setScenario(scn);setChoices({etiology:null,nonpharm:[],pharm:null,monitoring:[]});setStep(0);setNudge(false);setPhase('play');announce('Scenario loaded. Step 1 of 4: etiology triage.');}
    function pickScenario(scn){setScenario(scn);setChoices({etiology:null,nonpharm:[],pharm:null,monitoring:[]});setStep(0);setNudge(false);setPhase('play');}

    var STEP_LABELS=['Step 1 · Etiology triage','Step 2 · Non-pharmacologic first','Step 3 · Pharmacologic reasoning','Step 4 · Monitoring & reassessment'];
    var STEP_Q=['What is most likely driving this agitation?','Before any medication route — what do you do first? (select all that apply)','If pharmacologic management is needed, what is your class-level approach?','What will you monitor and when will you reassess? (select all that apply)'];
    function currentOptions(){var b=pack.choiceBanks;return step===0?b.etiology:step===1?b.nonpharm:step===2?b.pharmApproach:b.monitoring;}
    function currentRung(){
      var ids=[].concat(choices.nonpharm||[]);if(choices.pharm)ids.push(choices.pharm);
      var mx=0;ids.forEach(function(id){if(RUNG[id]!==undefined&&RUNG[id]>mx)mx=RUNG[id];});return mx;
    }
    function pick(opt){setNudge(false);var c=Object.assign({},choices);
      if(step===0)c.etiology=opt.id;
      else if(step===1){var a=c.nonpharm.slice();var i=a.indexOf(opt.id);if(i>=0)a.splice(i,1);else a.push(opt.id);c.nonpharm=a;}
      else if(step===2)c.pharm=opt.id;
      else{var m=c.monitoring.slice();var j=m.indexOf(opt.id);if(j>=0)m.splice(j,1);else m.push(opt.id);c.monitoring=m;}
      setChoices(c);}
    function pickSenior(){setNudge(false);var c=Object.assign({},choices);if(step===0)c.etiology='call_senior';else if(step===2)c.pharm='call_senior';setChoices(c);}
    function canAdvance(){if(step===0)return !!choices.etiology;if(step===1)return choices.nonpharm.length>0;if(step===2)return !!choices.pharm;return true;}
    function next(){if(!canAdvance()){setNudge(true);if(step===1)announce('Address de-escalation before pharmacologic options.');return;}
      if(step<3){setStep(step+1);announce(STEP_LABELS[step+1]);}else{setPhase('trace');announce('Decision trace ready.');}}
    function back(){if(step>0)setStep(step-1);}

    function optionEl(opt,idx){
      var selected=step===0?choices.etiology===opt.id:step===1?choices.nonpharm.indexOf(opt.id)>=0:step===2?choices.pharm===opt.id:choices.monitoring.indexOf(opt.id)>=0;
      var tok=opt.tokenId?tokenById(pack,opt.tokenId):null;
      return e('button',{key:opt.id,className:'opt'+(selected?' on':''),onClick:function(){pick(opt);},'aria-pressed':selected},
        e('span',{className:'num'},idx+1),
        e('span',{className:'lab'},opt.label,tok?e('div',null,e(LocalChip,{token:tok})):null));
    }
    function seniorEl(){ // ever-present on decision steps (0 and 2)
      if(step!==0&&step!==2)return null;
      var on=(step===0&&choices.etiology==='call_senior')||(step===2&&choices.pharm==='call_senior');
      return e('button',{className:'senior'+(on?' on':''),onClick:pickSenior,'aria-pressed':on},
        e('span',{className:'ico'},'☎'),e('span',null,'Call your senior / attending — never the wrong move'));
    }
    function guidedReveal(){
      if(mode!=='guided')return null;
      if(step===0&&choices.etiology){
        if(choices.etiology==='call_senior')return e('div',{className:'verdict good'},e('div',{className:'vh'},'✓ ','Calling for help is never wrong'),e('div',null,'Good instinct — escalate early. While help is on the way, keep gathering the driver so your senior arrives to a clear picture.'));
        var truth=scenario.trueEtiology,disc=scenario.discriminators||{};var v=choices.etiology===truth?'good':'caution';
        var head=choices.etiology===truth?'Consistent with the discriminating features':(choices.etiology==='undetermined'?'A safe, non-penalized stance':'Worth re-weighing the discriminators');
        return e('div',{className:'verdict '+v},e('div',{className:'vh'},v==='good'?'✓ ':'△ ',head),
          e('div',null,choices.etiology==='undetermined'?'When data are insufficient, working it up and using least-harm measures is appropriate.':'Key features pointing to the likely driver: '+((disc[truth]||[]).join('; '))+'.'));
      }
      if(step===2&&choices.pharm){
        if(choices.pharm==='call_senior')return e('div',{className:'verdict good'},e('div',{className:'vh'},'✓ ','Escalating is always appropriate'),e('div',null,'Reaching your senior/attending — especially when unsure or when danger is escalating — is always a correct move.'));
        var opt=pack.choiceBanks.pharmApproach.filter(function(o){return o.id===choices.pharm;})[0];var vd=pharmVerdict(opt,scenario);
        return e('div',{className:'verdict '+vd.level},e('div',{className:'vh'},vd.level==='hazard'?'⚠ Hazard ':(vd.level==='caution'?'△ Caution ':'✓ Reasonable '),'— reasoning check'),
          e('ul',{style:{margin:'4px 0 0',paddingLeft:'1.1em'}},vd.notes.map(function(n,i){return e('li',{key:i},n);})),
          vd.hard?e('div',{className:'stopnote'},'This is a stereotyped, high-harm error — make sure you can articulate why before proceeding.'):null);
      }
      return null;
    }

    if(phase==='loading')return e('div',{className:'shell'},e('p',null,'Loading trainer…'));
    if(phase==='error')return e('div',{className:'shell'},e('h1',null,'Agitation Ladder'),
      e('div',{className:'verdict caution'},'Could not load the content pack. Refresh to retry, or review the Agitation topic page.'),
      e('button',{className:'btn primary',onClick:function(){window.location.reload();}},'Retry'));

    var header=e('div',null,
      e('div',{className:'kicker'},'Acute & Safety · Teaching trainer'),
      e('h1',null,'Agitation Ladder — PRN Decision Trainer'),
      e('div',{className:'disc teach',role:'note'},'Educational tool for MMC psychiatry residents. It teaches the ',e('b',null,'least-restrictive ladder'),' and hazard-avoidance — not what to order. Agents, doses, routes, and monitoring are ',e('b',null,'local-policy placeholders'),'. Fictional composites — no PHI.'),
      e('div',{className:'modebar',role:'tablist','aria-label':'Mode'},['guided','challenge','reference'].map(function(m){
        return e('button',{key:m,role:'tab','aria-selected':mode===m,className:mode===m?'on':'',onClick:function(){setModeP(m);}},m==='guided'?'Guided drill':m==='challenge'?'Challenge':'Learn the ladder');})));

    if(phase==='home'){
      return e('div',null,header,
        e('div',{className:'card'},
          e('p',{className:'sub'},mode==='reference'?'Learn the ladder: the five rungs of least-restrictive management with the local-policy overlays that stay unverified until attested.':mode==='challenge'?'Challenge mode picks a random scenario and holds feedback until the decision trace.':'Guided mode walks one scenario with feedback at each step, tracking your position on the least-restrictive ladder.'),
          mode==='reference'?e('button',{className:'btn primary',onClick:function(){setPhase('refmap');}},'Open the ladder'):
            e('div',null,e('button',{className:'btn primary',onClick:startPlay},mode==='challenge'?'Start a random scenario':'Start scenario'),
              mode==='guided'?e('div',{style:{marginTop:'14px'}},e('div',{className:'steplabel'},'Or pick a scenario'),
                pack.content.scenarios.map(function(scn){return e('button',{key:scn.id,className:'opt',onClick:function(){pickScenario(scn);}},e('span',{className:'lab'},scn.stem.slice(0,92)+'…'));})):null)),
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},e(FlagButton,{ctx:'home'}),e('span',{className:'cite'},'v0.2.0 · Draft — pending faculty review')));
    }
    if(phase==='refmap'){
      var b=pack.choiceBanks;
      function grp(title,arr){return e('div',null,e('h3',null,title),e('ul',null,arr.map(function(o){var tok=o.tokenId?tokenById(pack,o.tokenId):null;return e('li',{key:o.id},o.label,tok?e('span',null,' ',e(LocalChip,{token:tok})):null);})));}
      return e('div',null,header,
        e('div',{className:'play'},
          e(LadderRail,{rung:0}),
          e('div',{className:'card refmap'},
            e('p',{className:'sub'},'Project BETA sequencing: safety and verbal de-escalation first (≈5–10 min), oral before parenteral, agent choice driven by etiology and special populations. Climb the ladder only as far as the situation requires. Every specific agent/dose/route/interval is a local-policy placeholder.'),
            grp('A · Etiology triage',b.etiology),grp('B · Non-pharmacologic first',b.nonpharm),
            grp('C · Pharmacologic approach (class-level)',b.pharmApproach),grp('D · Monitoring & reassessment',b.monitoring),
            e('div',{className:'pearl'},'The same class (a benzodiazepine) is a hazard in non-withdrawal delirium but first-line in alcohol/sedative withdrawal — which is why etiology comes first.'))),
        e(FlagButton,{ctx:'refmap'}));
    }
    if(phase==='trace'){
      var rows=[];
      (function(){var chosen=choices.etiology,truth=scenario.trueEtiology;
        if(chosen==='call_senior'){rows.push({k:'Etiology',v:'good',choice:'☎ Called your senior',note:'Escalating when unsure is always safe.'});return;}
        var v=chosen===truth?'good':'caution';var lbl=pack.choiceBanks.etiology.filter(function(o){return o.id===chosen;})[0];
        rows.push({k:'Etiology',v:v,choice:lbl?lbl.label:'—',note:chosen===truth?'Matched the discriminating features.':(chosen==='undetermined'?'Safe stance when data are insufficient.':'Re-weigh: '+((scenario.discriminators[truth]||[]).join('; ')))});})();
      (function(){var picks=choices.nonpharm.map(function(id){return pack.choiceBanks.nonpharm.filter(function(o){return o.id===id;})[0].label;});
        rows.push({k:'Non-pharm first',v:'good',choice:picks.join(', ')||'—',note:'De-escalation-first sequencing (Project BETA).'});})();
      (function(){if(choices.pharm==='call_senior'){rows.push({k:'Pharmacologic',v:'good',choice:'☎ Called your senior',note:'Escalation is always an acceptable move.'});return;}
        var opt=pack.choiceBanks.pharmApproach.filter(function(o){return o.id===choices.pharm;})[0];var vd=pharmVerdict(opt,scenario);
        rows.push({k:'Pharmacologic',v:vd.level,choice:opt.label,note:vd.notes.join(' ')});})();
      (function(){var picks=choices.monitoring.map(function(id){return pack.choiceBanks.monitoring.filter(function(o){return o.id===id;})[0].label;});
        rows.push({k:'Monitoring',v:choices.monitoring.length?'good':'caution',choice:picks.join(', ')||'—',note:choices.monitoring.length?'Post-sedation monitoring selected.':'Always monitor after sedating an agitated patient.'});})();
      var cites=(scenario.citationIds||[]).map(function(id){return (pack.citations.filter(function(c){return c.id===id;})[0]||{}).ref;}).filter(Boolean);
      var finalRung=currentRung();
      return e('div',null,header,
        e('div',{className:'play'},
          e(LadderRail,{rung:finalRung}),
          e('div',{className:'card'},
            e('div',{className:'steplabel'},'Decision trace'),
            e('div',{className:'trace'},rows.map(function(r,i){return e('div',{className:'node',key:i},
              e('div',{className:'marker m '+r.v},r.v==='good'?'✓':r.v==='hazard'?'!':'△'),
              e('div',{className:'nodecard'},e('div',{className:'steplabel'},r.k),e('div',null,e('b',null,r.choice)),e('div',{className:'cite'},r.note)));})),
            e('div',{className:'pearl'},'Highest rung reached: ',e('b',null,finalRung?('Rung '+finalRung+' · '+(LADDER[finalRung-1]||{}).t):'none — managed without escalating'),'. Aim for the lowest rung that keeps everyone safe.'),
            e('div',{className:'pearl'},e('b',null,'Teaching points'),e('ul',{style:{margin:'6px 0 0',paddingLeft:'1.1em'}},(scenario.teachingPoints||[]).map(function(tp,i){return e('li',{key:i},tp.text);}))),
            cites.length?e('details',{className:'cites'},e('summary',null,'Citations'),e('ul',null,cites.map(function(c,i){return e('li',{key:i,className:'cite'},c);}))):null)),
        e('div',{className:'btnrow'},e('button',{className:'btn primary',onClick:startPlay},mode==='challenge'?'Another random scenario':'Restart'),
          e('button',{className:'btn',onClick:function(){setPhase('home');}},'Back to start'),e(FlagButton,{ctx:'trace:'+scenario.id})));
    }

    // phase play
    var opts=currentOptions();var rung=currentRung();
    return e('div',null,header,
      e('div',{className:'play'},
        e(LadderRail,{rung:rung}),
        e('div',null,
          e(Pills,{rung:rung}),
          e('div',{className:'card'},
            e('div',{className:'steplabel'},'Scenario'),
            e('p',{style:{margin:'0 0 6px'}},scenario.stem),
            e('div',{className:'stemgrid'},
              e('span',{className:'vital'},e('b',null,'HR '),scenario.vitals.hr),
              e('span',{className:'vital'},e('b',null,'BP '),scenario.vitals.bp),
              e('span',{className:'vital'},e('b',null,'SpO₂ '),scenario.vitals.spo2+'%'),
              e('span',{className:'vital'},e('b',null,'Temp '),scenario.vitals.temp)),
            e('div',{className:'metarow'},e('span',null,scenario.history),e('span',null,'Meds: '+scenario.currentMeds.join(', ')))),
          e('div',{className:'card'},
            e('div',{className:'steplabel'},STEP_LABELS[step]),
            e('div',{className:'qtext'},STEP_Q[step]),
            opts.map(function(o,i){return optionEl(o,i);}),
            seniorEl(),
            nudge?e('div',{className:'nudge'},step===1?'Address de-escalation / a non-pharmacologic step before moving to medications.':'Make a selection to continue.'):null,
            guidedReveal(),
            e('div',{className:'btnrow'},step>0?e('button',{className:'btn',onClick:back},'Back'):null,
              e('button',{className:'btn primary',onClick:next,disabled:!canAdvance()&&step!==1},step<3?'Next':'See decision trace'))))),
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px'}},
        e('span',{className:'cite'},'Step '+(step+1)+' of 4 · '+mode),e(FlagButton,{ctx:'play:'+scenario.id+':step'+step})));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
