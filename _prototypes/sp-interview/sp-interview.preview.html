    body:JSON.stringify(body),signal:signal})
  .then(function(r){return r.text().then(function(text){
    var j={}; try{j=text?JSON.parse(text):{};}catch(x){var malformed=new Error('The live patient returned an invalid response.');malformed.code='invalid_response';malformed.status=r.status;malformed.retryDisposition='offline-only';throw malformed;}
    if(!r.ok){var d=j&&j.error&&typeof j.error==='object'?j.error:{};var err=new Error(d.message||'The live patient is unavailable.');err.code=d.code||'actor_failed';err.status=r.status;err.retryDisposition=j.retryDisposition||'offline-only';throw err;}
    if(signal&&signal.aborted)throw cancelled();
    return j;
  });});
};
ProxyProvider.prototype._applyState=function(s,j,text,signal){
  if(signal&&signal.aborted){var cancelled=new Error('The live patient request was cancelled.');cancelled.code='cancelled';cancelled.status=0;cancelled.retryDisposition='offline-only';throw cancelled;}
  function stringArray(value){return Array.isArray(value)&&value.every(function(item){return typeof item==='string';});}
  function exactKeys(value,expected){if(!value||typeof value!=='object'||Array.isArray(value))return false;var actual=Object.keys(value).sort();var wanted=expected.slice().sort();return actual.length===wanted.length&&actual.every(function(key,index){return key===wanted[index];});}
  var st=j&&j.state;
  var ticketValid=j&&(j.ticket===null||(typeof j.ticket==='string'&&j.ticket.trim()!==''));
  var valid=!!(exactKeys(j,['reply','state','ticket'])&&typeof j.reply==='string'&&j.reply.trim()!==''&&j.reply.length<=1200&&exactKeys(st,['intents','flags','rapport','unlocked'])&&
    stringArray(st.intents)&&stringArray(st.flags)&&Number.isSafeInteger(st.rapport)&&
    Number.isSafeInteger(this.rapportMin)&&Number.isSafeInteger(this.rapportMax)&&
    st.rapport>=this.rapportMin&&st.rapport<=this.rapportMax&&stringArray(st.unlocked)&&ticketValid);
  if(!valid){var invalid=new Error('The live patient returned an invalid response.');invalid.code='invalid_response';invalid.status=200;invalid.retryDisposition='offline-only';throw invalid;}
  var intents=st.intents.slice(),flags=st.flags.slice(),unlocked=st.unlocked.slice(),rapport=st.rapport;
  var nextTurns=s.turns.slice(),nextCovered=Object.assign({},s.covered),nextUnlocked=Object.assign({},s.unlocked);
  if(text!==null)nextTurns.push({me:text,pt:j.reply,flags:flags,intents:intents,rapport:rapport});
  intents.forEach(function(i){nextCovered[i]=true;});
  unlocked.forEach(function(u){nextUnlocked[u]=true;});
  s.turns=nextTurns;s.covered=nextCovered;s.rapport=rapport;s.unlocked=nextUnlocked;
  return {reply:j.reply,ticket:j.ticket};
};
ProxyProvider.prototype.open=function(s,context){
  var self=this,ctx=context||{};
  return this._request({caseId:s.caseDef.id,mode:'open',encounterId:ctx.encounterId,turnId:0},ctx.signal)
    .then(function(j){return self._applyState(s,j,null,ctx.signal);});
};
ProxyProvider.prototype.respond=function(s,text,context){
  var self=this,ctx=context||{};
  return this._request({caseId:s.caseDef.id,mode:'converse',encounterId:ctx.encounterId,turnId:ctx.turnId,
    turns:s.turns.map(function(t){return{me:t.me,pt:t.pt};}),message:text},ctx.signal)
    .then(function(j){return self._applyState(s,j,text,ctx.signal);});
};
ProxyProvider.prototype.evaluate=function(s,sa,context){
  var ctx=context||{};
  return this._request({caseId:s.caseDef.id,mode:'evaluate',encounterId:ctx.encounterId,
    turns:s.turns.map(function(t){return{me:t.me,pt:t.pt};}),selfAssess:sa},ctx.signal);
};

/* ============================ Deterministic debrief ============================ */
function computeCoverage(s){
  var out=[]; var cd=s.caseDef;
  cd.checklist.forEach(function(c){
    var status;
    if(c.dependsOnGate && !s.unlocked[c.dependsOnGate]){ status='na'; }
    else{
      var got=c.intents.filter(function(i){return s.covered[i];}).length;
      if(got===c.intents.length)status='observed';
      else if(got>0)status='partial';
      else if(c.partialIfOnly && c.partialIfOnly.some(function(i){return s.covered[i];}))status='partial';
      else status='missed';
    }
    out.push({id:c.id,label:c.label,status:status,critical:!!c.critical});
  });
  return out;
}
function computeRubric(s,cov){
  function covPct(cat){
    var items=s.caseDef.intents.filter(function(i){return i.category===cat&&i.coverage==='core';});
    var got=items.filter(function(i){return s.covered[i.id];}).length;
    return items.length?got/items.length:0;
  }
  var flagsAll=[]; s.turns.forEach(function(t){flagsAll=flagsAll.concat(t.flags||[]);});
  var r={};
  r.alliance=(s.reflections>=2&&s.rapport>=2)?'observed':(s.reflections>=1||s.rapport>=1)?'partial':'missed';
  var dp=covPct('data'); r.data=dp>=0.8?'observed':dp>=0.5?'partial':'missed';
  var direct=!!s.covered['si_direct'], euph=!!s.covered['si_euphemism'];
  var badFlags=flagsAll.filter(function(f){return f!=='ooc_attempt';}).length;
  r.technique=(direct&&badFlags===0&&s.covered['open_invite'])?'observed':(direct||euph)?'partial':'missed';
  var org=(s.covered['greeting_agenda']?1:0)+(s.covered['summary_close']?1:0);
  r.organization=org===2?'observed':org===1?'partial':'missed';
  return r;
}
function buildNarrative(s,cov,rub){
  var strengths=[],growth=[];
  var who=s.caseDef.persona.displayName;
  function hasIntent(id){return s.caseDef.intents.some(function(it){return it.id===id;});}
  if(s.reflections>=2)strengths.push('You reflected and validated more than once — '+who+'’s guardedness dropped when you did. That is the mechanism, not a nicety.');
  /* Coaching text must work for every persona (Dana/Marcus/Ray) — displayName + they/them,
     never a hardcoded she/her: Marcus and Ray got wrong-pronoun debriefs. */
  if(s.covered['si_direct'])strengths.push('You asked about suicide in plain language. That is exactly why '+who+' told you the truth.');
  if(s.covered['work_stressor'])strengths.push('You found the job loss — the organizing stressor most interviewers miss.');
  if(s.covered['greeting_agenda'])strengths.push('You set a collaborative frame at the start, and '+who+' noticed.');
  if(s.covered['summary_close'])strengths.push('You closed with a summary rather than letting the encounter just stop.');
  if(!s.covered['si_direct']&&s.covered['si_euphemism'])growth.push({t:'You approached suicide with a euphemism and '+who+' tested you instead of answering. Next time, try the patient’s own words plus the plain question: “When you say you’re a burden — have you had thoughts of killing yourself?”',link:'pg_suicide.md'});
  if(!s.covered['si_direct']&&!s.covered['si_euphemism'])growth.push({t:'Suicide never came up. With this presentation it must — directly and plainly. Next time, try asking early, once any rapport exists: “Have you had thoughts of killing yourself?”',link:'pg_suicide.md'});
  if(s.unlocked['si_active']&&!(s.covered['si_plan']&&s.covered['si_means']&&s.covered['si_intent_protective']))growth.push({t:'After the disclosure, the follow-through was incomplete. Next time, walk the chain: plan, means and access, intent, and what keeps them going.',link:'pg_suicide.md'});
  if(s.reflections<2)growth.push({t:'Long question runs made this feel like an intake form. Next time, try one reflection for every two or three questions — watch what it buys you.',link:'pg_interview.md'});
  if(hasIntent('work_stressor')&&!s.covered['work_stressor'])growth.push({t:'You collected symptoms but not the story — something happened two months ago and it never surfaced. Next time, try “What changed around the time this started?”',link:'pg_interview.md'});
  if(!s.covered['summary_close'])growth.push({t:'The encounter ended without a summary. Next time, try playing back what you heard and naming the hard part calmly before you leave the room.',link:'pg_interview.md'});
  if(hasIntent('psychosis_screen')&&!s.covered['psychosis_screen'])growth.push({t:'No psychosis screen. Two plain questions cover it.',link:'t_mood.md'});
  while(strengths.length<2)strengths.push('You stayed in the encounter and kept asking — reps are how this skill is built.');
  return {strengths:strengths.slice(0,2),growth:growth.slice(0,2)};
}

function isCaseReviewed(caseDef){
  return !!(caseDef&&caseDef.facultyReview&&caseDef.facultyReview.status==='reviewed');
}
function eligibleCases(pack){
  return (pack&&Array.isArray(pack.cases)?pack.cases:[]).filter(isCaseReviewed);
}
function isManagedVoiceEligible(pack,caseDef){
  return !!(isCaseReviewed(caseDef)&&pack.speechEngine&&pack.speechEngine.enabled===true&&
    pack.speechEngine.status==='reviewed'&&caseDef.speechProfile&&
    caseDef.speechProfile.status==='reviewed');
}

/* ===================== Redesign: pacing, coach, coverage prose ===================== */
/* Per-persona speech pace, derived from the pack's authored persona.voice field.
   The rhythm is clinical content: pressured speech reveals fast and dense; guarded
   psychosis reveals in clusters with long silences; depression reveals flat and even. */
function paceFor(caseDef){
  var v=(caseDef.persona.voice||'').toLowerCase();
  if(/rapid|pressured|run-on/.test(v)) return {w:75,ch:4,sent:170,cl:60,ell:220,stage:450,caps:140,rate:1.15,anim:'spkflat spkbar',dur:'.45s',label:'pressured, fast',bars:[14,20,17,20,18]};
  if(/pause|halting|careful|tests you/.test(v)) return {w:300,ch:2,sent:1050,cl:520,ell:1650,stage:2100,caps:0,rate:0.85,anim:'spkhalt',dur:'2.1s',label:'halting, careful',bars:[17,5,4,16,5]};
  return {w:260,ch:2,sent:620,cl:280,ell:950,stage:1300,caps:0,rate:0.95,anim:'spkflat',dur:'1.7s',label:'measured, flat',bars:[9,12,10,12,9]};
}
/* Adaptive coach: process before content, stakes before list order, escalating specificity. */
function getCoach(sess){
  var recent=sess.turns.slice(-2), flags=[];
  recent.forEach(function(t){flags=flags.concat(t.flags||[]);});
