  /* The Interview Room wears the protected spoken pilot's design language (sp-preview/dist/styles.css,

  /* the encounter panel */
  .room{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0 0 var(--sp3);position:relative}
  .roomhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:20px 26px 16px;border-bottom:1px solid var(--line)}

  .voice-tag{font-size:.75rem;color:var(--muted);margin-left:12px;white-space:nowrap}

<script>
(function(){
"use strict";
var previewConfig=window.__SP_PREVIEW__||{providerMode:'live',endpoint:null,autoOpenSettings:true};
var SPOKEN_CONSENT_VERSION='2026-09-26-realtime-v1';
/* The shared family meeting (Morgan and Maya) needs two voices in one room. A real-time session is
   pinned to one voice, so until the two-session family room exists that encounter runs in the
   faculty preview on the chained voice pipeline. One card, one door, same tab, no credentials. */

function looksLikePhi(t){for(var i=0;i<PHI_PATTERNS.length;i++){if(PHI_PATTERNS[i].test(t))return true;}return false;}

/* ============================ Provider interface ===========================
   Unchanged from v0.1.0 — the redesign is the view layer only.               */
function MockProvider(){}
MockProvider.prototype.name='Mock (offline)';
MockProvider.prototype.start=function(caseDef,opts){
  var rx={}; caseDef.intents.forEach(function(it){rx[it.id]=it.patterns.map(function(p){return new RegExp(p,'i');});});
  var flagIds=caseDef.intents.filter(function(it){return it.category==='flag';}).map(function(it){return it.id;});
  var prio={data:0,safety:0,organization:1,technique:2,alliance:3};
  var catPrio={}; caseDef.intents.forEach(function(it){catPrio[it.id]=(prio[it.category]!==undefined)?prio[it.category]:9;});
  return {caseDef:caseDef, opts:opts, rx:rx, flagIds:flagIds, catPrio:catPrio, rapport:0, unlocked:{}, covered:{}, flags:[], closedRun:0,
          varIdx:{}, turns:[], reflections:0, hintUses:0, stepOuts:0, openInviteUsed:false, greetUsed:false};
};
MockProvider.prototype._match=function(s,text){
  var hits=[]; var rx=s.rx;
  s.caseDef.intents.forEach(function(it){ if(rx[it.id].some(function(r){return r.test(text);})) hits.push(it.id); });
  return hits;
};
MockProvider.prototype._tier=function(s){
  var shift=(s.opts.difficulty==='realistic')?s.caseDef.difficulty.realistic.guardedShift:0;
  return (s.rapport-shift)>=1?'open':'guarded';
};
MockProvider.prototype._pick=function(s,key,tier){
  var bank=s.caseDef.responses[key]||s.caseDef.responses._default;
  var arr=bank[tier]||bank.any||bank.guarded||bank.open;
  if(!arr||!arr.length){bank=s.caseDef.responses._default;arr=bank[tier]||bank.guarded;}
  var k=key+':'+tier; s.varIdx[k]=(s.varIdx[k]||0);
  var out=arr[s.varIdx[k]%arr.length]; s.varIdx[k]++;
  return out;
};
MockProvider.prototype._recentFlag=function(s,names){
  var last=s.turns.slice(-2);
  return last.some(function(t){return (t.flags||[]).some(function(f){return names.indexOf(f)>=0;});});

MockProvider.prototype.respond=function(s,text){

  var flags=hits.filter(function(h){return s.flagIds.indexOf(h)>=0;});

    // before an already-open gate replays its repeatAsk or a locked one deflects. Without it a
    // follow-up that also names the act re-hit gated[0] (si_active) and the follow-up gate was
    // never reached, so the stronger phrasing got less than the vaguer one. Client and server
    // must agree bit-for-bit on s.unlocked (parity.test.mjs).
    var self=this;

      reply=opening.reveal;
      if(!opening.requiresGate) critical='disclosure';

function computeCoverage(s){

    else{
      var got=c.intents.filter(function(i){return s.covered[i];}).length;
      if(got===c.intents.length)status='observed';
      else if(got>0)status='partial';
      else if(c.partialIfOnly && c.partialIfOnly.some(function(i){return s.covered[i];}))status='partial';
      else status='missed';

    out.push({id:c.id,label:c.label,status:status,critical:!!c.critical});
  });

}
function computeRubric(s,cov){
  function covPct(cat){
    var items=s.caseDef.intents.filter(function(i){return i.category===cat&&i.coverage==='core';});
    var got=items.filter(function(i){return s.covered[i.id];}).length;
    return items.length?got/items.length:0;
  }
  var flagsAll=[]; s.turns.forEach(function(t){flagsAll=flagsAll.concat(t.flags||[]);});
  var r={};
  r.alliance=(s.reflections>=2&&s.rapport>=2)?'observed':(s.reflections>=1||s.rapport>=1)?'partial':'missed';
  var dp=covPct('data'); r.data=dp>=0.8?'observed':dp>=0.5?'partial':'missed';
  var direct=!!s.covered['si_direct'], euph=!!s.covered['si_euphemism'], passive=!!s.covered['si_passive'];
  var badFlags=flagsAll.filter(function(f){return f!=='ooc_attempt';}).length;
  /* Technique. The three history cases keep the screen-based rule: direct screening language, an open
     invitation, no communication flags. A case that grades alliance on its own intents (Morgan's MI
     shape: reflection and autonomy support are alliance-category core items) grades technique on its own
     technique-category core intents (open invitation, values) plus the same plain screen, so a complete
     MI interview without the screen reads "partly there", never "observed" and never "not this time". */
  var allianceItems=s.caseDef.intents.filter(function(i){return i.category==='alliance'&&i.coverage==='core';});
  var techItems=s.caseDef.intents.filter(function(i){return i.category==='technique'&&i.coverage==='core';});
  if(allianceItems.length){
    var techGot=techItems.filter(function(i){return s.covered[i.id];}).length;
    r.technique=(direct&&badFlags===0&&techGot===techItems.length)?'observed':(direct||euph||passive||techGot>0)?'partial':'missed';
  }else{
    r.technique=(direct&&badFlags===0&&s.covered['open_invite'])?'observed':(direct||euph||passive)?'partial':'missed';
  }
  /* Organization is the case's own organization-category core intents (an opening and a close):
     greeting_agenda + summary_close for Dana, Marcus and Ray; greeting_agenda + next_step for Morgan,
     whose MI close is a next step rather than a summary. Same grades for the first three as before. */
  var orgItems=s.caseDef.intents.filter(function(i){return i.category==='organization'&&i.coverage==='core';});
  var org=orgItems.filter(function(i){return s.covered[i.id];}).length;
  r.organization=org>=2?'observed':org===1?'partial':'missed';
  return r;
}

/* Per-persona speech pace, derived from the pack's authored persona.voice field.

/* Adaptive coach: process before content, stakes before list order, escalating specificity. */
function getCoach(sess){

  recent.forEach(function(t){flags=flags.concat(t.flags||[]);});

  if(flags.indexOf('premature_reassurance')>=0)
    return 'Reassurance landed before assessment, and it cost you. Ask what would need to be true for things to feel okay — don’t promise it.';
  if(sess.closedRun>=3)
    return 'That’s '+sess.closedRun+' closed questions in a row — it’s starting to feel like a form to them. One reflection buys back the room.';
  var cov=computeCoverage(sess), hints=sess.caseDef.hints||{};
