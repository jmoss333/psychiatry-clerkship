"use strict";
var e=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;

/* ============================== PHI heuristic ============================== */
var PHI_PATTERNS=[/\b\d{6,}\b/, /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/, /\bmrn\b/i, /\bmy patient\b/i, /\bdate of birth\b/i, /\bdob\b/i];
function looksLikePhi(t){for(var i=0;i<PHI_PATTERNS.length;i++){if(PHI_PATTERNS[i].test(t))return true;}return false;}

/* ============================ Provider interface ===========================
   Unchanged from v0.1.0 — the redesign is the view layer only.               */
function MockProvider(){}
MockProvider.prototype.name='Mock (offline)';
MockProvider.prototype.start=function(caseDef,opts){
  var rx={}; caseDef.intents.forEach(function(it){rx[it.id]=it.patterns.map(function(p){return new RegExp(p,'i');});});
  var flagIds=caseDef.intents.filter(function(it){return it.category==='flag';}).map(function(it){return it.id;});
  var prio={data:0,safety:0,organization:1,technique:2,alliance:3};
  var catPrio={}; caseDef.intents.forEach(function(it){catPrio[it.id]=(prio[it.category]!==undefined)?prio[it.category]:9;});
  return {caseDef:caseDef, opts:opts, rx:rx, flagIds:flagIds, catPrio:catPrio, rapport:0, unlocked:{}, covered:{}, flags:[], closedRun:0,

function computeCoverage(s){
  var out=[]; var cd=s.caseDef;
  cd.checklist.forEach(function(c){
    var status;
    if(c.dependsOnGate && !s.unlocked[c.dependsOnGate]){ status='na'; }
    else{
      var got=c.intents.filter(function(i){return s.covered[i];}).length;
      if(got===c.intents.length)status='observed';
      else if(got>0)status='partial';
      else if(c.partialIfOnly && c.partialIfOnly.some(function(i){return s.covered[i];}))status='partial';
      else status='missed';
    }
    out.push({id:c.id,label:c.label,status:status,critical:!!c.critical});
  });
  return out;
}
function computeRubric(s,cov){
  function covPct(cat){
    var items=s.caseDef.intents.filter(function(i){return i.category===cat&&i.coverage==='core';});
    var got=items.filter(function(i){return s.covered[i.id];}).length;
    return items.length?got/items.length:0;
  }
  var flagsAll=[]; s.turns.forEach(function(t){flagsAll=flagsAll.concat(t.flags||[]);});
  var r={};
  r.alliance=(s.reflections>=2&&s.rapport>=2)?'observed':(s.reflections>=1||s.rapport>=1)?'partial':'missed';
  var dp=covPct('data'); r.data=dp>=0.8?'observed':dp>=0.5?'partial':'missed';
  var direct=!!s.covered['si_direct'], euph=!!s.covered['si_euphemism'];
  var badFlags=flagsAll.filter(function(f){return f!=='ooc_attempt';}).length;
  r.technique=(direct&&badFlags===0&&s.covered['open_invite'])?'observed':(direct||euph)?'partial':'missed';
  var org=(s.covered['greeting_agenda']?1:0)+(s.covered['summary_close']?1:0);
  r.organization=org===2?'observed':org===1?'partial':'missed';
  return r;
}

/* Per-persona speech pace, derived from the pack's authored persona.voice field.
   The rhythm is clinical content: pressured speech reveals fast and dense; guarded
   psychosis reveals in clusters with long silences; depression reveals flat and even. */
function paceFor(caseDef){
  var v=(caseDef.persona.voice||'').toLowerCase();
  if(/rapid|pressured|run-on/.test(v)) return {w:75,ch:4,sent:170,cl:60,ell:220,stage:450,caps:140,rate:1.15,anim:'spkflat spkbar',dur:'.45s',label:'pressured, fast',bars:[14,20,17,20,18]};
  if(/pause|halting|careful|tests you/.test(v)) return {w:300,ch:2,sent:1050,cl:520,ell:1650,stage:2100,caps:0,rate:0.85,anim:'spkhalt',dur:'2.1s',label:'halting, careful',bars:[17,5,4,16,5]};
  return {w:260,ch:2,sent:620,cl:280,ell:950,stage:1300,caps:0,rate:0.95,anim:'spkflat',dur:'1.7s',label:'measured, flat',bars:[9,12,10,12,9]};
}
function buildSpeechSteps(text,P){
  var steps=[],acc='';
  text.split(/(\*[^*]+\*)/).forEach(function(part){ if(!part||!part.trim())return;
    if(/^\*[^*]+\*$/.test(part)){ acc=(acc?acc+' ':'')+part; steps.push({text:acc,delay:P.stage,hold:true}); return; }
    var words=part.split(/\s+/).filter(Boolean);
    for(var i=0;i<words.length;i+=P.ch){ var chunk=words.slice(i,i+P.ch).join(' ');
      acc=(acc?acc+' ':'')+chunk;
      var d=Math.min(P.ch,words.length-i)*P.w;
      if(/(\.\.\.|…)/.test(chunk))d+=P.ell;
      else if(/[.!?]["”]?$/.test(chunk))d+=P.sent;
      else if(/[,;:—–]$/.test(chunk))d+=P.cl;
      if(P.caps&&/\b[A-Z]{3,}\b/.test(chunk))d+=P.caps;
      steps.push({text:acc,delay:d,hold:d>=600});
    }
  });
  return steps;
}
/* Adaptive coach: process before content, stakes before list order, escalating specificity. */
function getCoach(sess){
  var recent=sess.turns.slice(-2), flags=[];
  recent.forEach(function(t){flags=flags.concat(t.flags||[]);});
  if(flags.indexOf('judgmental')>=0)
    return sess.caseDef.persona.displayName+' went quiet after that last one. Before your next question, try giving their own words back — no advice attached.';
  if(flags.indexOf('premature_reassurance')>=0)
    return 'Reassurance landed before assessment, and it cost you. Ask what would need to be true for things to feel okay — don’t promise it.';
  if(sess.closedRun>=3)
    return 'That’s '+sess.closedRun+' closed questions in a row — it’s starting to feel like a form to them. One reflection buys back the room.';
  var cov=computeCoverage(sess), hints=sess.caseDef.hints||{};
  var open=cov.filter(function(c){return c.status!=='observed'&&c.status!=='na'&&hints[c.id];});
  open.sort(function(a,b){return (b.critical?1:0)-(a.critical?1:0);});
  if(!open.length) return 'You have covered the territory — consider summarizing and closing, and don’t leave anything hard hanging.';
  var h=hints[open[0].id];
  if(sess.stepOuts>1) return h+' Say it in their own words first, then one plain question — and wait.';
  return h;
}
function coverageProse(cov){
  var missed=cov.filter(function(c){return c.status==='missed';}).map(function(c){return c.label.replace(/\s*\(.*\)$/,'');});
  var partial=cov.filter(function(c){return c.status==='partial';}).map(function(c){return c.label.replace(/\s*\(.*\)$/,'');});
  var out=[];
  if(partial.length)out.push('Started but not finished: '+partial.join('; ')+'.');
  if(missed.length)out.push('Not yet visited: '+missed.join('; ')+'.');
  if(!out.length)out.push('You have been everywhere the map knows about. What remains is depth, not territory.');
  return out.join(' ');
}
