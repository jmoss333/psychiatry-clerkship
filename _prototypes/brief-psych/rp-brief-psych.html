<script src="./vendor/react.min.js"></script>

<style>
  :root{
    --bg:#f6f3ee; --bg-alt:#faf6f0; --surface:#ffffff; --on-brand:#ffffff; --border:#ddd3c6;
    --primary:#c25a3c; --primary-dark:#a84830; --primary-light:#f3ebe5;
    --accent:#2a6b5e; --accent-dark:#1e5248; --accent-light:#edf4f2;
    --text:#3b332c; --text-mid:#64574b; --text-light:#665a4f;
    --success:#357160; --success-light:#e7f1ed;
    --warning:#7a6234; --warning-light:#f5efe2;
    --danger:#a34132; --danger-light:#fbece9;
    --info:#41618a; --info-light:#eaf0f6;
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
    --shadow-sm:0 1px 3px rgba(59,51,44,.06);
    --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-head:"Source Serif 4","Iowan Old Style",Georgia,serif;
    --sp1:6px; --sp2:10px; --sp3:16px; --sp4:24px;
  }
  [data-theme="dark"]{--bg:#1a1816;--bg-alt:#211d1a;--surface:#2a2520;--on-brand:#211d1a;--border:#3d3630;--text:#e8e2da;--text-mid:#b3a596;--text-light:#8a7c6e;--primary:#d4896e;--primary-dark:#dd9277;--primary-light:rgba(212,137,110,.16);--accent:#5aad9a;--accent-dark:#6cbcaa;--accent-light:rgba(90,173,154,.16);--success:#5aad8e;--success-light:rgba(90,173,142,.16);--warning:#c4a45c;--warning-light:rgba(196,164,92,.16);--danger:#d46858;--danger-light:rgba(212,104,88,.16);--info:#7a9ec4;--info-light:rgba(122,158,196,.16);--focus:#7aa2ff;--shadow-sm:0 1px 3px rgba(0,0,0,.35);}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6}
  .shell{width:min(820px,100%);margin:0 auto;padding:var(--sp4) var(--sp3) 84px}
  h1{font-family:var(--font-head);font-size:1.7rem;color:var(--primary);margin:0 0 2px}
  .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--accent-dark);margin-bottom:var(--sp2)}
  .themebtn{position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);cursor:pointer;font-size:1rem;z-index:30}
  .disc{border-radius:var(--radius-md);padding:var(--sp2) var(--sp3);font-size:.83rem;margin-bottom:var(--sp3);background:var(--accent-light);color:var(--accent-dark);border:1px solid var(--accent)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp3) var(--sp4);box-shadow:var(--shadow-sm);margin-bottom:var(--sp3)}
  .tabs{display:inline-flex;gap:6px;border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px;margin-bottom:var(--sp3);background:var(--bg-alt)}
  .tabs button{border:none;background:transparent;padding:7px 16px;border-radius:var(--radius-pill);font:inherit;font-size:.85rem;font-weight:700;color:var(--text-mid);cursor:pointer;min-height:40px}
  .tabs button.on{background:var(--accent);color:var(--on-brand)}
  .frame{background:var(--primary-light);border-left:3px solid var(--primary);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:12px 15px;margin-bottom:var(--sp3);font-size:.92rem}
  .frame b{color:var(--primary-dark)}
  .cuegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cue{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:13px 14px;cursor:pointer;font:inherit;color:var(--text);min-height:70px}
  .cue:hover{border-color:var(--accent);background:var(--accent-light)}
  .cue.safety{border-color:var(--danger);background:var(--danger-light)}
  .cue .mech{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-light);margin-top:4px}
  .cue.safety .mech{color:var(--danger)}
  .mechbadge{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-pill);padding:3px 11px;margin-bottom:8px}
  .tname{font-family:var(--font-head);font-size:1.35rem;margin:0 0 var(--sp3);color:var(--text)}
  .step{display:grid;grid-template-columns:26px 1fr;gap:11px;margin:8px 0}
  .step .sn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-brand);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center}
  .lbl{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-light);margin:16px 0 6px}
  .script{background:var(--bg-alt);border-radius:var(--radius-sm);padding:9px 13px;font-style:italic;color:var(--text-mid);margin:6px 0;font-size:.95rem}
  .kv{border-radius:var(--radius-sm);padding:9px 13px;margin:6px 0;font-size:.9rem;border:1px solid var(--border)}
  .kv.ev{background:var(--success-light);border-color:var(--success);color:var(--success)}
  .kv.ca{background:var(--warning-light);border-color:var(--warning);color:var(--warning)}
  .kv.ho{background:var(--info-light);border-color:var(--info);color:var(--info)}
  .localchip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;border:1px dashed var(--warning);color:var(--warning);background:var(--warning-light);border-radius:var(--radius-pill);padding:3px 10px;margin-top:8px}
  .localchip.set{border-style:solid;border-color:var(--success);color:var(--success);background:var(--success-light)}
  .planbox{border-top:1px solid var(--border);margin-top:16px;padding-top:14px}
  .planbox input{width:100%;max-width:340px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font:inherit;background:var(--surface);color:var(--text)}
  .hint{font-size:.74rem;color:var(--text-light);margin:4px 0 8px}
  .btn{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-weight:600;cursor:pointer;font:inherit;background:var(--surface);color:var(--accent-dark);min-height:44px}
  .btn.primary{background:var(--primary-dark);color:var(--on-brand);border-color:var(--primary-dark)}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:var(--sp3)}
  .route{display:flex;align-items:center;gap:10px;border:1px solid var(--danger);background:var(--surface);border-radius:var(--radius-md);padding:12px 14px;margin:8px 0;color:var(--danger);text-decoration:none;font-weight:600}
  .route:hover{background:var(--danger-light)}
  .planrow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 13px;margin:8px 0;flex-wrap:wrap}
  .planrow .pt{flex:1;min-width:0}
  .planrow .pt small{color:var(--text-light)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-pill);overflow:hidden}
  .seg button{border:none;background:var(--surface);padding:6px 12px;font:inherit;font-size:.78rem;color:var(--text-mid);cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-brand)}
  .private{font-size:.78rem;color:var(--text-light);margin-top:10px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg-alt);border-top:1px solid var(--border);color:var(--text-light);font-size:.78rem;padding:8px 14px;text-align:center;margin:0;z-index:20}
  .flag{background:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 14px;color:var(--text-light);cursor:pointer;font:inherit;font-size:.82rem;min-height:40px}
  .flag:hover{border-color:var(--danger);color:var(--danger)}
  details.cites summary{cursor:pointer;font-size:.82rem;color:var(--accent-dark);margin-top:10px}
  .cite{font-size:.8rem;color:var(--text-light)}
  :focus-visible{outline:3px solid var(--focus,#155eef);outline-offset:2px}
  @media(max-width:560px){.cuegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="themebtn" id="themebtn" aria-label="Toggle light/dark theme">◐</button>
<main class="shell" id="root"></main>
<div class="foot" role="note">A coaching aid — <b>not a chart entry, not a diagnosis or treatment plan for the record</b>. Reflections stay on this device.</div>
<div id="live" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" aria-live="polite"></div>
<script>
(function(){
  "use strict";
  var e=React.createElement, useState=React.useState, useEffect=React.useEffect;
  var PKEY='rp_bp_v1';
  function announce(m){try{document.getElementById('live').textContent=m;}catch(e){}}
  function today(){return new Date().toISOString().slice(0,10);}
  function loadPlans(){try{return JSON.parse(localStorage.getItem(PKEY)||'{"plans":[]}');}catch(e){return {plans:[]};}}
  function savePlans(p){try{localStorage.setItem(PKEY,JSON.stringify(p));}catch(e){}}
  function tokenById(pack,id){var a=(pack.localPolicies||[]).filter(function(t){return t.id===id;});return a[0]||null;}
  function distinctMechanisms(pack){var seen={},out=[];(pack.content.techniques||[]).forEach(function(t){if(!seen[t.mechanism]){seen[t.mechanism]=true;out.push(t.mechanism);}});return out;}
  function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
  function LocalChip(props){var tok=props.token;if(!tok)return null;var set=tok.value!==null&&tok.value!==undefined;
    return e('span',{className:'localchip'+(set?' set':''),title:tok.label},set?('Local · '+tok.value):('⚠ '+(tok.placeholder||'Confirm locally')));}
  function FlagButton(props){function onFlag(){var r=window.prompt('Flag this content — reason + note:');if(r===null)return;
    try{var a=JSON.parse(localStorage.getItem('rp_flags')||'[]');a.push({tool:'rp-brief-psych',v:'0.1.0',ctx:props.ctx||'',reason:r,at:new Date().toISOString()});localStorage.setItem('rp_flags',JSON.stringify(a));}catch(e){}
    announce('Flag saved locally.');alert('Flag saved locally.');}
    return e('button',{className:'flag',onClick:onFlag},'⚑ Flag');}

  function App(){
    var s0=useState('loading'),phase=s0[0],setPhase=s0[1];
    var sp=useState(null),pack=sp[0],setPack=sp[1];
    var sv=useState('coach'),view=sv[0],setView=sv[1]; // coach | plan | history
    var st=useState(null),tech=st[0],setTech=st[1];
    var ssf=useState(false),showSafety=ssf[0],setShowSafety=ssf[1];
    var sl=useState(''),label=sl[0],setLabel=sl[1];
    var spl=useState(loadPlans()),plans=spl[0],setPlans=spl[1];
    var smd=useState('practice'),mode=smd[0],setMode=smd[1]; // practice | reference
    var spm=useState(null),predMechChoice=spm[0],setPredMechChoice=spm[1];
    var spt=useState(null),predTechChoice=spt[0],setPredTechChoice=spt[1];
    var smo=useState([]),mechOptions=smo[0],setMechOptions=smo[1];
    var sto=useState([]),techOptions=sto[0],setTechOptions=sto[1];

    useEffect(function(){fetch('./rp-brief-psych.pack.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(d){setPack(d);setPhase('cues');}).catch(function(){setPhase('error');});},[]);
    useEffect(function(){document.getElementById('themebtn').onclick=function(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('cw_theme',c);}catch(e){}};},[]);

    function openCue(cue){if(cue.safety){setShowSafety(true);setPhase('safety');announce('Safety routing.');return;}
      var t=pack.content.techniques.filter(function(x){return x.id===cue.techId;})[0];setTech(t);setLabel('');
      setPredMechChoice(null);setPredTechChoice(null);
      if(mode==='practice'){
        setMechOptions(shuffle(distinctMechanisms(pack)));
        setTechOptions(shuffle(pack.content.techniques.map(function(x){return {id:x.id,name:x.name};})));
        setPhase('predict-mech');announce('Predict the mechanism, then the technique.');
      } else {
        setPhase('tech');announce(t.name);
      }}
    function addPlan(){var p=loadPlans();var entry={id:'p'+Date.now(),date:today(),techId:tech.id,techName:tech.name,label:(label||'').slice(0,30),status:'planned'};
      if(mode==='practice'&&predMechChoice!==null)entry.predMech=(predMechChoice===tech.mechanism);
      if(mode==='practice'&&predTechChoice!==null)entry.predTech=(predTechChoice===tech.id);
      p.plans.push(entry);savePlans(p);setPlans(p);setLabel('');announce('Added to today’s plan.');setView('plan');setPhase('cues');}
    function setStatus(id,st){var p=loadPlans();p.plans.forEach(function(x){if(x.id===id)x.status=st;});savePlans(p);setPlans(p);}

    if(phase==='loading')return e('div',{className:'shell'},e('p',null,'Loading coach…'));
    if(phase==='error')return e('div',{className:'shell'},e('h1',null,'Five Good Minutes'),
      e('div',{className:'disc'},'Could not load the content pack. Runs on the site (served); opened from disk the browser blocks the fetch — use the served version or the preview build.'),
      e('button',{className:'btn primary',onClick:function(){location.reload();}},'Retry'));

    var header=e('div',null,
      e('div',{className:'kicker'},'Skills & reference · Bedside coaching'),
      e('h1',null,'Five Good Minutes'),
      e('div',{className:'disc',role:'note'},'Match the ',e('b',null,'mechanism'),' driving today’s crisis to one brief technique — then hand the thread to outpatient. A coaching aid, not a chart entry; no names, no PHI.'),
      e('div',{className:'tabs',role:'tablist'},
        e('button',{role:'tab','aria-selected':view==='coach',className:view==='coach'?'on':'',onClick:function(){setView('coach');setPhase('cues');}},'Coach'),
        e('button',{role:'tab','aria-selected':view==='plan',className:view==='plan'?'on':'',onClick:function(){setView('plan');setPhase('cues');}},'Today’s plan ('+plans.plans.filter(function(p){return p.date===today();}).length+')'),
        e('button',{role:'tab','aria-selected':view==='history',className:view==='history'?'on':'',onClick:function(){setView('history');}},'History ('+plans.plans.length+')')),
      view==='coach'?e('div',{className:'seg',style:{marginTop:'2px',marginBottom:'6px'}},
        ['practice','reference'].map(function(mx){return e('button',{key:mx,className:mode===mx?'on':'',onClick:function(){setMode(mx);setPhase('cues');setPredMechChoice(null);setPredTechChoice(null);}}, mx==='practice'?'Practice':'Reference');})):null);

    // PLAN view
    if(view==='plan'){
      var todays=plans.plans.filter(function(p){return p.date===today();});
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'lbl'},'Today’s five good minutes'),
          todays.length?todays.map(function(p){return e('div',{className:'planrow',key:p.id},
            e('div',{className:'pt'},e('div',null,e('b',null,p.techName)),p.label?e('small',null,p.label):e('small',null,'—')),
            e('div',{className:'seg'},
              ['did','tried','didnt'].map(function(sx){return e('button',{key:sx,className:p.status===sx?'on':'',onClick:function(){setStatus(p.id,sx);}}, sx==='did'?'Did it':sx==='tried'?'Tried':'Didn’t');})));
          }):e('p',{className:'cite'},'Nothing planned yet today. Open the Coach tab, pick a cue, and plan one good five minutes.'),
          e('div',{className:'private'},'Private — these reflections never leave this device, are not part of the record, and are not visible to supervisors.')),
        e(FlagButton,{ctx:'plan'}));
    }

    // HISTORY & coverage view — aggregates ALL entries, every date
    if(view==='history'){
      var all=plans.plans;
      var byTech={};
      all.forEach(function(p){
        var techId=p.techId||'unknown', techName=p.techName||'Unknown technique';
        if(!byTech[techId])byTech[techId]={name:techName,count:0,did:0,tried:0,didnt:0,planned:0};
        byTech[techId].count++;
        var s=p.status;
        if(s==='did'||s==='tried'||s==='didnt'||s==='planned'){byTech[techId][s]++;}else{byTech[techId].planned++;}
      });
      var techIds=Object.keys(byTech);
      var totalStatus={did:0,tried:0,didnt:0,planned:0};
      techIds.forEach(function(id){totalStatus.did+=byTech[id].did;totalStatus.tried+=byTech[id].tried;totalStatus.didnt+=byTech[id].didnt;totalStatus.planned+=byTech[id].planned;});
      var mechToTech={};
      (pack.content.techniques||[]).forEach(function(t){mechToTech[t.mechanism]=t;});
      var practicedTechIds={};
      all.forEach(function(p){if(p.techId)practicedTechIds[p.techId]=true;});
      var neverPracticed=distinctMechanisms(pack).filter(function(m){var t=mechToTech[m];return t&&!practicedTechIds[t.id];});
      var predMechTotal=all.filter(function(p){return typeof p.predMech==='boolean';}).length;
      var predMechCorrect=all.filter(function(p){return p.predMech===true;}).length;
      var predTechTotal=all.filter(function(p){return typeof p.predTech==='boolean';}).length;
      var predTechCorrect=all.filter(function(p){return p.predTech===true;}).length;
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'lbl'},'All-time history · '+all.length+' entr'+(all.length===1?'y':'ies')),
          all.length===0?e('p',{className:'cite'},'No history yet — plans you add on any tab, any day, accumulate here.'):null,
          techIds.length?e('div',null,techIds.map(function(id){var b=byTech[id];return e('div',{className:'planrow',key:id},
            e('div',{className:'pt'},e('div',null,e('b',null,b.name)),
              e('small',null,b.count+' attempt'+(b.count===1?'':'s')+' · did '+b.did+' · tried '+b.tried+' · didn’t '+b.didnt+(b.planned?(' · unmarked '+b.planned):''))));
          })):null,
          all.length?e('div',{className:'kv ho'},'Distribution — did '+totalStatus.did+' · tried '+totalStatus.tried+' · didn’t '+totalStatus.didnt+' · unmarked '+totalStatus.planned):null,
          (predMechTotal||predTechTotal)?e('div',{className:'kv ho'},'Predictions — mechanism '+predMechCorrect+'/'+predMechTotal+' correct · technique '+predTechCorrect+'/'+predTechTotal+' correct'):null,
          e('div',{className:'lbl'},'Not yet practiced'),
          neverPracticed.length?e('ul',null,neverPracticed.map(function(m,i){return e('li',{key:i,className:'cite'},m);})):e('p',{className:'cite'},'Every mechanism has at least one entry.'),
          e('div',{className:'private'},'Private — all-time history stays on this device and is not visible to supervisors.')),
        e(FlagButton,{ctx:'history'}));
    }

    // SAFETY routing
    if(phase==='safety'){
      var sf=pack.safety;
      return e('div',null,header,
        e('div',{className:'card',style:{borderColor:'var(--danger)'}},
          e('div',{className:'mechbadge',style:{color:'var(--danger)',borderColor:'var(--danger)',background:'var(--danger-light)'}},'Acute risk state'),
          e('div',{className:'tname'},sf.title),
          e('p',null,sf.body),
          sf.routes.map(function(r,i){return e('a',{className:'route',key:i,href:r.href,target:'_top'},'→ ',r.label);}),
          e('div',{className:'kv ca'},sf.note),
          e('div',{className:'btnrow'},e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues'))),
        e(FlagButton,{ctx:'safety'}));
    }

    // PREDICT step 1 — mechanism
    if(phase==='predict-mech'){
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'lbl'},'Predict — which mechanism is driving this?'),
          e('div',{className:'cuegrid'},
            mechOptions.map(function(m,i){return e('button',{key:i,className:'cue',onClick:function(){setPredMechChoice(m);setPhase('predict-tech');announce('Now predict the technique.');}},m);})),
          e('div',{className:'btnrow'},e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues'))),
        e(FlagButton,{ctx:'predict-mech'}));
    }

    // PREDICT step 2 — technique
    if(phase==='predict-tech'){
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'lbl'},'Predict — which technique fits?'),
          e('div',{className:'cuegrid'},
            techOptions.map(function(o,i){return e('button',{key:i,className:'cue',onClick:function(){setPredTechChoice(o.id);setPhase('tech');announce(tech.name);}},o.name);})),
          e('div',{className:'btnrow'},e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues'))),
        e(FlagButton,{ctx:'predict-tech'}));
    }

    // TECHNIQUE view
    if(phase==='tech'){
      var t=tech;var cites=(t.citationIds||[]).map(function(id){return (pack.citations.filter(function(c){return c.id===id;})[0]||{}).ref;}).filter(Boolean);
      var tok=t.localHookId?tokenById(pack,t.localHookId):null;
      var predTechName=predTechChoice!==null?((pack.content.techniques.filter(function(x){return x.id===predTechChoice;})[0]||{}).name||predTechChoice):null;
      return e('div',null,header,
        e('div',{className:'card'},
          mode==='practice'&&predMechChoice!==null?e('div',{className:'kv '+(predMechChoice===t.mechanism?'ev':'ca')},(predMechChoice===t.mechanism?'✓ Correct — ':'✗ You said “'+predMechChoice+'” — ')+'mechanism is '+t.mechanism):null,
          mode==='practice'&&predTechChoice!==null?e('div',{className:'kv '+(predTechChoice===t.id?'ev':'ca')},(predTechChoice===t.id?'✓ Correct — ':'✗ You said “'+predTechName+'” — ')+'technique is '+t.name):null,
          e('div',{className:'mechbadge'},'Mechanism · '+t.mechanism),
          e('div',{className:'tname'},t.name),
          e('div',{className:'lbl'},'Do this'),
          t.steps.map(function(s){return e('div',{className:'step',key:s.n},e('div',{className:'sn'},s.n),e('div',null,s.t));}),
          e('div',{className:'lbl'},'Example language — make it yours'),
          t.scriptLines.map(function(x,i){return e('div',{className:'script',key:i},x);}),
          e('div',{className:'kv ev'},e('b',null,'Evidence — '),t.evidence),
          e('div',{className:'kv ca'},e('b',null,'Caution — '),t.caution),
          e('div',{className:'kv ho'},e('b',null,'Handoff — '),t.handoff),
          tok?e('div',null,e(LocalChip,{token:tok})):null,
          cites.length?e('details',{className:'cites'},e('summary',null,'Evidence sources'),e('ul',null,cites.map(function(c,i){return e('li',{key:i,className:'cite'},c);}))):null,
          e('div',{className:'planbox'},
            e('div',{className:'lbl'},'Plan one good five minutes'),
            e('div',{className:'hint'},'Optional label — no names or identifiers (e.g., “Room task after lunch”). Max 30 chars, stays on this device.'),
            e('input',{type:'text',maxLength:30,value:label,placeholder:'e.g., walk after lunch',onChange:function(ev){setLabel(ev.target.value);},'aria-label':'Plan label, no names'}),
            e('div',{className:'btnrow'},
              e('button',{className:'btn primary',onClick:addPlan},'Add to today’s plan'),
              e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues')))),
        e(FlagButton,{ctx:'tech:'+t.id}));
    }

    // CUES (default)
    var f=pack.content.frame;
    return e('div',null,header,
      e('div',{className:'frame'},e('b',null,'Five minutes, not fifty. '),f.lead),
      e('div',{className:'card'},
        e('div',{className:'lbl'},'What are you seeing?'),
        e('div',{className:'cuegrid'},
          pack.content.cues.map(function(c){var showMech=c.safety||mode==='reference';return e('button',{key:c.id,className:'cue'+(c.safety?' safety':''),onClick:function(){openCue(c);}},
            c.label, showMech?e('span',{className:'mech'}, c.safety?'⚑ Route to your team':c.mechanism):null);}))),
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('span',{className:'cite'},'Daily scaffold: '+f.scaffold.join(' · ')),
        e(FlagButton,{ctx:'cues'})));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
</body>
</html>
