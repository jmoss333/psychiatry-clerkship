    function openCue(cue){if(cue.safety){setShowSafety(true);setPhase('safety');announce('Safety routing.');return;}
      var t=pack.content.techniques.filter(function(x){return x.id===cue.techId;})[0];setTech(t);setLabel('');setPhase('tech');announce(t.name);}
    function addPlan(){var p=loadPlans();p.plans.push({id:'p'+Date.now(),date:today(),techId:tech.id,techName:tech.name,label:(label||'').slice(0,30),status:'planned'});savePlans(p);setPlans(p);setLabel('');announce('Added to today’s plan.');setView('plan');setPhase('cues');}
    function setStatus(id,st){var p=loadPlans();p.plans.forEach(function(x){if(x.id===id)x.status=st;});savePlans(p);setPlans(p);}

    if(phase==='loading')return e('div',{className:'shell'},e('p',null,'Loading coach…'));
    if(phase==='error')return e('div',{className:'shell'},e('h1',null,'Five Good Minutes'),
      e('div',{className:'disc'},'Could not load the content pack. Runs on the site (served); opened from disk the browser blocks the fetch — use the served version or the preview build.'),
      e('button',{className:'btn primary',onClick:function(){location.reload();}},'Retry'));

    var header=e('div',null,
      e('div',{className:'kicker'},'Skills & reference · Bedside coaching'),
      e('h1',null,'Five Good Minutes'),
      e('div',{className:'disc',role:'note'},'Match the ',e('b',null,'mechanism'),' driving today’s crisis to one brief technique — then hand the thread to outpatient. A coaching aid, not a chart entry; no names, no PHI.'),
      e('div',{className:'tabs',role:'tablist'},
        e('button',{role:'tab','aria-selected':view==='coach',className:view==='coach'?'on':'',onClick:function(){setView('coach');setPhase('cues');}},'Coach'),
        e('button',{role:'tab','aria-selected':view==='plan',className:view==='plan'?'on':'',onClick:function(){setView('plan');setPhase('cues');}},'Today’s plan ('+plans.plans.filter(function(p){return p.date===today();}).length+')')));

    // PLAN view
    if(view==='plan'){
      var todays=plans.plans.filter(function(p){return p.date===today();});
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'lbl'},'Today’s five good minutes'),
          todays.length?todays.map(function(p){return e('div',{className:'planrow',key:p.id},
            e('div',{className:'pt'},e('div',null,e('b',null,p.techName)),p.label?e('small',null,p.label):e('small',null,'—')),
            e('div',{className:'seg'},
              ['did','tried','didnt'].map(function(sx){return e('button',{key:sx,className:p.status===sx?'on':'',onClick:function(){setStatus(p.id,sx);}}, sx==='did'?'Did it':sx==='tried'?'Tried':'Didn’t');})));
          }):e('p',{className:'cite'},'Nothing planned yet today. Open the Coach tab, pick a cue, and plan one good five minutes.'),
          e('div',{className:'private'},'Private — these reflections never leave this device, are not part of the record, and are not visible to supervisors.')),
        e(FlagButton,{ctx:'plan'}));
    }

    // SAFETY routing
    if(phase==='safety'){
      var sf=pack.safety;
      return e('div',null,header,
        e('div',{className:'card',style:{borderColor:'var(--danger)'}},
          e('div',{className:'mechbadge',style:{color:'var(--danger)',borderColor:'var(--danger)',background:'var(--danger-light)'}},'Acute risk state'),
          e('div',{className:'tname'},sf.title),
          e('p',null,sf.body),
          sf.routes.map(function(r,i){return e('a',{className:'route',key:i,href:r.href,target:'_top'},'→ ',r.label);}),
          e('div',{className:'kv ca'},sf.note),
          e('div',{className:'btnrow'},e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues'))),
        e(FlagButton,{ctx:'safety'}));
    }

    // TECHNIQUE view
    if(phase==='tech'){
      var t=tech;var cites=(t.citationIds||[]).map(function(id){return (pack.citations.filter(function(c){return c.id===id;})[0]||{}).ref;}).filter(Boolean);
      var tok=t.localHookId?tokenById(pack,t.localHookId):null;
      return e('div',null,header,
        e('div',{className:'card'},
          e('div',{className:'mechbadge'},'Mechanism · '+t.mechanism),
          e('div',{className:'tname'},t.name),
          e('div',{className:'lbl'},'Do this'),
          t.steps.map(function(s){return e('div',{className:'step',key:s.n},e('div',{className:'sn'},s.n),e('div',null,s.t));}),
          e('div',{className:'lbl'},'Example language — make it yours'),
          t.scriptLines.map(function(x,i){return e('div',{className:'script',key:i},x);}),
          e('div',{className:'kv ev'},e('b',null,'Evidence — '),t.evidence),
          e('div',{className:'kv ca'},e('b',null,'Caution — '),t.caution),
          e('div',{className:'kv ho'},e('b',null,'Handoff — '),t.handoff),
          tok?e('div',null,e(LocalChip,{token:tok})):null,
          cites.length?e('details',{className:'cites'},e('summary',null,'Evidence sources'),e('ul',null,cites.map(function(c,i){return e('li',{key:i,className:'cite'},c);}))):null,
          e('div',{className:'planbox'},
            e('div',{className:'lbl'},'Plan one good five minutes'),
            e('div',{className:'hint'},'Optional label — no names or identifiers (e.g., “Room task after lunch”). Max 30 chars, stays on this device.'),
            e('input',{type:'text',maxLength:30,value:label,placeholder:'e.g., walk after lunch',onChange:function(ev){setLabel(ev.target.value);},'aria-label':'Plan label, no names'}),
            e('div',{className:'btnrow'},
              e('button',{className:'btn primary',onClick:addPlan},'Add to today’s plan'),
              e('button',{className:'btn',onClick:function(){setPhase('cues');}},'← Back to cues')))),
        e(FlagButton,{ctx:'tech:'+t.id}));
    }

    // CUES (default)
    var f=pack.content.frame;
    return e('div',null,header,
      e('div',{className:'frame'},e('b',null,'Five minutes, not fifty. '),f.lead),
      e('div',{className:'card'},
        e('div',{className:'lbl'},'What are you seeing?'),
        e('div',{className:'cuegrid'},
          pack.content.cues.map(function(c){return e('button',{key:c.id,className:'cue'+(c.safety?' safety':''),onClick:function(){openCue(c);}},
            c.label, e('span',{className:'mech'}, c.safety?'⚑ Route to your team':c.mechanism));}))),
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('span',{className:'cite'},'Daily scaffold: '+f.scaffold.join(' · ')),
        e(FlagButton,{ctx:'cues'})));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
</body>
</html>
