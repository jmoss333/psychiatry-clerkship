# SP Interview proxy — its own tiny Netlify site (same repo, base directory: sp-proxy).
# Kept SEPARATE from faculty-console so the student passcode and the GitHub-writing
# token never share an environment (smaller blast radius per key).
#
# `ignore = "/bin/false"` = ALWAYS BUILD, NEVER "CANCEL". Because this site has a base
# directory, Netlify's default is to cancel any build whose commit did not touch sp-proxy/.
# It records that cancel as a FAILED deploy (state "error", "Failed during stage 'checking
# build content for changes': Canceled build due to no content change"), and the site's
# "Deploy failed" email — the only alarm for a broken production deploy, added after the
# 2026-08-31 LFS-budget outage — fires on every one of them: every push to an unrelated PR
# and every unrelated merge to main (~75/day observed on 2026-09-02). Exit code 1 from the
# ignore command means "content changed, build". The cost is one ~30 s `npm ci` build per
# event and a byte-identical redeploy of the functions. See ../netlify.toml and
# GIT_AND_DEPLOY_PLAN.md §7. Netlify reads THIS file (base-directory config wins), so the
# rule has to live here, not in the root netlify.toml.
[build]
  publish = "."
  command = "npm ci --omit=dev"
  ignore = "/bin/false"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deterministic routes for the client-facing endpoints.
# The functions self-register in source, but those routes were observed NOT registering on the
# live deploy: /api/sp fell through to the static 404 page (which carries no
# Access-Control-Allow-Origin), so the browser reported "Load failed" instead of reaching the
# function. These explicit rewrites pin all public paths regardless of in-source registration.
# Status 200 = rewrite (proxy), not a 3xx redirect, so methods, bodies, and headers (including
# x-student-key) are preserved and the functions still own CORS/OPTIONS.
[[redirects]]
  from = "/api/sp"
  to = "/.netlify/functions/sp"
  status = 200
  force = true

[[redirects]]
  from = "/api/sp/voice"
  to = "/.netlify/functions/sp-voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/sp/health-status"
  to = "/.netlify/functions/sp-health-status"
  status = 200
  force = true
