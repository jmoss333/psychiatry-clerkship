# SP Interview proxy — its own tiny Netlify site (same repo, base directory: sp-proxy).
# Kept SEPARATE from faculty-console so the student passcode and the GitHub-writing
# token never share an environment (smaller blast radius per key).
#
# BUILD ONLY WHEN THIS SITE'S OWN DIRECTORY CHANGES. `ignore` runs
# netlify_ignore_scoped.sh, which exits 0 ("skip, no production deploy") only when the
# context is production AND the diff between the last built commit and this one does not
# touch the path it is given. Deploy previews and branch deploys always build: they are
# free and they are the PR gate. Anything unexpected -- missing refs, a path that has
# moved, a non-git checkout -- exits non-zero and BUILDS.
#
# This replaced `ignore = "/bin/false"` (always build, never cancel) on 2026-09-10. That
# rule was there for a real reason: Netlify records a skip as a FAILED deploy (state
# "error", "Canceled build due to no content change") and this site's "Deploy failed"
# email -- the only alarm for a genuinely broken production deploy, added after the
# 2026-08-31 LFS outage -- fired on every one of them (~75/day observed 2026-09-02). It
# was priced in these comments as "one ~30 s build per event", which was correct when
# Netlify billed build MINUTES. Under credit pricing build minutes are FREE and a
# PRODUCTION DEPLOY is 15 credits (~$0.10) flat: 513 of the 815 production deploys charged
# across the satellite sites over 14 days were byte-identical republishes, about
# $110/month. The alarm moved to bin/check_netlify_deploy_health.py, which reads deploy
# state from the Netlify API, discards exactly that cancel message, and runs daily inside
# maintenance-production-canary.yml.
# ACTION REQUIRED IN THE NETLIFY UI: turn OFF this site's "Deploy failed" email.
# Numbers and rollback: 13_Faculty_Resources/_automation/NETLIFY_COST_REDUCTION_PLAN.md;
# history: GIT_AND_DEPLOY_PLAN.md section 7.
[build]
  publish = "."
  command = "npm ci --omit=dev"
  ignore = 'bash ../13_Faculty_Resources/_automation/site_build/netlify_ignore_scoped.sh sp-proxy'

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deterministic routes for the client-facing endpoints.
# The functions self-register in source, but those routes were observed NOT registering on the
# live deploy: /api/sp fell through to the static 404 page (which carries no
# Access-Control-Allow-Origin), so the browser reported "Load failed" instead of reaching the
# function. These explicit rewrites pin all public paths regardless of in-source registration.
# Status 200 = rewrite (proxy), not a 3xx redirect, so methods, bodies, and headers (including
# x-student-key) are preserved and the functions still own CORS/OPTIONS.
[[redirects]]
  from = "/api/sp"
  to = "/.netlify/functions/sp"
  status = 200
  force = true

[[redirects]]
  from = "/api/sp/voice"
  to = "/.netlify/functions/sp-voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/sp/health-status"
  to = "/.netlify/functions/sp-health-status"
  status = 200
  force = true
