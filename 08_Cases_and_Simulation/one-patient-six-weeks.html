<script id="case-practice-data" type="application/json">{

  "boundary": "New practice prompts · Pending faculty review. Use the selected chapter's supplied story as your fact source. Model examples illustrate language and do not add established findings. Follow this chapter's supervised task and any urgent escalation before routine practice. Rehearse privately away from this page; nothing is recorded or submitted.",

  "finishText": "You have rehearsed one responsibility with this fictional patient. Finishing records no progress or score and makes no claim about readiness for independent care.",
  "tasks": {
    "interview": {
      "label": "Interview this patient",
      "sourceRef": "pg_interview.md",

        "5": {
          "prompt": "Privately rehearse an opening: explain your role and purpose, ask permission, and invite the person's priority from this chapter. Add one follow-up and name what you still need to clarify.",
          "example": "I am a learner working with your team. I would like to understand what matters most to you today. Is it okay to begin? [Follow one concern supplied in this chapter, then identify unanswered questions.]",
          "card": {
            "try": "Explain your role, purpose, and permission before your first question.",
            "notice": "Which supplied concern deserves a follow-up rather than an assumed answer.",
            "ask": "Which part of this conversation should I clarify first?"
          }
        },
        "15": {
          "prompt": "Privately rehearse an opening, focused follow-ups, and a closing summary. Use the chapter's story and supervised task to choose priorities. Say what was supplied, what remains unknown, and what you will bring to your supervisor.",
